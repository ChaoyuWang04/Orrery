<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30" y="34" font-size="19" font-weight="700" fill="#111827">一次重启的账：要压的是协调，不只是读盘</text>
<text x="30" y="58" font-size="13" fill="#6b7280">绿 = 报告写了具体优化的恢复环节；紫 = 常驻的异步观察进程；黄 = 常态训练里存检查点；灰 = 中断与恢复完成两个端点。</text>
<rect x="40" y="92" width="500" height="78" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="52" y="116" font-size="14" font-weight="700" fill="#111827">常态训练：存检查点</text>
<text x="52" y="136" font-size="11" fill="#6b7280">优化器状态与权重完全分片，持久化不再阻塞训练</text>
<text x="52" y="152" font-size="11" fill="#6b7280">开销：H100 集群约 1 秒，TRN1 集群约 0.1 秒</text>
<text x="580" y="116" font-size="14" font-weight="700" fill="#111827">预训练周平均 goodput 最高 97%</text>
<text x="580" y="136" font-size="11" fill="#6b7280">三路优化合起来：降低任务失败率、压检查点开销、压 MTTR</text>
<text x="580" y="152" font-size="11" fill="#6b7280">goodput = 真正推进训练的时间占比</text>
<path d="M40,232 L40,222 L1080,222 L1080,232" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<text x="560" y="193" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">MTTR：从上次成功检查点起算，到恢复稳态训练为止</text>
<text x="560" y="214" font-size="11" fill="#6b7280" text-anchor="middle">TRN1 集群目标 9 分钟，实际平均 6.5 分钟</text>
<rect x="40" y="244" width="165" height="100" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="52" y="268" font-size="14" font-weight="700" fill="#111827">中断</text>
<text x="52" y="288" font-size="11" fill="#6b7280">上次成功检查点之后</text>
<text x="52" y="304" font-size="11" fill="#6b7280">的进度作废</text>
<text x="52" y="320" font-size="11" fill="#6b7280">这段也计入 MTTR</text>
<rect x="215" y="244" width="165" height="100" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="227" y="268" font-size="14" font-weight="700" fill="#111827">重启组件</text>
<text x="227" y="288" font-size="11" fill="#6b7280">优化训练启动时的</text>
<text x="227" y="304" font-size="11" fill="#6b7280">节点通信初始化</text>
<rect x="390" y="244" width="165" height="100" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="402" y="268" font-size="14" font-weight="700" fill="#111827">找到最新检查点</text>
<text x="402" y="288" font-size="11" fill="#6b7280">3 分钟 → 5 秒</text>
<rect x="565" y="244" width="165" height="100" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="577" y="268" font-size="14" font-weight="700" fill="#111827">按 rank 加载</text>
<text x="577" y="288" font-size="11" fill="#6b7280">每个节点只读</text>
<text x="577" y="304" font-size="11" fill="#6b7280">自己 rank 的文件</text>
<rect x="740" y="244" width="165" height="100" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="752" y="268" font-size="14" font-weight="700" fill="#111827">数据加载初始化</text>
<text x="752" y="288" font-size="11" fill="#6b7280">缓存并复用数据索引</text>
<text x="752" y="304" font-size="11" fill="#6b7280">每次重启 205 毫秒</text>
<rect x="915" y="244" width="165" height="100" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="927" y="268" font-size="14" font-weight="700" fill="#111827">回到稳态训练</text>
<text x="927" y="288" font-size="11" fill="#6b7280">恢复完成</text>
<path d="M205,294.0 L213,294.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M380,294.0 L388,294.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M555,294.0 L563,294.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M730,294.0 L738,294.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M905,294.0 L913,294.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="390" y="380" width="340" height="54" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="402" y="404" font-size="14" font-weight="700" fill="#111827">异步观察进程（常驻）</text>
<text x="402" y="424" font-size="11" fill="#6b7280">持续把每个最新检查点文件映射到对应节点</text>
<path d="M472.5,380 L472.5,346" fill="none" stroke="#8f8bd8" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M647.5,380 L647.5,346" fill="none" stroke="#8f8bd8" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="30" y="458" font-size="11" fill="#9ca3af">据 PDF p. 21–22 重画。方框不按时长比例：报告只给了「3 分钟 → 5 秒」与「205 毫秒」两个分段数字，没有给各段在 6.5 分钟里的占比。</text>
</svg>