<text x="30.0" y="642.0" font-size="12" fill="#6b7280" text-anchor="start">原文结论：Prompt 阶段算力受限，功耗随 batch 涨到 TDP，对功耗帽很敏感；吐字阶段访存受限，功耗不随 batch 变，</text>
<text x="30.0" y="664.0" font-size="12" fill="#6b7280" text-anchor="start">功耗帽降一半以上（700W 到 350W）几乎没有延迟代价（Insight VI）。HHcap 设计就建立在这张图上。</text>
