<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
<marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fa886"/></marker>
<marker id="aq" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9877a"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">AFM 的一次训练步：对抗项管分布，OT 项管路，引导另走一条分支</text>
<text x="30" y="54" font-size="13" fill="#6b7280">灰 = 样本与增强；紫 = 生成器及它的梯度路径；黄 = 判别器；绿 = OT 正则；红 = 分类器引导（训练后段才加）。</text>

<rect x="40" y="90" width="220" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="150" y="116" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">真实样本 x</text>
<text x="150" y="136" font-size="11" fill="#6b7280" text-anchor="middle">ImageNet 潜变量 32×32×4</text>

<rect x="40" y="200" width="220" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="150" y="226" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">噪声 z ~ N(0, I)</text>
<text x="150" y="246" font-size="11" fill="#6b7280" text-anchor="middle">与 x 独立采样，维度相同</text>

<rect x="320" y="190" width="190" height="80" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="415" y="222" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">生成器 G</text>
<text x="415" y="242" font-size="11" fill="#6b7280" text-anchor="middle">标准 DiT，单步去掉时间投影</text>
<text x="415" y="258" font-size="11" fill="#6b7280" text-anchor="middle">G(z) = g(z)</text>

<rect x="560" y="200" width="120" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="620" y="226" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">G(z)</text>
<text x="620" y="246" font-size="11" fill="#6b7280" text-anchor="middle">生成样本</text>

<rect x="720" y="90" width="120" height="170" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="780" y="150" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">ρ 成对增强</text>
<text x="780" y="172" font-size="11" fill="#6b7280" text-anchor="middle">平移 + cutout</text>
<text x="780" y="190" font-size="11" fill="#6b7280" text-anchor="middle">真假用同一组</text>
<text x="780" y="208" font-size="11" fill="#6b7280" text-anchor="middle">引导阶段才开</text>

<rect x="870" y="200" width="100" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="920" y="224" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">φ 归一化</text>
<text x="920" y="242" font-size="11" fill="#6b7280" text-anchor="middle">前向恒等</text>
<text x="920" y="256" font-size="11" fill="#6b7280" text-anchor="middle">反向缩放</text>

<rect x="1000" y="90" width="100" height="170" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="1050" y="150" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">判别器 D</text>
<text x="1050" y="172" font-size="11" fill="#6b7280" text-anchor="middle">DiT + [CLS]</text>
<text x="1050" y="190" font-size="11" fill="#6b7280" text-anchor="middle">只看样本、t、c</text>
<text x="1050" y="208" font-size="11" fill="#6b7280" text-anchor="middle">输入不含 z</text>

<line x1="260" y1="120" x2="716" y2="120" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="840" y1="120" x2="996" y2="120" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="260" y1="230" x2="316" y2="230" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="510" y1="230" x2="556" y2="230" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="680" y1="230" x2="716" y2="230" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="840" y1="230" x2="866" y2="230" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="970" y1="230" x2="996" y2="230" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="780" y="310" width="320" height="70" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="940" y="334" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">相对论对抗损失</text>
<text x="940" y="353" font-size="11" fill="#6b7280" text-anchor="middle">f(a, b) = −log sigmoid(a − b)，比较真假 logit 之差</text>
<text x="940" y="370" font-size="11" fill="#6b7280" text-anchor="middle">D 侧另加 R1、R2（有限差分）与 logit 居中</text>
<line x1="1050" y1="260" x2="1050" y2="306" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="40" y="310" width="470" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="275" y="334" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">OT 正则 λot · ‖G(z) − z‖² / n</text>
<text x="275" y="353" font-size="11" fill="#6b7280" text-anchor="middle">把 G(z) 拉向它自己的起点 z，在所有合法映射里挑运输代价最小的那张</text>
<text x="275" y="370" font-size="11" fill="#6b7280" text-anchor="middle">λot 从 0.2 左右起步、随训练衰减，后段压到 0.001</text>
<line x1="150" y1="260" x2="150" y2="306" stroke="#5fa886" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ag)"/>
<polyline points="600,260 600,345 514,345" fill="none" stroke="#5fa886" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ag)"/>

<rect x="320" y="420" width="240" height="60" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="440" y="444" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">重新加噪</text>
<text x="440" y="464" font-size="11" fill="#6b7280" text-anchor="middle">interp(G(z, c), z′, t′)，t′ ~ U(0, 0.1)</text>
<rect x="610" y="420" width="220" height="60" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="720" y="444" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">时间条件分类器 C</text>
<text x="720" y="464" font-size="11" fill="#6b7280" text-anchor="middle">离线单独训好，B/2，30 epoch</text>
<rect x="880" y="420" width="220" height="60" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="990" y="444" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">引导损失 λcg · (−C)</text>
<text x="990" y="464" font-size="11" fill="#6b7280" text-anchor="middle">1NFE 的最优 λcg = 0.003</text>
<polyline points="650,260 650,400 440,400 440,416" fill="none" stroke="#d9877a" stroke-width="1.4" marker-end="url(#aq)"/>
<line x1="560" y1="450" x2="606" y2="450" stroke="#d9877a" stroke-width="1.4" marker-end="url(#aq)"/>
<line x1="830" y1="450" x2="876" y2="450" stroke="#d9877a" stroke-width="1.4" marker-end="url(#aq)"/>

<text x="30" y="518" font-size="11" fill="#9ca3af">机制示意，据 PDF p. 3–5 式 (13)(14)(23)(26)、p. 22 式 (33)(34) 与 p. 25 Algorithm 2 重画；画的是单步情形。</text>
<text x="30" y="538" font-size="11" fill="#9ca3af">多步时 z 换成插值点 x_s，G 多收源时间 s 与目标时间 t，D 多收 t；OT 项再除以 max(|s − t|, 0.001)。</text>
</svg>
