<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">同一套 28 个块用两次：走两步，还是一次前向走完</text>
<text x="30" y="54" font-size="13" fill="#6b7280">绿 = 进出潜空间的 Patchify / Unpatchify；紫 = Transformer 块（两幅是同一套 28 块）；灰 = 潜空间里的张量；黄 = 块之间的隐状态。</text>

<rect x="20" y="74" width="1080" height="160" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="40" y="102" font-size="14" fill="#111827" font-weight="700">(a) 多步：28 层走 2 次（2NFE）</text>
<rect x="40" y="124" width="80" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="80" y="159" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Patchify</text>
<rect x="140" y="124" width="150" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="215" y="150" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">28 个块</text>
<text x="215" y="170" font-size="11" fill="#6b7280" text-anchor="middle">第 1 次调用</text>
<rect x="310" y="124" width="90" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="355" y="159" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Unpatchify</text>
<rect x="420" y="124" width="160" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="500" y="150" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">中间结果 x_τ</text>
<text x="500" y="170" font-size="11" fill="#6b7280" text-anchor="middle">回到 32×32×4 潜空间</text>
<rect x="600" y="124" width="80" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="640" y="159" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Patchify</text>
<rect x="700" y="124" width="150" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="775" y="150" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">28 个块</text>
<text x="775" y="170" font-size="11" fill="#6b7280" text-anchor="middle">第 2 次调用</text>
<rect x="870" y="124" width="90" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="915" y="159" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Unpatchify</text>
<rect x="980" y="124" width="100" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="1030" y="159" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">输出</text>
<line x1="120" y1="154" x2="136" y2="154" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="290" y1="154" x2="306" y2="154" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="400" y1="154" x2="416" y2="154" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="580" y1="154" x2="596" y2="154" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="680" y1="154" x2="696" y2="154" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="850" y1="154" x2="866" y2="154" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="960" y1="154" x2="976" y2="154" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="40" y="214" font-size="11" fill="#6b7280">两跳之间要把表示压回 4 通道潜变量、再重新切块；训练第 2 跳时，输入是由真实数据插值出来的 x_s（teacher forcing），推理时才换成第 1 跳的输出。</text>

<rect x="20" y="254" width="1080" height="160" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="40" y="282" font-size="14" fill="#111827" font-weight="700">(b) 超深单步：56 层一次前向（1NFE）</text>
<rect x="40" y="304" width="80" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="80" y="339" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Patchify</text>
<rect x="140" y="304" width="150" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="215" y="330" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">28 个块</text>
<text x="215" y="350" font-size="11" fill="#6b7280" text-anchor="middle">第 1 轮</text>
<rect x="310" y="304" width="370" height="60" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="495" y="330" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">隐状态直接传给下一轮</text>
<text x="495" y="350" font-size="11" fill="#6b7280" text-anchor="middle">不投影回潜空间，也不用人工选中间时间点</text>
<rect x="700" y="304" width="150" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="775" y="330" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">28 个块</text>
<text x="775" y="350" font-size="11" fill="#6b7280" text-anchor="middle">第 2 轮，同一套权重</text>
<rect x="870" y="304" width="90" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="915" y="339" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Unpatchify</text>
<rect x="980" y="304" width="100" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="1030" y="339" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">输出</text>
<line x1="120" y1="334" x2="136" y2="334" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="290" y1="334" x2="306" y2="334" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="680" y1="334" x2="696" y2="334" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="850" y1="334" x2="866" y2="334" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="960" y1="334" x2="976" y2="334" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="40" y="394" font-size="11" fill="#6b7280">块里仍喂一个类似时间步的嵌入，只为区分第几轮；整条网络只在最终输出上算单步对抗目标，中间层没有任何监督。</text>

<text x="30" y="444" font-size="11" fill="#9ca3af">结构示意，据 PDF p. 6 Figure 4 与 §3.8 重画。两幅参数同为 675M；112 层 = 同一套 28 块重复 4 次，对应 4NFE。实测 FID 见正文 Table 7。</text>
</svg>
