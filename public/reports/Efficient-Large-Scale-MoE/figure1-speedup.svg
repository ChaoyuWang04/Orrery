<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 1：同一份成绩，MoE 少花几倍训练算力</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">紫 = 域内验证困惑度；绿 = Pile 22 个子集平均困惑度；黄 = 六项零样本平均准确率。灰虚线 = 1 倍，即与 dense 持平。</text>
