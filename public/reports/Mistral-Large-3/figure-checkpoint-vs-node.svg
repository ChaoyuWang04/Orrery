<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0.0" y="0" width="1120.0" height="420" rx="0" fill="#ffffff" stroke="none"/>
<text x="30.0" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">三种精度的权重体积，决定了它能塞进哪一档节点</text>
<text x="30.0" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = 官方 checkpoint 的权重文件体积；灰虚线 = 一档节点的显存总量（按单卡 H100/A100 80 GB、H200 141 GB 计）。</text>
<line x1="502.7" y1="92" x2="502.7" y2="330" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="502.7" y="84" font-size="11" fill="#6b7280" text-anchor="middle">8 × H100 / A100</text>
<text x="502.7" y="350" font-size="11" fill="#9ca3af" text-anchor="middle">640 GB</text>
<line x1="657.2" y1="92" x2="657.2" y2="330" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="657.2" y="84" font-size="11" fill="#6b7280" text-anchor="middle">8 × H200</text>
<text x="657.2" y="350" font-size="11" fill="#9ca3af" text-anchor="middle">1128 GB</text>
<line x1="1014.4" y1="92" x2="1014.4" y2="330" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="1014.4" y="84" font-size="11" fill="#6b7280" text-anchor="middle">16 × H200</text>
<text x="1014.4" y="350" font-size="11" fill="#9ca3af" text-anchor="middle">2256 GB</text>
<text x="40.0" y="128" font-size="14" fill="#111827" text-anchor="start" font-weight="700">BF16</text>
<text x="40.0" y="146" font-size="11" fill="#6b7280" text-anchor="start">Base 与 Instruct-BF16</text>
<rect x="300.0" y="110" width="428.1" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="310.0" y="133" font-size="12" fill="#111827" text-anchor="start">1352.0 GB</text>
<text x="40.0" y="200" font-size="14" fill="#111827" text-anchor="start" font-weight="700">FP8</text>
<text x="40.0" y="218" font-size="11" fill="#6b7280" text-anchor="start">Instruct 默认仓库</text>
<rect x="300.0" y="182" width="215.8" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="310.0" y="205" font-size="12" fill="#111827" text-anchor="start">681.5 GB</text>
<text x="40.0" y="272" font-size="14" fill="#111827" text-anchor="start" font-weight="700">NVFP4</text>
<text x="40.0" y="290" font-size="11" fill="#6b7280" text-anchor="start">只量化前馈与专家</text>
<rect x="300.0" y="254" width="127.6" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="310.0" y="277" font-size="12" fill="#111827" text-anchor="start">403.1 GB</text>
<text x="40.0" y="390" font-size="11" fill="#9ca3af" text-anchor="start">依据：Hugging Face 上各仓库 safetensors 文件体积合计；节点档位取自模型卡与官方技术文档。KV 缓存与激活另需显存，见正文。</text>
</svg>