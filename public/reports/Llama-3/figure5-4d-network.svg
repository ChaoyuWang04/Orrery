<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="580" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">4D 并行的嵌套顺序 [TP, CP, PP, DP]，是网络带宽层级的映射</text>
<text x="30" y="54" font-size="13" fill="#6b7280">紫 = 并行维度，从上到下由内到外；绿 = 405B 训练用的 RoCE 网络，从上到下由快到慢。</text>
<text x="30" y="74" font-size="13" fill="#6b7280">连线只画报告明说的对应：最内层留在一台服务器里，最外两层可能跨多跳网络。</text>
<text x="60" y="112" font-size="14" fill="#111827" font-weight="700">并行维度（由内到外）</text>
<rect x="60" y="125" width="380" height="64" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="76" y="151" font-size="14" fill="#111827" font-weight="700">TP 张量并行</text>
<text x="76" y="173" font-size="11" fill="#6b7280">把单个权重张量切块；每层都要通信，最怕延迟</text>
<rect x="60" y="205" width="380" height="64" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="76" y="231" font-size="14" fill="#111827" font-weight="700">CP 上下文并行</text>
<text x="76" y="253" font-size="11" fill="#6b7280">把序列切段；算注意力前 all-gather K 与 V</text>
<rect x="60" y="285" width="380" height="64" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="76" y="311" font-size="14" fill="#111827" font-weight="700">PP 流水线并行</text>
<text x="76" y="333" font-size="11" fill="#6b7280">按层切成阶段；阶段之间点对点传激活</text>
<rect x="60" y="365" width="380" height="64" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="76" y="391" font-size="14" fill="#111827" font-weight="700">DP 数据并行（FSDP）</text>
<text x="76" y="413" font-size="11" fill="#6b7280">分片优化器状态与梯度；异步预取权重、异步规约梯度</text>
<text x="680" y="112" font-size="14" fill="#111827" font-weight="700">RoCE 网络（由快到慢）</text>
<rect x="680" y="125" width="380" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="696" y="151" font-size="14" fill="#111827" font-weight="700">服务器</text>
<text x="696" y="173" font-size="11" fill="#6b7280">8 张 H100，机内 NVLink</text>
<rect x="680" y="205" width="380" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="696" y="231" font-size="14" fill="#111827" font-weight="700">机架</text>
<text x="696" y="253" font-size="11" fill="#6b7280">16 张 GPU（两台服务器），接一台 ToR 交换机</text>
<rect x="680" y="285" width="380" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="696" y="311" font-size="14" fill="#111827" font-weight="700">Pod</text>
<text x="696" y="333" font-size="11" fill="#6b7280">192 个机架 = 3,072 张 GPU，全二分带宽，无收敛</text>
<rect x="680" y="365" width="380" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="696" y="391" font-size="14" fill="#111827" font-weight="700">集群</text>
<text x="696" y="413" font-size="11" fill="#6b7280">8 个 Pod = 24K 张 GPU，聚合层收敛比 1:7</text>
<line x1="440" y1="157" x2="676" y2="157" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="560" y="147" font-size="11" fill="#9ca3af" text-anchor="middle">Table 4：TP = 8，一台服务器</text>
<line x1="440" y1="317" x2="658" y2="317" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="440" y1="397" x2="658" y2="397" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="664" y1="207" x2="664" y2="427" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="664" y1="207" x2="674" y2="207" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="664" y1="427" x2="674" y2="427" stroke="#9ca3af" stroke-width="1.4"/>
<text x="560" y="452" font-size="11" fill="#9ca3af" text-anchor="middle">PP 与 DP 可能跨出服务器、走多跳网络，延迟可达数十微秒</text>
<text x="30" y="496" font-size="13" fill="#6b7280">内层维度通信最密、最怕延迟，所以放在带宽最高的一层；DP 放最外，因为 FSDP 能用异步预取和异步规约把延迟藏起来。</text>
<text x="30" y="518" font-size="13" fill="#6b7280">并行方式与作业调度器都感知拓扑，尽量不让通信跨 Pod。CP 具体落在哪一层报告没有写，图上不连线。</text>
<text x="30" y="556" font-size="11" fill="#9ca3af">据 PDF p. 9（网络拓扑）、p. 10（Table 4）、p. 11（Figure 5）与 p. 12（并行顺序、NCCLX）重画。机制示意，不是实测带宽；405B 预训练最多只用了这 24K 张卡中的 16K 张。</text>
</svg>
