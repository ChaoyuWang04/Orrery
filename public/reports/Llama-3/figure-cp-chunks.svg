<text x="30" y="556" font-size="11" fill="#9ca3af">据 PDF p. 11「Context parallelism for long sequences」重画。报告只写了切成 2 × CP 块、第 i 个 rank 拿第 i 与第 2 × CP − 1 − i 块，理由是负载均衡；</text>
<text x="30" y="574" font-size="11" fill="#9ca3af">工作量按「块序号 + 1」计的方块模型和连续切的对照都是本图的机制示意，不是实测时间。405B 长上下文阶段实际用 CP = 16（Table 4）。</text>
</svg>
