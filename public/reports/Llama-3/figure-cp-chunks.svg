<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">上下文并行：把序列切成 2 × CP 块，一头一尾配成一对</text>
<text x="30" y="54" font-size="13" fill="#6b7280">以 CP = 4 为例：序列切成 8 块。因果注意力下，第 k 块要看前面全部 k 块加自己，工作量大致正比于 k + 1。方块内的数字是块序号，方块长度是工作量。</text>
<text x="30" y="74" font-size="13" fill="#6b7280">灰 = 假想对照（连续切）；绿 = Llama 3 的配法（第 i 个 rank 拿第 i 块和第 2 × CP − 1 − i 块）。</text>
<text x="30" y="110" font-size="14" fill="#111827" font-weight="700">假想对照：按顺序连续切，每个 rank 拿相邻两块</text>
