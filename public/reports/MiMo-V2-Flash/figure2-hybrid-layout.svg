<text x="210.0" y="312.0" font-size="12" fill="#111827" text-anchor="start">最近 128 个 Token</text>
<text x="450.0" y="312.0" font-size="12" fill="#111827" text-anchor="start">全部历史</text>
<line x1="60" y1="292" x2="660" y2="292" stroke="#eeeeee" stroke-width="1"/>
