<text x="90.0" y="108.0" font-size="12" fill="#6b7280" text-anchor="end">注意力</text>
<text x="90.0" y="148.0" font-size="12" fill="#6b7280" text-anchor="end">前馈</text>
<text x="108.5" y="180.0" font-size="11" fill="#9ca3af" text-anchor="middle">1</text>
<text x="203.5" y="180.0" font-size="11" fill="#9ca3af" text-anchor="middle">6</text>
<text x="317.5" y="180.0" font-size="11" fill="#9ca3af" text-anchor="middle">12</text>
<text x="1001.5" y="180.0" font-size="11" fill="#9ca3af" text-anchor="middle">48</text>
<text x="96.0" y="198.0" font-size="11" fill="#9ca3af" text-anchor="start">层号（虚线分出 8 个混合块）</text>
<text x="300.0" y="198.0" font-size="11" fill="#6b7280" text-anchor="start">合计 39 层滑动窗口、9 层全局；除第 1 层外都是 MoE（PDF p. 5–6、p. 10）。</text>
<rect x="40" y="226" width="640" height="250" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="60.0" y="252.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">两类注意力层只差在「看多远」和「KV 头数」</text>
<text x="60.0" y="282.0" font-size="12" fill="#6b7280" text-anchor="start"></text>
