<text x="210.0" y="342.0" font-size="12" fill="#111827" text-anchor="start">64 / 8</text>
<text x="450.0" y="342.0" font-size="12" fill="#111827" text-anchor="start">64 / 4</text>
<line x1="60" y1="322" x2="660" y2="322" stroke="#eeeeee" stroke-width="1"/>
<text x="60.0" y="372.0" font-size="12" fill="#6b7280" text-anchor="start">每头维度（QK / V）</text>
<text x="210.0" y="372.0" font-size="12" fill="#111827" text-anchor="start">192 / 128</text>
<text x="450.0" y="372.0" font-size="12" fill="#111827" text-anchor="start">192 / 128</text>
<line x1="60" y1="352" x2="660" y2="352" stroke="#eeeeee" stroke-width="1"/>
<text x="60.0" y="402.0" font-size="12" fill="#6b7280" text-anchor="start">RoPE</text>
<text x="210.0" y="402.0" font-size="12" fill="#111827" text-anchor="start">只作用于前 64 维，基频 10,000</text>
<text x="450.0" y="402.0" font-size="12" fill="#111827" text-anchor="start">只作用于前 64 维，基频 64 万 → 500 万</text>
<line x1="60" y1="382" x2="660" y2="382" stroke="#eeeeee" stroke-width="1"/>
<text x="60.0" y="432.0" font-size="12" fill="#6b7280" text-anchor="start">sink 偏置</text>
<text x="210.0" y="432.0" font-size="12" fill="#111827" text-anchor="start">每头一个可学习标量</text>
<text x="450.0" y="432.0" font-size="12" fill="#111827" text-anchor="start">报告未区分；公开 config 里未开启</text>
<line x1="60" y1="412" x2="660" y2="412" stroke="#eeeeee" stroke-width="1"/>
<text x="60.0" y="462.0" font-size="11" fill="#6b7280" text-anchor="start">滑动窗口层的 KV 缓存最多存 128 个位置，所以随长度增长的缓存只来自 9 层全局层。</text>
<rect x="710" y="226" width="370" height="250" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="730.0" y="252.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">MTP 头：给主模型打草稿</text>
<rect x="750" y="270" width="290" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="895.0" y="290.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">输入：主模型隐状态 + Token embedding</text>
<text x="895.0" y="308.0" font-size="11" fill="#6b7280" text-anchor="middle">embedding 与 LM Head 和主模型共享（图上标 tied）</text>
<rect x="750" y="332" width="290" height="48" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="895.0" y="352.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">滑动窗口注意力</text>
<text x="895.0" y="370.0" font-size="11" fill="#6b7280" text-anchor="middle">64 / 8 头，窗口 128</text>
<rect x="750" y="394" width="290" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="895.0" y="414.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">稠密 FFN（不是 MoE）</text>
<text x="895.0" y="432.0" font-size="11" fill="#6b7280" text-anchor="middle">每个 MTP 块 0.33B 参数</text>
<text x="730.0" y="462.0" font-size="11" fill="#6b7280" text-anchor="start">预训练挂 1 个，后训练复制成 3 个联合训练（PDF p. 9）</text>
<text x="30.0" y="508.0" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p. 5 Figure 2、p. 6 Table 1 与 p. 10 超参重画，是结构示意。「第 1 层替换掉第一个混合块里的第一层滑动窗口」是由 8 × 6 = 48 与 39 / 9 的层数推出的，</text>
<text x="30.0" y="526.0" font-size="11" fill="#9ca3af" text-anchor="start">与官方权重 config 的 hybrid_layer_pattern 一致（外部补充）；同一份 config 里 sink 偏置只在滑动窗口层打开（add_full_attention_sink_bias 为 false），与报告的写法不同。</text>
