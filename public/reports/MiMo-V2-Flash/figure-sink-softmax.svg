<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">窗口里没有值得看的 Token 时：普通 softmax 仍要把权重分满 1，sink 偏置可以把它们都吸走</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">黄 = 窗口内各 Token 的注意力权重（会乘到 Value 上进入输出）；灰 = sink 吸走的份额（分子里没有它，不对应任何 Value）。</text>
<rect x="40" y="80" width="510" height="316" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="60.0" y="108.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">普通 softmax（式 2 去掉 sink 项）</text>
<text x="60.0" y="128.0" font-size="11" fill="#6b7280" text-anchor="start">分数都很低，但归一化后仍被迫分满 1，噪声混进输出</text>
<line x1="80" y1="340" x2="530" y2="340" stroke="#9ca3af" stroke-width="1"/>
<rect x="100" y="311.9" width="40" height="28.1" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="120.0" y="305.9" font-size="11" fill="#6b7280" text-anchor="middle">0.16</text>
<text x="120.0" y="356.0" font-size="11" fill="#9ca3af" text-anchor="middle">Token 1</text>
<rect x="156" y="293.6" width="40" height="46.4" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="176.0" y="287.6" font-size="11" fill="#6b7280" text-anchor="middle">0.26</text>
<text x="176.0" y="356.0" font-size="11" fill="#9ca3af" text-anchor="middle">Token 2</text>
<rect x="212" y="317.0" width="40" height="23.0" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="232.0" y="311.0" font-size="11" fill="#6b7280" text-anchor="middle">0.13</text>
<text x="232.0" y="356.0" font-size="11" fill="#9ca3af" text-anchor="middle">Token 3</text>
<rect x="268" y="305.7" width="40" height="34.3" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="288.0" y="299.7" font-size="11" fill="#6b7280" text-anchor="middle">0.19</text>
<text x="288.0" y="356.0" font-size="11" fill="#9ca3af" text-anchor="middle">Token 4</text>
<rect x="324" y="322.9" width="40" height="17.1" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="344.0" y="316.9" font-size="11" fill="#6b7280" text-anchor="middle">0.09</text>
<text x="344.0" y="356.0" font-size="11" fill="#9ca3af" text-anchor="middle">Token 5</text>
<rect x="380" y="308.9" width="40" height="31.1" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="400.0" y="302.9" font-size="11" fill="#6b7280" text-anchor="middle">0.17</text>
<text x="400.0" y="356.0" font-size="11" fill="#9ca3af" text-anchor="middle">Token 6</text>
<text x="60.0" y="380.0" font-size="12" fill="#111827" text-anchor="start" font-weight="700">窗口内权重之和 = 1.00</text>
<rect x="570" y="80" width="510" height="316" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="590.0" y="108.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">加 sink 偏置（式 2–3）</text>
<text x="590.0" y="128.0" font-size="11" fill="#6b7280" text-anchor="start">分母多一项 exp(sink)，窗口内的权重可以一起趋近 0</text>
<line x1="610" y1="340" x2="1060" y2="340" stroke="#9ca3af" stroke-width="1"/>
<rect x="630" y="337.0" width="40" height="3.0" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="650.0" y="331.0" font-size="11" fill="#6b7280" text-anchor="middle">0.02</text>
<text x="650.0" y="356.0" font-size="11" fill="#9ca3af" text-anchor="middle">Token 1</text>
<rect x="686" y="335.1" width="40" height="4.9" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="706.0" y="329.1" font-size="11" fill="#6b7280" text-anchor="middle">0.03</text>
<text x="706.0" y="356.0" font-size="11" fill="#9ca3af" text-anchor="middle">Token 2</text>
<rect x="742" y="337.6" width="40" height="2.4" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="762.0" y="331.6" font-size="11" fill="#6b7280" text-anchor="middle">0.01</text>
<text x="762.0" y="356.0" font-size="11" fill="#9ca3af" text-anchor="middle">Token 3</text>
<rect x="798" y="336.4" width="40" height="3.6" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="818.0" y="330.4" font-size="11" fill="#6b7280" text-anchor="middle">0.02</text>
<text x="818.0" y="356.0" font-size="11" fill="#9ca3af" text-anchor="middle">Token 4</text>
<rect x="854" y="338.2" width="40" height="1.8" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="874.0" y="332.2" font-size="11" fill="#6b7280" text-anchor="middle">0.01</text>
<text x="874.0" y="356.0" font-size="11" fill="#9ca3af" text-anchor="middle">Token 5</text>
<rect x="910" y="336.7" width="40" height="3.3" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="930.0" y="330.7" font-size="11" fill="#6b7280" text-anchor="middle">0.02</text>
<text x="930.0" y="356.0" font-size="11" fill="#9ca3af" text-anchor="middle">Token 6</text>
<rect x="996" y="178.9" width="56" height="161.1" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="1024.0" y="172.9" font-size="11" fill="#6b7280" text-anchor="middle">0.90</text>
<text x="1024.0" y="356.0" font-size="11" fill="#9ca3af" text-anchor="middle">sink</text>
<text x="590.0" y="380.0" font-size="12" fill="#111827" text-anchor="start" font-weight="700">窗口内权重之和 = 0.10</text>
<text x="30.0" y="428.0" font-size="11" fill="#9ca3af" text-anchor="start">示意数值：6 个 Token 的分数取 −1.5 到 −2.5，sink = 2（本文自拟，不是报告数据）。真实窗口是 128 个 Token，sink 是每个注意力头一个可学习的标量（PDF p. 6–7）。</text>
<text x="30.0" y="448.0" font-size="11" fill="#9ca3af" text-anchor="start">加 sink 后这一头的输出接近零向量，相当于「这一层这个头这次不发言」；报告在 32B 对照里发现，没有它 128 窗口的混合模型在多数通用基准上掉分（PDF p. 7–8）。</text>
</svg>