<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="860" height="410" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="860" height="410" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">ARC：写进权重的份额，过滤之后还剩多少</text>
<text x="30" y="58" font-size="13" fill="#6b7280">灰 = 分给 ARC 的平均任务权重；绿 = 滤掉零梯度题后 ARC 在 batch 里的实际占比</text>
<text x="30" y="78" font-size="13" fill="#6b7280">实验 1（Qwen2.5-3B，三个中等难度任务）；条长按数值画，横轴 0–1</text>
<line x1="300" y1="92" x2="300" y2="350" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="550" y1="92" x2="550" y2="350" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="800" y1="92" x2="800" y2="350" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<text x="300" y="368" font-size="11" fill="#9ca3af" text-anchor="middle">0</text>
<text x="550" y="368" font-size="11" fill="#9ca3af" text-anchor="middle">0.5</text>
<text x="800" y="368" font-size="11" fill="#9ca3af" text-anchor="middle">1.0</text>

<text x="30" y="118" font-size="14" fill="#111827" font-weight="700">只开 IWU（λ=0.25）</text>
<text x="30" y="137" font-size="11" fill="#6b7280">没有保比例采样</text>
<rect x="300" y="102" width="400" height="22" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="708" y="118" font-size="12" fill="#111827">约 0.80</text>
<rect x="300" y="130" width="225" height="22" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="533" y="146" font-size="12" fill="#111827">约 0.45</text>

<text x="30" y="198" font-size="14" fill="#111827" font-weight="700">MT-GRPO λ=0.2</text>
<text x="30" y="217" font-size="11" fill="#6b7280">去掉保比例约束，仍过滤、仍重采</text>
<rect x="300" y="182" width="315" height="22" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="623" y="198" font-size="12" fill="#111827">0.63</text>
<rect x="300" y="210" width="180" height="22" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="488" y="226" font-size="12" fill="#111827">0.36</text>
<text x="640" y="226" font-size="11" fill="#9ca3af">ARC 准确率 62.4%</text>

<text x="30" y="278" font-size="14" fill="#111827" font-weight="700">MT-GRPO λ=0.2</text>
<text x="30" y="297" font-size="11" fill="#6b7280">完整版，带保比例采样</text>
<rect x="300" y="262" width="215" height="22" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="523" y="278" font-size="12" fill="#111827">0.43</text>
<rect x="300" y="290" width="215" height="22" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="523" y="306" font-size="12" fill="#111827">0.43</text>
<text x="640" y="306" font-size="11" fill="#9ca3af">ARC 准确率 64.8%</text>

<text x="30" y="396" font-size="11" fill="#9ca3af">第一行取自 PDF p. 22 正文（原文即写约值），后两行取自 p. 25 正文；按原文数字重画，不是原图</text>
</svg>
