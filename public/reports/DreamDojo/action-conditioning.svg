<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 550" width="1120" height="550" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="550" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">动作条件怎么接进世界模型：按潜帧切块，两阶段共用一条注入通路</text>
<text x="30" y="56" font-size="13" fill="#6b7280">绿 = 预训练时的潜动作；紫 = 后训练时的机器人相对动作；黄 = 被零初始化或重新初始化的层；灰 = 两阶段共用、继续微调的部分。</text>
