<rect x="690" y="170" width="232" height="32" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="806.0" y="191" font-size="12" fill="#111827" text-anchor="middle">x³</text>
<line x1="806.0" y1="222" x2="806.0" y2="205" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="690" y="224" width="232" height="28" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="806.0" y="242" font-size="11" fill="#111827" text-anchor="middle">a⁹–a¹²：相对本块起点位姿</text>
<text x="176" y="242" font-size="11" fill="#9ca3af" text-anchor="middle">无动作</text>
<text x="945" y="130" font-size="11" fill="#6b7280">13 帧压成 4 个潜帧</text>
<text x="945" y="148" font-size="11" fill="#6b7280">WAN2.2 时间压缩 4 倍</text>
<text x="945" y="166" font-size="11" fill="#6b7280">首帧只当条件帧</text>
<text x="945" y="200" font-size="11" fill="#6b7280">不把整段动作</text>
<text x="945" y="218" font-size="11" fill="#6b7280">广播给所有潜帧</text>
<rect x="20" y="278" width="1080" height="222" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36" y="302" font-size="14" fill="#111827" font-weight="700">B. 同一条注入通路，预训练和后训练只换输入</text>
<line x1="380" y1="345" x2="452" y2="382" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="380" y1="445" x2="452" y2="412" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="700" y1="397" x2="738" y2="397" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="880" y1="397" x2="918" y2="397" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="40" y="320" width="340" height="50" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="56" y="341" font-size="14" fill="#111827" font-weight="700">预训练：人类视频</text>
<text x="56" y="360" font-size="11" fill="#6b7280">相邻两帧 → 潜动作模型 → 32 维 â，4 个拼一块</text>
<rect x="40" y="420" width="340" height="50" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="56" y="441" font-size="14" fill="#111827" font-weight="700">后训练：目标机器人</text>
<text x="56" y="460" font-size="11" fill="#6b7280">真值关节动作 → 相对化 → 4 步一块，展平送入</text>
<rect x="440" y="330" width="260" height="120" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="570" y="352" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">轻量动作 MLP</text>
<rect x="455" y="364" width="110" height="72" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="510" y="386" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">第一层</text>
<text x="510" y="406" font-size="11" fill="#6b7280" text-anchor="middle">后训练时</text>
<text x="510" y="422" font-size="11" fill="#6b7280" text-anchor="middle">重新初始化</text>
<rect x="580" y="364" width="110" height="72" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="635" y="386" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">末层</text>
<text x="635" y="406" font-size="11" fill="#6b7280" text-anchor="middle">预训练起点</text>
<text x="635" y="422" font-size="11" fill="#6b7280" text-anchor="middle">零初始化</text>
<rect x="740" y="365" width="140" height="64" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="810" y="392" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">＋时间步嵌入</text>
<text x="810" y="412" font-size="11" fill="#6b7280" text-anchor="middle">两者相加</text>
<rect x="920" y="355" width="170" height="84" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="1005" y="382" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">每个 DiT 块</text>
<text x="1005" y="402" font-size="11" fill="#6b7280" text-anchor="middle">自适应 LayerNorm</text>
<text x="1005" y="420" font-size="11" fill="#6b7280" text-anchor="middle">scale、shift、gate</text>
<text x="440" y="478" font-size="11" fill="#9ca3af">预训练时文本条件固定为空 prompt；后训练全参数微调，只有第一层按新动作维度重建。</text>
<text x="30" y="528" font-size="11" fill="#9ca3af">机制示意。依据 PDF p.5–7（3.3.1–3.3.3 节）与 p.9 的训练设置重画；每个潜帧对应 4 个像素帧、首帧为条件帧、其后 12 步相对动作，均按原文设置排布。</text>
