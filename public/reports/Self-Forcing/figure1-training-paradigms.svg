<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
<marker id="arp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8f8bd8"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="480" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 1：三种训练范式，差别只在「上下文从哪来」</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">绿 = 干净的真值帧；黄 = 加了噪声的真值帧；紫 = 模型自己生成的帧；灰 = 当前待去噪的噪声帧。红字 = 乘起来不等于推理时的联合分布。</text>
<rect x="16" y="72" width="352" height="340" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="192" y="96" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(a) Teacher Forcing</text>
<text x="192" y="120" font-size="12" fill="#d9877a" text-anchor="middle" font-weight="700">p(x̂¹)p(x̂²|x¹)p(x̂³|x¹,x²) ≠ p(x̂¹,x̂²,x̂³)</text>
<rect x="38" y="136" width="88" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="82.0" y="157.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">x̂¹</text>
<line x1="82" y1="196" x2="82" y2="172" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="82" y1="262" x2="82" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="38" y="262" width="88" height="34" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="82.0" y="283.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">噪声 1</text>
<rect x="148" y="136" width="88" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="192.0" y="157.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">x̂²</text>
<line x1="192" y1="196" x2="192" y2="172" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="192" y1="262" x2="192" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="148" y="262" width="88" height="34" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="192.0" y="283.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">噪声 2</text>
<rect x="148" y="306" width="88" height="34" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="192.0" y="327.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">x¹</text>
<rect x="258" y="136" width="88" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="302.0" y="157.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">x̂³</text>
<line x1="302" y1="196" x2="302" y2="172" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="302" y1="262" x2="302" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="258" y="262" width="88" height="34" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="302.0" y="283.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">噪声 3</text>
<rect x="258" y="306" width="88" height="34" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="302.0" y="327.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">x¹, x²</text>
<rect x="38" y="196" width="308" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
<text x="192.0" y="217.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">因果 DiT</text>
<text x="38" y="324" font-size="11" fill="#6b7280" text-anchor="start">当前帧</text>
<text x="38" y="338" font-size="11" fill="#6b7280" text-anchor="start">的条件</text>
<text x="38" y="370" font-size="11" fill="#6b7280" text-anchor="start">上下文 = 干净的真值帧。</text>
<text x="38" y="388" font-size="11" fill="#6b7280" text-anchor="start">每帧的去噪损失各算各的。</text>
<rect x="384" y="72" width="352" height="340" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="560" y="96" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(b) Diffusion Forcing</text>
<text x="560" y="120" font-size="12" fill="#d9877a" text-anchor="middle" font-weight="700">p(x̂¹)p(x̂²|x¹ₜ)p(x̂³|x¹ₜ,x²ₜ) ≠ p(x̂¹,x̂²,x̂³)</text>
<rect x="406" y="136" width="88" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="450.0" y="157.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">x̂¹</text>
<line x1="450" y1="196" x2="450" y2="172" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="450" y1="262" x2="450" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="406" y="262" width="88" height="34" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="450.0" y="283.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">噪声 1</text>
<rect x="516" y="136" width="88" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="560.0" y="157.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">x̂²</text>
<line x1="560" y1="196" x2="560" y2="172" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="560" y1="262" x2="560" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="516" y="262" width="88" height="34" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="560.0" y="283.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">噪声 2</text>
<rect x="516" y="306" width="88" height="34" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="560.0" y="327.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">x¹ₜ</text>
<rect x="626" y="136" width="88" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="670.0" y="157.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">x̂³</text>
<line x1="670" y1="196" x2="670" y2="172" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="670" y1="262" x2="670" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="626" y="262" width="88" height="34" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="670.0" y="283.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">噪声 3</text>
<rect x="626" y="306" width="88" height="34" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="670.0" y="327.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">x¹ₜ, x²ₜ</text>
<rect x="406" y="196" width="308" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
<text x="560.0" y="217.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">因果 DiT</text>
<text x="406" y="324" font-size="11" fill="#6b7280" text-anchor="start">当前帧</text>
<text x="406" y="338" font-size="11" fill="#6b7280" text-anchor="start">的条件</text>
<text x="406" y="370" font-size="11" fill="#6b7280" text-anchor="start">上下文 = 各帧独立加噪的真值帧。</text>
<text x="406" y="388" font-size="11" fill="#6b7280" text-anchor="start">覆盖了「过去干净、当前带噪」，仍不是自己的过去。</text>
<rect x="752" y="72" width="352" height="340" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="928" y="96" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(c) Self Forcing</text>
<text x="928" y="120" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">p(x̂¹)p(x̂²|x̂¹)p(x̂³|x̂¹,x̂²) = p(x̂¹,x̂²,x̂³)</text>
<rect x="774" y="136" width="88" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="818.0" y="157.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">x̂¹</text>
<line x1="818" y1="196" x2="818" y2="172" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="818" y1="262" x2="818" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="774" y="262" width="88" height="34" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="818.0" y="283.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">噪声 1</text>
<rect x="884" y="136" width="88" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="928.0" y="157.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">x̂²</text>
<line x1="928" y1="196" x2="928" y2="172" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="928" y1="262" x2="928" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="884" y="262" width="88" height="34" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="928.0" y="283.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">噪声 2</text>
<rect x="884" y="306" width="88" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="928.0" y="327.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">x̂¹</text>
<rect x="994" y="136" width="88" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="1038.0" y="157.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">x̂³</text>
<line x1="1038" y1="196" x2="1038" y2="172" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="1038" y1="262" x2="1038" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="994" y="262" width="88" height="34" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="1038.0" y="283.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">噪声 3</text>
<rect x="994" y="306" width="88" height="34" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="1038.0" y="327.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">x̂¹, x̂²</text>
<rect x="774" y="196" width="308" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
<text x="928.0" y="217.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">因果 DiT</text>
<text x="774" y="324" font-size="11" fill="#6b7280" text-anchor="start">当前帧</text>
<text x="774" y="338" font-size="11" fill="#6b7280" text-anchor="start">的条件</text>
<text x="774" y="370" font-size="11" fill="#6b7280" text-anchor="start">上下文 = 自己刚生成的帧，训练时带 KV cache 滚动。</text>
<text x="774" y="388" font-size="11" fill="#6b7280" text-anchor="start">在整段输出上算分布匹配损失（DMD / SiD / GAN）。</text>
<text x="30" y="442" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 2 Figure 1 重画。等式照抄原图；每列的上下文在 (a)(b) 里来自数据，在 (c) 里来自模型自己。</text>
<text x="30" y="464" font-size="13" fill="#6b7280" text-anchor="start">原文说明：记号上的「一帧」也可以是一块帧（chunk）。</text>
</svg>
