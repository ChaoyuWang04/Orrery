<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
<marker id="arp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8f8bd8"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 3：外推长视频时，三种滑窗各在哪里花算力</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">灰 = 当前待去噪的帧；紫 = 每个去噪步都要重算的 token；红 = 窗口一挪就要重算 KV 的帧；黄 = 直接复用的 KV cache；白虚线 = 已出窗口。T = 去噪步数，L = 窗口帧数。</text>
<rect x="16" y="72" width="352" height="330" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="192" y="96" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(a) 双向注意力滑窗</text>
<text x="192" y="124" font-size="11" fill="#6b7280" text-anchor="middle">生成第 5 帧时，窗口 = 第 2–5 帧</text>
<rect x="42" y="150" width="52" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="5 4"/>
<text x="68.0" y="174.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">1</text>
<rect x="104" y="150" width="52" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="130.0" y="174.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">2</text>
<rect x="166" y="150" width="52" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="192.0" y="174.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">3</text>
<rect x="228" y="150" width="52" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="254.0" y="174.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">4</text>
<rect x="290" y="150" width="52" height="40" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="316.0" y="174.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">5</text>
<text x="192" y="232" font-size="19" fill="#111827" text-anchor="middle" font-weight="700">O(T·L²)</text>
<text x="192" y="252" font-size="11" fill="#9ca3af" text-anchor="middle">每生成一帧的注意力开销</text>
<text x="38" y="290" font-size="11" fill="#6b7280" text-anchor="start">双向注意力不支持 KV cache。</text>
<text x="38" y="310" font-size="11" fill="#6b7280" text-anchor="start">每个去噪步都把整个窗口</text>
<text x="38" y="330" font-size="11" fill="#6b7280" text-anchor="start">重新算一遍注意力。</text>
<rect x="384" y="72" width="352" height="330" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="560" y="96" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(b) 因果滑窗 + 重算 KV</text>
<text x="560" y="124" font-size="11" fill="#6b7280" text-anchor="middle">生成第 5 帧时，窗口 = 第 2–5 帧</text>
<rect x="410" y="150" width="52" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="5 4"/>
<text x="436.0" y="174.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">1</text>
<rect x="472" y="150" width="52" height="40" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="498.0" y="174.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">2</text>
<rect x="534" y="150" width="52" height="40" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="560.0" y="174.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">3</text>
<rect x="596" y="150" width="52" height="40" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="622.0" y="174.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">4</text>
<rect x="658" y="150" width="52" height="40" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="684.0" y="174.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">5</text>
<text x="560" y="232" font-size="19" fill="#111827" text-anchor="middle" font-weight="700">O(L² + T·L)</text>
<text x="560" y="252" font-size="11" fill="#9ca3af" text-anchor="middle">每生成一帧的注意力开销</text>
<text x="406" y="290" font-size="11" fill="#6b7280" text-anchor="start">窗口一挪，重叠帧的 KV 全部重算；</text>
<text x="406" y="310" font-size="11" fill="#6b7280" text-anchor="start">前人因此加大步长、减少重叠，</text>
<text x="406" y="330" font-size="11" fill="#6b7280" text-anchor="start">窗口开头的帧能看的历史变短。</text>
<rect x="752" y="72" width="352" height="330" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="928" y="96" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(c) 因果滑窗 + rolling KV</text>
<text x="928" y="124" font-size="11" fill="#6b7280" text-anchor="middle">生成第 5 帧时，窗口 = 第 2–5 帧</text>
<rect x="778" y="150" width="52" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="5 4"/>
<text x="804.0" y="174.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">1</text>
<rect x="840" y="150" width="52" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="866.0" y="174.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">2</text>
<rect x="902" y="150" width="52" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="928.0" y="174.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">3</text>
<rect x="964" y="150" width="52" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="990.0" y="174.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">4</text>
<rect x="1026" y="150" width="52" height="40" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="1052.0" y="174.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">5</text>
<text x="928" y="232" font-size="19" fill="#111827" text-anchor="middle" font-weight="700">O(T·L)</text>
<text x="928" y="252" font-size="11" fill="#9ca3af" text-anchor="middle">每生成一帧的注意力开销</text>
<text x="774" y="290" font-size="11" fill="#6b7280" text-anchor="start">固定长度的 KV 队列：满了先丢最老的一条，</text>
<text x="774" y="310" font-size="11" fill="#6b7280" text-anchor="start">新帧去噪完再追加，从不重算。</text>
<text x="774" y="330" font-size="11" fill="#6b7280" text-anchor="start">训练时去噪最后一块不许看第一块。</text>
<text x="30" y="432" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 7 Figure 3 与 §3.4（p. 6）重画；复杂度照抄原文，框数只是示意。实测：生成 10 秒视频时 (b) 只有 4.6 FPS，(c) 保持 16.1 FPS（p. 9）。</text>
<text x="30" y="454" font-size="13" fill="#6b7280" text-anchor="start">(c) 最后一行是为了模拟「第一帧已出窗」：因果 VAE 的第一个潜帧统计与众不同，朴素 rolling 会闪烁（p. 6、附录 B）。</text>
</svg>
