<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>

  <text x="24" y="38" font-size="19" font-weight="700" fill="#111827">被预算截断的轨迹：奖励进组均值，token 不进梯度</text>
  <text x="24" y="62" font-size="13" fill="#6b7280">紫条：跑完并拿到验证器裁决的轨迹；黄条：被轮数或长度预算截断的轨迹；条长代表生成的 token 数</text>
  <text x="24" y="82" font-size="13" fill="#6b7280">右两列格子：绿 = 这条轨迹的 token 被推高，红 = 被压低，灰 = 不回传梯度</text>

  <!-- 表头 -->
  <text x="210" y="116" font-size="11" fill="#9ca3af">生成的 token（条长，示意）</text>
  <text x="620" y="116" font-size="11" fill="#9ca3af" text-anchor="middle">奖励 R</text>
  <text x="700" y="116" font-size="11" fill="#9ca3af" text-anchor="middle">优势 R − R̄</text>
  <text x="850" y="116" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">不掩码</text>
  <text x="1025" y="116" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">掩码</text>

  <!-- 行 A -->
  <text x="24" y="148" font-size="14" font-weight="700" fill="#111827">轨迹 A</text>
  <text x="24" y="164" font-size="11" fill="#6b7280">跑完，修好</text>
  <rect x="210" y="138" width="80" height="24" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="620" y="155" font-size="13" fill="#111827" text-anchor="middle">1.0</text>
  <text x="700" y="155" font-size="13" fill="#111827" text-anchor="middle">+0.625</text>
  <rect x="770" y="138" width="160" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="850" y="154" font-size="11" fill="#111827" text-anchor="middle">推高</text>
  <rect x="945" y="138" width="160" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="1025" y="154" font-size="11" fill="#111827" text-anchor="middle">推高</text>

  <!-- 行 B -->
  <text x="24" y="198" font-size="14" font-weight="700" fill="#111827">轨迹 B</text>
  <text x="24" y="214" font-size="11" fill="#6b7280">跑完，修好一部分</text>
  <rect x="210" y="188" width="170" height="24" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="620" y="205" font-size="13" fill="#111827" text-anchor="middle">0.5</text>
  <text x="700" y="205" font-size="13" fill="#111827" text-anchor="middle">+0.125</text>
  <rect x="770" y="188" width="160" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="850" y="204" font-size="11" fill="#111827" text-anchor="middle">略推高</text>
  <rect x="945" y="188" width="160" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="1025" y="204" font-size="11" fill="#111827" text-anchor="middle">略推高</text>

  <!-- 行 C -->
  <text x="24" y="248" font-size="14" font-weight="700" fill="#111827">轨迹 C</text>
  <text x="24" y="264" font-size="11" fill="#6b7280">跑完，没修好</text>
  <rect x="210" y="238" width="190" height="24" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="620" y="255" font-size="13" fill="#111827" text-anchor="middle">0</text>
  <text x="700" y="255" font-size="13" fill="#111827" text-anchor="middle">−0.375</text>
  <rect x="770" y="238" width="160" height="24" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
  <text x="850" y="254" font-size="11" fill="#111827" text-anchor="middle">压低</text>
  <rect x="945" y="238" width="160" height="24" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
  <text x="1025" y="254" font-size="11" fill="#111827" text-anchor="middle">压低</text>

  <!-- 行 D -->
  <text x="24" y="298" font-size="14" font-weight="700" fill="#111827">轨迹 D</text>
  <text x="24" y="314" font-size="11" fill="#6b7280">在攻难修复，撞上预算</text>
  <rect x="210" y="288" width="360" height="24" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="620" y="305" font-size="13" fill="#111827" text-anchor="middle">0</text>
  <text x="700" y="305" font-size="13" fill="#111827" text-anchor="middle">−0.375</text>
  <rect x="770" y="288" width="160" height="24" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
  <text x="850" y="304" font-size="11" fill="#111827" text-anchor="middle">压低，token 最多</text>
  <rect x="945" y="288" width="160" height="24" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="1025" y="304" font-size="11" fill="#111827" text-anchor="middle">不回传梯度</text>

  <!-- 基线说明 -->
  <line x1="24" y1="336" x2="1105" y2="336" stroke="#cbd2d9" stroke-width="1"/>
  <text x="24" y="362" font-size="13" fill="#111827">组均值 R̄ = (1.0 + 0.5 + 0 + 0) / 4 = 0.375：两种做法里 D 的奖励都算进这个均值，差别只在 D 的 token 有没有梯度</text>
  <text x="24" y="390" font-size="11" fill="#6b7280">不掩码时按 token 平均，D 每个 token 都挨一份 −0.375，越长罚得越多 → 策略学会把每轮写短 → 更多轨迹撞上轮数上限 → 截断更多</text>
  <text x="24" y="408" font-size="11" fill="#6b7280">掩码后 D 仍然压低组均值，所以 A、B 的正优势照旧；跑完不等于正优势，C 仍被压低</text>

  <text x="24" y="446" font-size="11" fill="#9ca3af">机制示意，据原文 p. 15–16 式 (2) 与附录式 (S3) 重画：原文每组 8 条，这里用 4 条；条长与奖励是假设值，不是实测轨迹。</text>
</svg>
