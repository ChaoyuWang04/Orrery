<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">选择分支的块分数从哪来：复用压缩注意力，再在 GQA 组内求和</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">绿 = 压缩 Token 覆盖的窗口（长 32，步长 16，互相重叠）；紫 = 长 64 的选择块；黄 = 组内各头的分数。示意，截取序列开头 192 个 Token。</text>
<text x="30.0" y="92.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">① 压缩分支本来就要算 q 对每个压缩 Token 的注意力分数（式 8）</text>
<rect x="81.0" y="108.0" width="158.0" height="20.0" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="160.0" y="122.0" font-size="11" fill="#6b7280" text-anchor="middle">压缩 1</text>
<rect x="161.0" y="134.0" width="158.0" height="20.0" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="240.0" y="148.0" font-size="11" fill="#6b7280" text-anchor="middle">压缩 2</text>
<rect x="241.0" y="108.0" width="158.0" height="20.0" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="320.0" y="122.0" font-size="11" fill="#6b7280" text-anchor="middle">压缩 3</text>
<rect x="321.0" y="134.0" width="158.0" height="20.0" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="400.0" y="148.0" font-size="11" fill="#6b7280" text-anchor="middle">压缩 4</text>
<rect x="401.0" y="108.0" width="158.0" height="20.0" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="480.0" y="122.0" font-size="11" fill="#6b7280" text-anchor="middle">压缩 5</text>
<rect x="481.0" y="134.0" width="158.0" height="20.0" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="560.0" y="148.0" font-size="11" fill="#6b7280" text-anchor="middle">压缩 6</text>
<rect x="561.0" y="108.0" width="158.0" height="20.0" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="640.0" y="122.0" font-size="11" fill="#6b7280" text-anchor="middle">压缩 7</text>
<rect x="641.0" y="134.0" width="158.0" height="20.0" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="720.0" y="148.0" font-size="11" fill="#6b7280" text-anchor="middle">压缩 8</text>
<rect x="721.0" y="108.0" width="158.0" height="20.0" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="800.0" y="122.0" font-size="11" fill="#6b7280" text-anchor="middle">压缩 9</text>
<rect x="801.0" y="134.0" width="158.0" height="20.0" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="880.0" y="148.0" font-size="11" fill="#6b7280" text-anchor="middle">压缩 10</text>
<rect x="881.0" y="108.0" width="158.0" height="20.0" rx="3" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="960.0" y="122.0" font-size="11" fill="#6b7280" text-anchor="middle">压缩 11</text>
<line x1="80.0" y1="104.0" x2="80.0" y2="250.0" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="400.0" y1="104.0" x2="400.0" y2="250.0" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="720.0" y1="104.0" x2="720.0" y2="250.0" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="1040.0" y1="104.0" x2="1040.0" y2="250.0" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 3"/>
<text x="30.0" y="186.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">② 每个选择块收下与它重叠的压缩 Token 的分数（式 9）</text>
<rect x="82.0" y="200.0" width="316.0" height="40.0" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="240.0" y="225.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">选择块 1：64 个 Token</text>
<rect x="402.0" y="200.0" width="316.0" height="40.0" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="560.0" y="225.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">选择块 2：64 个 Token</text>
<rect x="722.0" y="200.0" width="316.0" height="40.0" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="880.0" y="225.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">选择块 3：64 个 Token</text>
<text x="80.0" y="270.0" font-size="11" fill="#9ca3af" text-anchor="start">压缩块与选择块切法相同（l′ = l = d）时，分数一一对应，直接拿来用；原文实际配置 l = 32、d = 16、l′ = 64，走式 9 的重叠求和。</text>
<text x="30.0" y="312.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">③ 同一 GQA 组的全部头把块分数相加（式 10），排名取前 n 块，全组共用这套下标</text>
<rect x="80.0" y="330.0" width="70.0" height="28.0" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="115.0" y="349.0" font-size="12" fill="#111827" text-anchor="middle">头 1</text>
<line x1="154.0" y1="344.0" x2="300.0" y2="404.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="80.0" y="366.0" width="70.0" height="28.0" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="115.0" y="385.0" font-size="12" fill="#111827" text-anchor="middle">头 2</text>
<line x1="154.0" y1="380.0" x2="300.0" y2="404.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="80.0" y="402.0" width="70.0" height="28.0" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="115.0" y="421.0" font-size="12" fill="#111827" text-anchor="middle">…</text>
<line x1="154.0" y1="416.0" x2="300.0" y2="404.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="80.0" y="438.0" width="70.0" height="28.0" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="115.0" y="457.0" font-size="12" fill="#111827" text-anchor="middle">头 16</text>
<line x1="154.0" y1="452.0" x2="300.0" y2="404.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="304.0" y="384.0" width="150.0" height="40.0" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="379.0" y="409.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">逐块相加</text>
<line x1="456.0" y1="404.0" x2="516.0" y2="404.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="520.0" y="384.0" width="200.0" height="40.0" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="620.0" y="409.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">排名取前 n = 16 块</text>
<line x1="722.0" y1="404.0" x2="782.0" y2="404.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="786.0" y="374.0" width="290.0" height="60.0" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="931.0" y="399.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">一套块下标 I_t</text>
<text x="931.0" y="419.0" font-size="11" fill="#6b7280" text-anchor="middle">组内 16 个头读同样的 KV 块</text>
<text x="304.0" y="460.0" font-size="11" fill="#9ca3af" text-anchor="start">选择本身不可导，也没有辅助损失：分数来自压缩分支，压缩分支跟着主损失一起学。</text>
<text x="304.0" y="480.0" font-size="11" fill="#9ca3af" text-anchor="start">解码时 KV 按组共享；组内头若各选各的，要读的是它们的并集，这一步把并集收成一份。</text>
</svg>
