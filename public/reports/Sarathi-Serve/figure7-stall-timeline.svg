<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 7：同样四条请求，四种调度谁在等</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">紫 = 只有 Decode 的一步；黄 = 含整段 Prefill 的一步；绿 = Decode 加一个 Prefill 块；红括号 = 有人被迫停住。</text>
<text x="30.0" y="74.0" font-size="13" fill="#6b7280" text-anchor="start">开始时 A、B 在解码，走完一步 C、D 到达。下标 d 是一步 Decode，p 是整段 Prefill，p1、p2 是切出的两块。</text>
<line x1="225.0" y1="100.0" x2="1090.0" y2="100.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="1090.0" y="92.0" font-size="11" fill="#9ca3af" text-anchor="end">时间</text>
<line x1="337.0" y1="106.0" x2="337.0" y2="560.0" stroke="#cbd2d9" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="343.0" y="118.0" font-size="11" fill="#9ca3af" text-anchor="start">C、D 到达</text>
<text x="30.0" y="164.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">vLLM</text>
<text x="30.0" y="182.0" font-size="11" fill="#6b7280" text-anchor="start">Prefill 优先，整批只放一种阶段</text>
