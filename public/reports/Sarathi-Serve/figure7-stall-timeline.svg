<text x="281.0" y="193.0" font-size="12" fill="#111827" text-anchor="middle">A<tspan dy="3" font-size="9">d</tspan><tspan dy="-3">, B</tspan><tspan dy="3" font-size="9">d</tspan></text>
<rect x="337.0" y="172.0" width="218.3" height="34.0" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="446.1" y="193.0" font-size="12" fill="#111827" text-anchor="middle">C<tspan dy="3" font-size="9">p</tspan></text>
<rect x="555.3" y="172.0" width="258.7" height="34.0" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="684.6" y="193.0" font-size="12" fill="#111827" text-anchor="middle">D<tspan dy="3" font-size="9">p</tspan></text>
<rect x="814.0" y="172.0" width="125.7" height="34.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="876.9" y="193.0" font-size="12" fill="#111827" text-anchor="middle">A<tspan dy="3" font-size="9">d</tspan><tspan dy="-3">, B</tspan><tspan dy="3" font-size="9">d</tspan><tspan dy="-3">, C</tspan><tspan dy="3" font-size="9">d</tspan><tspan dy="-3">, D</tspan><tspan dy="3" font-size="9">d</tspan></text>
<path d="M339.0,169.0 L339.0,164.0 L812.0,164.0 L812.0,169.0" fill="none" stroke="#d9877a" stroke-width="1.6"/>
<text x="575.5" y="158.0" font-size="11" fill="#b4574a" text-anchor="middle">A、B 的字停住：要等 C、D 两段 Prefill 跑完</text>
<text x="30.0" y="264.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Orca</text>
<text x="30.0" y="282.0" font-size="11" fill="#6b7280" text-anchor="start">Prefill 优先，可混批但 Prefill 不切</text>
