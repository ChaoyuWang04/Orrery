<rect x="699.8" y="472.0" width="120.7" height="34.0" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="760.2" y="493.0" font-size="12" fill="#111827" text-anchor="middle">B<tspan dy="3" font-size="9">d</tspan><tspan dy="-3">, C</tspan><tspan dy="3" font-size="9">d</tspan><tspan dy="-3">, D</tspan><tspan dy="3" font-size="9">p2</tspan></text>
<text x="577.7" y="522.0" font-size="11" fill="#9ca3af" text-anchor="middle">A 退出</text>
<text x="820.5" y="522.0" font-size="11" fill="#9ca3af" text-anchor="middle">B 退出</text>
<text x="30.0" y="575.0" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p. 6 Figure 7 重画，是机制示意，不是实测时间；方块长度按原图比例。原图文字把两块写成 p0、p1，图上标的是 p1、p2。</text>
