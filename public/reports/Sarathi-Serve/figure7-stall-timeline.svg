<rect x="337.0" y="272.0" width="490.7" height="34.0" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="582.4" y="293.0" font-size="12" fill="#111827" text-anchor="middle">C<tspan dy="3" font-size="9">p</tspan><tspan dy="-3">, D</tspan><tspan dy="3" font-size="9">p</tspan><tspan dy="-3">, A</tspan><tspan dy="3" font-size="9">d</tspan><tspan dy="-3">, B</tspan><tspan dy="3" font-size="9">d</tspan></text>
<rect x="827.7" y="272.0" width="122.9" height="34.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
