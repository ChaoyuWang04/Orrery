<rect x="337.0" y="372.0" width="112.0" height="34.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="393.0" y="393.0" font-size="12" fill="#111827" text-anchor="middle">A<tspan dy="3" font-size="9">d</tspan><tspan dy="-3">, B</tspan><tspan dy="3" font-size="9">d</tspan></text>
<rect x="449.0" y="372.0" width="112.0" height="34.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="505.0" y="393.0" font-size="12" fill="#111827" text-anchor="middle">A<tspan dy="3" font-size="9">d</tspan><tspan dy="-3">, B</tspan><tspan dy="3" font-size="9">d</tspan></text>
<rect x="561.1" y="372.0" width="112.0" height="34.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="617.1" y="393.0" font-size="12" fill="#111827" text-anchor="middle">B<tspan dy="3" font-size="9">d</tspan></text>
<rect x="673.1" y="372.0" width="112.0" height="34.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="729.1" y="393.0" font-size="12" fill="#111827" text-anchor="middle">B<tspan dy="3" font-size="9">d</tspan></text>
<rect x="785.1" y="372.0" width="292.7" height="34.0" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="931.4" y="393.0" font-size="12" fill="#111827" text-anchor="middle">C<tspan dy="3" font-size="9">p</tspan><tspan dy="-3">, D</tspan><tspan dy="3" font-size="9">p</tspan></text>
<path d="M339.0,369.0 L339.0,364.0 L783.1,364.0 L783.1,369.0" fill="none" stroke="#d9877a" stroke-width="1.6"/>
<text x="561.1" y="358.0" font-size="11" fill="#b4574a" text-anchor="middle">C、D 的 Prefill 停住：等 A、B 全部结束</text>
<text x="561.1" y="422.0" font-size="11" fill="#9ca3af" text-anchor="middle">A 退出</text>
<text x="785.1" y="422.0" font-size="11" fill="#9ca3af" text-anchor="middle">B 退出</text>
<text x="30.0" y="464.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Sarathi-Serve</text>
<text x="30.0" y="482.0" font-size="11" fill="#6b7280" text-anchor="start">无停顿组批，Prefill 切块</text>
<rect x="225.0" y="472.0" width="112.0" height="34.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="281.0" y="493.0" font-size="12" fill="#111827" text-anchor="middle">A<tspan dy="3" font-size="9">d</tspan><tspan dy="-3">, B</tspan><tspan dy="3" font-size="9">d</tspan></text>
<rect x="337.0" y="472.0" width="120.0" height="34.0" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
