<path d="M339.0,269.0 L339.0,264.0 L825.7,264.0 L825.7,269.0" fill="none" stroke="#d9877a" stroke-width="1.6"/>
<text x="582.4" y="258.0" font-size="11" fill="#b4574a" text-anchor="middle">A、B 仍停住：这一步被整段 Prefill 撑长</text>
<text x="950.6" y="322.0" font-size="11" fill="#9ca3af" text-anchor="middle">A 退出</text>
<text x="30.0" y="364.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">FasterTransformer</text>
<text x="30.0" y="382.0" font-size="11" fill="#6b7280" text-anchor="start">Decode 优先，请求级批处理</text>
