<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">黄 = 只有 Prefill（整段或一块）；紫 = 只有 Decode；绿 = Decode 加 Prefill 块；灰 = 这张卡在等上一级，即气泡。</text>
