<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">同样 25 步去噪：随机性和优化预算花在哪几步</text>
<text x="30" y="58" font-size="13" fill="#6b7280">依据 PDF p. 4 Figure 2、p. 7 Algorithm 1、p. 22 Algorithm 2 重画的机制示意。每格是一个去噪步，左端是噪声 t = T，右端是干净图 t = 0。</text>
<text x="30" y="77" font-size="13" fill="#6b7280">绿 = SDE 采样并进入 GRPO 优化；紫 = SDE 采样但不优化；灰 = 一阶 ODE，不进比值与 KL；黄 = 高阶求解器压缩后的 ODE。</text>
