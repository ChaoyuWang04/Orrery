<text x="30" y="498" font-size="11" fill="#9ca3af">机制示意，依据 GSPO 论文式 2、式 5–7 与 5.1 节的裁剪区间（PDF p. 2–4）；token 比值是虚构数字。裁剪按 PPO 的 min 与 clip：优势为正只裁比值偏大的，优势为负只裁比值偏小的。</text>
<text x="30" y="516" font-size="11" fill="#9ca3af">回答 1 里只有一个 token 跳到 1.35：GRPO 只关掉这一格，GSPO 的几何平均被抬到 1.038，超出 1 + 4e-4，于是 8 个 token 一起退出。</text>
