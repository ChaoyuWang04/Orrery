<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">同一组回答：GRPO 按 token 算比值、按 token 裁；GSPO 整条回答只算一个比值、整条裁</text>
<text x="30" y="54" font-size="13" fill="#6b7280">每个小格是一个 token，格内是新旧策略概率比（示意数字）。绿 = 参与梯度且比值在区间内；黄 = 越出区间但不裁（负优势时比值偏大，没有上界）；红 = 被裁掉、不回传梯度。</text>
