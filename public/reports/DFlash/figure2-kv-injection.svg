<text x="830.0" y="515.0" font-size="11" fill="#6b7280" text-anchor="middle">H_t 投影后进草稿 KV 缓存，多轮复用；它不走 Q、输出投影和 FFN</text>
<text x="30.0" y="550.0" font-size="12" fill="#6b7280" text-anchor="start">据 PDF p. 4 Figure 2、§4.1 与附录 A.3（p. 12）重画的机制示意。块内是双向注意力；草稿共享目标模型冻结的词嵌入与 LM 头，示意里省略。</text>
<text x="30.0" y="572.0" font-size="12" fill="#6b7280" text-anchor="start">额外参数几乎只有 W_c（D × 5D）：Qwen3.5-35B-A3B、D = 2048、BF16 时约 42 MB，对照约 70 GB 的目标模型。</text>
