<text x="901.7" y="480.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">草稿 16 个 Token</text>
<text x="30.0" y="506.0" font-size="12" fill="#6b7280" text-anchor="start">据 PDF p. 3 Figure 3 的矢量坐标读数（原图没有印数字）。EAGLE-3 从 6.4 涨到 25.6 毫秒，大致随草稿长度成正比；DFlash 三种深度都停在 1.7–5.5 毫秒。</text>
<text x="30.0" y="528.0" font-size="12" fill="#6b7280" text-anchor="start">论文据此说：5 层 DFlash 写 16 个 Token（约 5.4 毫秒）比 1 层 EAGLE-3 写 8 个（约 11.5 毫秒）还便宜，接受长度还更高（PDF p. 4）。</text>
