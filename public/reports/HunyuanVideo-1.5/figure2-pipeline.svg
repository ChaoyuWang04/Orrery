<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">HunyuanVideo 1.5：一个 8.3B 主干在 480p/720p 上生成，另一个 8.3B 超分模型升到 1080p</text>
<text x="30" y="54" font-size="13" fill="#6b7280">黄 = 文字条件；绿 = 参考图条件（只有图生视频才有）；紫 = 视频潜变量；灰 = 共享的计算模块。</text>
<rect x="16" y="70" width="700" height="520" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="30" y="94" font-size="14" fill="#111827" text-anchor="start" font-weight="700">第一段：统一 DiT（文生图、文生视频、图生视频共用一套权重）</text>
<rect x="36" y="112" width="150" height="48" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="111.0" y="133.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Qwen2.5-VL</text>
<text x="111.0" y="150.0" font-size="11" fill="#6b7280" text-anchor="middle">语义：读懂描述</text>
<rect x="200" y="112" width="150" height="48" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="275.0" y="133.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Glyph-ByT5</text>
<text x="275.0" y="150.0" font-size="11" fill="#6b7280" text-anchor="middle">字形：把字写对</text>
<rect x="364" y="112" width="150" height="48" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-dasharray="5 4"/>
<text x="439.0" y="133.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">SigLip</text>
<text x="439.0" y="150.0" font-size="11" fill="#6b7280" text-anchor="middle">参考图语义</text>
<rect x="528" y="112" width="170" height="48" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="613.0" y="133.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">带噪潜变量</text>
<text x="613.0" y="150.0" font-size="11" fill="#6b7280" text-anchor="middle">I2V 时通道拼参考图潜变量</text>
<rect x="36" y="186" width="150" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="111.0" y="209.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Token Refiner</text>
<rect x="200" y="186" width="150" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="275.0" y="209.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">ByT5 Proj</text>
<rect x="364" y="186" width="150" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-dasharray="5 4"/>
<text x="439.0" y="209.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Vision Proj</text>
<rect x="528" y="186" width="170" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="613.0" y="209.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Patch Emb</text>
<line x1="111" y1="160" x2="111" y2="184" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="275" y1="160" x2="275" y2="184" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="439" y1="160" x2="439" y2="184" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)" stroke-dasharray="4 3"/>
<line x1="613" y1="160" x2="613" y2="184" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="440" y="306" font-size="11" fill="#9ca3af" text-anchor="middle">可学习的类型嵌入区分各段条件</text>
<rect x="36" y="256" width="478" height="34" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="275" y="278" font-size="11" fill="#6b7280" text-anchor="middle">条件流 Token：文字、字形、参考图语义（沿序列拼接）</text>
<rect x="528" y="256" width="170" height="34" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="613" y="278" font-size="11" fill="#6b7280" text-anchor="middle">视觉流 Token</text>
<line x1="111" y1="222" x2="111" y2="254" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="275" y1="222" x2="275" y2="254" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="439" y1="222" x2="439" y2="254" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="613" y1="222" x2="613" y2="254" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="36" y="312" width="662" height="190" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="48" y="334" font-size="12" fill="#111827" text-anchor="start" font-weight="700">双流块 × 54（模型维度 2048、FFN 8192、16 头 × 128）</text>
<rect x="56" y="350" width="622" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="367.0" y="377.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">一次联合自注意力（可换成 SSTA 稀疏注意力），配 3D RoPE</text>
<rect x="120" y="418" width="200" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="220.0" y="443.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">条件流 MLP</text>
<rect x="414" y="418" width="200" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="514.0" y="443.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">视觉流 MLP</text>
<line x1="220" y1="394" x2="220" y2="416" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="514" y1="394" x2="514" y2="416" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="367" y="486" font-size="11" fill="#9ca3af" text-anchor="middle">两条流各有自己的参数与残差，只在注意力里交换信息</text>
<line x1="275" y1="290" x2="275" y2="348" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="613" y1="290" x2="613" y2="348" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="496" y="530" width="202" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="597.0" y="549.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">低分辨率潜变量</text>
<text x="597.0" y="566.0" font-size="11" fill="#6b7280" text-anchor="middle">480p 或 720p，5–10 秒</text>
<line x1="514" y1="458" x2="560" y2="528" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="736" y="70" width="368" height="520" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="750" y="94" font-size="14" fill="#111827" text-anchor="start" font-weight="700">第二段：级联视频超分</text>
<rect x="760" y="130" width="320" height="50" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="920.0" y="152.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">潜变量上采样块</text>
<text x="920.0" y="169.0" font-size="11" fill="#6b7280" text-anchor="middle">单独训练，把低清潜变量对齐到高清网格</text>
<rect x="760" y="220" width="320" height="58" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="920.0" y="246.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">超分 DiT，8.3B</text>
<text x="920.0" y="263.0" font-size="11" fill="#6b7280" text-anchor="middle">同一套架构，由 T2V 模型初始化</text>
<text x="920" y="300" font-size="11" fill="#6b7280" text-anchor="middle">输入 = 上采样后的低清潜变量 与 噪声 按通道拼接</text>
<rect x="760" y="330" width="320" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="920.0" y="357.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">VAE 解码器</text>
<rect x="760" y="420" width="320" height="50" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="920.0" y="450.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">1080p 视频</text>
<line x1="920" y1="180" x2="920" y2="218" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="920" y1="278" x2="920" y2="328" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="920" y1="374" x2="920" y2="418" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="698,552 720,552 720,155 758,155" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="920" y="506" font-size="11" fill="#9ca3af" text-anchor="middle">报告称「少步数」超分，</text>
<text x="920" y="524" font-size="11" fill="#9ca3af" text-anchor="middle">但没给步数与耗时</text>
<text x="30" y="614" font-size="12" fill="#6b7280" text-anchor="start">据 PDF p. 4 Figure 2、p. 6 Figure 3 与 §3.1–3.2、§4.3 正文重画。条件流与视觉流的划分按 Figure 2 的画法读出，正文没有描述双流块；虚线框只在图生视频时出现。</text>
</svg>