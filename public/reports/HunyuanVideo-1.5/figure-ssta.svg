<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">SSTA：选块时既看「和我相关」，也扣掉「和别的块重复」，再并上局部窗口</text>
<text x="30" y="54" font-size="13" fill="#6b7280">紫 = 键块（同一深浅表示内容几乎相同）；黄 = 被动态选中的块；绿 = 滑动窗口固定保留的块；灰 = 跳过的块。</text>
