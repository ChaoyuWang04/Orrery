<text x="582" y="382" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Score_i = λ · Score_s − β · Score_r</text>
<text x="582" y="402" font-size="11" fill="#6b7280" text-anchor="middle">按 Score_i 取 Top-k，得到 M_sel</text>
