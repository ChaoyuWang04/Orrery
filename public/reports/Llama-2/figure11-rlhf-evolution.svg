<text x="30" y="590" font-size="13" fill="#6b7280">据 PDF p. 18 Figure 11 逐点读图重画，坐标是读图近似值。验证集为 1,586 条安全提示与 584 条有用性提示；两个裁判都不是人类评测。</text>
