<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = 张量并行组（一台节点里的 8 张卡，每层每个微批都要 All-Reduce，走 NVLink）；绿 = 流水线阶段之间的点对点（跨节点，走 InfiniBand）；</text>
<text x="30" y="73" font-size="13" fill="#6b7280" text-anchor="start">黄虚线 = 数据并行组（各副本里同一位置的卡，每个 batch 同步一次梯度）。按论文 §2–§3 与 Figure 2（PDF p. 2–5）画的机制示意。</text>
