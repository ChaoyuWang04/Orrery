<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Scatter/gather：相邻流水阶段不再把同一份激活跨机传 t 遍</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">以 t = 4 为例（论文实验用 t = 8）。灰条 = 一份完整的层输出 bsh，四格是它的四等分；紫格 = 这张卡负责发送的那一块；</text>
<text x="30" y="73" font-size="13" fill="#6b7280" text-anchor="start">绿箭头 = 跨节点 InfiniBand，每张卡一块网卡；黄 = 节点内 NVLink all-gather。按论文 Figure 9（PDF p. 7）重画的机制示意。</text>
