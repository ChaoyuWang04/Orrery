<text x="455" y="447" font-size="12" fill="#111827" text-anchor="middle">密集注意力层</text>
<rect x="540" y="420" width="150" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="615" y="447" font-size="12" fill="#111827" text-anchor="middle">块稀疏注意力层</text>
<text x="710" y="447" font-size="14" fill="#9ca3af">……</text>
<text x="760" y="436" font-size="11" fill="#6b7280">密集层保长上下文检索，稀疏层省 KV cache。</text>
<text x="760" y="456" font-size="11" fill="#6b7280">模型另用 GQA：4 个 query 头共享 1 个 key 头。</text>
<text x="60" y="492" font-size="11" fill="#9ca3af">据 PDF p. 2 正文与 p. 3 Figure 1 重画，是玩具示意；稀疏度、块大小与层的具体排布报告没有给。</text>
</svg>
