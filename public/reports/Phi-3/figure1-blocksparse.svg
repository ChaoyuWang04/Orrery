<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">块稀疏注意力：每个头只看一半的块，四个头合起来一块不漏</text>
<text x="30" y="54" font-size="13" fill="#6b7280">查询 Token 位于 Block8，2 个局部块、纵向步长 3。绿 = 局部块；黄 = 按步长挑出的远程块；灰 = 跳过的块。</text>

