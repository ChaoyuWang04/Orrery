<text x="30" y="510" font-size="11" fill="#9ca3af">phi-3-mini 取自 PDF p. 6 主表，phi-3.5-mini 取自 p. 9 Table 3；多语言 MMLU 两个均分 47.3 与 55.4 取自 p. 7 正文。</text>
<text x="30" y="530" font-size="11" fill="#9ca3af">这是本文拼出的对照，报告没有把两组数放在一起比；两张表不保证出自同一条评测流水线，看方向与量级，不看小数。</text>
