<text x="1046" y="138" font-size="11" fill="#6b7280" text-anchor="end">终点是 G 张不同的图（论文 G = 24）</text>
<text x="48" y="480" font-size="13" fill="#111827">一粒种子定下整条轨迹，相邻两步一一对应。</text>
<text x="48" y="500" font-size="13" fill="#111827">写不出可用的 p(x<tspan baseline-shift="sub" font-size="9">t−1</tspan> | x<tspan baseline-shift="sub" font-size="9">t</tspan>)，同一提示词也采不出一组不同的图。</text>
<text x="593" y="480" font-size="13" fill="#111827">漂移 = 原速度 v + 分数补偿项，再加 σ<tspan baseline-shift="sub" font-size="9">t</tspan>·√Δt·ε。</text>
<text x="593" y="500" font-size="13" fill="#111827">每一步是各向同性高斯：对数概率、重要性比、KL 都有闭式。</text>
<text x="30" y="534" font-size="13" fill="#6b7280">紫色路径的分叉按 σ<tspan baseline-shift="sub" font-size="9">t</tspan> = a·√(t/(1−t)) 画：靠近噪声端分得开，靠近图像端几乎只剩平移；论文取 a = 0.7。</text>
<text x="30" y="556" font-size="11" fill="#9ca3af">据 PDF p. 4–5 式 6–9 与附录 A（p. 17–18）自绘的机制示意，路径形状是示意，不是实测轨迹。</text>
</svg>