<text x="330.0" y="400.0" font-size="12" fill="#111827" text-anchor="start">三级流水 × 每级 7 卡 = 一对实例占 21 张卡；表 3 的配置是 Prefill TP 3、PP 3，Decode TP 4、PP 3（PDF p. 19）。</text>
<text x="30.0" y="440.0" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p. 8–9 §4.2、Algorithm 2 与附录表 3 画的机制示意，原文没有这张图。表 3 只给并行度；每台机器怎么摆，</text>
<text x="30.0" y="458.0" font-size="11" fill="#9ca3af" text-anchor="start">是按算法 2「同一级的两段同机、合计不超过每机卡数」的约束推出来的。</text>
