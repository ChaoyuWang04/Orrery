<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">算法 2：跨节点带宽不够时，按流水级把两个实例对齐到同一台机器</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">黄 = Prefill 实例的一段；紫 = Decode 实例的一段；灰 = 空闲卡。实线箭头 = KV 在节点内走 NVLink；</text>
<text x="30.0" y="74.0" font-size="13" fill="#6b7280" text-anchor="start">虚线箭头 = 流水线相邻两级之间传激活，走跨节点网络（测试集群只有 25 Gbps）。例子是 OPT-175B 的实际配置。</text>
