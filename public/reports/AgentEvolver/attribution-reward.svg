<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="540" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">一条 4 步轨迹的奖励，怎样变成逐 token 的优势</text>
<text x="30" y="54" font-size="13" fill="#6b7280">绿 = 过程通道；红 = 被判 BAD 的一步；黄 = 终局通道；紫 = 合成后的逐步量。按原文式 18–21 与 Figure 2 右栏重画，机制示意，不是实测。</text>

<line x1="305" y1="122" x2="305" y2="148" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="455" y1="122" x2="455" y2="148" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="605" y1="122" x2="605" y2="148" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="755" y1="122" x2="755" y2="148" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="305" y1="192" x2="305" y2="218" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="455" y1="192" x2="455" y2="218" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="605" y1="192" x2="605" y2="218" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="755" y1="192" x2="755" y2="218" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="305" y1="262" x2="305" y2="288" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="455" y1="262" x2="455" y2="288" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="605" y1="262" x2="605" y2="288" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="755" y1="262" x2="755" y2="288" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="305" y1="332" x2="305" y2="358" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="455" y1="332" x2="455" y2="358" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="605" y1="332" x2="605" y2="358" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="755" y1="332" x2="755" y2="358" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="305" y1="402" x2="305" y2="426" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="455" y1="402" x2="455" y2="426" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="605" y1="402" x2="605" y2="426" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="755" y1="402" x2="755" y2="426" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="990" y1="192" x2="990" y2="218" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="990,262 990,310 826,310" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>

<text x="30" y="97" font-size="14" fill="#111827" font-weight="700">① 逐步判方向</text>
<text x="30" y="114" font-size="11" fill="#6b7280">另一个 LLM 一次读完整条轨迹</text>
<rect x="240" y="80" width="130" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="305" y="105" font-size="13" fill="#111827" text-anchor="middle">第 1 步 GOOD</text>
<rect x="390" y="80" width="130" height="40" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="455" y="105" font-size="13" fill="#111827" text-anchor="middle">第 2 步 BAD</text>
<rect x="540" y="80" width="130" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="605" y="105" font-size="13" fill="#111827" text-anchor="middle">第 3 步 GOOD</text>
<rect x="690" y="80" width="130" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="755" y="105" font-size="13" fill="#111827" text-anchor="middle">第 4 步 GOOD</text>

<text x="30" y="167" font-size="14" fill="#111827" font-weight="700">② 标签变成 ±1</text>
<text x="30" y="184" font-size="11" fill="#6b7280">只给方向，不给幅度</text>
<rect x="240" y="150" width="130" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="305" y="175" font-size="13" fill="#111827" text-anchor="middle">+1</text>
<rect x="390" y="150" width="130" height="40" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="455" y="175" font-size="13" fill="#111827" text-anchor="middle">−1</text>
<rect x="540" y="150" width="130" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="605" y="175" font-size="13" fill="#111827" text-anchor="middle">+1</text>
<rect x="690" y="150" width="130" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="755" y="175" font-size="13" fill="#111827" text-anchor="middle">+1</text>

<text x="30" y="237" font-size="14" fill="#111827" font-weight="700">③ 两路各自标准化</text>
<text x="30" y="254" font-size="11" fill="#6b7280">μ、σ 取组内各轨迹的平均归因分</text>
<rect x="240" y="220" width="130" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="305" y="245" font-size="12" fill="#111827" text-anchor="middle">p1 = (+1 − μ) / σ</text>
<rect x="390" y="220" width="130" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="455" y="245" font-size="12" fill="#111827" text-anchor="middle">p2 = (−1 − μ) / σ</text>
<rect x="540" y="220" width="130" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="605" y="245" font-size="12" fill="#111827" text-anchor="middle">p3 = (+1 − μ) / σ</text>
<rect x="690" y="220" width="130" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="755" y="245" font-size="12" fill="#111827" text-anchor="middle">p4 = (+1 − μ) / σ</text>

<text x="880" y="97" font-size="14" fill="#111827" font-weight="700">终局通道</text>
<text x="880" y="114" font-size="11" fill="#6b7280">整条轨迹只有一个分</text>
<rect x="880" y="150" width="220" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="990" y="175" font-size="12" fill="#111827" text-anchor="middle">终局分 R（轨迹级裁判给出）</text>
<rect x="880" y="220" width="220" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="990" y="245" font-size="12" fill="#111827" text-anchor="middle">o = (R − 组内均值) / 组内标准差</text>

<text x="30" y="307" font-size="14" fill="#111827" font-weight="700">④ 合成逐步奖励</text>
<text x="30" y="324" font-size="11" fill="#6b7280">终局分只加在最后一步</text>
<rect x="240" y="290" width="130" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="305" y="315" font-size="12" fill="#111827" text-anchor="middle">r1 = α · p1</text>
<rect x="390" y="290" width="130" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="455" y="315" font-size="12" fill="#111827" text-anchor="middle">r2 = α · p2</text>
<rect x="540" y="290" width="130" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="605" y="315" font-size="12" fill="#111827" text-anchor="middle">r3 = α · p3</text>
<rect x="690" y="290" width="130" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="755" y="315" font-size="12" fill="#111827" text-anchor="middle">r4 = α · p4 + o</text>

<text x="30" y="377" font-size="14" fill="#111827" font-weight="700">⑤ 从后往前累加</text>
<text x="30" y="394" font-size="11" fill="#6b7280">不打折扣，γ = 1</text>
<rect x="240" y="360" width="130" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="305" y="385" font-size="12" fill="#111827" text-anchor="middle">A1 = r1+r2+r3+r4</text>
<rect x="390" y="360" width="130" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="455" y="385" font-size="12" fill="#111827" text-anchor="middle">A2 = r2+r3+r4</text>
<rect x="540" y="360" width="130" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="605" y="385" font-size="12" fill="#111827" text-anchor="middle">A3 = r3+r4</text>
<rect x="690" y="360" width="130" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="755" y="385" font-size="12" fill="#111827" text-anchor="middle">A4 = r4</text>

<text x="30" y="445" font-size="14" fill="#111827" font-weight="700">⑥ 广播到 token</text>
<text x="30" y="462" font-size="11" fill="#6b7280">再接进式 17 的裁剪目标</text>
<rect x="250" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="274" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="298" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="322" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="346" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="305" y="466" font-size="11" fill="#6b7280" text-anchor="middle">本步每个 token 都用 A1</text>
<rect x="400" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="424" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="448" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="472" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="455" y="466" font-size="11" fill="#6b7280" text-anchor="middle">都用 A2</text>
<rect x="550" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="574" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="598" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="622" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="646" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="605" y="466" font-size="11" fill="#6b7280" text-anchor="middle">都用 A3</text>
<rect x="700" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="724" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="748" y="430" width="18" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="755" y="466" font-size="11" fill="#6b7280" text-anchor="middle">都用 A4</text>

<text x="880" y="377" font-size="11" fill="#9ca3af">α 调两路的比重：</text>
<text x="880" y="394" font-size="11" fill="#9ca3af">论文主消融取 0.1，</text>
<text x="880" y="411" font-size="11" fill="#9ca3af">建议区间 0.10–0.20</text>

<text x="30" y="506" font-size="11" fill="#9ca3af">注：第 5.2 节规定 BAD 记 −1、μ 与 σ 按轨迹平均分算；第 7.1.3 节的实现写成「组内 step-level 标准化」，BAD 可记 0 或 −1。原文没有统一这两处。</text>
<text x="30" y="524" font-size="11" fill="#9ca3af">第 1 步的优势 A1 把后面三步的奖励和终局分都算进去；第 2 步被判 BAD，只让 A2 以及它之前的 A1 被拉低一截。</text>
</svg>
