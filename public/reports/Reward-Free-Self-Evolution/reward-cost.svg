<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="480" fill="#ffffff"/>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#111827">Reward-Free 只挪走了打分：一份 K 的一次评分要跑什么</text>
  <text x="40" y="60" font-size="13" fill="#6b7280">绿 = 探索网站、写 K；灰 = 产物 K；紫 = 下游答题；黄 = 只在训练时出现的打分与筛选。绿、紫方块的横向长度按步数上限画（500 步对 100 步）</text>

  <!-- 训练泳道 -->
  <rect x="24" y="80" width="1072" height="232" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="40" y="102" font-size="14" font-weight="700" fill="#111827">训练时 · 每份候选 K 都要这样打一次分（PDF p. 4–6）</text>

  <rect x="40" y="142" width="500" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="290" y="168" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">教师或学生：探索网站、写出 K</text>
  <text x="290" y="188" font-size="11" fill="#6b7280" text-anchor="middle">上限 500 步、43200 秒（12 小时）；轨迹平均 374.8 步（教师）</text>

  <line x1="540" y1="172" x2="558" y2="172" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="560" y="152" width="60" height="40" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="590" y="177" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">K</text>
  <line x1="620" y1="164" x2="648" y2="164" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="650" y="116" width="100" height="28" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="700" y="135" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">带 K · 题 1</text>
  <rect x="650" y="150" width="100" height="28" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="700" y="169" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">带 K · 题 2</text>
  <text x="700" y="191" font-size="14" fill="#6b7280" text-anchor="middle">⋮</text>
  <rect x="650" y="198" width="100" height="28" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="700" y="217" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">带 K · 题 M</text>
  <text x="700" y="244" font-size="11" fill="#6b7280" text-anchor="middle">每题上限 100 步、3600 秒</text>
  <text x="700" y="259" font-size="11" fill="#9ca3af" text-anchor="middle">M = 该站带答案的题数</text>

  <line x1="750" y1="172" x2="798" y2="172" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="800" y="120" width="280" height="106" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="940" y="146" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">R_evolve(K)</text>
  <text x="940" y="168" font-size="11" fill="#6b7280" text-anchor="middle">= 带 K 的命中率 − 不带 K 的基线命中率</text>
  <text x="940" y="186" font-size="11" fill="#6b7280" text-anchor="middle">命中：预测答案 f(Q, K) 等于标准答案 A</text>
  <text x="940" y="204" font-size="11" fill="#6b7280" text-anchor="middle">题库：20 个网站、600 道深搜题</text>

  <line x1="940" y1="226" x2="940" y2="270" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="40" y="272" width="1040" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <text x="560" y="292" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">按 R_evolve 留最好的整条轨迹：SFT 时教师每站 3 份，RFT 时学生每站 C 份（C 未公开），RFT 做两轮</text>

  <!-- 推理泳道 -->
  <rect x="24" y="332" width="1072" height="126" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="40" y="354" font-size="14" font-weight="700" fill="#111827">推理时 · 进一个没见过的网站（PDF p. 3、p. 6）</text>

  <rect x="40" y="372" width="500" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <text x="290" y="398" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">训练好的 π*：探索网站、写出 K</text>
  <text x="290" y="418" font-size="11" fill="#6b7280" text-anchor="middle">同样的 500 步、12 小时上限；入口仍是聚类后的网站图 G(U)</text>

  <line x1="540" y1="402" x2="558" y2="402" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="560" y="382" width="60" height="40" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="590" y="407" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">K</text>
  <line x1="620" y1="402" x2="648" y2="402" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="650" y="388" width="100" height="28" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="700" y="407" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">带 K 答题</text>
  <text x="700" y="436" font-size="11" fill="#6b7280" text-anchor="middle">任务这时才出现</text>

  <rect x="800" y="372" width="280" height="62" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="940" y="398" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">不打分</text>
  <text x="940" y="418" font-size="11" fill="#6b7280" text-anchor="middle">没有 R_evolve，没有题库与标准答案</text>
</svg>
