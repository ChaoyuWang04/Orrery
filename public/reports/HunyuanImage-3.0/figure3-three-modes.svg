<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">一个主干，三种运行模式：理解、纯文本、生成共用同一份权重</text>
<text x="30" y="58" font-size="13" fill="#6b7280">依据 PDF p. 6 Figure 3 重画的机制示意。绿 = 生成通路的 VAE；紫 = 理解用的视觉编码器；灰 = 文本；黄 = 共享主干。</text>
<rect x="16" y="76" width="420" height="452" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="30" y="100" font-size="14" fill="#111827" text-anchor="start" font-weight="700">图像理解</text>
