<text x="560.0" y="286.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Decoder-only Transformer：Hunyuan-A13B</text>
<text x="560.0" y="303.0" font-size="11" fill="#6b7280" text-anchor="middle">超过 80B 总参，每 Token 激活约 13B；64 个专家选 8 个，外加 1 个共享 MLP（PDF p. 6）</text>
<text x="130" y="500" font-size="12" fill="#111827" text-anchor="middle">条件图</text>
