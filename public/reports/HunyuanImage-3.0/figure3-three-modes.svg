<text x="466" y="100" font-size="14" fill="#111827" text-anchor="start" font-weight="700">语言建模</text>
<rect x="718" y="76" width="386" height="452" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="732" y="100" font-size="14" fill="#111827" text-anchor="start" font-weight="700">图像生成</text>
