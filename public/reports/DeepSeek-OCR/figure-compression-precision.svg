<text x="30" y="510" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 10 Table 2 重画。64 个 token 那组在 800–900（83.8%）与 900–1000（85.9%）之间不单调；最右一点只有 4 页。</text>
<text x="30" y="534" font-size="13" fill="#6b7280" text-anchor="start">报告没有定义「precision」的算法，只说输出格式与 Fox 标准答案不完全一致、真实精度会略高（PDF p. 11）。</text>
