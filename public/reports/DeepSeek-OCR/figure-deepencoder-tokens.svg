<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">DeepEncoder：4096 个块交给窗口注意力，只有 256 个交给全局注意力</text>
<text x="30" y="56" font-size="13" fill="#6b7280" text-anchor="start">以 1024×1024 输入（Base 档）为例，条长与 token 数成比例。绿 = 窗口注意力段；黄 = 16× 卷积压缩；紫 = 全局注意力段；灰 = 解码器。</text>
<rect x="20" y="78" width="1080" height="196" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="32" y="96" font-size="11" fill="#9ca3af" text-anchor="start">PP0 · 参数冻结 · 报告称之为「视觉分词器」</text>
<rect x="20" y="286" width="1080" height="96" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="32" y="304" font-size="11" fill="#9ca3af" text-anchor="start">PP1 · 参数可训 · 报告称之为「输入嵌入层」</text>
<rect x="20" y="394" width="1080" height="96" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="32" y="412" font-size="11" fill="#9ca3af" text-anchor="start">PP2 + PP3 · 解码器 12 层，各放 6 层</text>
<text x="40" y="120" font-size="14" fill="#111827" text-anchor="start" font-weight="700">输入图像</text>
<text x="40" y="138" font-size="11" fill="#6b7280" text-anchor="start">1024×1024，切 16×16 的块</text>
<text x="40" y="180" font-size="14" fill="#111827" text-anchor="start" font-weight="700">SAM-base 80M</text>
<text x="40" y="198" font-size="11" fill="#6b7280" text-anchor="start">以窗口注意力为主</text>
<rect x="250" y="160" width="800" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="650.0" y="185" font-size="13" fill="#111827" text-anchor="middle">4096 个 token（64×64）</text>
<text x="40" y="240" font-size="14" fill="#111827" text-anchor="start" font-weight="700">卷积压缩器</text>
<text x="40" y="258" font-size="11" fill="#6b7280" text-anchor="start">2 层，kernel 3、stride 2</text>
<rect x="250" y="222" width="800" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="650.0" y="247" font-size="13" fill="#111827" text-anchor="middle">每层把边长减半、两层合计 16×；通道 256 → 1024</text>
<line x1="650.0" y1="202" x2="650.0" y2="220" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="40" y="330" font-size="14" fill="#111827" text-anchor="start" font-weight="700">CLIP-large 300M</text>
<text x="40" y="348" font-size="11" fill="#6b7280" text-anchor="start">密集全局注意力</text>
<rect x="250" y="312" width="50.0" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="312.0" y="337" font-size="13" fill="#111827" text-anchor="start">256 个 token（16×16）：全局注意力只作用在这条短序列上</text>
<line x1="275.0" y1="264" x2="275.0" y2="310" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="40" y="436" font-size="14" fill="#111827" text-anchor="start" font-weight="700">DeepSeek-3B-MoE</text>
<text x="40" y="454" font-size="11" fill="#6b7280" text-anchor="start">激活约 570M</text>
<rect x="250" y="420" width="800" height="40" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="650.0" y="445" font-size="13" fill="#111827" text-anchor="middle">256 个视觉 token + 提示词 → 生成文本（可远多于 256 个 text token）</text>
<line x1="275.0" y1="354" x2="275.0" y2="418" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="30" y="526" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 5 Figure 3、§3.2.1 与 p. 10 §3.5.2 重画；token 数与层配置为原文；CLIP 去掉了首层 patch 嵌入。</text>
<text x="30" y="550" font-size="13" fill="#6b7280" text-anchor="start">若全局注意力直接作用在 4096 个 token 上，两两配对数是 256 个时的 256 倍（本文推算）；报告没有给激活显存的实测数。</text>
</svg>