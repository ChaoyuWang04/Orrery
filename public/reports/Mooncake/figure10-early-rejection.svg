<text x="102.0" y="470.0" font-size="11" fill="#9ca3af" text-anchor="end">0.5</text>
<text x="102.0" y="410.0" font-size="11" fill="#9ca3af" text-anchor="end">1</text>
<polyline points="230.0,454.0 470.0,466.0 710.0,436.0 950.0,451.6" fill="none" stroke="#5fa886" stroke-width="2.6"/>
<circle cx="230" cy="454.0" r="4" fill="#e3f4ec" stroke="#5fa886"/>
<circle cx="470" cy="466.0" r="4" fill="#e3f4ec" stroke="#5fa886"/>
<circle cx="710" cy="436.0" r="4" fill="#e3f4ec" stroke="#5fa886"/>
<circle cx="950" cy="451.6" r="4" fill="#e3f4ec" stroke="#5fa886"/>
<polyline points="230.0,437.2 470.0,430.0 710.0,446.8 950.0,434.8" fill="none" stroke="#d4a24c" stroke-width="2.6"/>
<circle cx="230" cy="437.2" r="4" fill="#fdf1dc" stroke="#d4a24c"/>
<circle cx="470" cy="430.0" r="4" fill="#fdf1dc" stroke="#d4a24c"/>
<circle cx="710" cy="446.8" r="4" fill="#fdf1dc" stroke="#d4a24c"/>
<circle cx="950" cy="434.8" r="4" fill="#fdf1dc" stroke="#d4a24c"/>
<circle cx="186" cy="548" r="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="198.0" y="553.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">阶段 1：接受</text>
<text x="230.0" y="576.0" font-size="11" fill="#6b7280" text-anchor="middle">预测 Decode 接得住</text>
<text x="230.0" y="594.0" font-size="11" fill="#6b7280" text-anchor="middle">照常接受</text>
<circle cx="426" cy="548" r="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="438.0" y="553.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">阶段 2：接受</text>
<text x="470.0" y="576.0" font-size="11" fill="#6b7280" text-anchor="middle">两池都维持在高位</text>
<circle cx="666" cy="548" r="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="678.0" y="553.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">阶段 3：接受</text>
<text x="710.0" y="576.0" font-size="11" fill="#6b7280" text-anchor="middle">不再出现一边满一边空</text>
<circle cx="906" cy="548" r="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="918.0" y="553.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">阶段 4：接受</text>
<text x="30.0" y="648.0" font-size="12" fill="#6b7280" text-anchor="start">据 PDF p.14 Figure 10 与 p.13 正文重画，曲线高度只示意趋势。实测见 p.13 Figure 9：20 台机器 20 分钟，只做提前拒绝时两池负载明显反相。</text>
</svg>
