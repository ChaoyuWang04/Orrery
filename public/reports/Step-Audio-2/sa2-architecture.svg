<text x="30" y="34" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Step-Audio 2：连续特征进，离散 Token 出，工具结果接在输入后面</text>
<text x="30" y="56" font-size="13" fill="#6b7280" text-anchor="start">紫框＝参与训练的模块，灰框＝全程冻结的模块；绿方块＝连续潜在特征，黄方块＝离散音频 Token，红方块＝离散文本 Token。</text>
<text x="30" y="74" font-size="13" fill="#6b7280" text-anchor="start">按 PDF p.6 Figure 3 与 §3.1 正文重画；只表示数据通路与冻结关系，不含时序与延迟。</text>
<text x="560" y="122" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">LLM 解码器</text>
<text x="560" y="140" font-size="11" fill="#6b7280" text-anchor="middle">由某个文本 LLM 初始化（型号与规模报告未写），参与训练</text>
<text x="190" y="214" font-size="11" fill="#6b7280" text-anchor="middle">历史信息：上一轮的特征与输出</text>
<text x="470" y="214" font-size="11" fill="#6b7280" text-anchor="middle">本轮输入：12.5 Hz 连续特征</text>
<text x="700" y="214" font-size="11" fill="#6b7280" text-anchor="middle">工具返回的信息</text>
<text x="700" y="238" font-size="11" fill="#111827" text-anchor="middle">网页 · 天气 · 日期时间</text>
<text x="700" y="256" font-size="11" fill="#111827" text-anchor="middle">音频检索 → 一段参考语音</text>
<text x="950" y="214" font-size="11" fill="#6b7280" text-anchor="middle">输出：文本与音频 Token 交错</text>
<text x="470" y="332" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">适配器</text>
<text x="470" y="350" font-size="11" fill="#6b7280" text-anchor="middle">降采样 2 倍：25 → 12.5 Hz</text>
<text x="470" y="408" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">音频编码器</text>
<text x="470" y="426" font-size="11" fill="#6b7280" text-anchor="middle">全程冻结 · 输出 25 Hz</text>
<text x="470" y="490" font-size="11" fill="#111827" text-anchor="middle">输入波形</text>
<text x="950" y="332" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">音频反 Token 化器</text>
<text x="950" y="350" font-size="11" fill="#6b7280" text-anchor="middle">流匹配 → 梅尔频谱 → HiFi-GAN</text>
<text x="950" y="366" font-size="11" fill="#6b7280" text-anchor="middle">只取交错序列里的音频 Token</text>
<text x="950" y="428" font-size="11" fill="#111827" text-anchor="middle">输出语音</text>
<text x="205" y="306" font-size="11" fill="#9ca3af" text-anchor="start">本轮输入特征与输出序列，预填为下一轮的历史</text>
<text x="40" y="340" font-size="11" fill="#9ca3af" text-anchor="start">编码器预训练任务：ASR、说话人</text>
<text x="40" y="356" font-size="11" fill="#9ca3af" text-anchor="start">年龄与性别预测、音频事件检测等</text>
<text x="610" y="340" font-size="11" fill="#9ca3af" text-anchor="start">音频检索库：几十万条语音，</text>
<text x="610" y="356" font-size="11" fill="#9ca3af" text-anchor="start">每条带转写与描述；检索结果</text>
<text x="610" y="372" font-size="11" fill="#9ca3af" text-anchor="start">追加在输入音频特征之后</text>
<text x="610" y="428" font-size="11" fill="#9ca3af" text-anchor="start">交错比例正文只说「固定」；1:3 是示意图画法</text>
</svg>
