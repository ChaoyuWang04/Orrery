<text x="440" y="130" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">CPU：精确重叠</text>
<text x="440" y="152" font-size="11" fill="#6b7280" text-anchor="middle">交集体积 ÷ 查询视锥体积</text>
<text x="440" y="170" font-size="11" fill="#6b7280" text-anchor="middle">（式 10，深色块是交集）</text>
<text x="440" y="206" font-size="11" fill="#6b7280" text-anchor="middle">本图 A ≈ 0.36，B ≈ 0.02</text>
<text x="1000" y="130" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">GPU：采样近似</text>
<text x="1000" y="152" font-size="11" fill="#6b7280" text-anchor="middle">撒 N 个点，数落进候选的比例</text>
<text x="1000" y="170" font-size="11" fill="#6b7280" text-anchor="middle">（式 11，不做三维求交）</text>
<text x="1000" y="206" font-size="11" fill="#6b7280" text-anchor="middle">本图 N = 60：A 19/60，B 1/60</text>
<text x="440" y="232" font-size="11" fill="#6b7280" text-anchor="middle">准，但候选越多越贵</text>
<text x="1000" y="232" font-size="11" fill="#6b7280" text-anchor="middle">数值有误差，名次不变</text>
<text x="30" y="484" font-size="11" fill="#9ca3af">机制示意：式 9–11 见 PDF p.10。报告只写 GPU 版是「基于采样的近似」，点撒在查询视锥里是本文按式 10 的归一化推断的读法。</text>
<text x="30" y="502" font-size="11" fill="#9ca3af">图中两组数字是这张示意图自己的几何，不是报告数据；每个查询视角最终只取分数最高的一帧（式 9）。</text>
