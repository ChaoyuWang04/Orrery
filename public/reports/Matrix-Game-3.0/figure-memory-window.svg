<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="500" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">一个训练窗口里放了什么：5 帧记忆 + 4 帧过去 + 10 帧当前噪声</text>
<text x="30" y="54" font-size="13" fill="#6b7280">绿 = 检索来的记忆潜帧；黄 = 近期过去帧；紫 = 当前带噪预测帧；红 = 故意注入的误差；灰 = 条件。方框数即帧数。</text>

<rect x="30" y="76" width="252" height="160" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="320" y="76" width="204" height="160" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="562" y="76" width="502" height="160" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>

<rect x="86" y="86" width="140" height="22" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="156" y="101" font-size="11" fill="#111827" text-anchor="middle">训练时加 γm·δ</text>
<rect x="352" y="86" width="140" height="22" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="422" y="101" font-size="11" fill="#111827" text-anchor="middle">训练时加 γh·δ</text>
<rect x="738" y="86" width="140" height="22" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="808" y="101" font-size="11" fill="#111827" text-anchor="middle">加高斯噪声</text>

<rect x="40" y="120" width="40" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="88" y="120" width="40" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="136" y="120" width="40" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="184" y="120" width="40" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="232" y="120" width="40" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="60" y="146" font-size="11" fill="#6b7280" text-anchor="middle">M1</text>
<text x="108" y="146" font-size="11" fill="#6b7280" text-anchor="middle">M2</text>
<text x="156" y="146" font-size="11" fill="#6b7280" text-anchor="middle">M3</text>
<text x="204" y="146" font-size="11" fill="#6b7280" text-anchor="middle">M4</text>
<text x="252" y="146" font-size="11" fill="#6b7280" text-anchor="middle">M5</text>

<rect x="330" y="120" width="40" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="378" y="120" width="40" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="426" y="120" width="40" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="474" y="120" width="40" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="350" y="146" font-size="11" fill="#6b7280" text-anchor="middle">P1</text>
<text x="398" y="146" font-size="11" fill="#6b7280" text-anchor="middle">P2</text>
<text x="446" y="146" font-size="11" fill="#6b7280" text-anchor="middle">P3</text>
<text x="494" y="146" font-size="11" fill="#6b7280" text-anchor="middle">P4</text>

<rect x="572" y="120" width="40" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="620" y="120" width="40" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="668" y="120" width="40" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="716" y="120" width="40" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="764" y="120" width="40" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="812" y="120" width="40" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="860" y="120" width="40" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="908" y="120" width="40" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="956" y="120" width="40" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="1004" y="120" width="40" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="592" y="146" font-size="11" fill="#6b7280" text-anchor="middle">C1</text>
<text x="640" y="146" font-size="11" fill="#6b7280" text-anchor="middle">C2</text>
<text x="688" y="146" font-size="11" fill="#6b7280" text-anchor="middle">C3</text>
<text x="736" y="146" font-size="11" fill="#6b7280" text-anchor="middle">C4</text>
<text x="784" y="146" font-size="11" fill="#6b7280" text-anchor="middle">C5</text>
<text x="832" y="146" font-size="11" fill="#6b7280" text-anchor="middle">C6</text>
<text x="880" y="146" font-size="11" fill="#6b7280" text-anchor="middle">C7</text>
<text x="928" y="146" font-size="11" fill="#6b7280" text-anchor="middle">C8</text>
<text x="976" y="146" font-size="11" fill="#6b7280" text-anchor="middle">C9</text>
<text x="1024" y="146" font-size="11" fill="#6b7280" text-anchor="middle">C10</text>

<text x="156" y="188" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">检索记忆 × 5</text>
<text x="156" y="206" font-size="11" fill="#6b7280" text-anchor="middle">按相机位姿与视野重叠挑出的历史帧</text>
<text x="156" y="222" font-size="11" fill="#6b7280" text-anchor="middle">时间 RoPE 写入原始帧号：很久以前</text>
<text x="422" y="188" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">近期过去 × 4</text>
<text x="422" y="206" font-size="11" fill="#6b7280" text-anchor="middle">上一段的尾巴，管短时连续</text>
<text x="422" y="222" font-size="11" fill="#6b7280" text-anchor="middle">原始帧号紧挨当前</text>
<text x="808" y="188" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">当前噪声帧 × 10</text>
<text x="808" y="206" font-size="11" fill="#6b7280" text-anchor="middle">模型只预测这 10 帧</text>
<text x="808" y="222" font-size="11" fill="#6b7280" text-anchor="middle">流匹配损失只算在这里</text>

<line x1="156" y1="236" x2="156" y2="264" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="422" y1="236" x2="422" y2="264" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="808" y1="236" x2="808" y2="264" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="268" width="1034" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="547" y="295" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">同一个双向 DiT：三组潜帧拼成一条序列，共用同一套自注意力</text>

<line x1="280" y1="312" x2="280" y2="340" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="808" y1="344" x2="808" y2="316" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="344" width="500" height="88" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="280" y="368" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">共享误差缓冲 E</text>
<text x="280" y="388" font-size="11" fill="#6b7280" text-anchor="middle">收集记忆、过去、当前三组的残差 δ = ẑ − z</text>
<text x="280" y="404" font-size="11" fill="#6b7280" text-anchor="middle">ẑ 是由预测流推出的干净估计</text>
<text x="280" y="420" font-size="11" fill="#6b7280" text-anchor="middle">下一步均匀抽一个 δ，按上方红标加回记忆与过去</text>

<rect x="562" y="344" width="502" height="88" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="813" y="368" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">条件与位置编码</text>
<text x="813" y="388" font-size="11" fill="#6b7280" text-anchor="middle">键盘经交叉注意力、鼠标经自注意力，动作模块在前 15 个 DiT 块</text>
<text x="813" y="404" font-size="11" fill="#6b7280" text-anchor="middle">相对普吕克几何 g：当前视角相对每帧记忆差在哪</text>
<text x="813" y="420" font-size="11" fill="#6b7280" text-anchor="middle">逐头扰动 RoPE 基频，打破远距记忆的周期假对齐</text>

<text x="30" y="462" font-size="11" fill="#9ca3af">机制示意：据 PDF p.6–8 的图 4、式 4–7 与 p.13 的训练设置重画。方框数是帧数，不代表时间间隔；γm、γh 的取值报告没给。</text>
<text x="30" y="480" font-size="11" fill="#9ca3af">基座训练时另有一种模式：以 0.2 的概率掩掉过去与记忆，只留参考潜帧加 14 帧噪声，对应流式推理的第一段（PDF p.13）。</text>
</svg>
