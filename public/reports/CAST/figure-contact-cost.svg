<rect x="0" y="0" width="1120" height="500" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">接触、支撑、平面支撑：每种代价都是「拿 j 的表面点去查 i 的有向距离」</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">灰 = 物件 i，提供有向距离 Dᵢ（内部为负）；紫 = 物件 j，在它表面均匀采点；红点 = 计入代价的点；黄带 = 离 i 表面 σ 以内。二维示意。</text>
