<text x="32" y="100" font-size="14" fill="#111827" text-anchor="start" font-weight="700">接触：穿透时推开</text>
<text x="32" y="120" font-size="11" fill="#9ca3af" text-anchor="start">式 9 的第一项</text>
<text x="32" y="392" font-size="11" fill="#6b7280" text-anchor="start">j 上落进 i 内部的点：Dᵢ &lt; 0</text>
<text x="32" y="412" font-size="11" fill="#6b7280" text-anchor="start">代价 = 这些点的平均穿透深度</text>
<text x="32" y="432" font-size="11" fill="#6b7280" text-anchor="start">反方向 i → j 再算一遍，相加</text>
<text x="32" y="452" font-size="11" fill="#6b7280" text-anchor="start">两件物件都跟着优化</text>
<text x="304" y="100" font-size="14" fill="#111827" text-anchor="start" font-weight="700">接触：分开时拉拢</text>
<text x="304" y="120" font-size="11" fill="#9ca3af" text-anchor="start">式 9 的第二项</text>
<text x="304" y="392" font-size="11" fill="#6b7280" text-anchor="start">完全分开时，所有点 Dᵢ &gt; 0</text>
<text x="304" y="412" font-size="11" fill="#6b7280" text-anchor="start">代价 = 最近那个点的距离</text>
<text x="304" y="432" font-size="11" fill="#6b7280" text-anchor="start">一旦碰上，这一项归零</text>
<text x="304" y="452" font-size="11" fill="#6b7280" text-anchor="start">保证至少有一处接触</text>
<text x="576" y="100" font-size="14" fill="#111827" text-anchor="start" font-weight="700">支撑：只动上面那件</text>
<text x="576" y="120" font-size="11" fill="#9ca3af" text-anchor="start">式 10</text>
<text x="576" y="392" font-size="11" fill="#6b7280" text-anchor="start">i 支撑 j：i 视为静止，只动 j</text>
<text x="576" y="412" font-size="11" fill="#6b7280" text-anchor="start">代价 = |j 表面点里最小的 Dᵢ|</text>
<text x="576" y="432" font-size="11" fill="#6b7280" text-anchor="start">悬空（正）和压入（负）都罚</text>
<text x="576" y="452" font-size="11" fill="#6b7280" text-anchor="start">多件东西竖直码放时用</text>
<text x="848" y="100" font-size="14" fill="#111827" text-anchor="start" font-weight="700">平面支撑：贴住地面</text>
<text x="848" y="120" font-size="11" fill="#9ca3af" text-anchor="start">式 11</text>
<text x="848" y="392" font-size="11" fill="#6b7280" text-anchor="start">地面、墙这类平面支撑再加一项</text>
<text x="848" y="412" font-size="11" fill="#6b7280" text-anchor="start">只取在 i 外侧、距离不到 σ 的点</text>
<text x="848" y="432" font-size="11" fill="#6b7280" text-anchor="start">代价 = 它们的平均距离</text>
<text x="848" y="452" font-size="11" fill="#6b7280" text-anchor="start">补「车只重建出两个轮子」这类残缺</text>
<text x="111" y="184" font-size="12" fill="#6b7280" text-anchor="middle">i</text>
<text x="216" y="188" font-size="12" fill="#6b7280" text-anchor="middle">j</text>
<text x="353" y="184" font-size="12" fill="#6b7280" text-anchor="middle">i</text>
<text x="490" y="196" font-size="12" fill="#6b7280" text-anchor="middle">j</text>
<text x="424" y="237" font-size="11" fill="#9ca3af" text-anchor="middle">最近距离</text>
<text x="760" y="196" font-size="11" fill="#6b7280" text-anchor="middle">j（书）</text>
<text x="760" y="340" font-size="11" fill="#6b7280" text-anchor="middle">i（桌子，静止）</text>
<text x="957" y="202" font-size="11" fill="#6b7280" text-anchor="middle">j（车身）</text>
<text x="960" y="364" font-size="11" fill="#6b7280" text-anchor="middle">i（地面）</text>
<text x="1064" y="294" font-size="12" fill="#d4a24c" text-anchor="end">σ</text>
</svg>
