<text x="130" y="272" font-size="11" fill="#6b7280">像素 B</text>
<text x="130" y="376" font-size="11" fill="#6b7280">像素 C</text>

<circle cx="300" cy="184" r="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.6"/>
