<rect x="1024" y="262" width="52" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="770" y="284" font-size="11" fill="#111827" text-anchor="middle">墙</text>
<text x="826" y="284" font-size="11" fill="#111827" text-anchor="middle">同 L0</text>
<text x="882" y="284" font-size="11" fill="#111827" text-anchor="middle">同 L0</text>
<text x="938" y="284" font-size="11" fill="#111827" text-anchor="middle">同 L0</text>
<text x="994" y="284" font-size="11" fill="#111827" text-anchor="middle">同 L0</text>
<text x="1050" y="284" font-size="11" fill="#111827" text-anchor="middle">同 L0</text>
<text x="746" y="318" font-size="11" fill="#9ca3af">像素 B：只打到墙，深层全部塌回 L0</text>

<rect x="744" y="366" width="52" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="800" y="366" width="52" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="856" y="366" width="52" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="912" y="366" width="52" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="968" y="366" width="52" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="1024" y="366" width="52" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="770" y="388" font-size="11" fill="#111827" text-anchor="middle">噪声</text>
<text x="826" y="388" font-size="11" fill="#111827" text-anchor="middle">噪声</text>
<text x="882" y="388" font-size="11" fill="#111827" text-anchor="middle">噪声</text>
<text x="938" y="388" font-size="11" fill="#111827" text-anchor="middle">噪声</text>
<text x="994" y="388" font-size="11" fill="#111827" text-anchor="middle">噪声</text>
<text x="1050" y="388" font-size="11" fill="#111827" text-anchor="middle">噪声</text>
<text x="746" y="422" font-size="11" fill="#9ca3af">像素 C：背景，输入换新噪声，损失不计</text>

<text x="30" y="474" font-size="11" fill="#9ca3af">按 PDF p. 4 式（1）–（2）、p. 19 式（7）与 p. 22 深度剥离的描述重画的机制示意；物体与墙的摆放为虚构例子，不是原文样本。</text>
