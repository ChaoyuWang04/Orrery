<circle cx="566" cy="280" r="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.6"/>
<text x="548" y="306" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">L0</text>
<rect x="596" y="266" width="104" height="28" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="648" y="284" font-size="11" fill="#111827" text-anchor="middle">L1–L5 重复 L0</text>

<rect x="528" y="370" width="172" height="28" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
