<text x="882" y="188" font-size="11" fill="#111827" text-anchor="middle">墙</text>
<text x="938" y="188" font-size="11" fill="#111827" text-anchor="middle">同 L2</text>
<text x="994" y="188" font-size="11" fill="#111827" text-anchor="middle">同 L2</text>
<text x="1050" y="188" font-size="11" fill="#111827" text-anchor="middle">同 L2</text>
<text x="746" y="222" font-size="11" fill="#9ca3af">像素 A：打到三次，后三层复制最后一次</text>

<rect x="744" y="262" width="52" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="800" y="262" width="52" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
