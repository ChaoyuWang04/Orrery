<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="500" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">每个像素一叠点：第 0 层是看见的表面，后面是被挡住的交点</text>
<text x="30" y="54" font-size="13" fill="#6b7280">紫 = 场景里的表面；绿 = 深度剥离得到的真实交点；黄 = 向前填充的重复点；灰 = 背景像素，输入换成新噪声、不计损失。</text>

<rect x="16" y="76" width="700" height="360" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="30" y="100" font-size="14" fill="#111827" font-weight="700">侧视：沿三条像素射线往里看</text>

<rect x="30" y="262" width="46" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="53" y="318" font-size="11" fill="#6b7280" text-anchor="middle">相机</text>
<rect x="104" y="140" width="14" height="262" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
