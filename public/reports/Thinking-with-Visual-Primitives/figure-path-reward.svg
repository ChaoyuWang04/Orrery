<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" width="1120" height="440" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="440" fill="#ffffff"/>
<text x="24" y="32" font-size="19" fill="#111827" font-weight="700">路径追踪的轨迹奖励为什么必须双向</text>
<text x="24" y="54" font-size="13" fill="#6b7280">绿线 = 真值曲线；紫点 = 模型在思考里写下的坐标；红虚线 = 被计入惩罚的距离。</text>
<rect x="16" y="72" width="348" height="320" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="190" y="96" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">只用正向：只描起点附近几个点</text>
<text x="190" y="114" font-size="11" fill="#6b7280" text-anchor="middle">每个预测点都贴着真值线</text>
<polyline points="56,300 96,296 131,275 156,240 181,205 211,190 246,195 281,185 306,170 324,160" fill="none" stroke="#5fa886" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/>
<line x1="211" y1="190" x2="131" y2="275" stroke="#d9877a" stroke-width="1.6" stroke-dasharray="4 3"/>
<line x1="281" y1="185" x2="131" y2="275" stroke="#d9877a" stroke-width="1.6" stroke-dasharray="4 3"/>
<line x1="324" y1="160" x2="131" y2="275" stroke="#d9877a" stroke-width="1.6" stroke-dasharray="4 3"/>
<circle cx="56" cy="300" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="96" cy="296" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="131" cy="275" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<text x="56" y="326" font-size="11" fill="#9ca3af" text-anchor="middle">起点</text>
<text x="334" y="146" font-size="11" fill="#9ca3af" text-anchor="middle">终点</text>
<text x="190" y="354" font-size="11" fill="#111827" text-anchor="middle">正向（预测点 → 真值线）：很小</text>
<text x="190" y="372" font-size="11" fill="#111827" text-anchor="middle">反向（真值点 → 预测线）：很大，被罚</text>
<rect x="386" y="72" width="348" height="320" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="560" y="96" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">只用反向：整条都描，但中途绕路</text>
<text x="560" y="114" font-size="11" fill="#6b7280" text-anchor="middle">每个真值点附近都有预测线</text>
<polyline points="426,300 466,296 501,275 526,240 551,205 581,190 616,195 651,185 676,170 694,160" fill="none" stroke="#5fa886" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/>
<line x1="586" y1="240" x2="567" y2="197" stroke="#d9877a" stroke-width="1.6" stroke-dasharray="4 3"/>
<line x1="616" y1="262" x2="599" y2="193" stroke="#d9877a" stroke-width="1.6" stroke-dasharray="4 3"/>
<line x1="634" y1="232" x2="632" y2="191" stroke="#d9877a" stroke-width="1.6" stroke-dasharray="4 3"/>
<polyline points="426,300 466,296 501,275 526,240 551,205 581,190 586,240 616,262 634,232 616,195 651,185 676,170 694,160" fill="none" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="426" cy="300" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="466" cy="296" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="501" cy="275" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="526" cy="240" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="551" cy="205" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="581" cy="190" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="586" cy="240" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="616" cy="262" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="634" cy="232" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="616" cy="195" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="651" cy="185" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="676" cy="170" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="694" cy="160" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<text x="426" y="326" font-size="11" fill="#9ca3af" text-anchor="middle">起点</text>
<text x="704" y="146" font-size="11" fill="#9ca3af" text-anchor="middle">终点</text>
<text x="560" y="354" font-size="11" fill="#111827" text-anchor="middle">正向（预测点 → 真值线）：绕路点很远，被罚</text>
<text x="560" y="372" font-size="11" fill="#111827" text-anchor="middle">反向（真值点 → 预测线）：很小</text>
<rect x="756" y="72" width="348" height="320" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="930" y="96" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">双向都算：完整且贴线</text>
<text x="930" y="114" font-size="11" fill="#6b7280" text-anchor="middle">两种退化解都拿不到满分</text>
<polyline points="796,300 836,296 871,275 896,240 921,205 951,190 986,195 1021,185 1046,170 1064,160" fill="none" stroke="#5fa886" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/>
<polyline points="796,300 836,296 871,275 896,240 921,205 951,190 986,195 1021,185 1046,170 1064,160" fill="none" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="796" cy="300" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="836" cy="296" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="871" cy="275" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="896" cy="240" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="921" cy="205" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="951" cy="190" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="986" cy="195" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="1021" cy="185" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="1046" cy="170" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<circle cx="1064" cy="160" r="5" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<text x="796" y="326" font-size="11" fill="#9ca3af" text-anchor="middle">起点</text>
<text x="1074" y="146" font-size="11" fill="#9ca3af" text-anchor="middle">终点</text>
<text x="930" y="354" font-size="11" fill="#111827" text-anchor="middle">正向、反向距离都小</text>
<text x="930" y="372" font-size="11" fill="#111827" text-anchor="middle">最终取两个方向的平均</text>
<text x="24" y="420" font-size="11" fill="#9ca3af">机制示意：按原文路径追踪奖励的文字描述画（PDF p. 14–15），曲线与坐标为讲解所编。原文另有端点准确度、轨迹连续性惩罚与答案正确性三项。</text>
</svg>
