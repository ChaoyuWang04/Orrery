<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
<marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fa886"/></marker>
<marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8f8bd8"/></marker>
<marker id="ay" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d4a24c"/></marker>
<marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9877a"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="660" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 1：MSA 的一层，谁挑块、谁精读、梯度走到哪</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = 索引支路（只负责挑块）；绿 = 主支路（产出层输出）；黄 = 只在训练时存在的 KL 对齐；红虚线 = stopgrad，梯度在此截断。</text>
<rect x="40" y="100" width="300" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.2"/>
<text x="190.0" y="127.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">每组各取 Top-16 块</text>
<text x="190.0" y="144.0" font-size="11" fill="#6b7280" text-anchor="middle">包含当前位置的那一块强制入选</text>
<rect x="40" y="190" width="300" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.2"/>
<text x="190.0" y="217.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">按块取最大值</text>
<text x="190.0" y="234.0" font-size="11" fill="#6b7280" text-anchor="middle">每 128 个 Token 一块，块分 = 块内最高分</text>
<rect x="40" y="280" width="300" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.2"/>
<text x="190.0" y="307.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Token 级打分</text>
<text x="190.0" y="324.0" font-size="11" fill="#6b7280" text-anchor="middle">Q_idx · K_idx / √d_idx，只看 j ≤ i</text>
<rect x="40" y="370" width="300" height="70" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.2"/>
<text x="190.0" y="395.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">两张新投影 + Norm &amp; RoPE</text>
<text x="190.0" y="413.0" font-size="11" fill="#6b7280" text-anchor="middle">W_q^idx：每个 GQA 组 1 个 index query 头</text>
<text x="190.0" y="428.0" font-size="11" fill="#6b7280" text-anchor="middle">W_k^idx：4 个组共用 1 个 index key 头</text>
<rect x="40" y="470" width="300" height="50" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="190.0" y="491" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">stopgrad(X)</text>
<text x="190.0" y="509" font-size="11" fill="#6b7280" text-anchor="middle">KL 的梯度不许从这里流回骨干</text>
<rect x="780" y="100" width="300" height="50" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.2"/>
<text x="930.0" y="130.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">层输出</text>
<rect x="780" y="190" width="300" height="80" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.2"/>
<text x="930.0" y="220.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">块稀疏注意力</text>
<text x="930.0" y="238.0" font-size="11" fill="#6b7280" text-anchor="middle">只读选中 16 块 × 128 = 2048 个 KV</text>
<text x="930.0" y="253.0" font-size="11" fill="#6b7280" text-anchor="middle">组内 16 个头各用自己的 Query</text>
<rect x="780" y="370" width="300" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.2"/>
<text x="930.0" y="395.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q / K / V 投影</text>
<text x="930.0" y="413.0" font-size="11" fill="#6b7280" text-anchor="middle">64 个 Query 头，4 个 KV 头</text>
<text x="930.0" y="428.0" font-size="11" fill="#6b7280" text-anchor="middle">每 16 个 Query 头共用一套 KV</text>
<rect x="390" y="280" width="340" height="80" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.2"/>
<text x="560.0" y="310.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">KL 对齐（只在训练时）</text>
<text x="560.0" y="328.0" font-size="11" fill="#6b7280" text-anchor="middle">教师：组内 16 头 softmax 取平均，stopgrad</text>
<text x="560.0" y="343.0" font-size="11" fill="#6b7280" text-anchor="middle">学生：索引分数在同一批 Token 上的 softmax</text>
<rect x="460" y="560" width="200" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
<text x="560" y="583" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">隐状态 X</text>
<path d="M460,578 L190,578 L190,524" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="190" y1="470" x2="190" y2="444" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="190" y1="370" x2="190" y2="344" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="190" y1="280" x2="190" y2="254" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="190" y1="190" x2="190" y2="164" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M660,578 L930,578 L930,444" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="930" y1="370" x2="930" y2="274" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="930" y1="190" x2="930" y2="154" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M340,130 L560,130 L560,230 L776,230" fill="none" stroke="#8f8bd8" stroke-width="1.4" marker-end="url(#ap)"/>
<text x="574" y="186" font-size="11" fill="#6b7280" text-anchor="start">块索引 I</text>
<text x="574" y="202" font-size="11" fill="#6b7280" text-anchor="start">组内共用，组间不同</text>
<line x1="340" y1="310" x2="386" y2="310" stroke="#d4a24c" stroke-width="1.4" marker-end="url(#ay)"/>
<path d="M780,262 L760,262 L760,300 L734,300" fill="none" stroke="#d4a24c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ay)"/>
<path d="M560,360 L560,405 L344,405" fill="none" stroke="#d4a24c" stroke-width="1.4" marker-end="url(#ay)"/>
<text x="572" y="398" font-size="11" fill="#6b7280" text-anchor="start">只更新 W_q^idx、W_k^idx</text>
<text x="30" y="626" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p.1 Figure 1、§3.1–3.2（p.4–5）与 Algorithm 1（p.6）重画，是机制示意，不代表耗时比例。</text>
<text x="30" y="646" font-size="13" fill="#6b7280" text-anchor="start">Norm &amp; RoPE 只画在原图里，正文公式没有写。推理时没有黄色部分，索引支路也不走 softmax 的 exp。</text>
</svg>
