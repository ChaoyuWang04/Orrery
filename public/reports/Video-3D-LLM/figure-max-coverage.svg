<text x="30" y="313" font-size="11" fill="#6b7280" text-anchor="start">f9 一帧看见 7 个体素，贪心先挑它</text>
<line x1="30" y1="396" x2="1090" y2="396" stroke="#e5e7eb" stroke-width="1"/>
<text x="30" y="556" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 3 §3.1 与 Algorithm 1 画的机制示意，帧与体素都是虚构的小例子，不是 ScanNet 的真实扫描。</text>
<text x="30" y="580" font-size="13" fill="#9ca3af" text-anchor="start">真实做法：每帧深度反投影到全局坐标、离散成体素，按新增覆盖贪心挑帧；帧数到预算 K 或覆盖率过阈值就停（MC* 取 95%、至多 32 帧）。</text>
