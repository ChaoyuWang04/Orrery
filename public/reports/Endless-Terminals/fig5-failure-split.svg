<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="330" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">TerminalBench 2.0 的 89 道题：12 道做成，五次都没成的 77 道怎么拆</text>
<text x="30" y="56" font-size="13" fill="#6b7280">条长按题数。绿 = pass@5 做成；红 = 只陷入循环；紫 = 循环且用尽轮次；黄 = 只用尽轮次；灰 = 过早交卷。</text>
<text x="30" y="76" font-size="13" fill="#6b7280">30、20、11、12 与三档难度题数来自原文（PDF p. 7–8）；19、9、38、77 由这些数相减得出，是我们的计算。</text>
<rect x="60.0" y="150" width="134.8" height="56" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.4"/>
<text x="127.4" y="183.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">12 道做成</text>
<rect x="194.8" y="150" width="213.5" height="56" fill="#fbe9e7" stroke="#d9877a" stroke-width="1.4"/>
<text x="301.6" y="183.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">19</text>
<rect x="408.3" y="150" width="123.6" height="56" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.4"/>
<text x="470.1" y="183.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">11</text>
<rect x="531.9" y="150" width="101.1" height="56" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.4"/>
<text x="582.5" y="183.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">9</text>
<rect x="633.0" y="150" width="427.0" height="56" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.4"/>
<text x="846.5" y="183.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">38</text>
<path d="M196.8,140 L196.8,132 L529.9,132 L529.9,140" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<text x="363.4" y="122" font-size="13" fill="#111827" text-anchor="middle">循环失败 30 道，占失败 39%</text>
<path d="M635.0,140 L635.0,132 L1058.0,132 L1058.0,140" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<text x="846.5" y="122" font-size="13" fill="#111827" text-anchor="middle">过早交卷 38 道，约占失败 49%</text>
<path d="M410.3,216 L410.3,224 L631.0,224 L631.0,216" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<text x="520.7" y="246" font-size="13" fill="#111827" text-anchor="middle">轮次耗尽 20 道，占失败 26%</text>
<path d="M196.8,260 L196.8,268 L1058.0,268 L1058.0,260" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<text x="627.4" y="290" font-size="13" fill="#111827" text-anchor="middle">零成功 77 道：原文失败分析的全集</text>
<text x="30" y="318" font-size="11" fill="#9ca3af">原文 Figure 5 三根柱相加是 114%，因为循环与轮次耗尽有 11 道重叠；按题拆开后，总长正好是 89 道。</text>
</svg>
