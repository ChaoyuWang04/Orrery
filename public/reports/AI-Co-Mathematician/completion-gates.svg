<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" width="1120" height="650" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="650" fill="#ffffff"/>

  <rect x="20" y="72" width="1080" height="300" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <rect x="20" y="392" width="1080" height="240" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>

  <!-- 代码门 -->
  <rect x="40" y="110" width="200" height="70" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <rect x="290" y="110" width="180" height="70" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <rect x="520" y="110" width="240" height="70" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <rect x="820" y="110" width="260" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="290" y="215" width="470" height="56" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
  <rect x="40" y="295" width="330" height="56" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <rect x="420" y="295" width="330" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
  <rect x="800" y="295" width="280" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>

  <!-- 报告门 -->
  <rect x="40" y="440" width="220" height="70" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <rect x="310" y="440" width="260" height="70" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <rect x="620" y="440" width="180" height="70" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <rect x="850" y="440" width="230" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
  <rect x="620" y="560" width="210" height="54" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
  <rect x="870" y="560" width="210" height="54" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>

  <g stroke="#9ca3af" stroke-width="1.4" fill="none" marker-end="url(#ah)">
    <line x1="240" y1="145" x2="288" y2="145"/>
    <line x1="470" y1="145" x2="518" y2="145"/>
    <line x1="760" y1="145" x2="818" y2="145"/>
    <line x1="380" y1="180" x2="380" y2="213"/>
    <line x1="640" y1="180" x2="640" y2="213"/>
    <polyline points="290,243 205,243 205,293"/>
    <line x1="370" y1="323" x2="418" y2="323"/>
    <line x1="750" y1="323" x2="798" y2="323"/>
    <line x1="260" y1="475" x2="308" y2="475"/>
    <line x1="570" y1="475" x2="618" y2="475"/>
    <line x1="800" y1="475" x2="848" y2="475"/>
    <polyline points="680,510 680,534 150,534 150,512"/>
    <line x1="770" y1="510" x2="770" y2="558"/>
    <line x1="830" y1="587" x2="868" y2="587"/>
  </g>

  <text x="20" y="34" font-size="19" font-weight="700" fill="#111827">两道完成门：过不了就升级给人，不静默重来</text>
  <text x="20" y="57" font-size="13" fill="#6b7280">灰＝系统里的工作步骤与持久记录　紫＝检查门　绿＝放行后的状态　红＝被拦下后的状态　黄＝需要人来看或介入。按 PDF p.8–9 文字重画的机制示意</text>

  <text x="40" y="96" font-size="14" font-weight="700" fill="#111827">代码怎样才算完成：沙发走查里的编码子 agent（PDF p.8）</text>
  <text x="140" y="140" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">编码子 agent</text>
  <text x="140" y="162" font-size="11" fill="#6b7280" text-anchor="middle">写 Python 库与测试</text>
  <text x="380" y="140" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">门一：测试通过？</text>
  <text x="380" y="162" font-size="11" fill="#6b7280" text-anchor="middle">程序硬约束</text>
  <text x="640" y="140" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">门二：审稿 agent</text>
  <text x="640" y="162" font-size="11" fill="#6b7280" text-anchor="middle">接受代码与测试里的黄金值？</text>
  <text x="950" y="140" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">代码才能标成完成</text>
  <text x="950" y="162" font-size="11" fill="#6b7280" text-anchor="middle">两道门都说是</text>
  <text x="494" y="140" font-size="11" fill="#9ca3af" text-anchor="middle">是</text>
  <text x="789" y="140" font-size="11" fill="#9ca3af" text-anchor="middle">是</text>
  <text x="390" y="203" font-size="11" fill="#9ca3af">否</text>
  <text x="650" y="203" font-size="11" fill="#9ca3af">否</text>
  <text x="525" y="248" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">任一道门说否：审稿人反复拒，工作流协调者被堵住</text>
  <text x="205" y="328" font-size="11" fill="#111827" text-anchor="middle">失败探索作为持久记录写进共享文件系统</text>
  <text x="585" y="328" font-size="11" fill="#111827" text-anchor="middle">项目协调者读到记录，在聊天里向用户要数学直觉</text>
  <text x="940" y="328" font-size="11" fill="#111827" text-anchor="middle">用户提剪枝启发式，并让系统另开工作流</text>

  <text x="40" y="418" font-size="14" font-weight="700" fill="#111827">报告怎样才算完成：每条工作流的 LaTeX 写稿（PDF p.9）</text>
  <text x="150" y="470" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">工作流协调者写报告</text>
  <text x="150" y="492" font-size="11" fill="#6b7280" text-anchor="middle">过程、页边注、内部链接</text>
  <text x="440" y="470" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">门三：若干 AI 审稿人</text>
  <text x="440" y="492" font-size="11" fill="#6b7280" text-anchor="middle">查内容、文风、引用、代码输出与逻辑</text>
  <text x="710" y="470" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">全部审稿人批准？</text>
  <text x="710" y="492" font-size="11" fill="#6b7280" text-anchor="middle">审稿人跨轮保持身份</text>
  <text x="965" y="470" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">工作流标 complete</text>
  <text x="965" y="492" font-size="11" fill="#6b7280" text-anchor="middle">报告打开时置顶显示</text>
  <text x="824" y="468" font-size="11" fill="#9ca3af" text-anchor="middle">是</text>
  <text x="415" y="528" font-size="11" fill="#9ca3af" text-anchor="middle">否：按意见改稿，再送审</text>
  <text x="780" y="548" font-size="11" fill="#9ca3af">反复过不了</text>
  <text x="725" y="584" font-size="11" fill="#111827" text-anchor="middle">升级给项目协调者</text>
  <text x="725" y="602" font-size="11" fill="#6b7280" text-anchor="middle">工作流标为未完成</text>
  <text x="975" y="584" font-size="11" fill="#111827" text-anchor="middle">醒目告知用户</text>
  <text x="975" y="602" font-size="11" fill="#6b7280" text-anchor="middle">报告可能仍有未解决问题</text>
</svg>
