<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="430" fill="#ffffff"/>
<text x="30" y="34" font-size="19" font-weight="700" fill="#111827">首包延迟是五段串起来的：并发一上来，涨的主要是 Thinker 和 Talker 的首 Token</text>
<text x="30" y="58" font-size="13" fill="#6b7280">音频输入、冷启动、理论值。一种颜色一个模块：灰 = 编码器预处理，紫 = Thinker，绿 = Talker，黄 = MTP，红 = Codec 解码。段长按毫秒等比例。</text>
