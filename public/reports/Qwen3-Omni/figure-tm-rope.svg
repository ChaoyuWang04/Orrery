<text x="912" y="292" font-size="11" fill="#6b7280">帧内 patch 的高、宽 ID</text>
<text x="912" y="308" font-size="11" fill="#6b7280">按行、列编号，</text>
<text x="912" y="324" font-size="11" fill="#6b7280">与静态图像相同</text>
<rect x="30" y="360" width="1060" height="64" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="50" y="386" font-size="13" fill="#111827">另两种模态：文本的时间、高、宽三个分量取同一个 ID，退化成一维 RoPE；静态图像的全部 token 共用一个常数时间 ID。</text>
<text x="50" y="408" font-size="13" fill="#111827">多段模态拼接时编号连续：后一段从前一段最大 ID + 1 开始。旋转角按时间 24、高 20、宽 20 交错分配。</text>
<text x="30" y="452" font-size="11" fill="#9ca3af">机制示意，据 PDF p. 5 第 2.3 节重画。帧时刻为示意值：报告只说帧率动态、对齐到 80 ms 一格，没有给具体帧率与上限。</text>
</svg>