<text x="214" y="300" font-size="14" font-weight="700" fill="#111827" text-anchor="end">视频帧</text>
<text x="214" y="318" font-size="11" fill="#6b7280" text-anchor="end">动态帧率（示意）</text>
<line x1="272.0" y1="214" x2="272.0" y2="270" stroke="#8f8bd8" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="230" y="270" width="84" height="62" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="272.0" y="294" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">帧 @ 0 s</text>
<text x="272.0" y="314" font-size="11" fill="#6b7280" text-anchor="middle">时间 ID = 0</text>
<line x1="560.0" y1="214" x2="560.0" y2="270" stroke="#8f8bd8" stroke-width="1.4" stroke-dasharray="4 3"/>
<rect x="518" y="270" width="84" height="62" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="560.0" y="294" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">帧 @ 0.48 s</text>
<text x="560.0" y="314" font-size="11" fill="#6b7280" text-anchor="middle">时间 ID = 6</text>
<line x1="848.0" y1="214" x2="848.0" y2="270" stroke="#8f8bd8" stroke-width="1.4" stroke-dasharray="4 3"/>
