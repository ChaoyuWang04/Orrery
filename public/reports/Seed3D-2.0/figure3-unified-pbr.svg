<text x="734" y="466" font-size="11" fill="#6b7280" text-anchor="middle">去掉光照的固有色</text>
<rect x="866" y="424" width="224" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="978" y="447" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">多视图金属度—粗糙度</text>
<text x="978" y="466" font-size="11" fill="#6b7280" text-anchor="middle">换灯时由引擎重算高光</text>
<line x1="734" y1="386" x2="734" y2="422" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="978" y1="386" x2="978" y2="422" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="30" y="516" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 5 Figure 3 与 §2.2、p. 6 VLM 条件、p. 9 §4.2 重画。CCM 本 PDF 未给定义。</text>
<text x="30" y="540" font-size="13" fill="#9ca3af" text-anchor="start">生成分辨率、视角数、专家数与路由方式报告均未公开，图上不画。</text>
