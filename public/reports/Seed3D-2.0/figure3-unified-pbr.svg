<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">材质：从「先画 RGB 再反推」改成「一次出物理贴图」</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = 生成模型；红 = 已把光照烤进颜色的中间结果；黄 = VLM 语义条件；绿 = 物理贴图输出；灰 = 输入条件。</text>
<text x="360" y="90" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Seed3D 1.0：两棒级联</text>
<text x="845" y="90" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Seed3D 2.0：一个统一 PBR 模型</text>
<text x="30" y="140" font-size="14" fill="#111827" text-anchor="start" font-weight="700">条件</text>
<text x="30" y="290" font-size="14" fill="#111827" text-anchor="start" font-weight="700">生成</text>
<text x="30" y="452" font-size="14" fill="#111827" text-anchor="start" font-weight="700">输出</text>
<line x1="20" y1="180" x2="1100" y2="180" stroke="#e5e7eb" stroke-width="1"/>
<line x1="20" y1="410" x2="1100" y2="410" stroke="#e5e7eb" stroke-width="1"/>
<line x1="602" y1="76" x2="602" y2="490" stroke="#e5e7eb" stroke-width="1"/>
