<text x="360" y="466" font-size="11" fill="#6b7280" text-anchor="middle">受 1.0 的低图像分辨率所限，细纹理与文字难保住</text>
<line x1="360" y1="386" x2="360" y2="422" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="622" y="100" width="144" height="64" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
