<line x1="848" y1="164" x2="848" y2="200" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="1010" y1="164" x2="1010" y2="200" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="622" y="202" width="468" height="184" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="856" y="230" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">MMDiT 双流 + MoE</text>
<text x="856" y="252" font-size="11" fill="#6b7280" text-anchor="middle">沿用 1.0 的双流骨架，不再经过中间 RGB</text>
<rect x="648" y="270" width="200" height="46" rx="6" fill="#ffffff" stroke="#8f8bd8"/>
<text x="748" y="290" font-size="12" fill="#111827" text-anchor="middle">albedo 投影层</text>
<text x="748" y="306" font-size="11" fill="#6b7280" text-anchor="middle">模态专属</text>
<rect x="864" y="270" width="200" height="46" rx="6" fill="#ffffff" stroke="#8f8bd8"/>
<text x="964" y="290" font-size="12" fill="#111827" text-anchor="middle">金属度—粗糙度投影层</text>
<text x="964" y="306" font-size="11" fill="#6b7280" text-anchor="middle">模态专属</text>
<text x="856" y="342" font-size="11" fill="#6b7280" text-anchor="middle">两种贴图在共享 DiT 块里联合建模</text>
<text x="856" y="364" font-size="11" fill="#6b7280" text-anchor="middle">MoE 加大容量、按住激活计算，用来抬高生成分辨率</text>
<rect x="622" y="424" width="224" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
