<rect x="160" y="192" width="400" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="360" y="215" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Seed3D-MV</text>
<text x="360" y="234" font-size="11" fill="#6b7280" text-anchor="middle">先合成多视图 RGB</text>
<rect x="210" y="266" width="300" height="46" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
