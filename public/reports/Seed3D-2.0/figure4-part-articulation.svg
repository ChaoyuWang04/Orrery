<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">从一整块网格到能推动的资产：切缝、补全、推断关节</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = 训练出来的网络；黄 = 直接拿来用的现成模型（免训练）；灰 = 数据与确定性处理；绿 = 输出资产。</text>
<rect x="20" y="76" width="330" height="410" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="390" y="76" width="330" height="410" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="760" y="76" width="340" height="410" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="185" y="102" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">① Seed3D-PartSeg：在表面上切缝</text>
<text x="555" y="102" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">② Seed3D-PartDiT：补成实体</text>
<text x="930" y="102" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">③ 关节：三类先验拼起来</text>
<rect x="45" y="120" width="280" height="50" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="185" y="142" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">网格表面随机采样点</text>
<text x="185" y="160" font-size="11" fill="#6b7280" text-anchor="middle">输入是已生成的整块网格</text>
<rect x="45" y="190" width="280" height="50" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="185" y="212" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">原生 3D 骨干提特征</text>
<text x="185" y="230" font-size="11" fill="#6b7280" text-anchor="middle">引 Point Transformer V3 与 Sonata</text>
<rect x="45" y="260" width="280" height="50" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="185" y="282" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">分割头出部件掩码</text>
<text x="185" y="300" font-size="11" fill="#6b7280" text-anchor="middle">以稀疏点提示为条件</text>
<rect x="45" y="330" width="280" height="64" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="185" y="352" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">NMS → 投到三角面 → 传播</text>
<text x="185" y="370" font-size="11" fill="#6b7280" text-anchor="middle">补齐未标注区域</text>
<text x="185" y="385" font-size="11" fill="#6b7280" text-anchor="middle">得到完整的表面分割</text>
<line x1="185" y1="170" x2="185" y2="188" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="185" y1="240" x2="185" y2="258" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="185" y1="310" x2="185" y2="328" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="185" y="430" font-size="11" fill="#9ca3af" text-anchor="middle">产物：每个功能部件一块表面区域，</text>
<text x="185" y="446" font-size="11" fill="#9ca3af" text-anchor="middle">交给 ② 的是它的部分点云</text>
<rect x="410" y="120" width="92" height="64" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="456" y="144" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">部分点云</text>
<text x="456" y="160" font-size="11" fill="#6b7280" text-anchor="middle">来自 ①</text>
<text x="456" y="175" font-size="11" fill="#6b7280" text-anchor="middle">空间引导</text>
<rect x="509" y="120" width="92" height="64" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="555" y="144" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">全局形状</text>
<text x="555" y="160" font-size="11" fill="#6b7280" text-anchor="middle">latent</text>
<text x="555" y="175" font-size="11" fill="#6b7280" text-anchor="middle">结构上下文</text>
<rect x="608" y="120" width="92" height="64" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="654" y="144" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">输入图</text>
<text x="654" y="160" font-size="11" fill="#6b7280" text-anchor="middle">外观参考</text>
<line x1="456" y1="184" x2="456" y2="210" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="555" y1="184" x2="555" y2="210" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="654" y1="184" x2="654" y2="210" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="415" y="212" width="280" height="96" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="555" y="236" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">整流流 DiT，逐部件去噪</text>
<text x="555" y="256" font-size="11" fill="#6b7280" text-anchor="middle">改造注意力：部件之间、部件内部都交互</text>
<text x="555" y="274" font-size="11" fill="#6b7280" text-anchor="middle">（引 PartCrafter）</text>
<text x="555" y="294" font-size="11" fill="#6b7280" text-anchor="middle">全局形状特征注入每一个 DiT 块</text>
<rect x="415" y="330" width="280" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="555" y="354" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">逐部件 VAE 解码并组装</text>
<text x="555" y="374" font-size="11" fill="#6b7280" text-anchor="middle">部件组合网格，可炸开看</text>
<line x1="555" y1="308" x2="555" y2="328" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="780" y="120" width="300" height="64" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="930" y="142" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">语义：VLM 看渲染图</text>
<text x="930" y="160" font-size="11" fill="#6b7280" text-anchor="middle">把部件收成运动学上说得通的组</text>
<text x="930" y="175" font-size="11" fill="#6b7280" text-anchor="middle">并判关节类型</text>
<rect x="780" y="196" width="300" height="64" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="930" y="218" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">几何：算子出候选轴池</text>
<text x="930" y="236" font-size="11" fill="#6b7280" text-anchor="middle">预定义几何算子按部件形状出候选</text>
<text x="930" y="251" font-size="11" fill="#6b7280" text-anchor="middle">再让 VLM 挑最合理的一根</text>
<rect x="780" y="272" width="300" height="64" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="930" y="294" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">动态：图生视频当运动先验</text>
<text x="930" y="312" font-size="11" fill="#6b7280" text-anchor="middle">合成一段部件运动短片</text>
<text x="930" y="327" font-size="11" fill="#6b7280" text-anchor="middle">可微渲染拟合出运动范围</text>
<rect x="780" y="358" width="300" height="64" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="930" y="380" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">导出 URDF 等标准格式</text>
<text x="930" y="398" font-size="11" fill="#6b7280" text-anchor="middle">另由 VLM 估质量、摩擦</text>
<text x="930" y="413" font-size="11" fill="#6b7280" text-anchor="middle">进 Isaac Sim 等引擎被外力推动</text>
<line x1="930" y1="336" x2="930" y2="356" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="325,362 370,362 370,152 408,152" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="695,362 740,362 740,152 778,152" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="930" y="452" font-size="11" fill="#9ca3af" text-anchor="middle">整条关节流水线不训练任何新网络</text>
<text x="30" y="524" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 7 Figure 4 与 §2.3.2、p. 7–8 §2.3.3 重画。机制示意；报告没有给分割或关节的任何定量结果。</text>
<text x="30" y="548" font-size="13" fill="#9ca3af" text-anchor="start">点提示从哪来、PartDiT 一次出全部部件还是逐个出、图生视频用的是哪个模型，报告都没写。</text>
</svg>
