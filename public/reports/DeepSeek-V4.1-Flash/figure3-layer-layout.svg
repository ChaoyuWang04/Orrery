<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">每格一层（从 0 数）。绿 = Full：自算全局 KV 并检索；紫 = Reindex：借 KV、自己重选 Top-k；黄 = Reuse：KV 和 Top-k 都借；灰 = 只有 SWA。</text>
