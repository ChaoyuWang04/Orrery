<text x="260" y="414" font-size="12" fill="#8f8bd8" text-anchor="start">层次化稀疏索引：第 20 层给出至多 2048 块 × 8 = 16384 个候选位置，Reindex 层只在池内重选 Top-512</text>
<text x="76" y="472" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Prefill：读提示词（每 Token 激活约 8B）</text>
<text x="76" y="494" font-size="12" fill="#374151" text-anchor="start">全部提示 Token 只穿过编码器 20 层；</text>
<text x="76" y="513" font-size="12" fill="#374151" text-anchor="start">解码器全局 KV 由投影得到，几乎不花算力；</text>
<text x="76" y="532" font-size="12" fill="#374151" text-anchor="start">解码器只对最后 128 个 Token 跑一遍，补出窗口 KV。</text>
<text x="586" y="472" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Decode：生成新 Token（激活约 16B）</text>
<text x="586" y="494" font-size="12" fill="#374151" text-anchor="start">每个新 Token 穿过全部 40 层；</text>
<text x="586" y="513" font-size="12" fill="#374151" text-anchor="start">Reuse 层不打分、直接按借来的 Top-k 读 KV；</text>
<text x="586" y="532" font-size="12" fill="#374151" text-anchor="start">Full / Reindex 层才需要跑索引器。</text>
<text x="30" y="584" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p. 7 Figure 3、p. 9 式 1、p. 11–12 与 p. 21–22 第 4.2.1 节重画，是结构示意。8B / 16B 的逐模块拆账报告没有给。</text>
