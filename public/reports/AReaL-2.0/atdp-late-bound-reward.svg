<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="500" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">一条 ATDP 事件：因果记录当场封存，奖励可以晚到再挂上</text>
<text x="30" y="54" font-size="13" fill="#6b7280">灰 = 行动时就能记下、之后不可改的因果记录；黄 = 事后追加的奖励与批评；紫 = 重放与治理用的元数据。据 PDF p. 4–5 示意。</text>


<rect x="30" y="76" width="530" height="340" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="48" y="100" font-size="14" fill="#111827" font-weight="700">事件 e_t = 〈o, h, a, y, r, m〉（第 t 步）</text>

<rect x="48" y="112" width="494" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="62" y="132" font-size="14" fill="#111827" font-weight="700">o_t 看到了什么</text>
<text x="62" y="148" font-size="11" fill="#6b7280">工具输出、检索片段、用户消息、环境状态</text>

<rect x="48" y="162" width="494" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="62" y="182" font-size="14" fill="#111827" font-weight="700">h_t 当时的内部状态</text>
<text x="62" y="198" font-size="11" fill="#6b7280">正在执行的计划、置信度、推理摘要；只记与决策相关的部分</text>

<rect x="48" y="212" width="494" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="62" y="232" font-size="14" fill="#111827" font-weight="700">a_t 选了什么动作</text>
<text x="62" y="248" font-size="11" fill="#6b7280">带参数 schema 的工具调用、生成的 token、代码编辑、记忆写入</text>

<rect x="48" y="262" width="494" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="62" y="282" font-size="14" fill="#111827" font-weight="700">y_t 动作的直接结果</text>
<text x="62" y="298" font-size="11" fill="#6b7280">工具返回值、用户接受 / 编辑 / 重试 / 删除、退出码</text>

<rect x="48" y="312" width="494" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="62" y="332" font-size="14" fill="#111827" font-weight="700">r_t 奖励与批评</text>
<text x="62" y="348" font-size="11" fill="#6b7280">行动那一刻常常还是空的；之后只追加，不改上面四行</text>

<rect x="48" y="362" width="494" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="62" y="382" font-size="14" fill="#111827" font-weight="700">m_t 元数据（执行信封与治理字段）</text>
<text x="62" y="398" font-size="11" fill="#6b7280">模型 checkpoint、harness 指纹、工具版本、检索快照、租户、脱敏状态、训练资格</text>

<text x="610" y="100" font-size="14" fill="#111827" font-weight="700">之后陆续到达的信号（越往下越晚）</text>

<rect x="610" y="120" width="480" height="54" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="624" y="142" font-size="14" fill="#111827" font-weight="700">下一轮对话：用户纠正了回答</text>
<text x="624" y="162" font-size="11" fill="#6b7280">OpenClaw-RL 说的「下一状态信号」，论文把它推广到一切运营状态变化</text>

<rect x="610" y="200" width="480" height="54" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="624" y="222" font-size="14" fill="#111827" font-weight="700">稍后：测试失败、工单被重开、退款被撤销</text>
<text x="624" y="242" font-size="11" fill="#6b7280">弱信号、延迟信号，先由数据代理收下，再由控制面决定用不用</text>

<rect x="610" y="280" width="480" height="54" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="624" y="302" font-size="14" fill="#111827" font-weight="700">更晚：人工标注、慢速的远程评估器</text>
<text x="624" y="322" font-size="11" fill="#6b7280">异步、受策略约束或只抽样才有的判断</text>

<text x="610" y="372" font-size="11" fill="#9ca3af">三路信号都只写进 r_t。若允许回头改 o、a、y，</text>
<text x="610" y="390" font-size="11" fill="#9ca3af">事后的重放与归因就失去了依据。</text>

<polyline points="610,147 580,147 580,334" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="610" y1="227" x2="580" y2="227" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="610" y1="307" x2="580" y2="307" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="580" y1="334" x2="545" y2="334" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="30" y="446" font-size="13" fill="#6b7280">去掉 h 与 m，这个六元组就退化成标准 POMDP（PDF p. 5）。把 y 与 r 拆成两格，是因为结果当场就有，评价常常晚到。</text>
<text x="30" y="470" font-size="13" fill="#6b7280">示意图，不是论文原图。论文只给了六元组与六条原则，没有字段类型、序列化格式或示例事件（PDF p. 4–5）。</text>
</svg>
