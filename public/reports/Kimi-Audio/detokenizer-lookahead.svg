<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="860" height="460" fill="#ffffff"/>
<text x="30" y="36" font-size="19" font-weight="700" fill="#111827">分块流式反 token 化：向后多看 n 个 token，只保留本块</text>
<text x="30" y="60" font-size="13" fill="#6b7280">机制示意，按 PDF p. 5 第 2.4 节重画；块长 1 秒、n = 4 为原文举例，格子数只示意，不按比例。</text>
<text x="30" y="80" font-size="13" fill="#6b7280">颜色：灰 = 历史块（作 prompt），绿 = 本块，黄 = 借来的未来 token，红 = 解码后丢弃，紫 = 模块。</text>
<text x="30" y="128" font-size="14" font-weight="700" fill="#111827">语义 token</text>
<text x="30" y="145" font-size="11" fill="#6b7280">12.5 Hz</text>
<rect x="180" y="112" width="22" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="206" y="112" width="22" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="232" y="112" width="22" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="258" y="112" width="22" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="284" y="112" width="22" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="316" y="112" width="22" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="342" y="112" width="22" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="368" y="112" width="22" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="394" y="112" width="22" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="420" y="112" width="22" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="446" y="112" width="22" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="472" y="112" width="22" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="498" y="112" width="22" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="524" y="112" width="22" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="550" y="112" width="22" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="576" y="112" width="22" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="602" y="112" width="22" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="628" y="112" width="22" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="654" y="112" width="22" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="680" y="112" width="22" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="706" y="112" width="22" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="732" y="112" width="22" height="30" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="758" y="112" width="22" height="30" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="784" y="112" width="22" height="30" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="245" y="166" font-size="11" fill="#6b7280" text-anchor="middle">c(i−1)：历史块</text>
<text x="472" y="166" font-size="11" fill="#6b7280" text-anchor="middle">c(i)：本块</text>
<text x="680" y="166" font-size="11" fill="#6b7280" text-anchor="middle">c(i+1) 的前 n 个</text>
<text x="771" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">尚未用到</text>
<line x1="245" y1="174" x2="245" y2="198" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="472" y1="174" x2="472" y2="198" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="680" y1="174" x2="680" y2="198" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="180" y="200" width="630" height="64" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="495" y="226" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Flow matching：语义 token → mel</text>
<text x="495" y="249" font-size="11" fill="#6b7280" text-anchor="middle">条件是本块加借来的 n 个 token；prompt 是所有更早块的 mel 与 token（块级因果掩码）</text>
<text x="30" y="306" font-size="14" font-weight="700" fill="#111827">mel 谱</text>
<text x="30" y="323" font-size="11" fill="#6b7280">50 Hz，token 上采样 4 倍对齐</text>
<line x1="472" y1="264" x2="472" y2="290" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="680" y1="264" x2="680" y2="290" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="316" y="292" width="310" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="471" y="311" font-size="11" fill="#111827" text-anchor="middle">只保留 c(i) 对应的 mel</text>
<rect x="630" y="292" width="100" height="30" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="680" y="311" font-size="11" fill="#111827" text-anchor="middle">丢弃</text>
<line x1="472" y1="322" x2="472" y2="346" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="30" y="372" font-size="14" font-weight="700" fill="#111827">波形</text>
<rect x="316" y="348" width="310" height="48" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="471" y="369" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">BigVGAN 声码器</text>
<text x="471" y="387" font-size="11" fill="#6b7280" text-anchor="middle">逐块出波形，客户端边收边播</text>
<text x="30" y="428" font-size="11" fill="#9ca3af">代价：只有第一块要多等 n 个 token；n = 4 时约 0.32 秒音频（本文按 12.5 Hz 换算）。该机制不需要重新训练。</text>
<text x="30" y="446" font-size="11" fill="#9ca3af">为什么要借：块级因果注意力让块尾看不到后文，块边界会出现断续（PDF p. 5）。</text>
</svg>