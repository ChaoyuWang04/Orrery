<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">三段裁剪：比值 r 落在哪一段，这个 Token 还有没有梯度</text>
<text x="30" y="54" font-size="13" fill="#6b7280">横轴是重要性比 r = π_θ / π_μ，纵轴是这个 Token 被鼓励或被惩罚的力度（目标值的绝对值 ÷ |A|）。绿 = 有梯度；灰 = 被裁平、梯度为 0；虚线是三个裁剪点。</text>
<rect x="30" y="72" width="520" height="360" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="50" y="98" font-size="14" fill="#111827" font-weight="700">正优势（A &gt; 0）：鼓励这个 Token</text>
<text x="50" y="116" font-size="11" fill="#6b7280">目标 = A · min(r, 1+ε_ph)</text>
<line x1="70" y1="380" x2="490" y2="380" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="70" y1="380" x2="70" y2="140" stroke="#9ca3af" stroke-width="1.4"/>
<text x="490" y="414" font-size="11" fill="#9ca3af" text-anchor="end">r →</text>
<line x1="175.0" y1="380" x2="175.0" y2="160" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="175.0" y="398" font-size="11" fill="#6b7280" text-anchor="middle">1</text>
<line x1="206.5" y1="380" x2="206.5" y2="160" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="206.5" y="398" font-size="11" fill="#6b7280" text-anchor="middle">1+ε_ph</text>
<line x1="70.0" y1="380.0" x2="206.5" y2="299.4" stroke="#5fa886" stroke-width="4" stroke-linecap="round"/>
<line x1="206.5" y1="299.4" x2="469.0" y2="299.4" stroke="#b9b9b9" stroke-width="4" stroke-linecap="round"/>
<text x="127.8" y="305.6" font-size="11" fill="#6b7280" text-anchor="middle">r 越大越鼓励</text>
<text x="343.0" y="283.9" font-size="11" fill="#6b7280" text-anchor="middle">鼓励够了：不再推高</text>
<rect x="570" y="72" width="520" height="360" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="590" y="98" font-size="14" fill="#111827" font-weight="700">负优势（A &lt; 0）：压低这个 Token</text>
<text x="590" y="116" font-size="11" fill="#6b7280">目标 = −|A| · min( max(r, 1−ε_nl), ε_nh )</text>
<line x1="610" y1="380" x2="1030" y2="380" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="610" y1="380" x2="610" y2="140" stroke="#9ca3af" stroke-width="1.4"/>
<text x="1030" y="414" font-size="11" fill="#9ca3af" text-anchor="end">r →</text>
<line x1="694.0" y1="380" x2="694.0" y2="160" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="694.0" y="398" font-size="11" fill="#6b7280" text-anchor="middle">1−ε_nl</text>
<line x1="925.0" y1="380" x2="925.0" y2="160" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="925.0" y="398" font-size="11" fill="#6b7280" text-anchor="middle">ε_nh</text>
<line x1="610.0" y1="330.4" x2="694.0" y2="330.4" stroke="#b9b9b9" stroke-width="4" stroke-linecap="round"/>
<line x1="694.0" y1="330.4" x2="925.0" y2="194.0" stroke="#5fa886" stroke-width="4" stroke-linecap="round"/>
<line x1="925.0" y1="194.0" x2="1009.0" y2="194.0" stroke="#b9b9b9" stroke-width="4" stroke-linecap="round"/>
<text x="652.0" y="308.7" font-size="11" fill="#6b7280" text-anchor="middle">已压够</text>
<text x="793.8" y="221.9" font-size="11" fill="#6b7280" text-anchor="middle">正常压低</text>
<text x="967.0" y="172.3" font-size="11" fill="#6b7280" text-anchor="middle">地板</text>
<text x="30" y="462" font-size="13" fill="#6b7280">负优势那条的右端就是双重裁剪：MoE 换版本后路由一变，r 可能极大，−|A|·r 会把梯度放大到失控；过了 ε_nh 就只按常数罚，梯度归零。</text>
<text x="30" y="486" font-size="13" fill="#6b7280">每一项还要乘截断的引擎校正权重 min(π_train / π_infer, C)，再除以 G · T_max。</text>
<text x="30" y="508" font-size="11" fill="#9ca3af">据 PDF p. 10 式 4 与正文画出；裁剪点位置只是示意，报告没有公开 ε_nl、ε_ph、ε_nh 的取值。</text>
</svg>