<text x="365.0" y="84" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">第 n 步</text>
<text x="829.6" y="84" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">第 n+1 步</text>
<text x="30" y="148" font-size="14" fill="#111827" font-weight="700">独立生成组</text>
<text x="30" y="166" font-size="11" fill="#6b7280">只做生成</text>
<text x="30" y="288" font-size="14" fill="#111827" font-weight="700">弹性角色组</text>
<text x="30" y="306" font-size="11" fill="#6b7280">生成与训练轮换</text>
<text x="30" y="390" font-size="13" fill="#6b7280">第 n 步：5、8、3、1、6、2 依次写完就流走；2 写完凑满一批，生成中断，进入经验制作。</text>
<text x="30" y="414" font-size="13" fill="#6b7280">中断时 10、12 还在用 θn−2，训练出 θn+1 后它超出陈旧度，两条丢弃重生成；其余接着写。</text>
<text x="30" y="438" font-size="13" fill="#6b7280">第 n+1 步：7、13 连同 KV cache 迁到独立组续写，9 在弹性组原地续写；弹性组训练完用 θn+1 起新提示 14–16。</text>
<text x="30" y="462" font-size="13" fill="#6b7280">同一规则再走一遍：18、21 用的是 θn−1，到下一步也会超限被丢。</text>
<text x="30" y="500" font-size="11" fill="#9ca3af">据 PDF p. 7 Figure 5 逐格重画，条的长短只示意先后，不是实测时长。</text>
</svg>