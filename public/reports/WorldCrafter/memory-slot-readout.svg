<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
<marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fa886"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="660" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">同一个记忆槽，三种填法：槽的大小不变，变的是往里装什么</text>
<text x="30" y="58" font-size="13" fill="#6b7280">灰 = 历史潜帧；紫 = 记忆编码器、读出模块与它们产出的 token；绿 = 目标相机位姿（查询）；黄 = 当前段的噪声潜帧。</text>
<text x="30" y="78" font-size="13" fill="#6b7280">机制示意，依据 PDF p. 4–5 的 3.2–3.4 节与 p. 9 的消融设置；块的宽度不代表 token 数。</text>

<rect x="16" y="96" width="1088" height="112" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36" y="122" font-size="14" fill="#111827" font-weight="700">每一步去噪，DiT 处理的序列 [M ; zʳ ; zₜ]</text>
<text x="36" y="142" font-size="11" fill="#6b7280">记忆 M 占的位置，原来是 Helios 窗口里压缩的 16 帧历史段（PDF p. 5）</text>
<rect x="36" y="154" width="300" height="42" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="186" y="172" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">记忆 M</text>
<text x="186" y="189" font-size="11" fill="#6b7280" text-anchor="middle">固定为 4 帧完整潜帧的 token 数</text>
<rect x="352" y="154" width="360" height="42" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="532" y="172" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">最近历史 zʳ</text>
<text x="532" y="189" font-size="11" fill="#6b7280" text-anchor="middle">Helios 保留下来的 2 帧段、最新潜帧、注意力汇聚帧</text>
<rect x="728" y="154" width="360" height="42" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="908" y="172" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">噪声段 zₜ（9 帧）</text>
<text x="908" y="189" font-size="11" fill="#6b7280" text-anchor="middle">相机分支 UCPE 只作用在这一段</text>

<text x="36" y="240" font-size="14" fill="#111827" font-weight="700">槽里装什么</text>
<text x="1052" y="240" font-size="11" fill="#9ca3af" text-anchor="middle">填进 M</text>

<rect x="16" y="252" width="1088" height="100" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36" y="290" font-size="14" fill="#111827" font-weight="700">上下文记忆</text>
<text x="36" y="310" font-size="11" fill="#6b7280">Table 4 消融变体</text>
<rect x="250" y="286" width="18" height="18" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="274" y="286" width="18" height="18" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="298" y="286" width="18" height="18" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="322" y="286" width="18" height="18" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="250" y="328" font-size="11" fill="#6b7280">检索出的 4 帧历史潜帧</text>
<line x1="352" y1="295" x2="990" y2="295" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="670" y="286" font-size="11" fill="#9ca3af" text-anchor="middle">不编码、不读出，原样放进槽</text>
<rect x="998" y="276" width="90" height="38" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="1043" y="300" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">4 帧潜帧</text>

<rect x="16" y="366" width="1088" height="112" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36" y="408" font-size="14" fill="#111827" font-weight="700">位姿无关读出</text>
<text x="36" y="428" font-size="11" fill="#6b7280">Table 4 消融变体，式 (6)</text>
