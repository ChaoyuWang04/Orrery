<rect x="358" y="400" width="14" height="18" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="376" y="400" width="14" height="18" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="394" y="400" width="14" height="18" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
