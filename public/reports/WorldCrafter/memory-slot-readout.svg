<text x="535" y="424" font-size="11" fill="#6b7280" text-anchor="middle">LagerNVS 编码器初始化</text>
<line x1="614" y1="409" x2="646" y2="409" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="654" y="388" width="160" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
