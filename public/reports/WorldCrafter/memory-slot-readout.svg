<rect x="394" y="526" width="14" height="18" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="250" y="568" font-size="11" fill="#6b7280">同样的 9 帧输入</text>
<line x1="416" y1="535" x2="452" y2="535" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="460" y="514" width="150" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="535" y="533" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">记忆编码器 Φ</text>
<text x="535" y="550" font-size="11" fill="#6b7280" text-anchor="middle">LagerNVS 编码器初始化</text>
<line x1="614" y1="535" x2="646" y2="535" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="654" y="514" width="160" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="734" y="533" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">表示 R</text>
<text x="734" y="550" font-size="11" fill="#6b7280" text-anchor="middle">每帧 L 个 token，共 9L 个</text>
<line x1="818" y1="535" x2="850" y2="535" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="858" y="514" width="110" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="913" y="533" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">读出</text>
