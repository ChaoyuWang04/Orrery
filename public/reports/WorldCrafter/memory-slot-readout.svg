<rect x="998" y="390" width="90" height="38" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="1043" y="414" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">记忆 token</text>

<rect x="16" y="492" width="1088" height="150" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36" y="534" font-size="14" fill="#111827" font-weight="700">位姿引导读出</text>
<text x="36" y="554" font-size="11" fill="#6b7280">WorldCrafter 采用，式 (7)</text>
<rect x="250" y="526" width="14" height="18" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="268" y="526" width="14" height="18" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="286" y="526" width="14" height="18" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="304" y="526" width="14" height="18" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="322" y="526" width="14" height="18" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="340" y="526" width="14" height="18" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="358" y="526" width="14" height="18" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
