<rect x="998" y="516" width="90" height="38" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="1043" y="540" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">记忆 token</text>
<rect x="654" y="582" width="160" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="734" y="601" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">查询位姿 Cq</text>
<text x="734" y="618" font-size="11" fill="#6b7280" text-anchor="middle">从即将走的轨迹里采样</text>
<path d="M818,604 L913,604 L913,566" fill="none" stroke="#5fa886" stroke-width="1.4" marker-end="url(#ag)"/>
