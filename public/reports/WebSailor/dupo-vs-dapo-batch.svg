<text x="740" y="314" font-size="11" fill="#9ca3af" text-anchor="middle">空</text>
<rect x="776" y="292" width="56" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="804" y="315" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q4</text>
<rect x="840" y="292" width="56" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="868" y="315" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q5</text>
<rect x="904" y="292" width="56" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-dasharray="4 3"/>
<text x="932" y="314" font-size="11" fill="#9ca3af" text-anchor="middle">空</text>
<rect x="968" y="292" width="56" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="996" y="315" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q7</text>
<rect x="1032" y="292" width="56" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="1060" y="315" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q8</text>

<line x1="836" y1="334" x2="836" y2="356" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="608" y="360" width="456" height="54" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="836" y="382" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">从本 batch 的绿题里随机复制 3 份填空</text>
<text x="836" y="402" font-size="11" fill="#6b7280" text-anchor="middle">复制的是已经跑完的 8 条轨迹，不调用环境、不生成新 rollout</text>
<line x1="836" y1="418" x2="836" y2="440" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="584" y="444" width="56" height="42" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="612" y="470" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q1</text>
<rect x="648" y="444" width="56" height="42" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="676" y="462" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q4</text>
<text x="676" y="478" font-size="11" fill="#6b7280" text-anchor="middle">复制</text>
<rect x="712" y="444" width="56" height="42" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="740" y="462" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q7</text>
<text x="740" y="478" font-size="11" fill="#6b7280" text-anchor="middle">复制</text>
<rect x="776" y="444" width="56" height="42" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="804" y="470" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q4</text>
<rect x="840" y="444" width="56" height="42" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="868" y="470" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q5</text>
<rect x="904" y="444" width="56" height="42" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
