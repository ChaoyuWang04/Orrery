<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">DUPO 与 DAPO 动态采样：batch 里出现空槽之后怎么补</text>
<text x="30" y="54" font-size="13" fill="#6b7280">绿 = 组内有对有错，有学习信号；灰 = 组内全对或全错，被拿掉；黄 = 额外一轮 rollout 采回的新题；紫 = 从本 batch 复制的题。</text>

<rect x="16" y="68" width="1088" height="36" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="34" y="91" font-size="14" fill="#111827" font-weight="700">训练前（一次性）</text>
<text x="160" y="91" font-size="11" fill="#6b7280">DUPO 先让每道题跑 8 条，8 条全对的题直接移出训练集。下面是训练中的某一步，题号与对错数是示意，不是论文数据。</text>

<text x="71" y="130" font-size="14" fill="#111827" font-weight="700">训练中某一步：batch 里 8 道题，每题一组 8 条 rollout</text>

<rect x="71" y="142" width="110" height="54" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="126" y="164" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q1</text>
<text x="126" y="184" font-size="11" fill="#6b7280" text-anchor="middle">8 条里对 3</text>
<rect x="195" y="142" width="110" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="250" y="164" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q2</text>
<text x="250" y="184" font-size="11" fill="#6b7280" text-anchor="middle">8 条全对</text>
<rect x="319" y="142" width="110" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="374" y="164" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q3</text>
<text x="374" y="184" font-size="11" fill="#6b7280" text-anchor="middle">8 条全错</text>
<rect x="443" y="142" width="110" height="54" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="498" y="164" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q4</text>
<text x="498" y="184" font-size="11" fill="#6b7280" text-anchor="middle">8 条里对 5</text>
<rect x="567" y="142" width="110" height="54" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="622" y="164" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q5</text>
<text x="622" y="184" font-size="11" fill="#6b7280" text-anchor="middle">8 条里对 1</text>
<rect x="691" y="142" width="110" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="746" y="164" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q6</text>
<text x="746" y="184" font-size="11" fill="#6b7280" text-anchor="middle">8 条全错</text>
<rect x="815" y="142" width="110" height="54" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="870" y="164" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q7</text>
<text x="870" y="184" font-size="11" fill="#6b7280" text-anchor="middle">8 条里对 6</text>
<rect x="939" y="142" width="110" height="54" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="994" y="164" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q8</text>
<text x="994" y="184" font-size="11" fill="#6b7280" text-anchor="middle">8 条里对 2</text>

<line x1="284" y1="200" x2="284" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="836" y1="200" x2="836" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="16" y="238" width="536" height="306" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="568" y="238" width="536" height="306" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>

<text x="284" y="262" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">DAPO 动态采样：拿掉，再采新题填满</text>
<text x="284" y="280" font-size="11" fill="#6b7280" text-anchor="middle">空槽要等新一轮多轮 rollout 回来</text>
<text x="836" y="262" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">DUPO：拿掉，再从本 batch 复制</text>
<text x="836" y="280" font-size="11" fill="#6b7280" text-anchor="middle">只复制组内有对有错的题，不再等环境</text>

<rect x="32" y="292" width="56" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="60" y="315" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q1</text>
<rect x="96" y="292" width="56" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-dasharray="4 3"/>
<text x="124" y="314" font-size="11" fill="#9ca3af" text-anchor="middle">空</text>
