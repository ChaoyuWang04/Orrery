<text x="316" y="315" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q5</text>
<rect x="352" y="292" width="56" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-dasharray="4 3"/>
<text x="380" y="314" font-size="11" fill="#9ca3af" text-anchor="middle">空</text>
<rect x="416" y="292" width="56" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="444" y="315" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q7</text>
<rect x="480" y="292" width="56" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="508" y="315" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q8</text>

<line x1="284" y1="334" x2="284" y2="356" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="56" y="360" width="456" height="54" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="284" y="382" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">从数据集再抽 3 道新题，各跑 8 条多轮 rollout</text>
<text x="284" y="402" font-size="11" fill="#6b7280" text-anchor="middle">每条都要搜索、访问网页、等工具返回；新题又全对或全错，还得再抽</text>
<line x1="284" y1="418" x2="284" y2="440" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="32" y="444" width="56" height="42" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="60" y="470" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q1</text>
<rect x="96" y="444" width="56" height="42" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="124" y="462" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q9</text>
<text x="124" y="478" font-size="11" fill="#6b7280" text-anchor="middle">新题</text>
<rect x="160" y="444" width="56" height="42" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="188" y="462" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q10</text>
<text x="188" y="478" font-size="11" fill="#6b7280" text-anchor="middle">新题</text>
<rect x="224" y="444" width="56" height="42" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="252" y="470" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q4</text>
<rect x="288" y="444" width="56" height="42" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="316" y="470" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q5</text>
<rect x="352" y="444" width="56" height="42" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="380" y="462" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q11</text>
<text x="380" y="478" font-size="11" fill="#6b7280" text-anchor="middle">新题</text>
<rect x="416" y="444" width="56" height="42" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="444" y="470" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q7</text>
<rect x="480" y="444" width="56" height="42" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="508" y="470" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Q8</text>
<text x="284" y="518" font-size="11" fill="#6b7280" text-anchor="middle">这一步的耗时 = 原本的 rollout + 额外一轮（或几轮）rollout</text>

<rect x="584" y="292" width="56" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
