<text x="30.0" y="474.0" font-size="13" fill="#6b7280" text-anchor="start">柱高按 PDF p. 9 Figure 6 读取，误差约 2 个百分点。PartiPrompts 上成对比较，评三个问题：像不像提示词、好不好看、字写得对不对。</text>
<text x="30.0" y="498.0" font-size="13" fill="#6b7280" text-anchor="start">最右一组是完整模型对去掉 T5 版的胜率；附录按去掉 T5 一方写作 50%、46%、38%，两边互补（PDF p. 24）。</text>
<text x="30.0" y="522.0" font-size="13" fill="#9ca3af" text-anchor="start">美学对 Ideogram-V1.0 约 49%、对 DALL-E 3 约 53%，接近打平。排版对 PixArt-α、Playground-V2.5 近乎全胜，对 Ideogram-V1.0 只有约 54%。</text>
