<text x="50" y="482" font-size="13" fill="#111827" text-anchor="start">网页搜索与 GPT-5 的偏好是 0：多调它们不扣分，只是拿不到分。「避开某个工具」只能靠别的列相对变差来体现。</text>
<text x="50" y="512" font-size="13" fill="#111827" text-anchor="start">「答对」一列若全组都对，最大值等于最小值，这一列按论文规定置 0，不再区分。</text>
<text x="50" y="542" font-size="13" fill="#111827" text-anchor="start">最后 GRPO 在组内把 R 标准化成优势：本例约为 τ4 +1.20、τ1 +0.67、τ2 −0.50、τ3 −1.37。</text>
<text x="30" y="600" font-size="12" fill="#9ca3af" text-anchor="start">机制示意，数字为示意用的假设值，不是论文数据。规则据 PDF p. 4 式 1–3：逐列组内 min–max，常数列置 0，点乘 P，答错则 R = 0。</text>
