<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="540" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">RBRM：让 GPT-4 按人写的多选题给自己的输出分类，再换成奖励</text>
<text x="30" y="54" font-size="13" fill="#6b7280">红 = 请求违禁内容的 prompt 子集；绿 = 已知安全可答的 prompt 子集；紫 = 模型；黄 = 人写的规则；灰 = 奖励信号。</text>

<rect x="40" y="96" width="240" height="84" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="56" y="122" font-size="14" fill="#111827" font-weight="700">有害请求子集</text>
<text x="56" y="144" font-size="11" fill="#6b7280">例如索要违法建议</text>
<text x="56" y="162" font-size="11" fill="#6b7280">目标：以期望的风格拒绝</text>

<rect x="40" y="226" width="240" height="104" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="56" y="252" font-size="14" fill="#111827" font-weight="700">已知安全可答的子集</text>
<text x="56" y="274" font-size="11" fill="#6b7280">含「边界 prompt」：把违禁请求</text>
<text x="56" y="292" font-size="11" fill="#6b7280">改写成最相似、但不违禁的版本</text>
<text x="56" y="312" font-size="11" fill="#6b7280">目标：不拒绝，正常回答</text>

<rect x="340" y="176" width="200" height="84" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="356" y="204" font-size="14" fill="#111827" font-weight="700">策略模型 GPT-4</text>
<text x="356" y="226" font-size="11" fill="#6b7280">处在 PPO 微调中</text>
<text x="356" y="244" font-size="11" fill="#6b7280">对 prompt 生成一条输出</text>

<rect x="600" y="80" width="220" height="64" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="616" y="106" font-size="14" fill="#111827" font-weight="700">人写的 rubric</text>
<text x="616" y="128" font-size="11" fill="#6b7280">多选题式规则，按内容类别各写一份</text>

<rect x="600" y="176" width="220" height="84" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="616" y="204" font-size="14" fill="#111827" font-weight="700">RBRM</text>
<text x="616" y="226" font-size="11" fill="#6b7280">零样本 GPT-4 分类器</text>
<text x="616" y="244" font-size="11" fill="#6b7280">读 prompt（可选）+ 输出 + rubric</text>

<rect x="880" y="80" width="210" height="50" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="896" y="110" font-size="12" fill="#111827">A 期望风格的拒绝</text>
<rect x="880" y="142" width="210" height="50" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="896" y="172" font-size="12" fill="#111827">B 不期望风格的拒绝</text>
<rect x="880" y="204" width="210" height="50" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="896" y="234" font-size="12" fill="#111827">C 含违禁内容</text>
<rect x="880" y="266" width="210" height="50" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="896" y="296" font-size="12" fill="#111827">D 安全的非拒绝回答</text>

<line x1="280" y1="138" x2="338" y2="200" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="280" y1="278" x2="338" y2="238" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="540" y1="218" x2="598" y2="218" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="569" y="208" font-size="11" fill="#9ca3af" text-anchor="middle">输出</text>
<line x1="710" y1="144" x2="710" y2="174" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="820" y1="218" x2="878" y2="198" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="849" y="222" font-size="11" fill="#9ca3af" text-anchor="middle">归类</text>

<rect x="340" y="370" width="750" height="130" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="360" y="398" font-size="14" fill="#111827" font-weight="700">奖励 = 奖励模型 RM 的分数 + RBRM 的额外奖励</text>
<text x="360" y="424" font-size="11" fill="#6b7280">有害子集上：落在 A 才给奖励。安全子集上：不拒绝才给奖励。</text>
<text x="360" y="444" font-size="11" fill="#6b7280">两路信号冲突时，改写一部分 RM 训练数据，并计算 RBRM 的最优权重。</text>
<text x="360" y="464" font-size="11" fill="#6b7280">SFT 里另混入展示期望拒绝风格的合成示范，方便 PPO 探索。</text>
<text x="360" y="484" font-size="11" fill="#6b7280">完整的拒绝风格 rubric 有 A 到 R 共 18 个选项，这里只画报告正文举的 4 类。</text>
<line x1="985" y1="316" x2="985" y2="368" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="440" y1="370" x2="440" y2="262" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="452" y="320" font-size="11" fill="#9ca3af">更新策略</text>
<text x="30" y="528" font-size="11" fill="#9ca3af">据 PDF p. 12–13、p. 62 与 System Card Figure 6（p. 63）、附录 A（p. 80–81）重画，是机制示意，不代表数据量或各路信号的权重。</text>
</svg>
