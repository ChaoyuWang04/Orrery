<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">100 页里，技术报告正文只有 14 页，System Card 占了 60 页</text>
<text x="30" y="54" font-size="13" fill="#6b7280">横条按页数等比画。绿 = 技术报告正文；黄 = 技术报告附录；紫 = System Card；灰 = 署名、致谢与参考文献；红 = 明确不公开的项目。</text>

<rect x="60" y="92" width="140" height="44" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="130" y="119" font-size="12" fill="#111827" text-anchor="middle">正文 p. 1–14</text>
<rect x="200" y="92" width="90" height="44" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="245" y="119" font-size="12" fill="#111827" text-anchor="middle">署名与文献</text>
<rect x="290" y="92" width="160" height="44" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="370" y="119" font-size="12" fill="#111827" text-anchor="middle">附录 A–G p. 24–39</text>
<rect x="450" y="92" width="10" height="44" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="460" y="92" width="290" height="44" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="605" y="119" font-size="12" fill="#111827" text-anchor="middle">System Card 正文 p. 41–69</text>
<rect x="750" y="92" width="90" height="44" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="795" y="119" font-size="12" fill="#111827" text-anchor="middle">致谢与文献</text>
<rect x="840" y="92" width="220" height="44" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="950" y="119" font-size="12" fill="#111827" text-anchor="middle">System Card 附录 p. 79–100</text>
<text x="60" y="154" font-size="11" fill="#9ca3af">p. 1</text>
<text x="1060" y="154" font-size="11" fill="#9ca3af" text-anchor="end">p. 100</text>

<line x1="130" y1="136" x2="155" y2="186" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="370" y1="136" x2="415" y2="186" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="605" y1="136" x2="675" y2="186" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="950" y1="136" x2="945" y2="186" stroke="#9ca3af" stroke-width="1.4"/>

<rect x="40" y="186" width="230" height="150" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="56" y="210" font-size="14" fill="#111827" font-weight="700">正文写了什么</text>
<text x="56" y="234" font-size="11" fill="#6b7280">p. 2 报告范围：只给一段话</text>
<text x="56" y="254" font-size="11" fill="#6b7280">p. 2–4 可预测扩展</text>
<text x="56" y="274" font-size="11" fill="#6b7280">p. 4–9 考试、学术基准、多语言、视觉</text>
<text x="56" y="294" font-size="11" fill="#6b7280">p. 10–11 限制：幻觉、截止日、校准</text>
<text x="56" y="314" font-size="11" fill="#6b7280">p. 11–14 风险与缓解、RBRM</text>

<rect x="300" y="186" width="230" height="150" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="316" y="210" font-size="14" fill="#111827" font-weight="700">附录补方法学</text>
<text x="316" y="234" font-size="11" fill="#6b7280">A 考试怎么出、怎么判、用哪个快照</text>
<text x="316" y="254" font-size="11" fill="#6b7280">B 基座对 RLHF 的选择题对照</text>
<text x="316" y="274" font-size="11" fill="#6b7280">C–D 污染检测口径与逐项污染率</text>
<text x="316" y="294" font-size="11" fill="#6b7280">E GSM-8K 训练集混进预训练</text>
<text x="316" y="314" font-size="11" fill="#6b7280">F 多语言 MMLU 构造；G 视觉示例</text>

<rect x="560" y="186" width="230" height="150" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="576" y="210" font-size="14" fill="#111827" font-weight="700">System Card 正文</text>
<text x="576" y="234" font-size="11" fill="#6b7280">early 对 launch 两个版本对照</text>
<text x="576" y="254" font-size="11" fill="#6b7280">12 类风险、50 多位外部专家红队</text>
<text x="576" y="274" font-size="11" fill="#6b7280">ARC 自主复制评估</text>
<text x="576" y="294" font-size="11" fill="#6b7280">模型层缓解与系统层安全</text>
<text x="576" y="314" font-size="11" fill="#6b7280">仍然有效的越狱、四条建议</text>

<rect x="820" y="186" width="260" height="150" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="836" y="210" font-size="14" fill="#111827" font-weight="700">System Card 附录：原始素材</text>
<text x="836" y="234" font-size="11" fill="#6b7280">三份 RBRM 指令全文</text>
<text x="836" y="254" font-size="11" fill="#6b7280">有害内容、偏见、虚假信息的完整输出</text>
<text x="836" y="274" font-size="11" fill="#6b7280">渗透测试用的 Go 代码</text>
<text x="836" y="294" font-size="11" fill="#6b7280">指令跟随评测图</text>
<text x="836" y="314" font-size="11" fill="#6b7280">化学品检索与采购工具链全程</text>

<rect x="40" y="370" width="1040" height="200" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="60" y="398" font-size="14" fill="#111827" font-weight="700">p. 2 的全部模型信息：写了四件事，明确拒绝六类</text>
<rect x="60" y="414" width="480" height="140" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="80" y="440" font-size="14" fill="#111827" font-weight="700">写了</text>
<text x="80" y="464" font-size="11" fill="#6b7280">Transformer 风格的模型</text>
<text x="80" y="484" font-size="11" fill="#6b7280">预训练目标：预测文档里的下一个 Token</text>
<text x="80" y="504" font-size="11" fill="#6b7280">数据：公开数据（如互联网数据）+ 第三方授权数据</text>
<text x="80" y="524" font-size="11" fill="#6b7280">后训练：RLHF</text>
<rect x="580" y="414" width="480" height="140" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="600" y="440" font-size="14" fill="#111827" font-weight="700">明确不给</text>
<text x="600" y="464" font-size="11" fill="#6b7280">架构，包括模型规模</text>
<text x="600" y="484" font-size="11" fill="#6b7280">硬件与训练算力</text>
<text x="600" y="504" font-size="11" fill="#6b7280">数据集构建与训练方法</text>
<text x="600" y="524" font-size="11" fill="#6b7280">「或类似内容」：理由是竞争格局与安全影响</text>
</svg>
