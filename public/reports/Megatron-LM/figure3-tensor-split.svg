<text x="30" y="628" font-size="11" fill="#9ca3af" text-anchor="start">一层 = 注意力块 + MLP 块：前向 2 次 g、反向 2 次 f，共 4 次 All-Reduce。LayerNorm 参数每卡一份副本。</text>
