<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">层内切分：一块两张矩阵乘，列切进、行切出，只在出口同步一次</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">以 2 张卡为例。紫 = 卡 1 上的分片，绿 = 卡 2 上的分片；黄 = 通信算子 f / g；灰 = 每张卡都持有同一份、各自重复计算的部分。</text>
<text x="30" y="73" font-size="13" fill="#6b7280" text-anchor="start">按论文 Figure 3（PDF p. 4）重画的机制示意；Figure 4（PDF p. 5）把同样两块串成一层。</text>
