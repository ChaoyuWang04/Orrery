<text x="30" y="404" font-size="13" fill="#6b7280">据 PDF p. 16 第 6.2.1 节的例子重画：训练 8 个 patch 的整数下标是 0–7，换到 16 个 patch 时 8–15 全部越界。</text>
<text x="30" y="428" font-size="13" fill="#6b7280">归一化坐标 (2i+1)/Hp − 1 让两种分辨率都落在 [−1, 1]，高、宽各自归一以保住长宽比。机制示意，不是实测。</text>
