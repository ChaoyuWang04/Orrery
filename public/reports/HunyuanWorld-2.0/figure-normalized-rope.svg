<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">归一化 RoPE：把「没见过的下标」变成「更密的采样」</text>
<text x="30" y="58" font-size="13" fill="#6b7280">灰 = 训练时见过的位置；红 = 测试时越界、训练里从没出现的位置；绿 = 归一化后落在同一区间 [−1, 1] 里的位置。</text>
<text x="30" y="98" font-size="14" fill="#111827" font-weight="700">WorldMirror 1.0：绝对整数下标</text>
