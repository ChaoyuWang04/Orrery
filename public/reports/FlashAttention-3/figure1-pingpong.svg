<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 1：两个 warpgroup 打乒乓，一个做 softmax 时另一个占着 Tensor Core</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">按 PDF p. 5 Figure 1 重画，是理想化的机制示意：三种块画成等宽，数字是迭代序号。论文说实际调度没有这么整齐。</text>
<text x="30.0" y="72.0" font-size="13" fill="#6b7280" text-anchor="start">绿 = WGMMA 矩阵乘（GEMM0 = QKᵀ，GEMM1 = PV）；黄 = softmax。两个 warpgroup 的先后由 bar.sync 屏障强制。</text>
