<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">推理时三条线各跑各的：慢的世界模型不拖住快的动作</text>
<text x="30" y="56" font-size="13" fill="#6b7280">黄 = 子任务文本；紫 = 世界模型生成子目标图；绿 = π0.7 一次推理出 50 步动作块；灰 = 机器人执行。</text>
<rect x="240" y="96" width="850" height="50" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="30" y="118" font-size="14" fill="#111827" font-weight="700">高层策略或人</text>
<text x="30" y="136" font-size="11" fill="#6b7280">输出下一句子任务</text>
<rect x="240" y="166" width="850" height="50" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="30" y="188" font-size="14" fill="#111827" font-weight="700">世界模型 BAGEL 14B</text>
<text x="30" y="206" font-size="11" fill="#6b7280">4 张 H100，一张子目标 1.25 秒</text>
<rect x="240" y="236" width="850" height="50" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="30" y="258" font-size="14" fill="#111827" font-weight="700">π0.7 VLA</text>
<text x="30" y="276" font-size="11" fill="#6b7280">单张 H100，一次 38–127 毫秒</text>
<rect x="240" y="306" width="850" height="50" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="30" y="328" font-size="14" fill="#111827" font-weight="700">机器人（50 Hz）</text>
<text x="30" y="346" font-size="11" fill="#6b7280">执行手上已有的动作块</text>
<rect x="250" y="106" width="203.5" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="353.8" y="125" font-size="11" fill="#111827" text-anchor="middle">子任务 A：打开空气炸锅</text>
<rect x="457.5" y="106" width="622.5" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="768.8" y="125" font-size="11" fill="#111827" text-anchor="middle">子任务 B：把红薯放进空气炸锅</text>
<rect x="250.0" y="176" width="129.7" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="314.8" y="195" font-size="11" fill="#111827" text-anchor="middle">子目标 1</text>
<rect x="457.5" y="176" width="129.7" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="522.3" y="195" font-size="11" fill="#111827" text-anchor="middle">子目标 2</text>
<rect x="1002.2" y="176" width="77.8" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="1041.1" y="195" font-size="11" fill="#111827" text-anchor="middle">子目标 3</text>
<line x1="593.2" y1="191" x2="996.2" y2="191" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="699.7" y="182" width="190" height="18" fill="#ffffff"/>
<text x="794.7" y="195" font-size="11" fill="#6b7280" text-anchor="middle">子任务没变，满 4 秒才重画</text>
<text x="262" y="265" font-size="11" fill="#9ca3af">先等首张子目标</text>
<rect x="379.7" y="246" width="12" height="30" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="431.6" y="246" width="12" height="30" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="483.4" y="246" width="12" height="30" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="535.3" y="246" width="12" height="30" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="587.2" y="246" width="12" height="30" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="639.1" y="246" width="12" height="30" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="690.9" y="246" width="12" height="30" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="742.8" y="246" width="12" height="30" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="794.7" y="246" width="12" height="30" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="846.6" y="246" width="12" height="30" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="898.4" y="246" width="12" height="30" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="950.3" y="246" width="12" height="30" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="1002.2" y="246" width="12" height="30" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="1054.1" y="246" width="12" height="30" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="393.7" y="316" width="686.3" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="736.8" y="335" font-size="11" fill="#111827" text-anchor="middle">一直在动：每块 50 步只执行前 15 或 25 步，下一块按 RTC 接上已执行的前缀</text>
<line x1="385.7" y1="206" x2="385.7" y2="244" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="463.5" y1="136" x2="463.5" y2="174" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="593.2" y1="206" x2="593.2" y2="244" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="393.7" y="229" font-size="11" fill="#9ca3af">首张子目标</text>
<text x="471.5" y="159" font-size="11" fill="#9ca3af">子任务一换，立刻重画</text>
<text x="601.2" y="229" font-size="11" fill="#9ca3af">新图到手，下一次推理就换用它；之前照用旧图</text>
<line x1="250" y1="378" x2="1080" y2="378" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="250.0" y1="378" x2="250.0" y2="384" stroke="#9ca3af" stroke-width="1.4"/>
