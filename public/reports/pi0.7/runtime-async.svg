<line x1="457.5" y1="378" x2="457.5" y2="384" stroke="#9ca3af" stroke-width="1.4"/>
<text x="457.5" y="400" font-size="11" fill="#6b7280" text-anchor="middle">2 秒</text>
<line x1="561.2" y1="378" x2="561.2" y2="384" stroke="#9ca3af" stroke-width="1.4"/>
<text x="561.2" y="400" font-size="11" fill="#6b7280" text-anchor="middle">3 秒</text>
<line x1="665.0" y1="378" x2="665.0" y2="384" stroke="#9ca3af" stroke-width="1.4"/>
<text x="665.0" y="400" font-size="11" fill="#6b7280" text-anchor="middle">4 秒</text>
<line x1="768.8" y1="378" x2="768.8" y2="384" stroke="#9ca3af" stroke-width="1.4"/>
<text x="768.8" y="400" font-size="11" fill="#6b7280" text-anchor="middle">5 秒</text>
<line x1="872.5" y1="378" x2="872.5" y2="384" stroke="#9ca3af" stroke-width="1.4"/>
<text x="872.5" y="400" font-size="11" fill="#6b7280" text-anchor="middle">6 秒</text>
<line x1="976.2" y1="378" x2="976.2" y2="384" stroke="#9ca3af" stroke-width="1.4"/>
<text x="976.2" y="400" font-size="11" fill="#6b7280" text-anchor="middle">7 秒</text>
<line x1="1080.0" y1="378" x2="1080.0" y2="384" stroke="#9ca3af" stroke-width="1.4"/>
<text x="1080.0" y="400" font-size="11" fill="#6b7280" text-anchor="middle">8 秒</text>
<text x="30" y="400" font-size="11" fill="#6b7280">时间</text>
<text x="30" y="432" font-size="11" fill="#9ca3af">机制示意，不是实测时间线：绿块每 0.5 秒一次按 Ĥ = 25 步、50 Hz 排布；子任务切换时刻为示意。</text>
<text x="30" y="452" font-size="11" fill="#9ca3af">依据 PDF p.7 算法 1 与第 VII 节、附录 D（PDF p.22–23）的延迟数字重画。</text>
</svg>