<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
<marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fa886"/></marker>
<marker id="aq" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9877a"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">一个 MoDA 块怎样读写深度流：注意力的 K、V 直接复用，FFN 另配一个轻量 KV 投影</text>
<text x="30" y="58" font-size="13" fill="#6b7280">紫 = 带参数的计算模块；黄 = 归一化；绿 = 深度流与它的读写路径；红虚线 = 试过但没有采用的写法；灰线 = 残差主干。</text>
<text x="40" y="200" font-size="14" fill="#111827" font-weight="700">X(l−1)</text>
<rect x="110" y="175" width="100" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="160" y="200" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">RMSNorm</text>
<rect x="270" y="165" width="210" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="375" y="192" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">MoDA 注意力</text>
<text x="375" y="209" font-size="11" fill="#6b7280" text-anchor="middle">序列 KV 与深度 KV 同一个 softmax</text>
<rect x="520" y="177" width="36" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="538" y="200" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">+</text>
<rect x="600" y="175" width="100" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="650" y="200" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">RMSNorm</text>
<rect x="760" y="165" width="140" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="830" y="192" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">FFN</text>
<text x="830" y="209" font-size="11" fill="#6b7280" text-anchor="middle">不变</text>
<rect x="940" y="177" width="36" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="958" y="200" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">+</text>
<text x="1000" y="200" font-size="14" fill="#111827" font-weight="700">X(l+1)</text>
<line x1="92" y1="195" x2="108" y2="195" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="210" y1="195" x2="268" y2="195" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="480" y1="195" x2="518" y2="195" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="556" y1="195" x2="598" y2="195" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="700" y1="195" x2="758" y2="195" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="900" y1="195" x2="938" y2="195" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="976" y1="195" x2="996" y2="195" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="98,195 98,120 538,120 538,175" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="578,195 578,120 958,120 958,175" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="318" y="112" font-size="11" fill="#9ca3af" text-anchor="middle">残差：原样读、相加写，历史被压进一个 T×D 张量</text>
<text x="768" y="112" font-size="11" fill="#9ca3af" text-anchor="middle">残差</text>
<rect x="30" y="380" width="1060" height="54" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="560" y="403" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">深度流：前面每个子层在每个位置写下的一对 K、V</text>
<text x="560" y="422" font-size="11" fill="#6b7280" text-anchor="middle">只追加、不相加；后面每一层的 MoDA 按位置取自己那一列</text>
<line x1="455" y1="380" x2="455" y2="227" stroke="#5fa886" stroke-width="1.4" marker-end="url(#ag)"/>
<text x="463" y="270" font-size="11" fill="#5fa886">读</text>
<line x1="300" y1="227" x2="300" y2="378" stroke="#5fa886" stroke-width="1.4" marker-end="url(#ag)"/>
<text x="310" y="265" font-size="11" fill="#5fa886">写：本层注意力的 K、V</text>
<text x="310" y="281" font-size="11" fill="#6b7280">直接复用，零新增参数</text>
<text x="310" y="297" font-size="11" fill="#9ca3af">Table 3 行 3</text>
<rect x="760" y="280" width="140" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="830" y="307" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">线性 KV 投影</text>
<polyline points="730,195 730,302 758,302" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="830" y1="324" x2="830" y2="378" stroke="#5fa886" stroke-width="1.4" marker-end="url(#ag)"/>
<text x="912" y="296" font-size="11" fill="#5fa886">写：把 FFN 的输入</text>
<text x="912" y="312" font-size="11" fill="#5fa886">投成一对 K、V</text>
<text x="912" y="328" font-size="11" fill="#9ca3af">Table 3 行 4，默认配方</text>
<rect x="36" y="280" width="176" height="44" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-dasharray="5 4"/>
<text x="124" y="307" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">注意力侧独立 KV 投影</text>
<polyline points="240,195 240,262 124,262 124,278" fill="none" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#aq)"/>
<line x1="124" y1="324" x2="124" y2="378" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#aq)"/>
<text x="134" y="344" font-size="11" fill="#d9877a">Table 3 行 5</text>
<text x="134" y="360" font-size="11" fill="#d9877a">收益接近饱和，未采用</text>
<rect x="30" y="452" width="1060" height="130" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="50" y="480" font-size="13" fill="#6b7280">读：深度 KV 用本层现成的 Query 去打分，不另设深度 Query 投影，所以参数增长只有分组后的 K、V 投影（PDF p. 5）。</text>
<text x="50" y="504" font-size="13" fill="#6b7280">写：注意力子层把本层的 K、V 追加进深度流；FFN 子层没有 K、V，靠一个轻量线性投影把它的输入变成一对（PDF p. 5、p. 10）。</text>
<text x="50" y="528" font-size="13" fill="#6b7280">残差主干一条没改。MoDA 是在残差之外，再给每一层开一条能按内容取回历史的旁路。</text>
<text x="50" y="560" font-size="11" fill="#9ca3af">按 PDF p. 1 Figure 1 左幅、p. 4 Figure 3(d) 与 p. 10 Table 3 的变体定义重画，是结构示意；三种写法的参数、FLOPs 与效果见正文 Table 3。</text>
</svg>