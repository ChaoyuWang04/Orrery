<text x="130" y="392" font-size="11" fill="#9ca3af">序列候选数随位置增长，深度候选数随层号增长</text>
<text x="670" y="392" font-size="11" fill="#9ca3af">绿色那一列只取同一位置，不去看别的位置的历史层</text>
<rect x="30" y="434" width="1060" height="146" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="50" y="462" font-size="14" fill="#111827" font-weight="700">和普通因果注意力、以及残差流比</text>
<text x="50" y="488" font-size="13" fill="#6b7280">普通因果注意力：只有紫色那一行。前面各层的信息只能通过残差流 X 间接到达，而 X 是层层相加后的一个 T×D 张量。</text>
<text x="50" y="512" font-size="13" fill="#6b7280">MoDA：再加上绿色那一列。它们是前面各层在这个位置写下的 K、V 原件，没有被后续相加冲淡，每个头按内容决定取多少。</text>
<text x="50" y="536" font-size="13" fill="#6b7280">紫与绿的打分放在同一个 softmax 里归一化，彼此争同一份概率，而不是两路各自算完再固定加权。</text>
<text x="50" y="564" font-size="11" fill="#9ca3af">按 PDF p. 1 Figure 1 右幅重画的机制示意；原图画到第 L−1 层与 T 个位置，这里只画 6 层 10 个位置。原图左幅里 FFN 也经一个线性投影写出一对深度 KV。</text>
</svg>