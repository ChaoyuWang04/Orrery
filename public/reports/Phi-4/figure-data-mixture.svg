<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="480" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">预训练配比：合成数据只有 290B，却被读了 13.8 遍</text>
<text x="30" y="54" font-size="13" fill="#6b7280">灰条 = 训练中实际读到的 Token；色条 = 这类来源的唯一 Token。紫 = 合成类，绿 = 有机类，黄 = 代码（合成与原始代码混合）。</text>
<text x="40" y="108" font-size="14" fill="#111827" font-weight="700">网页</text>
<text x="40" y="126" font-size="11" fill="#6b7280">占训练 Token 15%</text>
<rect x="300" y="92" width="262.5" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="300" y="92" width="227.5" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="574.5" y="111" font-size="14" fill="#111827" font-weight="700">1.2 遍</text>
<text x="300" y="136" font-size="11" fill="#6b7280">唯一 1.3T，读到约 1.5T</text>
<text x="40" y="172" font-size="14" fill="#111827" font-weight="700">网页改写</text>
<text x="40" y="190" font-size="11" fill="#6b7280">占训练 Token 15%</text>
<rect x="300" y="156" width="262.5" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="300" y="156" width="50.8" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="574.5" y="175" font-size="14" fill="#111827" font-weight="700">5.2 遍</text>
<text x="300" y="200" font-size="11" fill="#6b7280">唯一 290B，读到约 1.5T</text>
<text x="40" y="236" font-size="14" fill="#111827" font-weight="700">合成</text>
<text x="40" y="254" font-size="11" fill="#6b7280">占训练 Token 40%</text>
<rect x="300" y="220" width="700.0" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="300" y="220" width="50.8" height="28" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="1012.0" y="239" font-size="14" fill="#111827" font-weight="700">13.8 遍</text>
<text x="300" y="264" font-size="11" fill="#6b7280">唯一 290B，读到约 4T</text>
<text x="40" y="300" font-size="14" fill="#111827" font-weight="700">代码</text>
<text x="40" y="318" font-size="11" fill="#6b7280">占训练 Token 20%</text>
<rect x="300" y="284" width="350.0" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="300" y="284" width="143.5" height="28" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="662.0" y="303" font-size="14" fill="#111827" font-weight="700">2.4 遍</text>
<text x="300" y="328" font-size="11" fill="#6b7280">唯一 820B，读到约 2T</text>
<text x="40" y="364" font-size="14" fill="#111827" font-weight="700">采买来源</text>
<text x="40" y="382" font-size="11" fill="#6b7280">占训练 Token 10%</text>
<rect x="300" y="348" width="175.0" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="300" y="348" width="101.5" height="28" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="487.0" y="367" font-size="14" fill="#111827" font-weight="700">1.7 遍</text>
<text x="300" y="392" font-size="11" fill="#6b7280">唯一 580B，读到约 1T</text>
<text x="30" y="424" font-size="13" fill="#6b7280">据 PDF p. 10 Table 5 重画。遍数与唯一 Token 是报告原值；灰条长度按「占比 × 约 10T」换算（10T 见 PDF p. 7），是本文乘法。</text>
<text x="30" y="448" font-size="13" fill="#6b7280">网页改写按报告脚注属于合成数据的子类（PDF p. 9）；合成与网页改写合计占 55%。</text>
</svg>