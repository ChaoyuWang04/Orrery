<text x="672.0" y="194" font-size="11" fill="#6b7280" text-anchor="middle">t10</text>
<rect x="702" y="178" width="52" height="24" rx="4" fill="#ffffff" stroke="#cbd2d9"/>
<text x="728.0" y="194" font-size="11" fill="#6b7280" text-anchor="middle">t11</text>
<rect x="758" y="178" width="52" height="24" rx="4" fill="#ffffff" stroke="#cbd2d9"/>
<text x="784.0" y="194" font-size="11" fill="#6b7280" text-anchor="middle">t12</text>
