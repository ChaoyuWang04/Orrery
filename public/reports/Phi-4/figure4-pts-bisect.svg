<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">PTS 的二分：平的段整段跳过，只往答对概率跳变的那段里钻</text>
<text x="30" y="54" font-size="13" fill="#6b7280">黑线 = 走到该 Token 后的答对概率；黄 = 两端差值够大、继续切；灰 = 差值小于阈值、停下；红 = 找到的枢轴 Token。</text>
<text x="40" y="88" font-size="11" fill="#9ca3af">答对概率 1</text>
<text x="40" y="168" font-size="11" fill="#9ca3af">答对概率 0</text>
