<text x="870" y="120" font-size="13" fill="#111827" text-anchor="start" font-weight="700">读图的三件事</text>
<text x="870" y="146" font-size="11" fill="#6b7280" text-anchor="start">1. 从上往下 s 越来越大，每条线整体下移：</text>
<text x="870" y="166" font-size="11" fill="#6b7280" text-anchor="start">   同样的激活参数，总参数越多交叉熵越低。</text>
<text x="870" y="186" font-size="11" fill="#6b7280" text-anchor="start">2. 每条线的最低点都落在黄带里，</text>
<text x="870" y="206" font-size="11" fill="#6b7280" text-anchor="start">   s 从 2 加到 64，最优 g 几乎不动。</text>
<text x="870" y="226" font-size="11" fill="#6b7280" text-anchor="start">3. 右端 g = 1（每个 Token 只走 1 位专家）</text>
<text x="870" y="246" font-size="11" fill="#6b7280" text-anchor="start">   s = 2、4、16 三条线都明显回升。</text>
<text x="870" y="266" font-size="11" fill="#6b7280" text-anchor="start">另：s = 1 的红线整条在稠密线之上，</text>
<text x="870" y="286" font-size="11" fill="#6b7280" text-anchor="start">   只把 FFN 切细、不加参数，比稠密更差。</text>
<text x="800" y="181.2" font-size="11" fill="#9ca3af" text-anchor="start">稠密</text>
<text x="30" y="540" font-size="11" fill="#9ca3af" text-anchor="start">数值为我们从 PDF p. 5 Figure 2(b) 右列逐点读出的近似值，误差约 ±0.005；原图 s = 8 与 s = 32、64 在 g = 1 处没有数据点。</text>
</svg>