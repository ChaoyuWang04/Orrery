<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" width="1120" height="510" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="510" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">一步训练里通信落在哪：前两级仍是 2Ψ，第三级多拼一次参数</text>
<text x="30" y="54" font-size="13" fill="#6b7280">灰 = 计算；紫 = 参数通信（All-Gather / Broadcast）；黄 = 梯度通信（All-Reduce / Reduce-Scatter）。块宽只示意先后，不是实测时间。</text>
<text x="360.0" y="88" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">前向：层 1 → L</text>
<text x="630.0" y="88" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">反向：层 L → 1</text>
<text x="830.0" y="88" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">更新</text>
<text x="920.0" y="88" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">下一步前</text>
<text x="1040" y="88" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">每卡通信量</text>
<line x1="475" y1="98" x2="475" y2="428" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="785" y1="98" x2="785" y2="428" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="875" y1="98" x2="875" y2="428" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="970" y1="98" x2="970" y2="428" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="250" y="114" width="220" height="26" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="480" y="114" width="300" height="26" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="790" y="114" width="80" height="26" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="600" y="148" width="180" height="26" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="360" y="131" font-size="11" fill="#111827" text-anchor="middle">前向</text>
<text x="540" y="131" font-size="11" fill="#111827" text-anchor="middle">反向</text>
<text x="830" y="131" font-size="11" fill="#111827" text-anchor="middle">全量更新</text>
<text x="690" y="165" font-size="11" fill="#111827" text-anchor="middle">All-Reduce 梯度</text>
<text x="30" y="122" font-size="14" fill="#111827" font-weight="700">基线数据并行</text>
<text x="30" y="140" font-size="11" fill="#6b7280">每卡一份完整模型状态</text>
<text x="250" y="196" font-size="11" fill="#9ca3af">梯度分桶，与反向重叠；All-Reduce 本身就是 Reduce-Scatter Ψ + All-Gather Ψ</text>
<text x="1040" y="148" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">2Ψ</text>
<rect x="250" y="229" width="220" height="26" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="480" y="229" width="300" height="26" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="790" y="229" width="80" height="26" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="600" y="263" width="180" height="26" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="880" y="263" width="80" height="26" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="360" y="246" font-size="11" fill="#111827" text-anchor="middle">前向</text>
<text x="540" y="246" font-size="11" fill="#111827" text-anchor="middle">反向</text>
<text x="830" y="246" font-size="11" fill="#111827" text-anchor="middle">更新 1/N_d</text>
<text x="690" y="280" font-size="11" fill="#111827" text-anchor="middle">Reduce-Scatter 梯度 Ψ</text>
<text x="920" y="280" font-size="11" fill="#111827" text-anchor="middle">All-Gather Ψ</text>
<text x="30" y="237" font-size="14" fill="#111827" font-weight="700">P_os+g</text>
<text x="30" y="255" font-size="11" fill="#6b7280">切优化器状态与梯度</text>
<text x="250" y="311" font-size="11" fill="#9ca3af">梯度只归约到负责那一段的卡上，归约完就释放；更新完再把新参数拼回每张卡</text>
<text x="1040" y="263" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">2Ψ</text>
<text x="1040" y="281" font-size="11" fill="#6b7280" text-anchor="middle">与基线相同</text>
<rect x="250" y="378" width="12" height="26" rx="2" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="264" y="344" width="38" height="26" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="305" y="378" width="12" height="26" rx="2" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="319" y="344" width="38" height="26" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="360" y="378" width="12" height="26" rx="2" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="374" y="344" width="38" height="26" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="415" y="378" width="12" height="26" rx="2" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="429" y="344" width="38" height="26" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="480" y="378" width="12" height="26" rx="2" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="494" y="344" width="40" height="26" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="536" y="378" width="12" height="26" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="555" y="378" width="12" height="26" rx="2" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="569" y="344" width="40" height="26" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="611" y="378" width="12" height="26" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="630" y="378" width="12" height="26" rx="2" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="644" y="344" width="40" height="26" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="686" y="378" width="12" height="26" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="705" y="378" width="12" height="26" rx="2" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="719" y="344" width="40" height="26" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="761" y="378" width="12" height="26" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="790" y="344" width="80" height="26" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="830" y="361" font-size="11" fill="#111827" text-anchor="middle">更新 1/N_d</text>
<text x="920" y="395" font-size="11" fill="#9ca3af" text-anchor="middle">无需再拼</text>
<text x="30" y="352" font-size="14" fill="#111827" font-weight="700">P_os+g+p</text>
<text x="30" y="370" font-size="11" fill="#6b7280">参数也只常驻 1/N_d</text>
<text x="250" y="426" font-size="11" fill="#9ca3af">前向每层用前拼一次、用完即丢（Ψ）；反向按相反顺序再拼一次（Ψ）；梯度仍 Reduce-Scatter（Ψ）</text>
<text x="1040" y="378" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">3Ψ</text>
<text x="1040" y="396" font-size="11" fill="#6b7280" text-anchor="middle">基线的 1.5 倍</text>
<rect x="16" y="440" width="1088" height="56" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36" y="464" font-size="13" fill="#6b7280">依据 PDF p. 13–14 第 7 节。Ψ 为参数个数，通信量按每卡收发的元素数计。</text>
<text x="36" y="484" font-size="13" fill="#6b7280">原文第三级由拥有该段参数的进程 Broadcast 给其他进程，体积与 All-Gather 相同；这里按论文的等价说法画成拼参数。</text>
</svg>
