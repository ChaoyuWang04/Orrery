<text x="260" y="482" font-size="11" fill="#6b7280" text-anchor="start">每个孩子分到 C′/8 个通道，再按组复制成 C 个通道（图中只画两格）；上采样前先预测八位掩码 ρ̂，判为空的孩子直接跳过，省下时间与显存。</text>
<text x="30" y="540" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 5 式 4–5、Figure 4 与早剪枝一段重画；消融数字见 p. 8 Table 3。三维里 2 倍下采样时，一个粗体素恰好对应 8 个子体素。</text>
<text x="30" y="564" font-size="13" fill="#9ca3af" text-anchor="start">这条捷径没有参数，只负责把信息搬到通道上；真正的变换仍由稀疏卷积加宽逐点 MLP 的残差块完成。</text>
