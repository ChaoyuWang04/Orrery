<text x="744.0" y="215.4" font-size="11" fill="#5fa886" text-anchor="middle">内腔保留</text>
<text x="945.6" y="145.2" font-size="11" fill="#5fa886" text-anchor="middle">开口薄片保留</text>
<text x="30" y="468" font-size="13" fill="#6b7280" text-anchor="start">左：符号只在「里外交界」处变化。被外壳包住的内腔墙两侧都算里面，开口薄片两侧都算外面，两处都没有符号翻转，也就抽不出面。</text>
<text x="30" y="492" font-size="13" fill="#6b7280" text-anchor="start">右：网格三角面直接和格子棱求交，得到交点与法向（Hermite 数据）。每个被切到的格子放一个对偶顶点，相邻顶点跨过被切的棱连起来。</text>
<text x="30" y="516" font-size="13" fill="#6b7280" text-anchor="start">三维里，一条被切开的棱对应一张四边形，再按剖分权重切成两个三角形；每个活跃体素存对偶顶点、X/Y/Z 三条棱的相交标志和剖分权重。</text>
<text x="30" y="556" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 3 Figure 3 与 p. 3–4 §3.1.1 自绘的机制示意，不是论文的样例。左栏是等值面场的一般做法；论文只写了它对开放面、非流形、封闭内腔受限，没有画这张对照。</text>
<text x="30" y="580" font-size="13" fill="#9ca3af" text-anchor="start">图中对偶顶点按交点均值近似摆放；论文的做法是解带平面项、边界项与正则项的 QEF（式 2）。</text>
</svg>
