<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">同一组表面：按里外符号抽，还是按「哪条棱被切开」抽</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">二维示意。绿 = 最终抽出的表面；红虚线 = 抽不出来的表面；灰点 = 被判为「里面」的格点；黄 = 被表面切开的格子棱；紫点 = 对偶顶点。</text>
<text x="40" y="90" font-size="14" fill="#111827" text-anchor="start" font-weight="700">等值面场：先给每个格点定里外</text>
<text x="40" y="108" font-size="11" fill="#6b7280" text-anchor="start">洪水填充从外面灌进来，灌不到的都算「里面」</text>
