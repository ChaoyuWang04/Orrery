<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">两本账：池子里有没有对的，法官选没选中</text>
<text x="30" y="54" font-size="13" fill="#6b7280">灰 = 最强成员；黄 = 线性化；红 = 路由上界（红虚线同值）；紫 = SAT 覆盖率；绿 = SAT 准确率。数值是各队全部 benchmark 的平均（%），据 Table 1–2（PDF p. 8–9）重画。</text>
<text x="30" y="92" font-size="14" fill="#111827" font-weight="700">数学与物理队（5 个 benchmark）：准确率越过了路由上界</text>
<text x="228" y="126" font-size="13" fill="#111827" text-anchor="end">最强成员</text>
<rect x="240" y="110" width="370.9" height="22" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.2"/>
<text x="618.9" y="126" font-size="13" fill="#111827" font-weight="700">48.8</text>
<text x="228" y="158" font-size="13" fill="#111827" text-anchor="end">线性化（最强成员一人演完）</text>
<rect x="240" y="142" width="446.1" height="22" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.2"/>
<text x="694.1" y="158" font-size="13" fill="#111827" font-weight="700">58.7</text>
<text x="228" y="190" font-size="13" fill="#111827" text-anchor="end">路由上界覆盖率</text>
<rect x="240" y="174" width="448.4" height="22" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1.2"/>
<text x="696.4" y="190" font-size="13" fill="#111827" font-weight="700">59.0</text>
<text x="228" y="222" font-size="13" fill="#111827" text-anchor="end">SAT 覆盖率（池子里有对的）</text>
<rect x="240" y="206" width="571.5" height="22" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.2"/>
<text x="819.5" y="222" font-size="13" fill="#111827" font-weight="700">75.2</text>
<text x="228" y="254" font-size="13" fill="#111827" text-anchor="end">SAT 准确率（法官选完）</text>
<rect x="240" y="238" width="506.9" height="22" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.2"/>
<text x="754.9" y="254" font-size="13" fill="#111827" font-weight="700">66.7</text>
<line x1="688.4" y1="104" x2="688.4" y2="264" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="240" y="284" font-size="12" fill="#6b7280">绿柱在红虚线右边 7.7 个点：有些题三名成员单独都没做对，团队做对了。紫与绿之差 8.5 个点是选择损失。</text>
<text x="30" y="330" font-size="14" fill="#111827" font-weight="700">知识与逻辑队（3 个 benchmark）：生成越过了上界，选择没守住</text>
<text x="228" y="364" font-size="13" fill="#111827" text-anchor="end">最强成员</text>
<rect x="240" y="348" width="500.8" height="22" rx="4" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.2"/>
<text x="748.8" y="364" font-size="13" fill="#111827" font-weight="700">65.9</text>
<text x="228" y="396" font-size="13" fill="#111827" text-anchor="end">线性化（最强成员一人演完）</text>
<rect x="240" y="380" width="548.0" height="22" rx="4" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.2"/>
<text x="796.0" y="396" font-size="13" fill="#111827" font-weight="700">72.1</text>
<text x="228" y="428" font-size="13" fill="#111827" text-anchor="end">路由上界覆盖率</text>
<rect x="240" y="412" width="605.0" height="22" rx="4" fill="#fbe9e7" stroke="#d9877a" stroke-width="1.2"/>
<text x="853.0" y="428" font-size="13" fill="#111827" font-weight="700">79.6</text>
<text x="228" y="460" font-size="13" fill="#111827" text-anchor="end">SAT 覆盖率（池子里有对的）</text>
<rect x="240" y="444" width="668.0" height="22" rx="4" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.2"/>
<text x="916.0" y="460" font-size="13" fill="#111827" font-weight="700">87.9</text>
<text x="228" y="492" font-size="13" fill="#111827" text-anchor="end">SAT 准确率（法官选完）</text>
<rect x="240" y="476" width="553.3" height="22" rx="4" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.2"/>
<text x="801.3" y="492" font-size="13" fill="#111827" font-weight="700">72.8</text>
<line x1="845.0" y1="342" x2="845.0" y2="502" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="240" y="522" font-size="12" fill="#6b7280">紫柱在红虚线右边 8.3 个点，绿柱却落回左边 6.8 个点：选择损失 15.1 个点，把生成侧的领先全吃掉了。</text>
</svg>
