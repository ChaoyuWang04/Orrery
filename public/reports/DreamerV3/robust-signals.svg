<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
  <text x="40" y="38" font-size="19" font-weight="700" fill="#111827">两个让梯度不跟着信号尺度走的小机关</text>
  <text x="40" y="62" font-size="13" fill="#6b7280">紫色是 DreamerV3 的做法，红色是对照做法，灰色是坐标与标注；图中数字都是示意用的假设值</text>

  <!-- Panel A -->
  <rect x="30" y="80" width="520" height="375" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="46" y="106" font-size="14" font-weight="700" fill="#111827">左：actor 的回报归一化只缩大回报</text>

  <!-- axes -->
  <line x1="100" y1="130" x2="100" y2="370" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="100" y1="370" x2="515" y2="370" stroke="#9ca3af" stroke-width="1.4"/>
  <!-- y ticks -->
  <g font-size="11" fill="#9ca3af" text-anchor="end">
    <text x="94" y="134">100</text>
    <text x="94" y="182">10</text>
    <text x="94" y="230">1</text>
    <text x="94" y="278">0.1</text>
    <text x="94" y="326">0.01</text>
    <text x="94" y="374">0.001</text>
  </g>
  <!-- x ticks -->
  <g font-size="11" fill="#9ca3af" text-anchor="middle">
    <text x="100" y="386">0.01</text>
    <text x="182" y="386">0.1</text>
    <text x="264" y="386">1</text>
    <text x="346" y="386">10</text>
    <text x="428" y="386">100</text>
    <text x="510" y="386">1000</text>
  </g>
  <line x1="264" y1="130" x2="264" y2="370" stroke="#eeeeee" stroke-width="1"/>
  <text x="305" y="404" font-size="11" fill="#6b7280" text-anchor="middle">回报范围 S（第 95 与第 5 百分位回报之差，对数轴）</text>
  <text x="106" y="122" font-size="11" fill="#6b7280">纵轴：优势被乘上的倍数（对数轴）</text>

  <!-- curves -->
  <line x1="100" y1="130" x2="510" y2="370" stroke="#d9877a" stroke-width="2" stroke-dasharray="6 4"/>
  <polyline points="100,226 264,226 510,370" fill="none" stroke="#8f8bd8" stroke-width="3"/>

  <!-- annotations -->
  <text x="290" y="150" font-size="11" fill="#d9877a">直接除以 S：S = 0.01 时噪声被放大 100 倍</text>
  <text x="112" y="252" font-size="11" fill="#6b7280">S &lt; 1 时分母钉在 1</text>
  <text x="112" y="268" font-size="11" fill="#6b7280">小回报原样保留，熵正则仍占上风</text>
  <text x="112" y="346" font-size="11" fill="#6b7280">S &gt; 1 时两条线重合，大回报被压回约 [0, 1]</text>

  <!-- legend -->
  <line x1="110" y1="428" x2="140" y2="428" stroke="#8f8bd8" stroke-width="3"/>
  <text x="148" y="432" font-size="11" fill="#6b7280">DreamerV3：除以 max(1, S)</text>
  <line x1="320" y1="428" x2="350" y2="428" stroke="#d9877a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="358" y="432" font-size="11" fill="#6b7280">对照：直接除以 S</text>

  <!-- Panel B -->
  <rect x="570" y="80" width="520" height="375" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <text x="586" y="106" font-size="14" font-weight="700" fill="#111827">右：奖励与价值改成在指数分箱上做分类</text>
  <text x="586" y="132" font-size="11" fill="#6b7280">网络给每个箱子输出一个概率；训练目标只在夹住 y 的两个箱子上非零，</text>
  <text x="586" y="148" font-size="11" fill="#6b7280">权重按离哪个箱子更近线性分配。损失是交叉熵，梯度与 y 的量级无关。</text>
  <text x="586" y="176" font-size="11" fill="#6b7280">读出：ŷ = 0.30 × 1.72 + 0.70 × 6.39 ≈ 5.0</text>

  <!-- bars -->
  <rect x="624.6" y="285" width="30" height="45" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="639.6" y="278" font-size="11" fill="#6b7280" text-anchor="middle">0.30</text>
  <rect x="732" y="225" width="30" height="105" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
  <text x="747" y="218" font-size="11" fill="#6b7280" text-anchor="middle">0.70</text>

  <!-- target -->
  <line x1="715" y1="240" x2="715" y2="330" stroke="#111827" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="708" y="250" font-size="11" fill="#111827" text-anchor="end">目标 y = 5</text>

  <!-- raw axis -->
  <line x1="600" y1="330" x2="1060" y2="330" stroke="#9ca3af" stroke-width="1.4"/>
  <circle cx="600" cy="330" r="4" fill="#8f8bd8"/>
  <circle cx="639.6" cy="330" r="4" fill="#8f8bd8"/>
  <circle cx="747" cy="330" r="4" fill="#8f8bd8"/>
  <circle cx="1039" cy="330" r="4" fill="#8f8bd8"/>
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="600" y="348">0</text>
    <text x="639.6" y="348">1.72</text>
    <text x="747" y="348">6.39</text>
    <text x="1039" y="348">19.1</text>
  </g>
  <text x="1060" y="308" font-size="11" fill="#9ca3af" text-anchor="end">原始数值轴：箱子越往外越稀</text>

  <!-- mapping -->
  <g stroke="#cbd2d9" stroke-width="1">
    <line x1="600" y1="356" x2="600" y2="384"/>
    <line x1="639.6" y1="356" x2="700" y2="384"/>
    <line x1="747" y1="356" x2="800" y2="384"/>
    <line x1="1039" y1="356" x2="900" y2="384"/>
  </g>
  <line x1="600" y1="390" x2="920" y2="390" stroke="#9ca3af" stroke-width="1.4"/>
  <circle cx="600" cy="390" r="4" fill="#8f8bd8"/>
  <circle cx="700" cy="390" r="4" fill="#8f8bd8"/>
  <circle cx="800" cy="390" r="4" fill="#8f8bd8"/>
  <circle cx="900" cy="390" r="4" fill="#8f8bd8"/>
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="600" y="408">0</text>
    <text x="700" y="408">1</text>
    <text x="800" y="408">2</text>
    <text x="900" y="408">3</text>
  </g>
  <text x="586" y="434" font-size="11" fill="#9ca3af">symlog 坐标：箱子等距。原文用 symexp([−20 … +20]) 生成箱子，没写箱子个数</text>
</svg>
