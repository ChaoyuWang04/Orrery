<text x="720" y="388" font-size="11" fill="#6b7280" text-anchor="start">每帧一个 logit，一次可判别多种时长。</text>
<text x="30" y="430" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 4 Figure 1 与 §2.1–2.2 重画，是机制示意，不是实测时间。原图里文本 token 也是两边的输入，这里省略；「KV」箭头表示后一步复用前一步的缓存。</text>
<text x="30" y="452" font-size="13" fill="#6b7280" text-anchor="start">原图把三步画在同一个生成器框里，这里按时间拆成三行，好看清回收路径。</text>
