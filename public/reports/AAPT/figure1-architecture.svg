<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 1：生成器一次前向出一帧并把它回收，判别器同一套结构、逐帧给分</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">绿 = 用户给的第 0 帧；紫 = 模型生成的帧（输出后回收为下一步输入）；黄 = 交互条件；灰 = 噪声；空心框 = 网络与它输出的分数。</text>
