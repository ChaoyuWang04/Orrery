<text x="40" y="366" font-size="11" fill="#6b7280" text-anchor="start">第 1 步用用户给的第 0 帧；之后每一步把上一步的输出拼进通道，不再重算过去。</text>
<text x="40" y="384" font-size="11" fill="#6b7280" text-anchor="start">视觉 token 最多看过去 N 帧，并始终看文本和第 0 帧（滑窗），所以速度与显存不随时长增长。</text>
