<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 2：同样一步、同样有 KV cache，扩散 forcing 每步算两帧，AAPT 只算一帧</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = 已经生成的帧；灰 = 当前步的噪声；虚线框 = 已在 KV cache 里、本步不再计算的历史；括号 = 本步真正进入前向计算的 token。</text>
<text x="30" y="128" font-size="14" fill="#111827" text-anchor="start" font-weight="700">一步扩散 forcing</text>
<text x="30" y="148" font-size="11" fill="#6b7280" text-anchor="start">上一帧作为干净帧</text>
<text x="30" y="164" font-size="11" fill="#6b7280" text-anchor="start">重新进入计算</text>
<text x="30" y="288" font-size="14" fill="#111827" text-anchor="start" font-weight="700">AAPT（回收输入）</text>
<text x="30" y="308" font-size="11" fill="#6b7280" text-anchor="start">上一帧沿通道拼到</text>
