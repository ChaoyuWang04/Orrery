<text x="30" y="400" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 4 Figure 2 与 p. 5 正文重画；原图第 1 步的上一帧是用户给的第 0 帧（绿）。这是计算量示意，不是墙钟实测，墙钟数字见 Table 4。</text>
<text x="30" y="422" font-size="13" fill="#6b7280" text-anchor="start">原文只说扩散 forcing 带 KV cache 时每步要在两帧上计算、AAPT 只要一帧，没有给出实测的 2 倍。</text>
