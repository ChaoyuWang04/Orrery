<text x="592" y="288" font-size="11" fill="#6b7280" text-anchor="start">生成器只拿真的第一帧，之后每步回收自己刚生成的帧，</text>
<text x="592" y="306" font-size="11" fill="#6b7280" text-anchor="start">带 KV cache 逐步前向，与推理完全一致；判别器一次看完。</text>
<text x="592" y="324" font-size="11" fill="#6b7280" text-anchor="start">O3 建在 O2 之上。过去帧这条输入断开梯度，</text>
<text x="592" y="342" font-size="11" fill="#6b7280" text-anchor="start">梯度仍可沿 KV cache 回流，更新全部参数。</text>
<text x="30" y="392" font-size="13" fill="#6b7280" text-anchor="start">(a) 据 PDF p. 18 Figure 8 与附录 D 重画；(b) 按 p. 5 §2.2 与附录 D 的文字画出，原文没有对应的图。</text>
<text x="30" y="414" font-size="13" fill="#6b7280" text-anchor="start">推理时 (a) 训出的模型几帧之后就开始漂（Figure 7），(b) 才是论文采用的接法。</text>
