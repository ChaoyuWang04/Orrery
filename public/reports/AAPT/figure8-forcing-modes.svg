<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 8：对抗训练的两种接法——教师强制与学生强制</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">绿 = 真视频的帧 I；紫 = 生成器输出的帧 O；空心框 = 网络与判别器给出的 logit L。</text>
