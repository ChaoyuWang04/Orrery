<text x="40" y="288" font-size="11" fill="#6b7280" text-anchor="start">生成器吃真帧 I1、I2、I3，并行吐出彼此独立的 O2、O3、O4：</text>
<text x="40" y="306" font-size="11" fill="#6b7280" text-anchor="start">O3 只和 I2 有关，和 O2 无关。判别器必须按各自的依赖分三次评，</text>
<text x="40" y="324" font-size="11" fill="#6b7280" text-anchor="start">用真视频的 KV cache 看真实的过去帧（因果结构让重复计算可省）。</text>
<text x="40" y="342" font-size="11" fill="#6b7280" text-anchor="start">训练时历史永远是真的，推理时却是自己生成的。</text>
