<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
<marker id="arp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8f8bd8"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">长视频训练：生成器一口气往后写，判别器按 10 秒一段去看</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = 生成器用学生强制写出的长视频；黄 = 交给判别器的 10 秒段（相邻段重叠 1 秒）；绿 = 数据集里的真视频；红 = 生成器每写完一段、把 KV cache 断开梯度的位置。</text>
<rect x="80" y="96" width="960" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="560.0" y="118.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">生成器按推理方式续写：本例 10 + 5 × (10 − 1) = 55 秒</text>
<rect x="80.0" y="160" width="174.5" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="167.25" y="182.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">段 1：0–10 秒</text>
<rect x="237.1" y="206" width="174.50000000000003" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="324.35" y="228.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">段 2：9–19 秒</text>
<rect x="394.2" y="160" width="174.50000000000006" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="481.45000000000005" y="182.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">段 3：18–28 秒</text>
<rect x="551.3" y="206" width="174.5" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="638.55" y="228.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">段 4：27–37 秒</text>
<rect x="708.4" y="160" width="174.5" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="795.65" y="182.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">段 5：36–46 秒</text>
<rect x="865.5" y="206" width="174.5" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="952.75" y="228.32" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">段 6：45–55 秒</text>
<line x1="254.5" y1="90" x2="254.5" y2="250" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="411.6" y1="90" x2="411.6" y2="250" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="568.7" y1="90" x2="568.7" y2="250" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="725.8" y1="90" x2="725.8" y2="250" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="882.9" y1="90" x2="882.9" y2="250" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="80" y1="270" x2="1040" y2="270" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="80.0" y1="270" x2="80.0" y2="276" stroke="#9ca3af" stroke-width="1.4"/>
<text x="80.0" y="292" font-size="11" fill="#9ca3af" text-anchor="middle">0</text>
<line x1="254.5" y1="270" x2="254.5" y2="276" stroke="#9ca3af" stroke-width="1.4"/>
<text x="254.5" y="292" font-size="11" fill="#9ca3af" text-anchor="middle">10</text>
<line x1="429.1" y1="270" x2="429.1" y2="276" stroke="#9ca3af" stroke-width="1.4"/>
<text x="429.1" y="292" font-size="11" fill="#9ca3af" text-anchor="middle">20</text>
<line x1="603.6" y1="270" x2="603.6" y2="276" stroke="#9ca3af" stroke-width="1.4"/>
<text x="603.6" y="292" font-size="11" fill="#9ca3af" text-anchor="middle">30</text>
<line x1="778.2" y1="270" x2="778.2" y2="276" stroke="#9ca3af" stroke-width="1.4"/>
<text x="778.2" y="292" font-size="11" fill="#9ca3af" text-anchor="middle">40</text>
<line x1="952.7" y1="270" x2="952.7" y2="276" stroke="#9ca3af" stroke-width="1.4"/>
<text x="952.7" y="292" font-size="11" fill="#9ca3af" text-anchor="middle">50</text>
<line x1="1040.0" y1="270" x2="1040.0" y2="276" stroke="#9ca3af" stroke-width="1.4"/>
<text x="1040.0" y="292" font-size="11" fill="#9ca3af" text-anchor="middle">55</text>
<text x="1048" y="274" font-size="11" fill="#9ca3af" text-anchor="start">秒</text>
<rect x="80" y="318" width="300" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="230.0" y="336.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">真视频：5–10 秒</text>
<text x="230.0" y="351.0" font-size="11" fill="#6b7280" text-anchor="middle">数据集平均镜头约 8 秒</text>
<rect x="420" y="318" width="300" height="40" rx="6" fill="#ffffff" stroke="#9ca3af"/>
<text x="570.0" y="342.68" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">判别器：每个 10 秒段像不像真视频</text>
<line x1="380" y1="338" x2="418" y2="338" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="760" y="318" width="280" height="40" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="900.0" y="336.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">生成器每写完一段：KV cache 断梯度</text>
<text x="900.0" y="351.0" font-size="11" fill="#6b7280" text-anchor="middle">每评完一段就反传、累加损失</text>
<text x="30" y="392" font-size="13" fill="#6b7280" text-anchor="start">判别器只需要「这段像不像真视频」，不需要逐帧真值，所以生成器可以写到数据里根本没有的长度，只要切出来的每一段都落在真视频的分布里。</text>
<text x="30" y="414" font-size="13" fill="#6b7280" text-anchor="start">重叠 1 秒是为了让相邻段接得上。代价是判别器只看 10 秒，超出这个尺度的一致性（主体、场景）没人要求。</text>
<text x="30" y="446" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 5 §2.2 与 p. 18 附录 B 画出，原文没有对应的图。正文举例写的是 60 秒长视频、10 秒段；附录给出的最长训练时长是 55 秒。</text>
</svg>
