<text x="48" y="406" font-size="14" font-weight="700" fill="#111827">张量并行</text>
<text x="48" y="426" font-size="11" fill="#6b7280">一层里算完一块，就要先汇总再往下</text>
<text x="48" y="484" font-size="11" fill="#9ca3af">all-reduce 的结果下一步马上要用，计算只能停下来等</text>
