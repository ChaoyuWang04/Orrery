<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect width="1120" height="660" fill="#ffffff"/>
<text x="40" y="38" font-size="19" font-weight="700" fill="#111827">一步训练里，通信藏在哪、露在哪</text>
<text x="40" y="62" font-size="13" fill="#6b7280">紫 = 计算；绿 = 被计算盖住的通信；红 = 露在关键路径上的通信；白虚框 = 空转。每行上排是计算流，下排是通信流。</text>
<text x="40" y="82" font-size="13" fill="#6b7280">按原文 Data Parallelism、ZeRO-3、Tensor Parallelism、Pipeline Parallelism 各节的时间线示意重画，块宽只示意先后，不是实测时长。</text>
<rect x="30" y="104" width="1060" height="124" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="48" y="134" font-size="14" font-weight="700" fill="#111827">数据并行</text>
<text x="48" y="154" font-size="11" fill="#6b7280">反向时按桶同步梯度</text>
<text x="48" y="212" font-size="11" fill="#9ca3af">只有最后一个桶露出来</text>
<rect x="250" y="118" width="150" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="325.0" y="141.0" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">反向 层 4</text>
