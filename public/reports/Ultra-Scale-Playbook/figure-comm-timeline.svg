<text x="48" y="270" font-size="14" font-weight="700" fill="#111827">ZeRO-3</text>
<text x="48" y="290" font-size="11" fill="#6b7280">前向逐层拼参数，边算本层边取下一层</text>
<text x="48" y="348" font-size="11" fill="#9ca3af">第一层的参数要先等；反向同理，还多一次 reduce-scatter</text>
