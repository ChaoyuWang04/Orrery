<text x="940.0" y="413.0" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">LayerNorm</text>
<rect x="30" y="512" width="1060" height="124" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="48" y="542" font-size="14" font-weight="700" fill="#111827">流水并行（中间一段）</text>
<text x="48" y="562" font-size="11" fill="#6b7280">只在段与段之间传激活，通信小</text>
<text x="48" y="620" font-size="11" fill="#9ca3af">真正的损失是开头结尾的空转，不是通信</text>
