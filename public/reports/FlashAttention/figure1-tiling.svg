<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 1：K、V 在外层只读一遍，Q、O 在内层反复读写，N×N 的分数矩阵从不落到 HBM</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">按 PDF p. 2 Figure 1 左与 p. 5 Algorithm 1 重画，是机制示意。绿 = 当前装在片上 SRAM 的块；紫 = 放在 HBM 里的矩阵；黄虚线 = 只在片上出现、从不写回的分数块。</text>
<rect x="16.0" y="80.0" width="270.0" height="500.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="32.0" y="106.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">存储层级（A100）</text>
<text x="32.0" y="126.0" font-size="11" fill="#6b7280" text-anchor="start">越往上越小、越快（PDF p. 2–3）</text>
<rect x="86.0" y="150.0" width="130.0" height="86.0" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="151.0" y="176.0" font-size="13" fill="#111827" text-anchor="middle">SRAM</text>
<text x="151.0" y="197.0" font-size="11" fill="#111827" text-anchor="middle">19 TB/s · 约 20 MB</text>
<text x="151.0" y="216.0" font-size="11" fill="#6b7280" text-anchor="middle">108 个 SM 各 192 KB</text>
<rect x="56.0" y="250.0" width="190.0" height="86.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="151.0" y="276.0" font-size="13" fill="#111827" text-anchor="middle">HBM（显存）</text>
<text x="151.0" y="297.0" font-size="11" fill="#111827" text-anchor="middle">1.5 TB/s · 40 GB</text>
<text x="151.0" y="316.0" font-size="11" fill="#6b7280" text-anchor="middle">40–80 GB，1.5–2.0 TB/s</text>
<rect x="31.0" y="350.0" width="240.0" height="86.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="151.0" y="376.0" font-size="13" fill="#111827" text-anchor="middle">CPU 内存</text>
<text x="151.0" y="397.0" font-size="11" fill="#111827" text-anchor="middle">12.8 GB/s · 超过 1 TB</text>
<text x="151.0" y="416.0" font-size="11" fill="#6b7280" text-anchor="middle">训练时基本不碰</text>
<text x="32.0" y="470.0" font-size="11" fill="#9ca3af" text-anchor="start">SRAM 带宽约为 HBM 的 13 倍，</text>
<text x="32.0" y="488.0" font-size="11" fill="#9ca3af" text-anchor="start">容量却小三个数量级。</text>
<text x="32.0" y="516.0" font-size="11" fill="#9ca3af" text-anchor="start">标准实现把 N×N 的 S、P 写进 HBM，</text>
<text x="32.0" y="534.0" font-size="11" fill="#9ca3af" text-anchor="start">再读出来，这一来一回就是瓶颈。</text>
<rect x="302.0" y="80.0" width="500.0" height="500.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="318.0" y="106.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">分块与两层循环</text>
<text x="318.0" y="172.0" font-size="11" fill="#6b7280" text-anchor="start">Kᵀ：d × N</text>
<rect x="430.0" y="150.0" width="58.0" height="34.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="459.0" y="172.0" font-size="11" fill="#111827" text-anchor="middle">K1ᵀ</text>
<rect x="494.0" y="150.0" width="58.0" height="34.0" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="523.0" y="172.0" font-size="11" fill="#111827" text-anchor="middle">K2ᵀ</text>
<rect x="558.0" y="150.0" width="58.0" height="34.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="587.0" y="172.0" font-size="11" fill="#111827" text-anchor="middle">K3ᵀ</text>
<rect x="622.0" y="150.0" width="58.0" height="34.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="651.0" y="172.0" font-size="11" fill="#111827" text-anchor="middle">K4ᵀ</text>
<line x1="430.0" y1="138.0" x2="680.0" y2="138.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="688.0" y="142.0" font-size="11" fill="#9ca3af" text-anchor="start">外层 j</text>
<text x="318.0" y="194.0" font-size="11" fill="#6b7280" text-anchor="start"></text>
<rect x="360.0" y="200.0" width="52.0" height="58.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="386.0" y="233.0" font-size="11" fill="#111827" text-anchor="middle">Q1</text>
<rect x="360.0" y="264.0" width="52.0" height="58.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="386.0" y="297.0" font-size="11" fill="#111827" text-anchor="middle">Q2</text>
<rect x="360.0" y="328.0" width="52.0" height="58.0" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="386.0" y="361.0" font-size="11" fill="#111827" text-anchor="middle">Q3</text>
<rect x="360.0" y="392.0" width="52.0" height="58.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="386.0" y="425.0" font-size="11" fill="#111827" text-anchor="middle">Q4</text>
<line x1="346.0" y1="200.0" x2="346.0" y2="450.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="318.0" y="470.0" font-size="11" fill="#9ca3af" text-anchor="start">内层 i</text>
<text x="318.0" y="488.0" font-size="11" fill="#6b7280" text-anchor="start">Q：N × d</text>
<rect x="430.0" y="200.0" width="58.0" height="58.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="494.0" y="200.0" width="58.0" height="58.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="558.0" y="200.0" width="58.0" height="58.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="622.0" y="200.0" width="58.0" height="58.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="430.0" y="264.0" width="58.0" height="58.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="494.0" y="264.0" width="58.0" height="58.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="558.0" y="264.0" width="58.0" height="58.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="622.0" y="264.0" width="58.0" height="58.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="430.0" y="328.0" width="58.0" height="58.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="494.0" y="328.0" width="58.0" height="58.0" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="523.0" y="355.0" font-size="11" fill="#111827" text-anchor="middle">S₃₂</text>
<text x="523.0" y="370.0" font-size="11" fill="#6b7280" text-anchor="middle">片上</text>
<rect x="558.0" y="328.0" width="58.0" height="58.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="622.0" y="328.0" width="58.0" height="58.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="430.0" y="392.0" width="58.0" height="58.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="494.0" y="392.0" width="58.0" height="58.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="558.0" y="392.0" width="58.0" height="58.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="622.0" y="392.0" width="58.0" height="58.0" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="430.0" y="470.0" font-size="11" fill="#9ca3af" text-anchor="start">N×N 的 S、P：只在片上一块一块出现</text>
<rect x="696.0" y="200.0" width="52.0" height="58.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="722.0" y="233.0" font-size="11" fill="#111827" text-anchor="middle">V1</text>
<rect x="696.0" y="264.0" width="52.0" height="58.0" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="722.0" y="297.0" font-size="11" fill="#111827" text-anchor="middle">V2</text>
<rect x="696.0" y="328.0" width="52.0" height="58.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="722.0" y="361.0" font-size="11" fill="#111827" text-anchor="middle">V3</text>
<rect x="696.0" y="392.0" width="52.0" height="58.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="722.0" y="425.0" font-size="11" fill="#111827" text-anchor="middle">V4</text>
<text x="692.0" y="190.0" font-size="11" fill="#6b7280" text-anchor="start">V：N × d</text>
<text x="318.0" y="522.0" font-size="11" fill="#6b7280" text-anchor="start">O：N × d</text>
<rect x="430.0" y="500.0" width="58.0" height="34.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="459.0" y="522.0" font-size="11" fill="#111827" text-anchor="middle">O1</text>
<rect x="494.0" y="500.0" width="58.0" height="34.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="523.0" y="522.0" font-size="11" fill="#111827" text-anchor="middle">O2</text>
<rect x="558.0" y="500.0" width="58.0" height="34.0" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="587.0" y="522.0" font-size="11" fill="#111827" text-anchor="middle">O3</text>
<rect x="622.0" y="500.0" width="58.0" height="34.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="651.0" y="522.0" font-size="11" fill="#111827" text-anchor="middle">O4</text>
<text x="430.0" y="556.0" font-size="11" fill="#9ca3af" text-anchor="start">O、ℓ、m 的第 i 块：每次内层迭代读进、更新、写回</text>
<rect x="818.0" y="80.0" width="286.0" height="500.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="834.0" y="106.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">一次内层迭代 (i, j) 做什么</text>
<rect x="834.0" y="124.0" width="254.0" height="46.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="846.0" y="143.0" font-size="11" fill="#111827" text-anchor="start">HBM → SRAM</text>
<text x="846.0" y="160.0" font-size="11" fill="#6b7280" text-anchor="start">读 Qᵢ、Oᵢ、ℓᵢ、mᵢ</text>
<rect x="834.0" y="178.0" width="254.0" height="46.0" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="846.0" y="197.0" font-size="11" fill="#111827" text-anchor="start">片上</text>
<text x="846.0" y="214.0" font-size="11" fill="#6b7280" text-anchor="start">Sᵢⱼ = Qᵢ Kⱼᵀ，块大小 Bᵣ × B_c</text>
<rect x="834.0" y="232.0" width="254.0" height="46.0" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="846.0" y="251.0" font-size="11" fill="#111827" text-anchor="start">片上</text>
<text x="846.0" y="268.0" font-size="11" fill="#6b7280" text-anchor="start">行最大值、指数、行和，更新 m、ℓ</text>
<rect x="834.0" y="286.0" width="254.0" height="46.0" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="846.0" y="305.0" font-size="11" fill="#111827" text-anchor="start">片上</text>
<text x="846.0" y="322.0" font-size="11" fill="#6b7280" text-anchor="start">按新统计量缩放旧 Oᵢ，加上 P̃ᵢⱼ Vⱼ</text>
<rect x="834.0" y="340.0" width="254.0" height="46.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="846.0" y="359.0" font-size="11" fill="#111827" text-anchor="start">SRAM → HBM</text>
<text x="846.0" y="376.0" font-size="11" fill="#6b7280" text-anchor="start">写回 Oᵢ、ℓᵢ、mᵢ</text>
<text x="834.0" y="410.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">HBM 访问怎么数（PDF p. 22–23）</text>
<text x="834.0" y="432.0" font-size="11" fill="#6b7280" text-anchor="start">K、V：每个元素只读 1 遍</text>
<text x="834.0" y="450.0" font-size="11" fill="#6b7280" text-anchor="start">Q、O：外层每转一圈读写 1 遍，共 T_c 遍</text>
<text x="834.0" y="468.0" font-size="11" fill="#6b7280" text-anchor="start">T_c = N / B_c，而 B_c = Θ(M / d)</text>
<text x="834.0" y="494.0" font-size="11" fill="#111827" text-anchor="start">合计 Θ(N d T_c) = Θ(N² d² / M)</text>
<text x="834.0" y="516.0" font-size="11" fill="#6b7280" text-anchor="start">标准实现是 Θ(N d + N²)</text>
<text x="834.0" y="540.0" font-size="11" fill="#9ca3af" text-anchor="start">d 取 64–128、M 约 100 KB 时，</text>
<text x="834.0" y="558.0" font-size="11" fill="#9ca3af" text-anchor="start">d² 远小于 M，差距就是许多倍</text>
</svg>
