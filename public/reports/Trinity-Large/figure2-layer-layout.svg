<text x="100" y="108" font-size="12" fill="#6b7280" text-anchor="end">注意力</text>
<text x="100" y="148" font-size="12" fill="#6b7280" text-anchor="end">前馈</text>
<text x="117.0" y="178" font-size="11" fill="#9ca3af" text-anchor="middle">1</text>
<text x="165.0" y="178" font-size="11" fill="#9ca3af" text-anchor="middle">4</text>
<text x="197.0" y="178" font-size="11" fill="#9ca3af" text-anchor="middle">6</text>
<text x="1061.0" y="178" font-size="11" fill="#9ca3af" text-anchor="middle">60</text>
<text x="106" y="196" font-size="11" fill="#9ca3af" text-anchor="start">层号</text>
<text x="210" y="196" font-size="11" fill="#6b7280" text-anchor="start">前 6 层稠密（原计划 3 层，训练失稳后加到 6 层，PDF p. 16）；其余 54 层是 MoE：1 个共享专家 + 256 个路由专家里选 4 个。</text>
<text x="210" y="214" font-size="11" fill="#6b7280" text-anchor="start">全局层共 15 层。局部层的 KV 缓存最多存 4096 个位置，所以输入越长，随长度增长的那部分缓存只来自这 15 层。</text>
<rect x="40" y="236" width="1040" height="250" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="60" y="262" font-size="14" fill="#111827" text-anchor="start" font-weight="700">放大任意一层：子层前后各一个 RMSNorm（三明治归一化），后一个的增益按深度缩小</text>
<text x="70" y="332" font-size="13" fill="#111827" text-anchor="start">输入 x</text>
<line x1="120" y1="327" x2="158" y2="327" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="160" y="300" width="150" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="235.0" y="324" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">RMSNorm (1)</text>
<text x="235.0" y="342" font-size="11" fill="#6b7280" text-anchor="middle">增益初始化为 1</text>
<line x1="310" y1="327" x2="348" y2="327" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="350" y="300" width="260" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="480.0" y="324" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">子层：注意力 或 FFN / MoE</text>
<text x="480.0" y="342" font-size="11" fill="#6b7280" text-anchor="middle">式 33 里的 M</text>
<line x1="610" y1="327" x2="648" y2="327" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="650" y="300" width="200" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="750.0" y="324" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">RMSNorm (2)</text>
<text x="750.0" y="342" font-size="11" fill="#6b7280" text-anchor="middle">增益初始化为 1/√60 ≈ 0.129</text>
<line x1="850" y1="327" x2="898" y2="327" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<circle cx="915" cy="327" r="16" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
<text x="915" y="332" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<line x1="931" y1="327" x2="978" y2="327" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="985" y="332" font-size="13" fill="#111827" text-anchor="start">输出 y</text>
<path d="M 138 327 L 138 284 L 915 284 L 915 309" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="530" y="278" font-size="11" fill="#9ca3af" text-anchor="middle">残差直通，不经过任何归一化</text>
<text x="60" y="392" font-size="13" fill="#6b7280" text-anchor="start">子层是注意力时，里面还有三处改动：</text>
<rect x="60" y="404" width="300" height="58" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="210.0" y="428" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">QK-Norm</text>
<text x="210.0" y="448" font-size="11" fill="#6b7280" text-anchor="middle">Q、K 先各过一次 RMSNorm，防注意力 logit 失控</text>
<rect x="390" y="404" width="300" height="58" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="540.0" y="428" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">RoPE 只在局部层</text>
<text x="540.0" y="448" font-size="11" fill="#6b7280" text-anchor="middle">全局层的 Q、K 不加任何位置编码</text>
<rect x="720" y="404" width="340" height="58" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="890.0" y="428" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">输出门</text>
<text x="890.0" y="448" font-size="11" fill="#6b7280" text-anchor="middle">注意力输出逐元素乘 σ(W_G x)，每头一段</text>
<text x="30" y="512" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p. 3 Figure 2、p. 5–6 式 4–14、p. 8 式 33–35 与 p. 12 Table 2 重画，是结构示意，不含实测。层序按 p. 5「三层局部接一层全局、重复到顶」排列，</text>
<text x="30" y="530" font-size="11" fill="#9ca3af" text-anchor="start">与官方权重 config 的 layer_types 一致（外部补充）。注意力是 GQA：48 个查询头共用 8 组 KV（PDF p. 12）。</text>
</svg>