<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">同一步的 4 条序列：顺序 packing 被一篇长文档占满，RSDB 每条序列各自随机抽文档</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">红 = 一篇很长的文档 A；其余颜色只用来区分相邻的不同文档（字母不同即不同文档）。每行是一条 8192 Token 的训练序列。</text>
<rect x="40" y="80" width="510" height="300" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="60.0" y="108.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">顺序 packing</text>
<text x="60.0" y="128.0" font-size="11" fill="#6b7280" text-anchor="start">文档按流的顺序接着铺，长文档连续占掉后面几条序列</text>
<text x="100.0" y="174.0" font-size="11" fill="#9ca3af" text-anchor="end">序列 1</text>
<rect x="110.0" y="150" width="408.0" height="36" rx="4" fill="#fbe9e7" stroke="#d9877a"/>
<text x="314.0" y="173.0" font-size="11" fill="#111827" text-anchor="middle">A 的第 1 段</text>
<text x="100.0" y="226.0" font-size="11" fill="#9ca3af" text-anchor="end">序列 2</text>
<rect x="110.0" y="202" width="408.0" height="36" rx="4" fill="#fbe9e7" stroke="#d9877a"/>
<text x="314.0" y="225.0" font-size="11" fill="#111827" text-anchor="middle">A 的第 2 段</text>
<text x="100.0" y="278.0" font-size="11" fill="#9ca3af" text-anchor="end">序列 3</text>
<rect x="110.0" y="254" width="408.0" height="36" rx="4" fill="#fbe9e7" stroke="#d9877a"/>
<text x="314.0" y="277.0" font-size="11" fill="#111827" text-anchor="middle">A 的第 3 段</text>
<text x="100.0" y="330.0" font-size="11" fill="#9ca3af" text-anchor="end">序列 4</text>
<rect x="110.0" y="306" width="223.5" height="36" rx="4" fill="#fbe9e7" stroke="#d9877a"/>
<text x="221.8" y="329.0" font-size="11" fill="#111827" text-anchor="middle">A 的第 4 段</text>
<rect x="335.5" y="306" width="182.5" height="36" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="426.8" y="329.0" font-size="11" fill="#111827" text-anchor="middle">B</text>
<rect x="570" y="80" width="510" height="300" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="590.0" y="108.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">RSDB（随机顺序文档缓冲区）</text>
<text x="590.0" y="128.0" font-size="11" fill="#6b7280" text-anchor="start">缓冲区里驻留几千篇文档、各带读头；每填一段随机抽一篇</text>
<text x="630.0" y="174.0" font-size="11" fill="#9ca3af" text-anchor="end">序列 1</text>
<rect x="640.0" y="150" width="141.5" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="710.8" y="173.0" font-size="11" fill="#111827" text-anchor="middle">C</text>
<rect x="783.5" y="150" width="264.5" height="36" rx="4" fill="#fbe9e7" stroke="#d9877a"/>
<text x="915.8" y="173.0" font-size="11" fill="#111827" text-anchor="middle">A（从读头往下读）</text>
<text x="630.0" y="226.0" font-size="11" fill="#9ca3af" text-anchor="end">序列 2</text>
<rect x="640.0" y="202" width="203.0" height="36" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="741.5" y="225.0" font-size="11" fill="#111827" text-anchor="middle">D</text>
<rect x="845.0" y="202" width="100.5" height="36" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="895.2" y="225.0" font-size="11" fill="#111827" text-anchor="middle">B</text>
<rect x="947.5" y="202" width="100.5" height="36" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="997.8" y="225.0" font-size="11" fill="#111827" text-anchor="middle">E</text>
<text x="630.0" y="278.0" font-size="11" fill="#9ca3af" text-anchor="end">序列 3</text>
<rect x="640.0" y="254" width="121.0" height="36" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="700.5" y="277.0" font-size="11" fill="#111827" text-anchor="middle">F</text>
<rect x="763.0" y="254" width="285.0" height="36" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="905.5" y="277.0" font-size="11" fill="#111827" text-anchor="middle">G</text>
<text x="630.0" y="330.0" font-size="11" fill="#9ca3af" text-anchor="end">序列 4</text>
<rect x="640.0" y="306" width="162.0" height="36" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="721.0" y="329.0" font-size="11" fill="#111827" text-anchor="middle">H</text>
<rect x="804.0" y="306" width="244.0" height="36" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="926.0" y="329.0" font-size="11" fill="#111827" text-anchor="middle">I</text>
<text x="40.0" y="406.0" font-size="11" fill="#6b7280" text-anchor="start">左：这一步的梯度几乎全来自 A 的领域，下一步又换成别的领域——每步在优化一个不同的目标分布；打乱文档顺序改变不了这一点（PDF p. 9–10）。</text>
<text x="40.0" y="424.0" font-size="11" fill="#6b7280" text-anchor="start">右：同一篇 A 仍然整篇、按顺序被读完，不丢 Token；只是它的各段被摊到不同的步里（PDF p. 10）。</text>
<text x="40.0" y="448.0" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p. 9–10 的文字描述画的机制示意，段长与颜色分布为示意，不是实测。Trinity Large 第三相位用的缓冲区是每 GPU 8192 篇（用户设定 4096），每 GPU 4 个 worker。</text>
</svg>