<text x="850.0" y="398.0" font-size="12" fill="#6b7280" text-anchor="middle">训练步 →</text>
<text x="620.0" y="88.0" font-size="12" fill="#6b7280" text-anchor="start">玩具模型：一个专家的偏置 b 随步数的走法</text>
<text x="902.5" y="128.0" font-size="12" fill="#d9877a" text-anchor="middle">sign：在 b* 两侧来回跳，停不下来</text>
<text x="902.5" y="251.2" font-size="12" fill="#5fa886" text-anchor="middle">tanh：越近越慢，贴住 b*</text>
<text x="30.0" y="452.0" font-size="11" fill="#9ca3af" text-anchor="start">左图按 PDF p. 6–7 式 20、式 23–24 画出函数形状；线性更新的斜率报告没给，这里只示意「不设上界」。SMEBU 还在 tanh 之后乘 λ = 5 × 10⁻⁴、</text>
<text x="30.0" y="470.0" font-size="11" fill="#9ca3af" text-anchor="start">减去全体均值再居中、过 β = 0.5 的动量（式 25–28）。右图是本文的一维玩具模型（负载偏差与 b* − b 成正比），只演示收敛方式，不是报告的实测曲线。</text>
<text x="30.0" y="488.0" font-size="11" fill="#9ca3af" text-anchor="start">报告的说法是：专家越多，每层偏置步长的范数越大，sign 更新在最优点附近偏向振荡（原文是 hypothesize，PDF p. 7）。</text>
</svg>