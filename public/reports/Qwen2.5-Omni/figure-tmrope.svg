<text x="30" y="448" font-size="12" fill="#111827">图像：所有视觉 Token 共用一个常数时间 ID，高、宽按 Token 在图中的行列编号；每张图当成两帧相同的画面。</text>
<text x="30" y="470" font-size="12" fill="#111827">视频：帧与帧之间的时间 ID 按每帧真实时刻动态调整，保证 1 个 ID 始终对应 40 ms。</text>
<text x="30" y="492" font-size="12" fill="#111827">多种模态接在一起时，后一个模态的编号从前一个模态的最大 ID 加 1 开始。</text>
<text x="30" y="522" font-size="11" fill="#9ca3af">原图没有画出文本提示与块之间的编号衔接，图中「文本提示」只示意排列顺序。</text>
