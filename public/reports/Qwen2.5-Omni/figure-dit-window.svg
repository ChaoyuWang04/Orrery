<text x="30" y="32" font-size="19" font-weight="700" fill="#111827">滑窗 DiT：每块只看「前 2 块 + 自己 + 后 1 块」</text>
<text x="30" y="54" font-size="13" fill="#6b7280">灰 = 看不见；紫 = 回看的过去块；黄 = 当前块；红 = 前瞻的未来块。按 PDF p. 5 的文字与 Figure 4 重画的块级示意；一块含几个 codec、多少毫秒，报告没写。</text>
