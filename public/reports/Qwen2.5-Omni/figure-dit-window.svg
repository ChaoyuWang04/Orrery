<text x="560" y="98" font-size="14" font-weight="700" fill="#111827">流式时这意味着什么</text>
<rect x="560" y="116" width="420" height="36" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="574" y="139" font-size="12" fill="#111827">1. Talker 吐出 B0 的 codec</text>
<line x1="770" y1="152" x2="770" y2="166" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="560" y="168" width="420" height="36" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="574" y="191" font-size="12" fill="#111827">2. Talker 吐出 B1 的 codec</text>
<line x1="770" y1="204" x2="770" y2="218" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="560" y="220" width="420" height="36" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="574" y="243" font-size="12" fill="#111827">3. DiT 用 B0 + 前瞻 B1 出 B0 的梅尔谱</text>
<line x1="770" y1="256" x2="770" y2="270" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="560" y="272" width="420" height="36" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="574" y="295" font-size="12" fill="#111827">4. BigVGAN 按块出 B0 的波形：首包</text>
<line x1="770" y1="308" x2="770" y2="322" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="560" y="324" width="420" height="36" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="574" y="347" font-size="12" fill="#111827">5. 之后每多一块 codec，就能多放一块声音</text>
<text x="560" y="402" font-size="11" fill="#6b7280">前瞻 1 块是首包的结构下限：B0 出声之前，至少要等 B1 的 codec 生成完。</text>
<text x="560" y="420" font-size="11" fill="#6b7280">回看只看 2 块，所以长句的计算量不随已生成长度增长。</text>
<text x="30" y="452" font-size="11" fill="#9ca3af">右侧的步骤顺序、「首包下限」与计算量的说法，是本文按窗口定义推出来的；报告没有给延迟分解或毫秒数。</text>
