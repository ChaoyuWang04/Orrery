<text x="932" y="284" font-size="11" fill="#9ca3af" text-anchor="start">A、B 的视觉 Token</text>
<rect x="614" y="298" width="182" height="20" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="800" y="298" width="92" height="20" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="932" y="312" font-size="11" fill="#9ca3af" text-anchor="start">自注意力（可套 NABLA）</text>
