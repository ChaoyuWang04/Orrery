<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">CrossDiT：视觉序列里没有文本 Token，文字只从交叉注意力进来</text>
<text x="30" y="54" font-size="13" fill="#6b7280">紫 = 视觉 Token；黄 = 文本 Token；绿 = 时间步与 CLIP 句向量的调制；灰框 = 一次自注意力覆盖的范围。</text>
<rect x="16" y="72" width="528" height="420" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="576" y="72" width="528" height="420" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="280" y="98" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(a) MMDiT 式：Kandinsky 4.0 的做法</text>
<text x="280" y="118" font-size="11" fill="#6b7280" text-anchor="middle">文本与视觉拼成一条序列，每层做联合自注意力</text>
<text x="840" y="98" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(b) CrossDiT：Kandinsky 5.0 的做法</text>
<text x="840" y="118" font-size="11" fill="#6b7280" text-anchor="middle">视觉自己做自注意力，文本只被交叉注意力读取</text>
<text x="40" y="150" font-size="11" fill="#6b7280" text-anchor="start">一个批里拼进两条长短不同的视频 A、B：</text>
<rect x="40" y="160" width="16" height="26" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
