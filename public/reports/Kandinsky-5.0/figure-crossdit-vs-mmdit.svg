<text x="40" y="524" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 23 Figure 10、p. 24 Figure 11 与 p. 23–24 正文重画。左栏是机制示意：报告没有画 MMDiT，只说它需要拼接、拖慢训练。</text>
<text x="40" y="550" font-size="13" fill="#6b7280" text-anchor="start">文本只读一次、每层反复查询：这条旁路的宽度（256 Token）就是全模型理解提示词的上限，见后文「代价」。</text>
<text x="40" y="580" font-size="11" fill="#9ca3af" text-anchor="start">图中格子数只表示长短不同，不代表真实 Token 数。</text>
</svg>