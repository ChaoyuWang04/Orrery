<text x="1006" y="356" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">MLP</text>
<text x="846" y="390" font-size="11" fill="#6b7280" text-anchor="middle">Q 来自视觉，K、V 来自文本</text>
<text x="616" y="410" font-size="11" fill="#6b7280" text-anchor="start">三个子块都由绿色那一路生成 Shift、Scale、Gate</text>
