<text x="76" y="204" font-size="11" fill="#9ca3af" text-anchor="middle">A 文本</text>
<text x="202" y="204" font-size="11" fill="#9ca3af" text-anchor="middle">A 视频</text>
<text x="334" y="204" font-size="11" fill="#9ca3af" text-anchor="middle">B 文本</text>
<text x="415.0" y="204" font-size="11" fill="#9ca3af" text-anchor="middle">B 视频</text>
<rect x="38" y="222" width="254" height="40" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="164" y="247" font-size="11" fill="#111827" text-anchor="middle">A 的联合注意力</text>
<rect x="296" y="222" width="164" height="40" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="377.0" y="247" font-size="11" fill="#111827" text-anchor="middle">B 的联合注意力</text>
<text x="40" y="296" font-size="12" fill="#111827" text-anchor="start">文本 Token 每层都跟视觉一起被更新，信息双向流动。</text>
<text x="40" y="320" font-size="12" fill="#111827" text-anchor="start">代价：每层都要把两种模态拼接一次；样本边界与模态边界</text>
<text x="40" y="340" font-size="12" fill="#111827" text-anchor="start">交错，块稀疏掩码要同时避开两种边界。</text>
<text x="40" y="374" font-size="11" fill="#9ca3af" text-anchor="start">报告只写了结论：这次拼接显著拖慢训练（p. 24）。</text>
<text x="600" y="148" font-size="11" fill="#6b7280" text-anchor="start">文本一侧：只算一次</text>
<rect x="600" y="158" width="150" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="675" y="176" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Qwen2.5-VL 7B</text>
<text x="675" y="191" font-size="11" fill="#6b7280" text-anchor="middle">最多 256 Token</text>
<line x1="750" y1="178" x2="778" y2="178" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="780" y="158" width="150" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="855" y="176" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">LTF 精炼</text>
<text x="855" y="191" font-size="11" fill="#6b7280" text-anchor="middle">2 或 4 个无交叉块</text>
<rect x="960" y="158" width="130" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="1025" y="176" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">时间步 + CLIP</text>
<text x="1025" y="191" font-size="11" fill="#6b7280" text-anchor="middle">句向量 768 维</text>
<rect x="600" y="230" width="490" height="190" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="612" y="250" font-size="11" fill="#6b7280" text-anchor="start">CrossDiT 块 × N（Image Lite 50、Video Lite 32、Video Pro 60）</text>
