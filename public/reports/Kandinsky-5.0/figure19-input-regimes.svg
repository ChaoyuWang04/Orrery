<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">同一副 CrossDiT 吃四种任务：差别只在视觉输入怎么拼、掩码填 0 还是 1</text>
<text x="30" y="54" font-size="13" fill="#6b7280">紫 = 要去噪的带噪潜变量；绿 = 不加噪的条件潜变量；灰 = 1 个通道的掩码（格内数字是它的取值）；黄 = 送进 Qwen2.5-VL 的文字。</text>
<text x="250" y="92" font-size="13" fill="#111827" text-anchor="start" font-weight="700">视觉输入（沿通道拼接）</text>
