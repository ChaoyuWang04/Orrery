<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
<marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8f8bd8"/></marker>
<marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fa886"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="700" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">RLM 的一次调用：长 prompt 留在 REPL 里当变量，根模型只看元数据，靠写代码去切、去递归</text>
<text x="30" y="58" font-size="13" fill="#6b7280">紫 = 语言模型调用；绿 = REPL 里的变量（长文本只活在这里）；黄 = 根模型的对话历史（只放常数大小的东西）；灰线 = 数据流向。</text>
<rect x="30" y="490" width="150" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="105" y="514" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">用户 prompt P</text>
<text x="105" y="532" font-size="11" fill="#6b7280" text-anchor="middle">可达千万 Token</text>
<rect x="260" y="86" width="300" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="410" y="112" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">根模型 M（depth 0）</text>
<text x="410" y="130" font-size="11" fill="#6b7280" text-anchor="middle">每轮只读 hist，吐出一段代码</text>
<rect x="260" y="170" width="300" height="64" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="410" y="189" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">hist：根模型的历史</text>
<text x="410" y="207" font-size="11" fill="#6b7280" text-anchor="middle">P 的长度、前缀、怎么取片段</text>
<text x="410" y="225" font-size="11" fill="#6b7280" text-anchor="middle">+ 自己写过的代码 + stdout 的前缀与长度</text>
<line x1="410" y1="170" x2="410" y2="148" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="240" y="266" width="560" height="300" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="260" y="290" font-size="14" fill="#111827" font-weight="700">持久 REPL 环境 E（Python）</text>
<text x="260" y="308" font-size="11" fill="#6b7280">变量跨轮保留；print 的输出被截断后才回到 hist</text>
<rect x="260" y="322" width="520" height="150" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="276" y="346" font-size="13" fill="#111827" font-weight="700">根模型写的代码在这里执行，例如：</text>
<text x="290" y="372" font-size="12" fill="#111827" font-family="Menlo, Consolas, monospace" xml:space="preserve">chunks = split(context, 10)</text>
<text x="290" y="392" font-size="12" fill="#111827" font-family="Menlo, Consolas, monospace" xml:space="preserve">for c in chunks:</text>
<text x="290" y="412" font-size="12" fill="#111827" font-family="Menlo, Consolas, monospace" xml:space="preserve">    buffers.append(llm_query(question + c))</text>
<text x="290" y="432" font-size="12" fill="#111827" font-family="Menlo, Consolas, monospace" xml:space="preserve">answer = llm_query(question + join(buffers))</text>
<text x="290" y="452" font-size="12" fill="#111827" font-family="Menlo, Consolas, monospace" xml:space="preserve">FINAL_VAR(answer)</text>
<rect x="260" y="490" width="160" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="340" y="514" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">context = P</text>
<text x="340" y="532" font-size="11" fill="#6b7280" text-anchor="middle">整段 prompt 只在这里</text>
<rect x="440" y="490" width="160" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="520" y="514" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">中间变量</text>
<text x="520" y="532" font-size="11" fill="#6b7280" text-anchor="middle">buffers、labels、pairs…</text>
<rect x="620" y="490" width="160" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="700" y="514" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">Final</text>
<text x="700" y="532" font-size="11" fill="#6b7280" text-anchor="middle">被赋值就结束循环</text>
<line x1="180" y1="518" x2="258" y2="518" stroke="#5fa886" stroke-width="1.4" marker-end="url(#ag)"/>
<polyline points="560,116 660,116 660,264" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="670" y="200" font-size="11" fill="#6b7280">① 一段代码</text>
<polyline points="260,400 220,400 220,202 258,202" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="30" y="372" font-size="11" fill="#6b7280">② 执行后只把 stdout 的</text>
<text x="30" y="388" font-size="11" fill="#6b7280">前缀与长度追加进 hist</text>
<rect x="870" y="300" width="220" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="980" y="324" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">llm_query：子 LM</text>
<text x="980" y="342" font-size="11" fill="#6b7280" text-anchor="middle">depth 1，普通一次调用</text>
<rect x="870" y="370" width="220" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="980" y="394" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">llm_query：子 LM</text>
<text x="980" y="412" font-size="11" fill="#6b7280" text-anchor="middle">循环里可以调几十到上千次</text>
<rect x="870" y="450" width="220" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-dasharray="5 4"/>
<text x="980" y="473" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">rlm_query：子 RLM</text>
<text x="980" y="491" font-size="11" fill="#6b7280" text-anchor="middle">自带 REPL 与循环</text>
<text x="980" y="509" font-size="11" fill="#6b7280" text-anchor="middle">depth ≥ 2 才开放</text>
<line x1="782" y1="380" x2="868" y2="330" stroke="#8f8bd8" stroke-width="1.4" marker-end="url(#ap)"/>
<line x1="782" y1="395" x2="868" y2="398" stroke="#8f8bd8" stroke-width="1.4" marker-end="url(#ap)"/>
<line x1="782" y1="410" x2="868" y2="480" stroke="#8f8bd8" stroke-width="1.4" marker-end="url(#ap)"/>
<text x="980" y="288" font-size="11" fill="#6b7280" text-anchor="middle">③ 子调用由代码触发，返回值进变量</text>
<line x1="700" y1="548" x2="700" y2="598" stroke="#5fa886" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="590" y="600" width="220" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="700" y="627" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">回答 Y = Final 的值</text>
<text x="830" y="616" font-size="11" fill="#6b7280">④ 输出长度不受单次生成上限约束：</text>
<text x="830" y="632" font-size="11" fill="#6b7280">答案可以在变量里拼到任意长</text>
<text x="30" y="684" font-size="11" fill="#9ca3af">按 PDF p. 2 Figure 2 与 p. 4 Algorithm 1 重画的机制示意；代码是示例，不是论文里的某条轨迹。rlm_query 只在最大递归深度大于 1 时提供（PDF p. 19）。</text>
</svg>