<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
<marker id="aq" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9877a"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">长输出也走变量：OOLONG-Pairs 的答案在 REPL 里拼出来，而不是一个 Token 一个 Token 写出来</text>
<text x="30" y="58" font-size="13" fill="#6b7280">紫 = 语言模型调用；灰 = 代码执行；绿 = REPL 里的变量；红 = 附录 E.2 这条轨迹实际出错的地方。</text>
<rect x="20" y="76" width="1080" height="130" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="40" y="100" font-size="14" fill="#111827" font-weight="700">基座模型直接读</text>
<rect x="40" y="116" width="240" height="72" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="160" y="148" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">32K Token 的条目 + 问题</text>
<text x="160" y="166" font-size="11" fill="#6b7280" text-anchor="middle">整段塞进窗口</text>
<rect x="340" y="116" width="380" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="530" y="139" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">一次自回归生成</text>
<text x="530" y="157" font-size="11" fill="#6b7280" text-anchor="middle">在心里给每条打标签、筛用户、</text>
<text x="530" y="175" font-size="11" fill="#6b7280" text-anchor="middle">再把满足条件的用户对全部写出来</text>
<rect x="780" y="116" width="300" height="72" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="930" y="139" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">输出：全部满足条件的用户对</text>
<text x="930" y="157" font-size="11" fill="#6b7280" text-anchor="middle">长度随条目数平方增长</text>
<text x="930" y="175" font-size="11" fill="#6b7280" text-anchor="middle">Table 1 里两个基座的 F1 都只有 0.1</text>
<line x1="280" y1="152" x2="338" y2="152" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="720" y1="152" x2="778" y2="152" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="20" y="222" width="1080" height="300" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="40" y="246" font-size="14" fill="#111827" font-weight="700">RLM(Qwen3-Coder) 的做法（附录 E.2，PDF p. 33–36）</text>
<rect x="40" y="266" width="180" height="72" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="130" y="289" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">① 探查</text>
<text x="130" y="307" font-size="11" fill="#6b7280" text-anchor="middle">打印开头几行，</text>
<text x="130" y="325" font-size="11" fill="#6b7280" text-anchor="middle">按换行切开看格式</text>
<rect x="250" y="266" width="200" height="72" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="350" y="289" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">② 子调用打标签</text>
<text x="350" y="307" font-size="11" fill="#6b7280" text-anchor="middle">把条目分小块，</text>
<text x="350" y="325" font-size="11" fill="#6b7280" text-anchor="middle">每块交给 llm_query</text>
<rect x="480" y="266" width="180" height="72" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="570" y="298" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">labels</text>
<text x="570" y="316" font-size="11" fill="#6b7280" text-anchor="middle">每条问题的语义类别</text>
<rect x="690" y="266" width="180" height="72" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="780" y="298" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">③ 代码筛用户</text>
<text x="780" y="316" font-size="11" fill="#6b7280" text-anchor="middle">按条件挑出目标用户</text>
<rect x="900" y="266" width="180" height="72" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="990" y="298" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">pairs</text>
<text x="990" y="316" font-size="11" fill="#6b7280" text-anchor="middle">用循环拼出全部去重用户对</text>
<line x1="220" y1="302" x2="248" y2="302" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="450" y1="302" x2="478" y2="302" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="660" y1="302" x2="688" y2="302" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="870" y1="302" x2="898" y2="302" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="900" y="370" width="180" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="990" y="394" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">FINAL_VAR(pairs)</text>
<text x="990" y="412" font-size="11" fill="#6b7280" text-anchor="middle">本该在这里交卷</text>
<line x1="990" y1="338" x2="990" y2="368" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="40" y="370" width="820" height="132" rx="6" fill="#fbe9e7" stroke="#d9877a" stroke-dasharray="5 4"/>
<text x="60" y="396" font-size="14" fill="#111827" font-weight="700">实际发生的事</text>
<text x="60" y="424" font-size="13" fill="#6b7280">答案已经在 pairs 里，模型也试过用 FINAL_VAR 交，却没有收住：它打印首尾几对、</text>
<text x="60" y="446" font-size="13" fill="#6b7280">打印统计量来核对，又把第 ① 到 ③ 步带着小改动重做了 5 遍，最后在被要求</text>
<text x="60" y="468" font-size="13" fill="#6b7280">给出答案时，交出的是根模型自己生成的一段答案，不是 pairs，结果错了（PDF p. 36）。</text>
<line x1="898" y1="398" x2="862" y2="420" stroke="#d9877a" stroke-width="1.4" marker-end="url(#aq)"/>
<rect x="20" y="536" width="1080" height="50" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="40" y="558" font-size="13" fill="#6b7280">Figure 8(c) 截取的另一段轨迹：代码把 10731 对拼成一个字符串，用 FINAL_VAR 整体交出（PDF p. 31）。输出多长，只取决于变量能存多大。</text>
<text x="40" y="576" font-size="11" fill="#9ca3af">按 PDF p. 31 Figure 8 与 p. 33–36 附录 E.2 的步骤描述重画的流程示意，不是轨迹截图。</text>
</svg>