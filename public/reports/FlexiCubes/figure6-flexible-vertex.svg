<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fa886"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="480" fill="#ffffff"/>

<rect x="16" y="76" width="352" height="384" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="384" y="76" width="352" height="384" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="752" y="76" width="352" height="384" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>

<!-- (a) DMC 质心 -->
<rect x="82" y="140" width="220" height="220" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.4"/>
<path d="M302,260 L236,260 L236,360" fill="none" stroke="#111827" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="302" y1="280" x2="222" y2="360" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="302" cy="280" r="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.6"/>
<circle cx="222" cy="360" r="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.6"/>
<circle cx="262" cy="320" r="7" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.8"/>
<circle cx="82" cy="140" r="11" fill="#ffffff" stroke="#b9b9b9"/>
<circle cx="302" cy="140" r="11" fill="#ffffff" stroke="#b9b9b9"/>
<circle cx="82" cy="360" r="11" fill="#ffffff" stroke="#b9b9b9"/>
<circle cx="302" cy="360" r="11" fill="#eeeeee" stroke="#b9b9b9"/>

<!-- (b) FlexiCubes α + β -->
<path d="M450,360 L670,140 L670,360 Z" fill="#e3f4ec" stroke="#5fa886" stroke-width="1.2"/>
<rect x="450" y="140" width="220" height="220" fill="none" stroke="#b9b9b9" stroke-width="1.4"/>
<path d="M670,260 L604,260 L604,360" fill="none" stroke="#111827" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="670" y1="180" x2="524" y2="360" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="670" cy="180" r="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.6"/>
<circle cx="524" cy="360" r="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.6"/>
<circle cx="604" cy="260" r="7" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.8"/>
<circle cx="450" cy="140" r="11" fill="#ffffff" stroke="#b9b9b9"/>
<circle cx="670" cy="140" r="11" fill="#ffffff" stroke="#b9b9b9"/>
<circle cx="450" cy="360" r="11" fill="#ffffff" stroke="#b9b9b9"/>
<circle cx="670" cy="360" r="11" fill="#eeeeee" stroke="#b9b9b9"/>

<!-- (c) FlexiCubes δ -->
<rect x="818" y="140" width="220" height="220" fill="none" stroke="#b9b9b9" stroke-width="1.2" stroke-dasharray="5 4"/>
<path d="M836,156 L1020,150 L1026,332 L806,348 Z" fill="none" stroke="#5fa886" stroke-width="1.6"/>
<line x1="818" y1="140" x2="832" y2="152" stroke="#5fa886" stroke-width="1.4" marker-end="url(#ag)"/>
<line x1="1038" y1="140" x2="1024" y2="148" stroke="#5fa886" stroke-width="1.4" marker-end="url(#ag)"/>
<line x1="818" y1="360" x2="809" y2="351" stroke="#5fa886" stroke-width="1.4" marker-end="url(#ag)"/>
<line x1="1038" y1="360" x2="1029" y2="336" stroke="#5fa886" stroke-width="1.4" marker-end="url(#ag)"/>
<circle cx="836" cy="156" r="4" fill="#5fa886"/>
<circle cx="1020" cy="150" r="4" fill="#5fa886"/>
<circle cx="1026" cy="332" r="4" fill="#5fa886"/>
<circle cx="806" cy="348" r="4" fill="#5fa886"/>

<!-- 文字最后画 -->
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">FlexiCubes 给对偶顶点三组可学的自由度，而且都关在格子里</text>
<text x="30" y="54" font-size="13" fill="#6b7280">紫 = 棱上零点 u_e；黄 = 对偶顶点 v_d；绿 = 可学参数带来的活动范围；黑虚线 = 带尖角的真实表面（二维示意）</text>

<text x="192" y="100" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(a) DMC 质心</text>
<text x="560" y="100" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(b) 加上角权重 α 与边权重 β</text>
<text x="928" y="100" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(c) 再加格点位移 δ</text>

<text x="82" y="144" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<text x="302" y="144" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<text x="82" y="364" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<text x="302" y="364" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">−</text>
<text x="450" y="144" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<text x="670" y="144" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<text x="450" y="364" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<text x="670" y="364" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">−</text>

<text x="230" y="252" font-size="11" fill="#6b7280" text-anchor="end">真实尖角</text>
<text x="312" y="284" font-size="11" fill="#6b7280">u_e</text>
<text x="222" y="384" font-size="11" fill="#6b7280" text-anchor="middle">u_e</text>
<text x="270" y="338" font-size="11" fill="#6b7280">v_d</text>

<text x="680" y="184" font-size="11" fill="#6b7280">u_e</text>
<text x="524" y="384" font-size="11" fill="#6b7280" text-anchor="middle">u_e</text>
<text x="586" y="248" font-size="11" fill="#6b7280" text-anchor="end">v_d 落在尖角上</text>

<text x="928" y="254" font-size="11" fill="#9ca3af" text-anchor="middle">虚线 = 原格子</text>
<text x="928" y="272" font-size="11" fill="#9ca3af" text-anchor="middle">绿框 = 挪过的格子</text>

<text x="192" y="406" font-size="11" fill="#6b7280" text-anchor="middle">u_e 由线性插值定死，v_d 取零点质心。</text>
<text x="192" y="424" font-size="11" fill="#6b7280" text-anchor="middle">几何只由符号和 s 的数值决定，</text>
<text x="192" y="442" font-size="11" fill="#6b7280" text-anchor="middle">质心够不着格子里的尖角。</text>
<text x="560" y="406" font-size="11" fill="#6b7280" text-anchor="middle">α 让零点沿棱滑动，β 给零点加权平均；</text>
<text x="560" y="424" font-size="11" fill="#6b7280" text-anchor="middle">v_d 可落在绿三角内任一点，尖角也够得着。</text>
<text x="560" y="442" font-size="11" fill="#6b7280" text-anchor="middle">两者都是凸组合，点走不出格子。</text>
<text x="928" y="406" font-size="11" fill="#6b7280" text-anchor="middle">δ 挪动格点本身，让格子贴薄结构。</text>
<text x="928" y="424" font-size="11" fill="#6b7280" text-anchor="middle">位移上限是半个格距，格子不会翻转；</text>
<text x="928" y="442" font-size="11" fill="#6b7280" text-anchor="middle">图中位移只是示意，未按比例。</text>
</svg>
