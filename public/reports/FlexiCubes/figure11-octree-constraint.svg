<text x="389" y="314" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<text x="389" y="234" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">−</text>
<text x="309" y="234" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">−</text>
<text x="209" y="194" font-size="14" fill="#9ca3af" text-anchor="middle" font-weight="700">粗格</text>
<text x="284" y="100" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(a) 不加约束：悬挂格点自己学 SDF</text>
<text x="293" y="234" font-size="11" fill="#d9877a" text-anchor="end">悬挂格点</text>
<text x="284" y="392" font-size="11" fill="#6b7280" text-anchor="middle">细格一侧：悬挂格点是负号，两段棱上都有零点，面伸到交界上；</text>
<text x="284" y="412" font-size="11" fill="#6b7280" text-anchor="middle">粗格一侧：四角全是正号，这条棱上没有零点，不出任何面；</text>
<text x="284" y="432" font-size="11" fill="#6b7280" text-anchor="middle">两边对不上，面在交界处敞口，就是裂缝或非流形。</text>
<text x="701" y="154" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<text x="701" y="314" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<text x="861" y="154" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<text x="861" y="314" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<text x="941" y="154" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<text x="941" y="314" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<text x="941" y="234" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">−</text>
<text x="861" y="234" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<text x="761" y="194" font-size="14" fill="#9ca3af" text-anchor="middle" font-weight="700">粗格</text>
<text x="836" y="100" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(b) 加约束：悬挂格点取粗格面插值</text>
<text x="845" y="234" font-size="11" fill="#5fa886" text-anchor="end">= 两端插值</text>
<text x="836" y="392" font-size="11" fill="#6b7280" text-anchor="middle">悬挂格点不再有自己的 SDF，直接取粗格那条边两端的插值；</text>
<text x="836" y="412" font-size="11" fill="#6b7280" text-anchor="middle">两侧看到的符号一致，面在细格内部拐回去，不碰交界；</text>
<text x="836" y="432" font-size="11" fill="#6b7280" text-anchor="middle">三维里是粗格面四个角的双线性插值，权重预先算好。</text>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">八叉树交界：细格多出来的格点不许自己定符号</text>
<text x="30" y="54" font-size="13" fill="#6b7280">红 = 自己学 SDF 的悬挂格点与它造成的裂缝；绿 = 按粗格插值的悬挂格点；黑线 = 抽出的表面。二维示意，按原文 Figure 11 重画。</text>
