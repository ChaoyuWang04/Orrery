<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700" text-anchor="start">VALL-E 在一张 8 行的码矩阵上生成：第 1 行自回归逐格写，第 2–8 行每次并行写满一整行</text>
<text x="30" y="56" font-size="13" fill="#6b7280" text-anchor="start">灰 = 3 秒登记录音经 EnCodec 编出的声学 prompt（已知）；绿 = AR 逐帧生成的第 1 层；紫 = NAR 每次调用并行生成的一整行；黄 = 音素条件。</text>
<text x="30" y="76" font-size="13" fill="#6b7280" text-anchor="start">每一列是一帧（24 kHz 下每秒 75 帧，3 秒 prompt 约 225 帧）；每一行是 EnCodec 的一本码本。按原文 Figure 3 与 4.2–4.3 节（PDF p. 5–7）重画，机制示意。</text>
<text x="310.0" y="104" font-size="11" fill="#111827" text-anchor="middle">声学 prompt（约 225 帧）</text>
<text x="710.0" y="104" font-size="11" fill="#111827" text-anchor="middle">待生成的目标语音（长度由 AR 决定）</text>
<rect x="190" y="112" width="824" height="24" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="202" y="128" font-size="11" fill="#111827" text-anchor="start">音素 prompt：登记录音的转写音素 + 待合成文本的音素，拼成一段（AR 与 NAR 都用）</text>
<text x="36" y="165" font-size="14" fill="#111827" font-weight="700" text-anchor="start">第 1 层</text>
<text x="36" y="197" font-size="11" fill="#111827" text-anchor="start">第 2 层</text>
<text x="36" y="229" font-size="11" fill="#111827" text-anchor="start">第 3 层</text>
<text x="36" y="261" font-size="11" fill="#111827" text-anchor="start">第 4 层</text>
<text x="36" y="293" font-size="11" fill="#111827" text-anchor="start">第 5 层</text>
<text x="36" y="325" font-size="11" fill="#111827" text-anchor="start">第 6 层</text>
<text x="36" y="357" font-size="11" fill="#111827" text-anchor="start">第 7 层</text>
<text x="36" y="389" font-size="11" fill="#111827" text-anchor="start">第 8 层</text>
<rect x="190" y="146" width="240" height="26" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="310.0" y="163" font-size="11" fill="#111827" text-anchor="middle">第 1 层：AR 前缀，NAR 也看</text>
<rect x="190" y="178" width="240" height="218" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="310.0" y="282.0" font-size="11" fill="#111827" text-anchor="middle">第 2–8 层：只有 NAR 看</text>
<text x="310.0" y="300.0" font-size="11" fill="#6b7280" text-anchor="middle">（NAR 把 prompt 的 8 层嵌入相加后使用）</text>
<rect x="450" y="146" width="36" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="468.0" y="163" font-size="11" fill="#111827" text-anchor="middle">1</text>
<rect x="490" y="146" width="36" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="508.0" y="163" font-size="11" fill="#111827" text-anchor="middle">2</text>
<rect x="530" y="146" width="36" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="548.0" y="163" font-size="11" fill="#111827" text-anchor="middle">3</text>
<rect x="570" y="146" width="36" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="588.0" y="163" font-size="11" fill="#111827" text-anchor="middle">4</text>
<rect x="610" y="146" width="36" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="628.0" y="163" font-size="11" fill="#111827" text-anchor="middle">…</text>
<rect x="650" y="146" width="36" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="668.0" y="163" font-size="11" fill="#111827" text-anchor="middle">…</text>
<rect x="690" y="146" width="36" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="708.0" y="163" font-size="11" fill="#111827" text-anchor="middle">…</text>
<rect x="730" y="146" width="36" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="748.0" y="163" font-size="11" fill="#111827" text-anchor="middle">…</text>
<rect x="770" y="146" width="36" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="788.0" y="163" font-size="11" fill="#111827" text-anchor="middle">…</text>
<rect x="810" y="146" width="36" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="828.0" y="163" font-size="11" fill="#111827" text-anchor="middle">…</text>
<rect x="850" y="146" width="36" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="868.0" y="163" font-size="11" fill="#111827" text-anchor="middle">…</text>
<rect x="890" y="146" width="36" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="908.0" y="163" font-size="11" fill="#111827" text-anchor="middle">…</text>
<rect x="930" y="146" width="36" height="26" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="948.0" y="163" font-size="11" fill="#111827" text-anchor="middle">T</text>
<rect x="970" y="146" width="40" height="26" rx="4" fill="#ffffff" stroke="#5fa886"/>
<text x="990" y="163" font-size="11" fill="#5fa886" text-anchor="middle">EOS</text>
<rect x="450" y="178" width="516" height="26" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="708.0" y="195" font-size="11" fill="#111827" text-anchor="middle">NAR 第 1 次调用：看得见第 1–1 层全部帧，一次写完第 2 层</text>
<rect x="450" y="210" width="516" height="26" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="708.0" y="227" font-size="11" fill="#111827" text-anchor="middle">NAR 第 2 次调用：看得见第 1–2 层全部帧，一次写完第 3 层</text>
<rect x="450" y="242" width="516" height="26" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="708.0" y="259" font-size="11" fill="#111827" text-anchor="middle">NAR 第 3 次调用：看得见第 1–3 层全部帧，一次写完第 4 层</text>
<rect x="450" y="274" width="516" height="26" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="708.0" y="291" font-size="11" fill="#111827" text-anchor="middle">NAR 第 4 次调用：看得见第 1–4 层全部帧，一次写完第 5 层</text>
<rect x="450" y="306" width="516" height="26" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="708.0" y="323" font-size="11" fill="#111827" text-anchor="middle">NAR 第 5 次调用：看得见第 1–5 层全部帧，一次写完第 6 层</text>
<rect x="450" y="338" width="516" height="26" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="708.0" y="355" font-size="11" fill="#111827" text-anchor="middle">NAR 第 6 次调用：看得见第 1–6 层全部帧，一次写完第 7 层</text>
<rect x="450" y="370" width="516" height="26" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="708.0" y="387" font-size="11" fill="#111827" text-anchor="middle">NAR 第 7 次调用：看得见第 1–7 层全部帧，一次写完第 8 层</text>
<rect x="16" y="416" width="1088" height="128" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36" y="442" font-size="14" fill="#111827" font-weight="700" text-anchor="start">两个模型怎么分工</text>
<text x="36" y="464" font-size="11" fill="#6b7280" text-anchor="start">AR：只写第 1 层，每步只看左边；采样解码（beam search 会陷入无限循环），输出 EOS 即停，于是语速与总长度由它决定。</text>
<text x="36" y="484" font-size="11" fill="#6b7280" text-anchor="start">NAR：结构同 AR，但有 8 套声学嵌入，层号 j 经 AdaLN 注入；同一行内所有帧互相可见，贪心解码，共调用 7 次。</text>
<text x="36" y="504" font-size="11" fill="#6b7280" text-anchor="start">每行的格子数由第 1 行定死，所以 NAR 每层是一次前向；但第 j 层要等第 j−1 层写完，7 次调用之间仍是串行。</text>
<rect x="870" y="432" width="210" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="975" y="454" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">EnCodec 解码器</text>
<text x="975" y="472" font-size="11" fill="#6b7280" text-anchor="middle">8 层码一起还原 24 kHz 波形</text>
</svg>