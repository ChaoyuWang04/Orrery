<text x="800.0" y="198.0" font-size="11" fill="#6b7280" text-anchor="start">加卡买到的是「塞得下」，</text>
<text x="800.0" y="216.0" font-size="11" fill="#6b7280" text-anchor="start">不是并行</text>
<rect x="16.0" y="272.0" width="1088.0" height="184.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="30.0" y="292.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">(c) GPipe：mini-batch 切成 M = 4 个微批，F(k,m) 里 k 是分区、m 是微批</text>
<text x="30.0" y="309.0" font-size="11" fill="#6b7280" text-anchor="start">先做完全部微批的前向（下标递增），再做全部反向（下标递减），最后四卡一起更新；中间那块白底就是气泡</text>
