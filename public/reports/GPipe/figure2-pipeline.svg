<rect x="0" y="0" width="1120" height="472" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">GPipe 图 2 重画：按层切成 4 段后，只切层会空转，切成微批才让 4 张卡同时干活</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">紫 = 前向 F；绿 = 反向 B；黄 = 整个 mini-batch 结束后的同步更新；白底 = 空转。行从上到下是 Device 3 到 Device 0，与原图同向。</text>
<text x="30.0" y="72.0" font-size="13" fill="#6b7280" text-anchor="start">格子长短照原图比例（反向画得比前向长约 1.3 倍），是机制示意，不是实测时间；两幅的横轴不是同一比例。</text>
<rect x="16.0" y="86.0" width="1088.0" height="172.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="30.0" y="106.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">(b) 朴素模型并行：整份 mini-batch 走完 F0→F3，再走完 B3→B0</text>
<text x="30.0" y="123.0" font-size="11" fill="#6b7280" text-anchor="start">层与层有依赖，同一时刻只有 1 张卡在算，其余 3 张在等</text>
