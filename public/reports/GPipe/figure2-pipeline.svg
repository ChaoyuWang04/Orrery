<text x="925.0" y="354.0" font-size="11" fill="#6b7280" text-anchor="start">空着 3 格前向 + 3 格反向：</text>
<text x="925.0" y="372.0" font-size="11" fill="#6b7280" text-anchor="start">正是 K−1 = 3 段灌满与排空。</text>
<text x="925.0" y="396.0" font-size="11" fill="#6b7280" text-anchor="start">空转占比 = (K−1)/(M+K−1)，</text>
<text x="925.0" y="414.0" font-size="11" fill="#6b7280" text-anchor="start">这里 3/7 ≈ 43%；M 越大越薄</text>
