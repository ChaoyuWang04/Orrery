<text x="30" y="560" font-size="12" fill="#6b7280" text-anchor="start">据 PDF p. 5 Figure 2 重画。(a)(b) 取图上标注；(c)(d) 除 MLA 为读图外，其余按 Table II 公式、B = 1 算出，与图上曲线端点一致。都是理论值，不是实测。</text>
<text x="30" y="580" font-size="12" fill="#6b7280" text-anchor="start">MLA 在 (d) 里最高，是因为推理走「吸收上投影」的 MQA 模式：省带宽、多花算力（见附录 B）。</text>
