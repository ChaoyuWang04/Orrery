<text x="36" y="410" font-size="12" fill="#6b7280" text-anchor="start">附录 B 的论证（PDF p. 12–13）：MQA 模式把算术强度推到 2 × 头数（128 头即 256），贴近 H100 BF16 的屋脊 295 FLOPs/byte，单卡解码很划算；</text>
<text x="36" y="430" font-size="12" fill="#6b7280" text-anchor="start">但一上 TP，共享 KV 必须复制到每张卡。GQA / CCGQA 的算术强度只有「组数」，却能按 KV 头切给各卡。作者认为这也是用 MLA 的模型偏向专家并行与流水线并行的原因。</text>
<text x="36" y="464" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p. 12–14 附录 B 与 Figure 8 画的机制示意，不是实测。</text>
