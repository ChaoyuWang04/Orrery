<marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8f8bd8"/></marker>
<marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fa886"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 1：CCA 在进注意力之前，对压缩后的 q、k、v 做了什么</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">灰 = 线性投影与归一化；绿 = CCA 加的三件事（卷积、QK 均值、V 平移）；黄 = 存进 KV cache 的 k̃、ṽ；紫 = 注意力本身，全程在宽 E/C 上。</text>
<rect x="24" y="250" width="48" height="40" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="48" y="275" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">x</text>
<line x1="72" y1="270" x2="90" y2="270" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="90" y1="120" x2="90" y2="420" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="90" y1="120" x2="108" y2="120" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="90" y1="240" x2="108" y2="240" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="106" y="100" width="98" height="40" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="155.0" y="117" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">下投影 W<tspan baseline-shift="sub" font-size="75%">Q</tspan></text>
<text x="155.0" y="132" font-size="10" fill="#6b7280" text-anchor="middle">E → E/C</text>
<line x1="200" y1="120" x2="228" y2="120" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="230" y="100" width="120" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="290.0" y="117" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">卷积 1：沿序列</text>
<text x="290.0" y="132" font-size="10" fill="#6b7280" text-anchor="middle">因果，深度可分</text>
<line x1="350" y1="120" x2="378" y2="120" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="380" y="100" width="130" height="40" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="445.0" y="117" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">卷积 2：序列 + 通道</text>
<text x="445.0" y="132" font-size="10" fill="#6b7280" text-anchor="middle">头内分组</text>
<line x1="510" y1="120" x2="530" y2="120" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<circle cx="544.0" cy="120.0" r="12" fill="#e3f4ec" stroke="#5fa886"/>
<text x="544" y="125" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<line x1="556" y1="120" x2="578" y2="120" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="580" y="100" width="160" height="40" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="660.0" y="117" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">L2 归一 × √d<tspan baseline-shift="sub" font-size="75%">h</tspan></text>
<text x="660.0" y="132" font-size="10" fill="#6b7280" text-anchor="middle">按头</text>
