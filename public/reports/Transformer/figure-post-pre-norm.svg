<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">LayerNorm 放在哪：原文放在残差相加之后，后来的默认放到子层之前</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">紫 = 子层（注意力或前馈）；黄 = LayerNorm；灰线 = 残差这条「直通路」。左边是原文，右边是论文之后的做法。</text>
<rect x="16.0" y="78.0" width="520.0" height="370.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="276.0" y="102.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(a) 原文：post-norm</text>
<text x="276.0" y="122.0" font-size="11" fill="#6b7280" text-anchor="middle">PDF p. 3：LayerNorm(x + Sublayer(x))</text>
<text x="316.0" y="420.0" font-size="12" fill="#111827" text-anchor="middle">x（上一层输出）</text>
<line x1="316.0" y1="404.0" x2="316.0" y2="342.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="226.0" y="300.0" width="180.0" height="40.0" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="316.0" y="325.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">子层</text>
<line x1="316.0" y1="300.0" x2="316.0" y2="266.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<circle cx="316" cy="254" r="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
<text x="316.0" y="259.0" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<path d="M 316 396 L 166 396 L 166 254 L 302 254" fill="none" stroke="#b9b9b9" stroke-width="3" marker-end="url(#ar)"/>
<line x1="316.0" y1="242.0" x2="316.0" y2="222.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="226.0" y="182.0" width="180.0" height="38.0" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="316.0" y="206.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">LayerNorm</text>
<line x1="316.0" y1="182.0" x2="316.0" y2="162.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="316.0" y="152.0" font-size="12" fill="#111827" text-anchor="middle">下一层输入：LN(x + 子层(x))</text>
<text x="40.0" y="184.0" font-size="12" fill="#6b7280" text-anchor="start">每一层的残差和都要</text>
<text x="40.0" y="202.0" font-size="12" fill="#6b7280" text-anchor="start">再过一次 LayerNorm。</text>
<rect x="584.0" y="78.0" width="520.0" height="370.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="844.0" y="102.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(b) 之后：pre-norm</text>
<text x="844.0" y="122.0" font-size="11" fill="#6b7280" text-anchor="middle">tensor2tensor 后续默认；GPT-2 等也采用</text>
<text x="884.0" y="420.0" font-size="12" fill="#111827" text-anchor="middle">x（上一层输出）</text>
<line x1="884.0" y1="404.0" x2="884.0" y2="382.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="794.0" y="342.0" width="180.0" height="38.0" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="884.0" y="366.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">LayerNorm</text>
<line x1="884.0" y1="342.0" x2="884.0" y2="300.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="794.0" y="258.0" width="180.0" height="40.0" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="884.0" y="283.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">子层</text>
<line x1="884.0" y1="258.0" x2="884.0" y2="222.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<circle cx="884" cy="210" r="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
<text x="884.0" y="215.0" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<path d="M 884 396 L 734 396 L 734 210 L 870 210" fill="none" stroke="#b9b9b9" stroke-width="3" marker-end="url(#ar)"/>
<line x1="884.0" y1="198.0" x2="884.0" y2="162.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="884.0" y="152.0" font-size="12" fill="#111827" text-anchor="middle">下一层输入：x + 子层(LN(x))</text>
<text x="608.0" y="184.0" font-size="12" fill="#6b7280" text-anchor="start">残差路上没有任何归一化，</text>
<text x="608.0" y="202.0" font-size="12" fill="#6b7280" text-anchor="start">梯度可以直通到底层。</text>
<text x="30.0" y="478.0" font-size="11" fill="#9ca3af" text-anchor="start">(a) 据 PDF p. 3 第 3.1 节；(b) 据 tensor2tensor 官方仓库的 transformer_base_v2 起的默认超参，</text>
<text x="30.0" y="496.0" font-size="11" fill="#9ca3af" text-anchor="start">以及 Xiong 等 2020（ICML）的分析。两幅都省略了 dropout。</text>
</svg>
