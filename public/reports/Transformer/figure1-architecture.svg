<text x="782.0" y="118.0" font-size="12" fill="#111827" text-anchor="start">→ 下一个 Token 的概率</text>
<path d="M 250 330 L 250 300 L 470.0 300 L 470.0 443 L 528.0 443" fill="none" stroke="#8f8bd8" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="410.0" y="292.0" font-size="12" fill="#6b7280" text-anchor="middle">K、V</text>
<text x="900.0" y="240.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">基础版的尺寸（PDF p. 3、5、9）：</text>
<text x="900.0" y="260.0" font-size="12" fill="#111827" text-anchor="start">· 编码器、解码器各 6 层</text>
<text x="900.0" y="280.0" font-size="12" fill="#111827" text-anchor="start">· 模型宽 d_model = 512</text>
<text x="900.0" y="300.0" font-size="12" fill="#111827" text-anchor="start">· 8 个头，每头 d_k = d_v = 64</text>
<text x="900.0" y="320.0" font-size="12" fill="#111827" text-anchor="start">· 前馈中间层 d_ff = 2048</text>
<text x="900.0" y="340.0" font-size="12" fill="#111827" text-anchor="start">· 约 65M 参数</text>
<text x="900.0" y="360.0" font-size="12" fill="#111827" text-anchor="start"></text>
<text x="900.0" y="380.0" font-size="12" fill="#111827" text-anchor="start">每个子层的输出都是</text>
<text x="900.0" y="400.0" font-size="12" fill="#111827" text-anchor="start">LayerNorm(x + Sublayer(x))，</text>
<text x="900.0" y="420.0" font-size="12" fill="#111827" text-anchor="start">进残差之前先做 dropout。</text>
<text x="30.0" y="752.0" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p. 3 Figure 1 重画，结构与原图一致，中文标注与尺寸为本文所加。</text>
