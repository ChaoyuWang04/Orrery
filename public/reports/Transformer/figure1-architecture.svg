<text x="650.0" y="347.0" font-size="11" fill="#6b7280" text-anchor="middle">512 → 2048 → 512，ReLU</text>
<line x1="650.0" y1="310.0" x2="650.0" y2="292.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
