<line x1="650.0" y1="420.0" x2="650.0" y2="402.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="530.0" y="370.0" width="240.0" height="32.0" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="650.0" y="390.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">残差相加 + LayerNorm</text>
<path d="M 650 474 L 512.0 474 L 512.0 386 L 528.0 386" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="650.0" y1="370.0" x2="650.0" y2="356.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="530.0" y="310.0" width="240.0" height="46.0" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
