<rect x="0" y="0" width="1120" height="760" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 1：编码器读整句，解码器一边看自己写过的、一边查编码器</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">紫 = 注意力子层；绿 = 逐位置前馈；黄 = 残差相加后做 LayerNorm（原文的 post-norm）；灰 = 嵌入、位置编码与输出层。</text>
