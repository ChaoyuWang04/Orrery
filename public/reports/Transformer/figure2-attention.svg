<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 2：一个头怎么算，八个头怎么拼</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">紫 = 矩阵乘；黄 = 缩放与掩码；绿 = softmax；灰 = 线性投影与拼接。方框旁的小字是张量形状（n 个查询、m 个键）。</text>
