<text x="266.0" y="282.0" font-size="11" fill="#6b7280" text-anchor="middle">每行非负、和为 1</text>
<line x1="266.0" y1="248.0" x2="266.0" y2="228.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
