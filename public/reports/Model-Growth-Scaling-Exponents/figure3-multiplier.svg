<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">每行左点 = 10¹⁸ FLOPs 处的倍数，箭头尖 = 10²⁰ 处。箭头越长，倍数随规模涨得越多，即指数更好；箭头很短或没有，就是只改常数。</text>
<text x="30" y="74" font-size="13" fill="#6b7280" text-anchor="start">灰 = 无边界算子、无生长；紫 = 有边界算子、固定遍数；绿 = 生长。右列是图例给出的拟合指数 γ。</text>
