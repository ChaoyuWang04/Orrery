<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 1 重画：六个变体是同一个「前导—核心—收尾」家族</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">最小规模 d6（前导 2 块、核心 2 块、收尾 2 块）。灰 = 前导与收尾；紫、绿、黄、红 = 四份不同的核心权重，同色即同一份权重。</text>
<text x="30" y="74" font-size="13" fill="#6b7280" text-anchor="start">虚线框 = 训练中途生长之后才启用的核心遍；⊕ = 边界算子 h ← Norm(h) + αe，e 是前导输出。</text>
