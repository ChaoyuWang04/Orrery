<text x="30" y="488" font-size="11" fill="#9ca3af" text-anchor="start">KL 有效深度：logit lens 解码每块之后的残差流，KL 峰值之后第一个与最终输出相差不超过 2 nats 的块（PDF p. 14）。执行深度按 PDF p. 20 Table 2。</text>
<text x="30" y="506" font-size="11" fill="#9ca3af" text-anchor="start">Deep Vanilla、Untied-2、Untied-Grow 的 20 / 24 / 36 是 PDF p. 13–14 正文的数；其余读自 Figure 6 左图。把两张表并排是本文的做法，论文没有这样对照。</text>
