<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">每行取各阶梯最大的那个模型（约 10²⁰ FLOPs）。空心框长 = 执行深度（Table 2），实心条长 = KL 有效深度（Figure 6）。</text>
<text x="30" y="74" font-size="13" fill="#6b7280" text-anchor="start">灰 = 无边界算子；紫 = 有边界算子、固定 2 遍；绿 = 生长到 4 遍。实心条短于空心框的那一截，就是「执行了却几乎不改预测」的块。</text>
