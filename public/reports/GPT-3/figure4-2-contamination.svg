<text x="124" y="172" font-size="11" fill="#111827" text-anchor="start">QuAC +20%：只剩 1% 干净样本，被见过的是原文不是问答</text>
<text x="168" y="318" font-size="11" fill="#111827" text-anchor="start">SQuADv2 −2%</text>
<text x="176" y="420" font-size="11" fill="#111827" text-anchor="start">DROP −21%：见过的只是原文，剩下的样本分布略不同</text>
<text x="238" y="278" font-size="11" fill="#111827" text-anchor="start">Symbol Insertion：重叠高但分数不变，是伪匹配</text>
<text x="452" y="332" font-size="11" fill="#111827" text-anchor="end">Winograd −3%：训练集里确有 132 条</text>
<text x="646" y="352" font-size="11" fill="#111827" text-anchor="end">PIQA −4%：打星号</text>
<text x="756" y="410" font-size="11" fill="#111827" text-anchor="end">WMT16 德→英 −5%：碰撞只是单语新闻片段</text>
<text x="990" y="384" font-size="11" fill="#111827" text-anchor="end">变位词 A1 −8%、A2 −7%</text>
<text x="925" y="450" font-size="11" fill="#111827" text-anchor="end">反写单词 −26%：被剔掉的多是回文</text>
<text x="1008" y="126" font-size="11" fill="#6b7280">↑ 干净子集分数更高</text>
<text x="1008" y="462" font-size="11" fill="#6b7280">↓ 全集分数更高</text>
<text x="550" y="514" font-size="12" fill="#6b7280" text-anchor="middle">干净样本占比（越靠右，能高置信确认干净的样本越多）</text>
<text x="30" y="548" font-size="11" fill="#9ca3af">据 PDF p. 45 表 C.1 的 42 行逐点重画（对应 p. 32 图 4.2）。表 C.1 用了另一组随机示例，分数与正文略有出入；复查结论见 p. 32–33。</text>
