<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="860" height="470" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">42 个准确率基准取平均：规模越大，三条线分得越开</text>
<text x="30" y="54" font-size="13" fill="#6b7280">灰 = 零样本，紫 = 单样本，绿 = 少样本。横轴按参数量对数刻度，八个点对应表 2.1 的八个规格。</text>

<g stroke="#eeeeee" stroke-width="1">
<line x1="90" y1="380" x2="700" y2="380"/>
<line x1="90" y1="310" x2="700" y2="310"/>
<line x1="90" y1="240" x2="700" y2="240"/>
<line x1="90" y1="170" x2="700" y2="170"/>
<line x1="90" y1="100" x2="700" y2="100"/>
<line x1="90" y1="100" x2="90" y2="380"/>
<line x1="287.2" y1="100" x2="287.2" y2="380"/>
<line x1="481.1" y1="100" x2="481.1" y2="380"/>
<line x1="700" y1="100" x2="700" y2="380"/>
</g>

<polyline fill="none" stroke="#9ca3af" stroke-width="2.2" points="90,356.9 176.7,333.8 242,323.3 287.2,314.9 348.7,303 425.3,292.5 481.1,279.9 700,220.4"/>
<polyline fill="none" stroke="#8f8bd8" stroke-width="2.2" points="90,342.2 176.7,321.2 242,307.2 287.2,296 348.7,278.5 425.3,269.4 481.1,235.1 700,161.6"/>
<polyline fill="none" stroke="#5fa886" stroke-width="2.2" points="90,342.2 176.7,314.9 242,298.1 287.2,284.8 348.7,261.7 425.3,249.1 481.1,214.1 700,117.5"/>
<circle cx="700" cy="220.4" r="4" fill="#9ca3af"/>
<circle cx="700" cy="161.6" r="4" fill="#8f8bd8"/>
<circle cx="700" cy="117.5" r="4" fill="#5fa886"/>
<circle cx="90" cy="356.9" r="4" fill="#9ca3af"/>
<circle cx="90" cy="342.2" r="4" fill="#5fa886"/>

<text x="82" y="384" font-size="11" fill="#6b7280" text-anchor="end">20</text>
<text x="82" y="314" font-size="11" fill="#6b7280" text-anchor="end">30</text>
<text x="82" y="244" font-size="11" fill="#6b7280" text-anchor="end">40</text>
<text x="82" y="174" font-size="11" fill="#6b7280" text-anchor="end">50</text>
<text x="82" y="104" font-size="11" fill="#6b7280" text-anchor="end">60</text>
<text x="30" y="88" font-size="11" fill="#6b7280">平均准确率</text>

<text x="90" y="400" font-size="11" fill="#6b7280" text-anchor="middle">125M</text>
<text x="287.2" y="400" font-size="11" fill="#6b7280" text-anchor="middle">1.3B</text>
<text x="425.3" y="400" font-size="11" fill="#6b7280" text-anchor="middle">6.7B</text>
<text x="481.1" y="400" font-size="11" fill="#6b7280" text-anchor="middle">13B</text>
<text x="700" y="400" font-size="11" fill="#6b7280" text-anchor="middle">175B</text>
<text x="395" y="422" font-size="12" fill="#6b7280" text-anchor="middle">参数量（对数刻度）</text>

<text x="712" y="122" font-size="12" fill="#111827" font-weight="700">少样本 约 58</text>
<text x="712" y="166" font-size="12" fill="#111827" font-weight="700">单样本 约 51</text>
<text x="712" y="225" font-size="12" fill="#111827" font-weight="700">零样本 约 43</text>
<text x="104" y="140" font-size="11" fill="#6b7280">125M：三条线相差约 2 分</text>
<text x="104" y="158" font-size="11" fill="#6b7280">175B：少样本比零样本高约 15 分</text>

<text x="30" y="452" font-size="11" fill="#9ca3af">据 PDF p. 5 图 1.3 读图重画，数值为读图近似。论文提醒这张平均图本身不应当作严格基准。</text>
