<text x="944" y="140" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">MLA 层（全局注意力）</text>
<text x="944" y="166" font-size="11" fill="#6b7280" text-anchor="middle">不加任何位置编码（NoPE）</text>
<text x="944" y="186" font-size="11" fill="#6b7280" text-anchor="middle">位置与「远近」全交给 KDA 层</text>
<text x="944" y="206" font-size="11" fill="#6b7280" text-anchor="middle">推理时可以化成纯 MQA</text>
<text x="944" y="226" font-size="11" fill="#6b7280" text-anchor="middle">长上下文不必调 RoPE 基频或 YaRN</text>
<text x="944" y="246" font-size="11" fill="#6b7280" text-anchor="middle">只有这 1/4 的层存 KV cache</text>
<rect x="804" y="284" width="280" height="130" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="944" y="310" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">MoE 通道混合</text>
<text x="944" y="336" font-size="11" fill="#6b7280" text-anchor="middle">256 个专家，每 Token 激活 8 个</text>
<text x="944" y="356" font-size="11" fill="#6b7280" text-anchor="middle">其中含 1 个共享专家</text>
<text x="944" y="376" font-size="11" fill="#6b7280" text-anchor="middle">总参 48B，激活 3B</text>
<text x="944" y="396" font-size="11" fill="#6b7280" text-anchor="middle">稀疏度 32，高于 Moonlight</text>
<rect x="804" y="434" width="280" height="96" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="944" y="460" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">骨架沿用 Moonlight</text>
<text x="944" y="486" font-size="11" fill="#6b7280" text-anchor="middle">三个对照模型（MLA、GDN-H、</text>
<text x="944" y="506" font-size="11" fill="#6b7280" text-anchor="middle">Kimi Linear RoPE 版）同骨架同参数量</text>
<text x="944" y="556" font-size="11" fill="#9ca3af" text-anchor="middle">层数、隐藏维、MLA 维度</text>
<text x="944" y="574" font-size="11" fill="#9ca3af" text-anchor="middle">论文正文都没给</text>
<text x="30" y="624" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 5–6（Figure 3、式 10 与参数化公式）和 p. 9（§5.4 配置）重画。结构示意，不代表真实层数。</text>
