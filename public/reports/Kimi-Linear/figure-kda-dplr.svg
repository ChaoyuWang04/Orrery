<text x="836" y="372" font-size="11" fill="#9ca3af" text-anchor="middle">输出与跨块状态更新：再省约 3 次矩阵乘</text>
<rect x="16" y="418" width="1088" height="166" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36" y="444" font-size="14" fill="#111827" text-anchor="start" font-weight="700">为什么这一步值钱</text>
<text x="36" y="470" font-size="13" fill="#6b7280" text-anchor="start">细粒度衰减让块内计算里出现 Γ<tspan baseline-shift="super" font-size="75%">i</tspan>/Γ<tspan baseline-shift="super" font-size="75%">j</tspan> 这样的除法。半精度下这会失真，GLA 的老办法是转到对数域、再做一层全精度的二级分块，</text>
<text x="36" y="492" font-size="13" fill="#6b7280" text-anchor="start">代价是用不满 Tensor Core 的半精度矩阵乘。需要这样特殊处理的矩阵越少，kernel 越快（PDF p. 5、15）。</text>
<text x="36" y="522" font-size="13" fill="#6b7280" text-anchor="start">Figure 2（batch 1、16 头）：输入 2K–64K 时 KDA 的 kernel 耗时约为通用 DPLR 的一半；读图约为 64K 时 57 ms 对 30 ms。</text>
<text x="36" y="544" font-size="13" fill="#6b7280" text-anchor="start">论文文字给的是「算子效率约提升 100%」「64K 以内接近 2 倍」（PDF p. 5、15）。</text>
<text x="36" y="570" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p. 5 §3.2、p. 14–15 §6.2 与 Listing 8 重画；方格是示意，C 取 6 只为画得下，实际 C = 64。</text>
