<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">把 DPLR 的 a、b 都绑到 k 上：块内要特殊处理的矩阵从 4 个减到 2 个</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">红 = 块内 C×C 注意力式矩阵，含累计衰减的倒数 1/Γ，要做全精度二级分块；灰虚线 = KDA 不再需要的那一份。</text>
