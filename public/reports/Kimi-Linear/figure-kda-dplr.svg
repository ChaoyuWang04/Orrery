<text x="284" y="100" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">通用 DPLR：(D − a<tspan baseline-shift="sub" font-size="75%">t</tspan> b<tspan baseline-shift="sub" font-size="75%">t</tspan><tspan baseline-shift="super" font-size="75%">⊤</tspan>) S<tspan baseline-shift="sub" font-size="75%">t−1</tspan> + k<tspan baseline-shift="sub" font-size="75%">t</tspan> v<tspan baseline-shift="sub" font-size="75%">t</tspan><tspan baseline-shift="super" font-size="75%">⊤</tspan></text>
<text x="284" y="120" font-size="11" fill="#6b7280" text-anchor="middle">a、b 是两组独立向量，D 是对角衰减</text>
<text x="836" y="100" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">KDA：D = Diag(α<tspan baseline-shift="sub" font-size="75%">t</tspan>)，a<tspan baseline-shift="sub" font-size="75%">t</tspan> = β<tspan baseline-shift="sub" font-size="75%">t</tspan> k<tspan baseline-shift="sub" font-size="75%">t</tspan>，b<tspan baseline-shift="sub" font-size="75%">t</tspan> = k<tspan baseline-shift="sub" font-size="75%">t</tspan> ⊙ α<tspan baseline-shift="sub" font-size="75%">t</tspan></text>
<text x="836" y="120" font-size="11" fill="#6b7280" text-anchor="middle">同一个受限 DPLR，只剩 k 与 α 两种量（PDF p. 14，式 1 改写）</text>
