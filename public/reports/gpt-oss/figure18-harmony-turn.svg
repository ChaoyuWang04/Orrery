<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 760" width="860" height="760" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="860" height="760" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<text x="30" y="34" font-size="19" font-weight="700" fill="#111827">harmony 里的一轮工具调用：谁说的、给谁看、何时停</text>
<text x="30" y="58" font-size="13" fill="#6b7280">灰 = 输入侧消息；紫 = analysis 通道（思维链）；黄 = commentary 通道（工具调用）；</text>
<text x="30" y="76" font-size="13" fill="#6b7280">绿 = final 通道（给用户看的答案）。右列是每条消息的结束符。</text>
<text x="40" y="110" font-size="13" font-weight="700" fill="#6b7280">输入（Figure 17）</text>
<rect x="40" y="122" width="600" height="78" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="56" y="144" font-size="14" font-weight="700" fill="#111827">system</text>
<text x="56" y="164" font-size="11" fill="#6b7280">知识截止 2024-06、当前日期、reasoning: low</text>
<text x="56" y="181" font-size="11" fill="#6b7280">声明有效通道 analysis / commentary / final；functions 工具必须走 commentary</text>
<line x1="640" y1="161.0" x2="690" y2="161.0" stroke="#9ca3af" stroke-width="1.4"/>
<text x="700" y="166.0" font-size="13" font-weight="700" fill="#111827" font-family="'SF Mono', Menlo, Consolas, monospace">&lt;|end|&gt;</text>
<rect x="40" y="212" width="600" height="62" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="56" y="234" font-size="14" font-weight="700" fill="#111827">developer</text>
<text x="56" y="254" font-size="11" fill="#6b7280">指令「Use a friendly tone」+ 工具签名 get_current_weather(location, format?)</text>
<line x1="640" y1="243.0" x2="690" y2="243.0" stroke="#9ca3af" stroke-width="1.4"/>
<text x="700" y="248.0" font-size="13" font-weight="700" fill="#111827" font-family="'SF Mono', Menlo, Consolas, monospace">&lt;|end|&gt;</text>
<rect x="40" y="286" width="600" height="50" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="56" y="308" font-size="14" font-weight="700" fill="#111827">user</text>
<text x="56" y="328" font-size="11" fill="#6b7280">What is the weather like in SF?</text>
<line x1="640" y1="311.0" x2="690" y2="311.0" stroke="#9ca3af" stroke-width="1.4"/>
<text x="700" y="316.0" font-size="13" font-weight="700" fill="#111827" font-family="'SF Mono', Menlo, Consolas, monospace">&lt;|end|&gt;</text>
<text x="56" y="364" font-size="12" fill="#111827" font-family="'SF Mono', Menlo, Consolas, monospace">&lt;|start|&gt;assistant</text>
<text x="220" y="364" font-size="11" fill="#9ca3af">输入到此为止，接下来由模型续写</text>
<line x1="340" y1="374" x2="340" y2="398" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="40" y="420" font-size="13" font-weight="700" fill="#6b7280">模型输出（Figure 18）</text>
<rect x="40" y="432" width="600" height="62" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="56" y="454" font-size="14" font-weight="700" fill="#111827">assistant · analysis</text>
<text x="56" y="474" font-size="11" fill="#6b7280">Need to use function get_weather.  只给编排器看的思维链</text>
<line x1="640" y1="463.0" x2="690" y2="463.0" stroke="#9ca3af" stroke-width="1.4"/>
<text x="700" y="468.0" font-size="13" font-weight="700" fill="#111827" font-family="'SF Mono', Menlo, Consolas, monospace">&lt;|end|&gt;</text>
<text x="700" y="485.0" font-size="11" fill="#9ca3af">这条消息说完了</text>
<rect x="40" y="506" width="600" height="78" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="56" y="528" font-size="14" font-weight="700" fill="#111827">assistant · commentary  to=functions.get_weather</text>
<text x="56" y="548" font-size="11" fill="#6b7280">&lt;|constrain|&gt;json  声明参数格式</text>
<text x="56" y="565" font-size="11" fill="#6b7280">{"location":"San_Francisco"}</text>
<line x1="640" y1="545.0" x2="690" y2="545.0" stroke="#9ca3af" stroke-width="1.4"/>
<text x="700" y="550.0" font-size="13" font-weight="700" fill="#111827" font-family="'SF Mono', Menlo, Consolas, monospace">&lt;|call|&gt;</text>
<text x="700" y="567.0" font-size="11" fill="#9ca3af">停下，去执行工具</text>
<line x1="340" y1="584" x2="340" y2="608" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="40" y="612" width="600" height="70" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-dasharray="5 4"/>
<text x="56" y="634" font-size="14" font-weight="700" fill="#111827">之后：tool 消息拼回 → assistant · final</text>
<text x="56" y="654" font-size="11" fill="#6b7280">工具结果作为 tool 角色的消息回填，模型再在 final 通道回答用户</text>
<text x="56" y="671" font-size="11" fill="#6b7280">卡内示例没有画出这一段（虚线框）</text>
<text x="30" y="712" font-size="11" fill="#9ca3af">据 PDF p. 30 Figure 17 与 p. 31 Figure 18 重画，消息正文有删节。示例里声明的函数名是 get_current_weather，</text>
<text x="30" y="730" font-size="11" fill="#9ca3af">模型调用的是 get_weather，原图如此。最后一框是本文按 §2.5.1 与 §2.5.3 的描述补的示意。</text>
</svg>