<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">IndexCache：F 层算下标，S 层只抄下标；训练时让一个索引器对准它服务的几层</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = 索引器；绿 = 每层自己的核心注意力（及其注意力分布）；黄 = 被多层共用的量；灰 = F / S 标记。</text>
