<text x="592" y="510" font-size="11" fill="#6b7280" text-anchor="start">索引器学的是这几层注意力分布的「质心」，挑一份几层都用得上的 Top-k。</text>
<text x="30" y="556" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p.3 Figure 2 与 p.4、p.6 的定义与命题 1 重画，是机制示意；FSSS 交替和各柱高度都是示意，不是实测。</text>
<text x="30" y="576" font-size="13" fill="#6b7280" text-anchor="start">论文实现用逐层 KL 的写法，因为 S 层只需接收 F 层的 q，不必把各层 p 传回来（PDF p.6）。</text>
