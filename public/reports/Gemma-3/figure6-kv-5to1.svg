<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<rect x="150.0" y="126.0" width="3.0" height="26.0" rx="2" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="150.0" y="160.0" width="3.0" height="26.0" rx="2" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="150.0" y="194.0" width="3.0" height="26.0" rx="2" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="150.0" y="228.0" width="3.0" height="26.0" rx="2" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="150.0" y="262.0" width="3.0" height="26.0" rx="2" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="150.0" y="296.0" width="340.0" height="26.0" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<line x1="640.0" y1="430.0" x2="1060.0" y2="430.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="640.0" y1="350.0" x2="1060.0" y2="350.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="640.0" y1="270.0" x2="1060.0" y2="270.0" stroke="#e5e7eb" stroke-width="1"/>
<line x1="640.0" y1="190.0" x2="1060.0" y2="190.0" stroke="#e5e7eb" stroke-width="1"/>
<polyline points="640.0,427.8 760.0,421.2 820.0,412.4 880.0,395.0 940.0,360.0 1000.0,290.0 1060.0,150.0" fill="none" stroke="#d4a24c" stroke-width="2.4"/>
<polyline points="640.0,427.8 760.0,426.6 820.0,425.2 880.0,422.4 940.0,416.8 1000.0,406.0 1060.0,384.0" fill="none" stroke="#8f8bd8" stroke-width="2.4"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">五个局部层配一个全局层：只有全局层的缓存随上下文变长</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">紫 = 局部滑动窗口层，缓存封顶 1024 个 Token；黄 = 全局层，缓存随上下文线性增长。左图按 PDF p. 1–2 的文字画，</text>
<text x="30.0" y="72.0" font-size="13" fill="#6b7280" text-anchor="start">条长按 128K 上下文时每层要存的 Token 数等比例缩放；右图据 Figure 6（PDF p. 7）重画，数值读自原图，约数。</text>
<text x="30.0" y="108.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">一组 6 层在 128K 上下文下各存多少 Token</text>
<text x="40.0" y="144.0" font-size="12" fill="#111827" text-anchor="start">第 1 层  局部</text>
<text x="161.0" y="144.0" font-size="11" fill="#6b7280" text-anchor="start">1024</text>
<text x="40.0" y="178.0" font-size="12" fill="#111827" text-anchor="start">第 2 层  局部</text>
<text x="161.0" y="178.0" font-size="11" fill="#6b7280" text-anchor="start">1024</text>
<text x="40.0" y="212.0" font-size="12" fill="#111827" text-anchor="start">第 3 层  局部</text>
<text x="161.0" y="212.0" font-size="11" fill="#6b7280" text-anchor="start">1024</text>
<text x="40.0" y="246.0" font-size="12" fill="#111827" text-anchor="start">第 4 层  局部</text>
<text x="161.0" y="246.0" font-size="11" fill="#6b7280" text-anchor="start">1024</text>
<text x="40.0" y="280.0" font-size="12" fill="#111827" text-anchor="start">第 5 层  局部</text>
<text x="161.0" y="280.0" font-size="11" fill="#6b7280" text-anchor="start">1024</text>
<text x="40.0" y="314.0" font-size="12" fill="#111827" text-anchor="start">第 6 层  全局</text>
<text x="498.0" y="314.0" font-size="11" fill="#6b7280" text-anchor="start">131,072（128K）</text>
<text x="40.0" y="344.0" font-size="11" fill="#6b7280" text-anchor="start">整组重复：27B 共 62 层，其中 10 层全局（层数来自官方实现，外部补充）。</text>
<text x="40.0" y="362.0" font-size="11" fill="#6b7280" text-anchor="start">Gemma 2 是局部与全局 1:1 交替，局部窗口 4096（PDF p. 7）。</text>
<text x="40.0" y="380.0" font-size="11" fill="#6b7280" text-anchor="start">窗口封顶的缓存不随上下文变长，账单里真正变长的只剩六分之一的层。</text>
<text x="600.0" y="108.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">2B 模型的 KV Cache 随上下文长度（MB）</text>
<text x="632.0" y="434.0" font-size="11" fill="#6b7280" text-anchor="end">0</text>
<text x="632.0" y="354.0" font-size="11" fill="#6b7280" text-anchor="end">2000</text>
<text x="632.0" y="274.0" font-size="11" fill="#6b7280" text-anchor="end">4000</text>
<text x="632.0" y="194.0" font-size="11" fill="#6b7280" text-anchor="end">6000</text>
<text x="640.0" y="448.0" font-size="11" fill="#6b7280" text-anchor="middle">1K</text>
<text x="760.0" y="448.0" font-size="11" fill="#6b7280" text-anchor="middle">4K</text>
<text x="820.0" y="448.0" font-size="11" fill="#6b7280" text-anchor="middle">8K</text>
<text x="880.0" y="448.0" font-size="11" fill="#6b7280" text-anchor="middle">16K</text>
<text x="940.0" y="448.0" font-size="11" fill="#6b7280" text-anchor="middle">32K</text>
<text x="1000.0" y="448.0" font-size="11" fill="#6b7280" text-anchor="middle">64K</text>
<text x="1060.0" y="448.0" font-size="11" fill="#6b7280" text-anchor="middle">128K</text>
<text x="850.0" y="468.0" font-size="11" fill="#6b7280" text-anchor="middle">上下文长度（对数轴）</text>
<text x="1052.0" y="154.0" font-size="12" fill="#111827" text-anchor="end" font-weight="700">纯全局 约 7000</text>
<text x="1052.0" y="374.0" font-size="12" fill="#111827" text-anchor="end" font-weight="700">5:1、窗口 1024 约 1100</text>
<text x="930.0" y="356.0" font-size="11" fill="#6b7280" text-anchor="end">约 1750</text>
<text x="930.0" y="408.8" font-size="11" fill="#6b7280" text-anchor="end">约 330</text>
<text x="30.0" y="500.0" font-size="13" fill="#6b7280" text-anchor="start">两条线都是 2B 纯文本消融模型，不是 27B。纯全局指 Gemma 1 与 Llama 那种每层都看全文的结构。</text>
<text x="30.0" y="522.0" font-size="13" fill="#6b7280" text-anchor="start">128K 时两者相差约 6 倍，与「六分之一的层随长度增长」的算术一致。</text>
</svg>
