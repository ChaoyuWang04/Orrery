<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">把 8 条轨迹分给 2 张训练卡：按负载贪心 vs 按 DFS 序连续切</text>
<text x="30" y="54" font-size="13" fill="#6b7280">绿 / 紫 / 黄 = 三组各自共享一段前缀的轨迹（A、B、C）；红框 = 在两张卡上各建了一份的共享前缀。机制示意，不是实测。</text>

<text x="30" y="92" font-size="14" fill="#111827" font-weight="700">先按字典序排好（即前缀树的一种合法 DFS 叶序），同组的轨迹挨在一起</text>
<rect x="30" y="106" width="120" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/><text x="90" y="126" font-size="11" fill="#111827" text-anchor="middle">A1</text>
<rect x="160" y="106" width="120" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/><text x="220" y="126" font-size="11" fill="#111827" text-anchor="middle">A2</text>
<rect x="290" y="106" width="120" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/><text x="350" y="126" font-size="11" fill="#111827" text-anchor="middle">A3</text>
<rect x="420" y="106" width="120" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="480" y="126" font-size="11" fill="#111827" text-anchor="middle">B1</text>
<rect x="550" y="106" width="120" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="610" y="126" font-size="11" fill="#111827" text-anchor="middle">B2</text>
<rect x="680" y="106" width="120" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="740" y="126" font-size="11" fill="#111827" text-anchor="middle">B3</text>
<rect x="810" y="106" width="120" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/><text x="870" y="126" font-size="11" fill="#111827" text-anchor="middle">C1</text>
<rect x="940" y="106" width="120" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/><text x="1000" y="126" font-size="11" fill="#111827" text-anchor="middle">C2</text>

<rect x="16" y="166" width="536" height="286" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="568" y="166" width="536" height="286" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="284" y="192" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(a) 贪心：下一条给当前最空的卡</text>
<text x="284" y="212" font-size="11" fill="#6b7280" text-anchor="middle">只看负载数字，不看谁和谁共享前缀</text>
<text x="836" y="192" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(b) DTA：在 DFS 序上切 K 段连续区间</text>
<text x="836" y="212" font-size="11" fill="#6b7280" text-anchor="middle">二分「最大一段的树 token 数」，贪心检查可行性</text>

<!-- greedy GPU0 -->
<text x="40" y="248" font-size="11" fill="#6b7280">GPU 0</text>
<rect x="90" y="232" width="76" height="26" rx="6" fill="#ffffff" stroke="#d9877a" stroke-width="2"/><text x="128" y="250" font-size="11" fill="#111827" text-anchor="middle">前缀 A</text>
<rect x="172" y="232" width="76" height="26" rx="6" fill="#ffffff" stroke="#d9877a" stroke-width="2"/><text x="210" y="250" font-size="11" fill="#111827" text-anchor="middle">前缀 B</text>
<rect x="254" y="232" width="76" height="26" rx="6" fill="#ffffff" stroke="#d9877a" stroke-width="2"/><text x="292" y="250" font-size="11" fill="#111827" text-anchor="middle">前缀 C</text>
<rect x="90" y="266" width="56" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/><text x="118" y="283" font-size="11" fill="#111827" text-anchor="middle">A1</text>
<rect x="152" y="266" width="56" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/><text x="180" y="283" font-size="11" fill="#111827" text-anchor="middle">A3</text>
<rect x="214" y="266" width="56" height="24" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="242" y="283" font-size="11" fill="#111827" text-anchor="middle">B2</text>
<rect x="276" y="266" width="56" height="24" rx="6" fill="#fdf1dc" stroke="#d4a24c"/><text x="304" y="283" font-size="11" fill="#111827" text-anchor="middle">C1</text>
<!-- greedy GPU1 -->
<text x="40" y="332" font-size="11" fill="#6b7280">GPU 1</text>
<rect x="90" y="316" width="76" height="26" rx="6" fill="#ffffff" stroke="#d9877a" stroke-width="2"/><text x="128" y="334" font-size="11" fill="#111827" text-anchor="middle">前缀 A</text>
<rect x="172" y="316" width="76" height="26" rx="6" fill="#ffffff" stroke="#d9877a" stroke-width="2"/><text x="210" y="334" font-size="11" fill="#111827" text-anchor="middle">前缀 B</text>
<rect x="254" y="316" width="76" height="26" rx="6" fill="#ffffff" stroke="#d9877a" stroke-width="2"/><text x="292" y="334" font-size="11" fill="#111827" text-anchor="middle">前缀 C</text>
<rect x="90" y="350" width="56" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/><text x="118" y="367" font-size="11" fill="#111827" text-anchor="middle">A2</text>
<rect x="152" y="350" width="56" height="24" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="180" y="367" font-size="11" fill="#111827" text-anchor="middle">B1</text>
<rect x="214" y="350" width="56" height="24" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="242" y="367" font-size="11" fill="#111827" text-anchor="middle">B3</text>
<rect x="276" y="350" width="56" height="24" rx="6" fill="#fdf1dc" stroke="#d4a24c"/><text x="304" y="367" font-size="11" fill="#111827" text-anchor="middle">C2</text>
<text x="40" y="414" font-size="11" fill="#6b7280">三段共享前缀在两张卡上各建一次；组越多、卡越多，</text>
<text x="40" y="432" font-size="11" fill="#6b7280">重复越多——负载看上去很齐，复用却被切碎了</text>

<!-- DFS contiguous GPU0 -->
<text x="592" y="248" font-size="11" fill="#6b7280">GPU 0</text>
<rect x="642" y="232" width="76" height="26" rx="6" fill="#e3f4ec" stroke="#5fa886"/><text x="680" y="250" font-size="11" fill="#111827" text-anchor="middle">前缀 A</text>
<rect x="724" y="232" width="76" height="26" rx="6" fill="#ffffff" stroke="#d9877a" stroke-width="2"/><text x="762" y="250" font-size="11" fill="#111827" text-anchor="middle">前缀 B</text>
<rect x="642" y="266" width="56" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/><text x="670" y="283" font-size="11" fill="#111827" text-anchor="middle">A1</text>
<rect x="704" y="266" width="56" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/><text x="732" y="283" font-size="11" fill="#111827" text-anchor="middle">A2</text>
<rect x="766" y="266" width="56" height="24" rx="6" fill="#e3f4ec" stroke="#5fa886"/><text x="794" y="283" font-size="11" fill="#111827" text-anchor="middle">A3</text>
<rect x="828" y="266" width="56" height="24" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="856" y="283" font-size="11" fill="#111827" text-anchor="middle">B1</text>
<!-- DFS contiguous GPU1 -->
<text x="592" y="332" font-size="11" fill="#6b7280">GPU 1</text>
<rect x="642" y="316" width="76" height="26" rx="6" fill="#ffffff" stroke="#d9877a" stroke-width="2"/><text x="680" y="334" font-size="11" fill="#111827" text-anchor="middle">前缀 B</text>
<rect x="724" y="316" width="76" height="26" rx="6" fill="#fdf1dc" stroke="#d4a24c"/><text x="762" y="334" font-size="11" fill="#111827" text-anchor="middle">前缀 C</text>
<rect x="642" y="350" width="56" height="24" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="670" y="367" font-size="11" fill="#111827" text-anchor="middle">B2</text>
<rect x="704" y="350" width="56" height="24" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="732" y="367" font-size="11" fill="#111827" text-anchor="middle">B3</text>
<rect x="766" y="350" width="56" height="24" rx="6" fill="#fdf1dc" stroke="#d4a24c"/><text x="794" y="367" font-size="11" fill="#111827" text-anchor="middle">C1</text>
<rect x="828" y="350" width="56" height="24" rx="6" fill="#fdf1dc" stroke="#d4a24c"/><text x="856" y="367" font-size="11" fill="#111827" text-anchor="middle">C2</text>
<line x1="898" y1="258" x2="898" y2="362" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="910" y="300" font-size="11" fill="#9ca3af">唯一的切口落在 B 组中间</text>
<text x="910" y="316" font-size="11" fill="#9ca3af">只有它的前缀重复一次</text>
<text x="592" y="414" font-size="11" fill="#6b7280">K 段只有 K−1 个切口，每个切口最多重复一条最长序列：</text>
<text x="592" y="432" font-size="11" fill="#6b7280">额外 token 不超过 (K−1) × 最长序列长度</text>
</svg>
