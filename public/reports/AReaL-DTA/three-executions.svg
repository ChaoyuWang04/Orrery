<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">同一棵四叶前缀树（Figure 2 的 s1–s4），三种训练执行方式</text>
<text x="30" y="54" font-size="13" fill="#6b7280">紫 = 此刻活在显存里、只算一份的片段；红 = 被重复计算的共享前缀副本；灰虚线 = 此刻不在显存（待 push 或已 pop）。</text>

<rect x="16" y="72" width="352" height="470" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="384" y="72" width="352" height="470" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="752" y="72" width="352" height="470" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>

<text x="192" y="98" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(a) Dense：每条轨迹当独立序列</text>
<text x="192" y="118" font-size="11" fill="#6b7280" text-anchor="middle">AReaL 默认的稠密因果注意力</text>
<text x="560" y="98" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(b) Sparse：整棵树打包 + 树掩码</text>
<text x="560" y="118" font-size="11" fill="#6b7280" text-anchor="middle">论文用 FlexAttention 实现的基线</text>
<text x="928" y="98" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(c) DTA：DFS 一次只走一条路径</text>
<text x="928" y="118" font-size="11" fill="#6b7280" text-anchor="middle">栈上只有当前根到叶路径的 token 与 KV</text>

<!-- Dense rows -->
<text x="36" y="160" font-size="11" fill="#6b7280">s1</text>
<rect x="60" y="143" width="64" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="92" y="161" font-size="11" fill="#111827" text-anchor="middle">seg1</text>
<rect x="130" y="143" width="64" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="162" y="161" font-size="11" fill="#111827" text-anchor="middle">seg2</text>
<rect x="200" y="143" width="64" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="232" y="161" font-size="11" fill="#111827" text-anchor="middle">seg3</text>
<text x="36" y="198" font-size="11" fill="#6b7280">s2</text>
<rect x="60" y="181" width="64" height="26" rx="6" fill="#fbe9e7" stroke="#d9877a"/><text x="92" y="199" font-size="11" fill="#111827" text-anchor="middle">seg1</text>
<rect x="130" y="181" width="64" height="26" rx="6" fill="#fbe9e7" stroke="#d9877a"/><text x="162" y="199" font-size="11" fill="#111827" text-anchor="middle">seg2</text>
<rect x="200" y="181" width="64" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="232" y="199" font-size="11" fill="#111827" text-anchor="middle">seg4</text>
<text x="36" y="236" font-size="11" fill="#6b7280">s3</text>
<rect x="60" y="219" width="64" height="26" rx="6" fill="#fbe9e7" stroke="#d9877a"/><text x="92" y="237" font-size="11" fill="#111827" text-anchor="middle">seg1</text>
<rect x="130" y="219" width="64" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="162" y="237" font-size="11" fill="#111827" text-anchor="middle">seg5</text>
<text x="36" y="274" font-size="11" fill="#6b7280">s4</text>
<rect x="60" y="257" width="64" height="26" rx="6" fill="#fbe9e7" stroke="#d9877a"/><text x="92" y="275" font-size="11" fill="#111827" text-anchor="middle">seg1</text>
<rect x="130" y="257" width="64" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="162" y="275" font-size="11" fill="#111827" text-anchor="middle">seg6</text>

<!-- Dense mask: regular causal triangle -->
<text x="36" y="318" font-size="11" fill="#9ca3af">每条序列各用一张规则的因果掩码</text>
<g>
<rect x="60" y="330" width="16" height="16" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="60" y="346" width="16" height="16" fill="#ecebfb" stroke="#8f8bd8"/><rect x="76" y="346" width="16" height="16" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="60" y="362" width="16" height="16" fill="#ecebfb" stroke="#8f8bd8"/><rect x="76" y="362" width="16" height="16" fill="#ecebfb" stroke="#8f8bd8"/><rect x="92" y="362" width="16" height="16" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="76" y="330" width="16" height="16" fill="#ffffff" stroke="#cbd2d9"/><rect x="92" y="330" width="16" height="16" fill="#ffffff" stroke="#cbd2d9"/><rect x="92" y="346" width="16" height="16" fill="#ffffff" stroke="#cbd2d9"/>
</g>
<text x="124" y="352" font-size="11" fill="#6b7280">下三角，稠密因果 kernel</text>
<text x="124" y="368" font-size="11" fill="#6b7280">能跑满</text>

<text x="36" y="420" font-size="14" fill="#111827" font-weight="700">seg1 算 4 遍，seg2 算 2 遍</text>
<text x="36" y="444" font-size="11" fill="#6b7280">前向、反向、激活都按组大小重复</text>
<text x="36" y="466" font-size="11" fill="#6b7280">大模型 + 16K 上下文要开激活重计算才不 OOM</text>
<text x="36" y="520" font-size="11" fill="#9ca3af">代价在计算量</text>

<!-- Sparse packed row -->
<text x="404" y="160" font-size="11" fill="#6b7280">打包后的一整条</text>
<rect x="404" y="170" width="50" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="429" y="188" font-size="11" fill="#111827" text-anchor="middle">seg1</text>
<rect x="458" y="170" width="50" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="483" y="188" font-size="11" fill="#111827" text-anchor="middle">seg2</text>
<rect x="512" y="170" width="50" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="537" y="188" font-size="11" fill="#111827" text-anchor="middle">seg3</text>
<rect x="566" y="170" width="50" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="591" y="188" font-size="11" fill="#111827" text-anchor="middle">seg4</text>
<rect x="620" y="170" width="50" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="645" y="188" font-size="11" fill="#111827" text-anchor="middle">seg5</text>
<rect x="674" y="170" width="50" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="699" y="188" font-size="11" fill="#111827" text-anchor="middle">seg6</text>
<text x="404" y="224" font-size="11" fill="#6b7280">每段只算一次，但六段的激活、KV、</text>
<text x="404" y="240" font-size="11" fill="#6b7280">反向中间量同时留在显存</text>

<!-- Sparse tree mask 6x6 -->
<text x="404" y="286" font-size="11" fill="#9ca3af">树掩码：每段只看自己的祖先</text>
<g>
<!-- row seg1: 1 0 0 0 0 0 -->
<rect x="404" y="298" width="14" height="14" fill="#ecebfb" stroke="#8f8bd8"/><rect x="418" y="298" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="432" y="298" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="446" y="298" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="460" y="298" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="474" y="298" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/>
<!-- row seg2: 1 1 0 0 0 0 -->
<rect x="404" y="312" width="14" height="14" fill="#ecebfb" stroke="#8f8bd8"/><rect x="418" y="312" width="14" height="14" fill="#ecebfb" stroke="#8f8bd8"/><rect x="432" y="312" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="446" y="312" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="460" y="312" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="474" y="312" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/>
<!-- row seg3: 1 1 1 0 0 0 -->
<rect x="404" y="326" width="14" height="14" fill="#ecebfb" stroke="#8f8bd8"/><rect x="418" y="326" width="14" height="14" fill="#ecebfb" stroke="#8f8bd8"/><rect x="432" y="326" width="14" height="14" fill="#ecebfb" stroke="#8f8bd8"/><rect x="446" y="326" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="460" y="326" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="474" y="326" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/>
<!-- row seg4: 1 1 0 1 0 0 -->
<rect x="404" y="340" width="14" height="14" fill="#ecebfb" stroke="#8f8bd8"/><rect x="418" y="340" width="14" height="14" fill="#ecebfb" stroke="#8f8bd8"/><rect x="432" y="340" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="446" y="340" width="14" height="14" fill="#ecebfb" stroke="#8f8bd8"/><rect x="460" y="340" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="474" y="340" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/>
<!-- row seg5: 1 0 0 0 1 0 -->
<rect x="404" y="354" width="14" height="14" fill="#ecebfb" stroke="#8f8bd8"/><rect x="418" y="354" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="432" y="354" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="446" y="354" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="460" y="354" width="14" height="14" fill="#ecebfb" stroke="#8f8bd8"/><rect x="474" y="354" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/>
<!-- row seg6: 1 0 0 0 0 1 -->
<rect x="404" y="368" width="14" height="14" fill="#ecebfb" stroke="#8f8bd8"/><rect x="418" y="368" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="432" y="368" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="446" y="368" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="460" y="368" width="14" height="14" fill="#ffffff" stroke="#cbd2d9"/><rect x="474" y="368" width="14" height="14" fill="#ecebfb" stroke="#8f8bd8"/>
</g>
<text x="504" y="330" font-size="11" fill="#6b7280">不是三角形，有空洞：</text>
<text x="504" y="346" font-size="11" fill="#6b7280">要专用稀疏 kernel，</text>
<text x="504" y="362" font-size="11" fill="#6b7280">MFU 通常低于因果核</text>

<text x="404" y="420" font-size="14" fill="#111827" font-weight="700">显存随整棵树的 token 数涨</text>
<text x="404" y="444" font-size="11" fill="#6b7280">树太大只能切成子树，切口处的公共前缀</text>
<text x="404" y="460" font-size="11" fill="#6b7280">又在每棵子树里各算一遍</text>
<text x="404" y="520" font-size="11" fill="#9ca3af">代价在显存与 kernel 效率</text>

<!-- DTA stack -->
<text x="772" y="160" font-size="11" fill="#6b7280">栈（此刻正在处理 s1）</text>
<rect x="772" y="170" width="64" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="804" y="188" font-size="11" fill="#111827" text-anchor="middle">seg1</text>
<rect x="842" y="170" width="64" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="874" y="188" font-size="11" fill="#111827" text-anchor="middle">seg2</text>
<rect x="912" y="170" width="64" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/><text x="944" y="188" font-size="11" fill="#111827" text-anchor="middle">seg3</text>
<text x="772" y="224" font-size="11" fill="#6b7280">其余片段此刻不在显存</text>
<rect x="772" y="234" width="64" height="26" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-dasharray="4 3"/><text x="804" y="252" font-size="11" fill="#9ca3af" text-anchor="middle">seg4</text>
<rect x="842" y="234" width="64" height="26" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-dasharray="4 3"/><text x="874" y="252" font-size="11" fill="#9ca3af" text-anchor="middle">seg5</text>
<rect x="912" y="234" width="64" height="26" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-dasharray="4 3"/><text x="944" y="252" font-size="11" fill="#9ca3af" text-anchor="middle">seg6</text>

<!-- DTA mask: causal triangle -->
<text x="772" y="286" font-size="11" fill="#9ca3af">当前路径就是一条普通序列</text>
<g>
<rect x="772" y="298" width="16" height="16" fill="#ecebfb" stroke="#8f8bd8"/><rect x="788" y="298" width="16" height="16" fill="#ffffff" stroke="#cbd2d9"/><rect x="804" y="298" width="16" height="16" fill="#ffffff" stroke="#cbd2d9"/>
<rect x="772" y="314" width="16" height="16" fill="#ecebfb" stroke="#8f8bd8"/><rect x="788" y="314" width="16" height="16" fill="#ecebfb" stroke="#8f8bd8"/><rect x="804" y="314" width="16" height="16" fill="#ffffff" stroke="#cbd2d9"/>
<rect x="772" y="330" width="16" height="16" fill="#ecebfb" stroke="#8f8bd8"/><rect x="788" y="330" width="16" height="16" fill="#ecebfb" stroke="#8f8bd8"/><rect x="804" y="330" width="16" height="16" fill="#ecebfb" stroke="#8f8bd8"/>
</g>
<text x="836" y="318" font-size="11" fill="#6b7280">回到下三角，用稠密因果 kernel；</text>
<text x="836" y="334" font-size="11" fill="#6b7280">seg1、seg2 的 KV 留在栈上给 s2 接着用</text>

<text x="772" y="420" font-size="14" fill="#111827" font-weight="700">显存随最长那条路径涨</text>
<text x="772" y="444" font-size="11" fill="#6b7280">共享前缀前向一次；子孙的梯度在反向里</text>
<text x="772" y="460" font-size="11" fill="#6b7280">累加到它身上，走完就 pop 释放</text>
<text x="772" y="520" font-size="11" fill="#9ca3af">代价在遍历开销（低共享负载上会露出来）</text>
</svg>
