<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30" y="34" font-size="19" font-weight="700" fill="#111827">TITO：训练端拿到的必须是引擎当时真正采样的那串 token</text>
<text x="30" y="58" font-size="13" fill="#6b7280">灰 = 模型实际生成的 token；红 = 重新分词后的错位序列；绿 = 按 token 记账后的序列。词表与例子照原文 1.3 节</text>
<text x="60" y="110" font-size="14" fill="#111827" text-anchor="start" font-weight="700">推理引擎实际采样</text>
<rect x="60" y="124" width="110" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="115.0" y="147.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">id 0</text>
<text x="115.0" y="165.0" font-size="11" fill="#6b7280" text-anchor="middle">&lt;</text>
<rect x="190" y="124" width="110" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="245.0" y="147.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">id 1</text>
<text x="245.0" y="165.0" font-size="11" fill="#6b7280" text-anchor="middle">search</text>
<rect x="320" y="124" width="110" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="375.0" y="147.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">id 3</text>
<text x="375.0" y="165.0" font-size="11" fill="#6b7280" text-anchor="middle">&gt;</text>
<rect x="40" y="220" width="500" height="220" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="60" y="246" font-size="14" fill="#111827" text-anchor="start" font-weight="700">字符串进、字符串出</text>
<line x1="245" y1="180" x2="245" y2="262" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="150" y="266" width="190" height="46" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="245.0" y="294.0" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">字符串 &lt;search&gt;</text>
<line x1="245" y1="314" x2="245" y2="350" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="258" y="338" font-size="11" fill="#6b7280" text-anchor="start">trainer 重新分词，长匹配优先</text>
<rect x="120" y="354" width="120" height="54" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="180.0" y="377.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">id 2</text>
<text x="180.0" y="395.0" font-size="11" fill="#6b7280" text-anchor="middle">&lt;search</text>
<rect x="250" y="354" width="120" height="54" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="310.0" y="377.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">id 3</text>
<text x="310.0" y="395.0" font-size="11" fill="#6b7280" text-anchor="middle">&gt;</text>
<text x="60" y="430" font-size="11" fill="#6b7280" text-anchor="start">模型从没采样过 2；梯度落在一条不存在的序列上，训练悄悄变成离策略</text>
<rect x="580" y="220" width="500" height="220" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="600" y="246" font-size="14" fill="#111827" text-anchor="start" font-weight="700">TITO：引擎直接交回 token id</text>
<path d="M 430 150 C 700 150, 830 190, 830 262" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="700" y="266" width="260" height="46" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="830.0" y="294.0" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">/completions 返回 token id 与 logprob</text>
<line x1="830" y1="314" x2="830" y2="350" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="640" y="354" width="110" height="54" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="695.0" y="377.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">id 0</text>
<text x="695.0" y="395.0" font-size="11" fill="#6b7280" text-anchor="middle">&lt;</text>
<rect x="770" y="354" width="110" height="54" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="825.0" y="377.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">id 1</text>
<text x="825.0" y="395.0" font-size="11" fill="#6b7280" text-anchor="middle">search</text>
<rect x="900" y="354" width="110" height="54" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="955.0" y="377.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">id 3</text>
<text x="955.0" y="395.0" font-size="11" fill="#6b7280" text-anchor="middle">&gt;</text>
<text x="600" y="430" font-size="11" fill="#6b7280" text-anchor="start">与采样逐位对齐；多轮时下一轮输入也直接拼这串 id，不再分词</text>
</svg>