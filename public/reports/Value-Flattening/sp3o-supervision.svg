<text x="946" y="388" font-size="11" fill="#6b7280">方差项只作用在这几个预测上</text>
<text x="946" y="408" font-size="11" fill="#6b7280">锚点相隔远，前缀重叠少，</text>
<text x="946" y="428" font-size="11" fill="#6b7280">梯度不再大量同向叠加</text>
<text x="946" y="448" font-size="11" fill="#6b7280">灰色小点：critic 照常输出价值，</text>
<text x="946" y="468" font-size="11" fill="#6b7280">GAE 照常用它们算逐 token 优势，</text>
<text x="946" y="488" font-size="11" fill="#6b7280">只是不回传价值损失</text>
