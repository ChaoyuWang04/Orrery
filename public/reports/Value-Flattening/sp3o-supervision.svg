<text x="946" y="144" font-size="11" fill="#6b7280">均方误差 = 均值误差 +</text>
<text x="946" y="164" font-size="11" fill="#6b7280">回答内预测值的方差</text>
<text x="946" y="184" font-size="11" fill="#6b7280">第二项覆盖全部 T 个位置，</text>
