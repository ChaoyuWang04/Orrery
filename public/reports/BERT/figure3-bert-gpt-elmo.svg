<text x="30" y="100" font-size="14" fill="#111827" font-weight="700">BERT：双向 Transformer</text>
<text x="30" y="118" font-size="11" fill="#6b7280">每层每个位置读全部位置</text>
<text x="70" y="379" font-size="11" fill="#111827" text-anchor="middle">E1</text>
<text x="70" y="299" font-size="11" fill="#111827" text-anchor="middle">Trm</text>
<text x="70" y="219" font-size="11" fill="#111827" text-anchor="middle">Trm</text>
<text x="70" y="144" font-size="11" fill="#111827" text-anchor="middle">T1</text>
<text x="148" y="379" font-size="11" fill="#111827" text-anchor="middle">E2</text>
<text x="148" y="299" font-size="11" fill="#111827" text-anchor="middle">Trm</text>
<text x="148" y="219" font-size="11" fill="#111827" text-anchor="middle">Trm</text>
<text x="148" y="144" font-size="11" fill="#111827" text-anchor="middle">T2</text>
<text x="226" y="379" font-size="11" fill="#111827" text-anchor="middle">E3</text>
<text x="226" y="299" font-size="11" fill="#111827" text-anchor="middle">Trm</text>
<text x="226" y="219" font-size="11" fill="#111827" text-anchor="middle">Trm</text>
<text x="226" y="144" font-size="11" fill="#111827" text-anchor="middle">T3</text>
<text x="304" y="379" font-size="11" fill="#111827" text-anchor="middle">E4</text>
<text x="304" y="299" font-size="11" fill="#111827" text-anchor="middle">Trm</text>
<text x="304" y="219" font-size="11" fill="#111827" text-anchor="middle">Trm</text>
<text x="304" y="144" font-size="11" fill="#111827" text-anchor="middle">T4</text>
<text x="400" y="100" font-size="14" fill="#111827" font-weight="700">OpenAI GPT：从左到右</text>
<text x="400" y="118" font-size="11" fill="#6b7280">每层每个位置只读自己和左边</text>
<text x="440" y="379" font-size="11" fill="#111827" text-anchor="middle">E1</text>
<text x="440" y="299" font-size="11" fill="#111827" text-anchor="middle">Trm</text>
<text x="440" y="219" font-size="11" fill="#111827" text-anchor="middle">Trm</text>
<text x="440" y="144" font-size="11" fill="#111827" text-anchor="middle">T1</text>
<text x="518" y="379" font-size="11" fill="#111827" text-anchor="middle">E2</text>
<text x="518" y="299" font-size="11" fill="#111827" text-anchor="middle">Trm</text>
<text x="518" y="219" font-size="11" fill="#111827" text-anchor="middle">Trm</text>
<text x="518" y="144" font-size="11" fill="#111827" text-anchor="middle">T2</text>
<text x="596" y="379" font-size="11" fill="#111827" text-anchor="middle">E3</text>
<text x="596" y="299" font-size="11" fill="#111827" text-anchor="middle">Trm</text>
<text x="596" y="219" font-size="11" fill="#111827" text-anchor="middle">Trm</text>
<text x="596" y="144" font-size="11" fill="#111827" text-anchor="middle">T3</text>
<text x="674" y="379" font-size="11" fill="#111827" text-anchor="middle">E4</text>
<text x="674" y="299" font-size="11" fill="#111827" text-anchor="middle">Trm</text>
<text x="674" y="219" font-size="11" fill="#111827" text-anchor="middle">Trm</text>
<text x="674" y="144" font-size="11" fill="#111827" text-anchor="middle">T4</text>
<text x="770" y="100" font-size="14" fill="#111827" font-weight="700">ELMo：两条独立的单向 LSTM</text>
<text x="770" y="118" font-size="11" fill="#6b7280">只在最顶上把两个方向拼接</text>
<text x="820" y="379" font-size="11" fill="#111827" text-anchor="middle">E1</text>
<text x="804" y="299" font-size="11" fill="#111827" text-anchor="middle">→</text>
<text x="836" y="219" font-size="11" fill="#111827" text-anchor="middle">←</text>
<text x="820" y="144" font-size="11" fill="#111827" text-anchor="middle">T1</text>
<text x="898" y="379" font-size="11" fill="#111827" text-anchor="middle">E2</text>
<text x="882" y="299" font-size="11" fill="#111827" text-anchor="middle">→</text>
<text x="914" y="219" font-size="11" fill="#111827" text-anchor="middle">←</text>
<text x="898" y="144" font-size="11" fill="#111827" text-anchor="middle">T2</text>
<text x="976" y="379" font-size="11" fill="#111827" text-anchor="middle">E3</text>
<text x="960" y="299" font-size="11" fill="#111827" text-anchor="middle">→</text>
<text x="992" y="219" font-size="11" fill="#111827" text-anchor="middle">←</text>
<text x="976" y="144" font-size="11" fill="#111827" text-anchor="middle">T3</text>
<text x="1054" y="379" font-size="11" fill="#111827" text-anchor="middle">E4</text>
<text x="1038" y="299" font-size="11" fill="#111827" text-anchor="middle">→</text>
<text x="1070" y="219" font-size="11" fill="#111827" text-anchor="middle">←</text>
<text x="1054" y="144" font-size="11" fill="#111827" text-anchor="middle">T4</text>
<text x="770" y="299" font-size="11" fill="#9ca3af" text-anchor="start">前</text>
<text x="770" y="219" font-size="11" fill="#9ca3af" text-anchor="start">后</text>
<text x="30" y="440" font-size="13" fill="#6b7280">BERT 的 T2 在第一层就读到了 E3、E4；GPT 的 T2 永远读不到右边。ELMo 两个方向各看一半，直到输出才拼在一起，中间层没有左右融合。</text>
<text x="30" y="462" font-size="13" fill="#6b7280">BERT_BASE 与 GPT 尺寸对齐，论文说两者架构除注意力掩码外几乎相同；BERT、GPT 走微调路线，ELMo 走特征式路线。</text>
<text x="30" y="506" font-size="11" fill="#9ca3af">据 PDF p. 13 Figure 3 重画，另参考 p. 3、p. 6 正文。只画 4 个位置、2 层，结构示意；原图 ELMo 每个方向画了两层 LSTM，此处各画一层。</text>
<text x="30" y="524" font-size="11" fill="#9ca3af">图中「前」「后」行分别是从左到右、从右到左的 LSTM；两行上下错开只是为了让连线不重叠，不代表层次先后。</text>
</svg>
