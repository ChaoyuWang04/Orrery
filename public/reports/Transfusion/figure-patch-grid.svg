<text x="50.0" y="440.0" font-size="13" fill="#111827" text-anchor="start">数字来自 0.76B 模型、0.5T token 的消融（PDF p. 19 Table 9）。线性层压到 16 个位置时 FID 从 20.3 垮到 43.5；U-Net 块压到 16 个仍是 16.1。</text>
<text x="50.0" y="464.0" font-size="13" fill="#6b7280" text-anchor="start">文字与图像的 token 比固定为 1:1：位置越少，同一预算里看过的图越多，每张图分到的算力越少（PDF p. 18 脚注 7）。</text>
<text x="50.0" y="496.0" font-size="12" fill="#9ca3af" text-anchor="start">7B / 2T 旗舰用的是 U-Net、k = 2，每张图 256 个位置（PDF p. 9）；16 个位置只在 0.76B 消融里验证过。</text>
