<text x="310.0" y="504.0" font-size="11" fill="#9ca3af" text-anchor="middle">橙框：同一张图的 4 个块</text>
<text x="560.0" y="140.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">读这张表的三条</text>
<text x="560.0" y="168.0" font-size="13" fill="#111827" text-anchor="start">1. 文字行只有绿格：写字仍然只看自己和左边。</text>
<text x="560.0" y="196.0" font-size="13" fill="#111827" text-anchor="start">2. 块 1 那一行也能看块 2–4（黄格）：画布上的块互相都看。</text>
<text x="560.0" y="224.0" font-size="13" fill="#111827" text-anchor="start">3. EOI、What 能看整张图；BOI 之前的文字看不到图。</text>
<text x="560.0" y="252.0" font-size="13" fill="#6b7280" text-anchor="start">序列里若有第二张图，它的块能看第一张图；</text>
<text x="560.0" y="280.0" font-size="13" fill="#6b7280" text-anchor="start">第一张看不到第二张，双向只在一张图内部（PDF p. 5）。</text>
<text x="560.0" y="326.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">去掉黄格会怎样（0.76B，2×2 块，PDF p. 8 Table 3）</text>
<text x="560.0" y="354.0" font-size="13" fill="#111827" text-anchor="start">线性编解码：FID 从 20.3 恶化到 61.3，CIDEr 16.0 → 12.7。</text>
<text x="560.0" y="382.0" font-size="13" fill="#111827" text-anchor="start">U-Net 编解码：FID 16.7 → 16.8，CIDEr 25.4 → 23.3。</text>
<text x="560.0" y="410.0" font-size="13" fill="#6b7280" text-anchor="start">U-Net 块内部自带双向注意力，所以对掩码不那么敏感。</text>
<text x="30.0" y="540.0" font-size="12" fill="#9ca3af" text-anchor="start">据 PDF p. 4 Figure 4 逐格重画：行列标签与原图一致，原图用小猫图片表示 4 个块。</text>
