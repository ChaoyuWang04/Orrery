<text x="42.0" y="196.0" font-size="14" fill="#111827" font-weight="700">迁移预训练 约 400B</text>
<text x="42.0" y="224.0" font-size="11" fill="#6b7280">4K 上下文，分四步</text>
<text x="42.0" y="248.0" font-size="11" fill="#6b7280">把 GQA 换成 Lightning + MLA</text>
<text x="42.0" y="272.0" font-size="11" fill="#6b7280">每步只解冻少量参数</text>
<text x="42.0" y="296.0" font-size="11" fill="#6b7280">配比未单独给出</text>
<path d="M515.8,124.0 L515.8,146.0 L375.0,146.0 L375.0,166.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#lr4-ar)"/>
<rect x="245.0" y="170.0" width="260.0" height="190.0" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="257.0" y="196.0" font-size="14" fill="#111827" font-weight="700">继续预训练 8T</text>
<text x="257.0" y="224.0" font-size="11" fill="#6b7280">4K 上下文，全参数解冻</text>
<text x="257.0" y="248.0" font-size="11" fill="#6b7280">正文：46% 推理、50% 通用、4% 多语言</text>
<text x="257.0" y="272.0" font-size="11" fill="#6b7280">图：64% 通用、36% 推理</text>
<text x="257.0" y="296.0" font-size="11" fill="#6b7280">推理占比两处差 10 个点，报告未解释</text>
<text x="257.0" y="320.0" font-size="11" fill="#6b7280">一开始就上新数据（激进策略）</text>
<path d="M971.3,124.0 L971.3,134.0 L610.0,134.0 L610.0,166.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#lr4-ar)"/>
<rect x="520.0" y="170.0" width="180.0" height="190.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="532.0" y="196.0" font-size="14" fill="#111827" font-weight="700">中期 ① 250B</text>
<text x="532.0" y="224.0" font-size="11" fill="#6b7280">20% 序列取 32K</text>
<text x="532.0" y="248.0" font-size="11" fill="#6b7280">图：67% 通用、33% 推理</text>
<text x="532.0" y="272.0" font-size="11" fill="#6b7280">学习率仍在峰值</text>
<path d="M1008.6,124.0 L1008.6,146.0 L805.0,146.0 L805.0,166.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#lr4-ar)"/>
