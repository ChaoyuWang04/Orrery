<text x="727.0" y="224.0" font-size="11" fill="#6b7280">32K 上下文</text>
<text x="727.0" y="248.0" font-size="11" fill="#6b7280">图：47% 通用、53% 推理</text>
<text x="727.0" y="272.0" font-size="11" fill="#6b7280">高质量数据占比显著提高</text>
<path d="M1061.0,124.0 L1061.0,158.0 L1000.0,158.0 L1000.0,166.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#lr4-ar)"/>
<rect x="910.0" y="170.0" width="180.0" height="190.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="922.0" y="196.0" font-size="14" fill="#111827" font-weight="700">中期 ③ 525B</text>
<text x="922.0" y="224.0" font-size="11" fill="#6b7280">256K 上下文</text>
<text x="922.0" y="248.0" font-size="11" fill="#6b7280">图：43% 通用、42% 推理、</text>
<text x="922.0" y="272.0" font-size="11" fill="#6b7280">15% Agentic</text>
<text x="922.0" y="296.0" font-size="11" fill="#6b7280">保持高质量配比</text>
<text x="30.0" y="392.0" font-size="11" fill="#9ca3af">全程沿用 WSM：warmup 到峰值后学习率恒定，退火效果靠合并 checkpoint 得到。多语言在迁移与继续预训练占 4%，中期训练去掉通用网页（PDF p. 9）。</text>
</svg>
