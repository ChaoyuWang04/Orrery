<rect x="985.1" y="88.0" width="46.9" height="34.0" rx="2" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="1032.0" y="88.0" width="58.0" height="34.0" rx="2" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="515.7" y="110.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">继续预训练 8T</text>
<path d="M52.1,124.0 L52.1,146.0 L130.0,146.0 L130.0,166.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#lr4-ar)"/>
