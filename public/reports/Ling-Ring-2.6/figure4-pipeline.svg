<rect x="0" y="0" width="1120" height="420" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" font-weight="700">9.6T Token 怎么花：八成多是 4K 上下文的继续预训练</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280">上面的条按 Token 量等比例画，下面是每段的上下文与配比。黄 = 迁移预训练；绿 = 继续预训练；紫 = 中期训练。按 PDF p. 9 Figure 4 与 p. 9–10 正文。</text>
