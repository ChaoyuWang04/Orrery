<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="lrp-ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" font-weight="700">部分采样：一步的边界由 Token 预算定，不由最慢的轨迹定</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280">每行一条轨迹，从左往右是时间。绿 = 策略版本 k 生成；紫 = 版本 k+1 续写；黄 = 预算到点时仍在生成，连同 KV Cache 指纹暂存。</text>
<text x="30.0" y="72.0" font-size="13" fill="#6b7280">按 PDF p. 30–31 的文字画，是机制示意，长度不代表实测。</text>
<path d="M520.0,118.0 L520.0,318.0" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="520.0" y="96.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">第 k 步：累计生成 Token 达到 Φ</text>
<text x="520.0" y="112.0" font-size="11" fill="#6b7280" text-anchor="middle">训练一步，亚秒级广播新权重</text>
<path d="M900.0,118.0 L900.0,318.0" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="900.0" y="96.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">第 k+1 步：累计生成 Token 达到 Φ</text>
<text x="900.0" y="112.0" font-size="11" fill="#6b7280" text-anchor="middle">训练一步，亚秒级广播新权重</text>
<rect x="150.0" y="136.0" width="230.0" height="22.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<text x="392.0" y="152.0" font-size="11" fill="#6b7280">完成，算奖励</text>
<rect x="260.0" y="172.0" width="210.0" height="22.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<text x="250.0" y="188.0" font-size="11" fill="#6b7280" text-anchor="end">重叠派发的新任务</text>
<rect x="150.0" y="208.0" width="365.0" height="22.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="515.0" y="208.0" width="10.0" height="22.0" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="525.0" y="208.0" width="175.0" height="22.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="712.0" y="224.0" font-size="11" fill="#6b7280">跨步拼成：前段版本 k，后段 k+1</text>
<rect x="150.0" y="244.0" width="365.0" height="22.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="515.0" y="244.0" width="10.0" height="22.0" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="525.0" y="244.0" width="370.0" height="22.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="895.0" y="244.0" width="10.0" height="22.0" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="912.0" y="260.0" font-size="11" fill="#6b7280">再次暂存</text>
<rect x="560.0" y="280.0" width="220.0" height="22.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="792.0" y="296.0" font-size="11" fill="#6b7280">新任务</text>
<rect x="30.0" y="340.0" width="515.0" height="108.0" rx="8" fill="#ffffff" stroke="#cbd2d9"/>
<text x="46.0" y="364.0" font-size="14" fill="#111827" font-weight="700">陈旧度管理器</text>
<text x="46.0" y="388.0" font-size="11" fill="#6b7280">每个片段打上生成时的策略版本号；进入训练池的轨迹至多</text>
<text x="46.0" y="408.0" font-size="11" fill="#6b7280">max_staleness × consumer_batch_size 条；和训练器版本差</text>
<text x="46.0" y="428.0" font-size="11" fill="#6b7280">超过上限的片段丢弃或退役。实际陈旧度只有几步（p. 30）。</text>
<rect x="575.0" y="340.0" width="515.0" height="108.0" rx="8" fill="#ffffff" stroke="#cbd2d9"/>
<text x="591.0" y="364.0" font-size="14" fill="#111827" font-weight="700">为什么 GPU 不空等</text>
<text x="591.0" y="388.0" font-size="11" fill="#6b7280">推理引擎与数千个 ASandbox 副本各自扩展；每次工具调用</text>
<text x="591.0" y="408.0" font-size="11" fill="#6b7280">是一个可等待对象；重叠派发器随时补新任务，病态长轨迹</text>
<text x="591.0" y="428.0" font-size="11" fill="#6b7280">被预算截断、留给下一版续写（p. 31）。</text>
</svg>
