<text x="964.0" y="214.0" font-size="11" fill="#9ca3af" text-anchor="middle">第 9 组</text>
<text x="1059.0" y="214.0" font-size="11" fill="#9ca3af" text-anchor="middle">第 10 组</text>
<text x="160.0" y="94.0" font-size="11" fill="#9ca3af">第 1 层</text>
<text x="1103.0" y="94.0" font-size="11" fill="#9ca3af" text-anchor="end">第 80 层</text>
<rect x="30.0" y="250.0" width="340.0" height="190.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="46.0" y="278.0" font-size="14" fill="#111827" font-weight="700">Lightning Attention × 70 层</text>
<text x="46.0" y="306.0" font-size="11" fill="#6b7280">线性注意力：用 RNN 式递推代替两两比较，</text>
<text x="46.0" y="330.0" font-size="11" fill="#6b7280">复杂度从 O(N²) 降到 O(N)；不存 KV Cache，</text>
<text x="46.0" y="354.0" font-size="11" fill="#6b7280">只带一个固定大小的状态往前走。</text>
<text x="46.0" y="378.0" font-size="11" fill="#6b7280">保留 QK Norm 与 Partial RoPE；输出过分组</text>
<text x="46.0" y="402.0" font-size="11" fill="#6b7280">RMSNorm，再乘 sigmoid 门控。</text>
<rect x="390.0" y="250.0" width="340.0" height="190.0" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="406.0" y="278.0" font-size="14" fill="#111827" font-weight="700">MLA × 10 层</text>
<text x="406.0" y="306.0" font-size="11" fill="#6b7280">全注意力层，保留逐位置两两比较。</text>
<text x="406.0" y="330.0" font-size="11" fill="#6b7280">KV 压成秩 512 的潜向量，Query 秩 1536；</text>
<text x="406.0" y="354.0" font-size="11" fill="#6b7280">每头 128 维里只有 64 维做 RoPE。</text>
<text x="406.0" y="378.0" font-size="11" fill="#6b7280">80 层里只有这 10 层的缓存随上下文变长，</text>
<text x="406.0" y="402.0" font-size="11" fill="#6b7280">其余 70 层带着固定大小的状态往前走。</text>
<rect x="750.0" y="250.0" width="340.0" height="190.0" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="766.0" y="278.0" font-size="14" fill="#111827" font-weight="700">FFN：前 4 层稠密，其余 76 层 MoE</text>
<text x="766.0" y="306.0" font-size="11" fill="#6b7280">稠密层中间维 18,432。MoE 层 1 个共享专家</text>
<text x="766.0" y="330.0" font-size="11" fill="#6b7280">加 256 个路由专家，每 Token 激活 8 个，</text>
<text x="766.0" y="354.0" font-size="11" fill="#6b7280">专家中间维 2,048；FP32 sigmoid 打分，</text>
<text x="766.0" y="378.0" font-size="11" fill="#6b7280">8 组里先选 4 组，输出乘 2.5；</text>
<text x="766.0" y="402.0" font-size="11" fill="#6b7280">无辅助损失均衡（给专家加偏置）。</text>
</svg>
