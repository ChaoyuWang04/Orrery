<rect x="0" y="0" width="1120" height="500" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" font-weight="700">KPop 的尺子：低概率 Token 放宽，高概率 Token 收紧</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280">横轴是训练引擎给采样 Token 的概率，纵轴是推理 / 训练的概率比；带内保留，带外屏蔽（不参与更新）。紫 = IcePop 式固定比例区间；</text>
<text x="30.0" y="72.0" font-size="13" fill="#6b7280">绿 = KPop 双向二元 KL ≤ φ。α、β、φ 报告都没给，这里取 0.5、2、0.01 只作机制示意；公式见 PDF p. 18–19。</text>
