<rect x="0" y="0" width="1120" height="700" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">按阶段分池：推理后端不再跟着「最慢的那一段」一起空等</text>
<text x="30" y="58" font-size="13" fill="#6b7280">黄 = INIT 起容器、装工具（等磁盘与网络）；绿 = RUN 多轮 agent 循环（等 LLM 推理）；紫 = EVAL 打分（毫秒到数分钟）；灰带 = 没有任何任务在 RUN。</text>
<text x="30" y="78" font-size="13" fill="#6b7280">据 PDF p. 7–8 Listing 2 与第 3.3.1 节重画的机制示意；J1、J2 是任务编号，时长是示意，不是实测。</text>
