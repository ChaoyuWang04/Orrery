<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">分配用粗页，命中用细哈希：两种状态在同一个边界恢复</text>
<text x="30" y="54" font-size="13" fill="#6b7280">紫 = 已缓存的 MLA KV 哈希块；灰 = 空块；黄点 = 本次命中的 KDA 检查点；灰点 = 存着但没用上的检查点；空心 = 没存；绿 = 新请求的共同前缀。</text>

<text x="600" y="92" font-size="12" fill="#6b7280" text-anchor="middle">一个物理缓存块 = 6144 Token = 12 个 512 Token 哈希块</text>
<text x="110" y="136" font-size="12" fill="#111827" text-anchor="end">MLA KV</text>
<rect x="120" y="112" width="80" height="40" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="200" y="112" width="80" height="40" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="280" y="112" width="80" height="40" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="360" y="112" width="80" height="40" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="440" y="112" width="80" height="40" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="520" y="112" width="80" height="40" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="600" y="112" width="80" height="40" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="680" y="112" width="80" height="40" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="760" y="112" width="80" height="40" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="840" y="112" width="80" height="40" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="920" y="112" width="80" height="40" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="1000" y="112" width="80" height="40" fill="#eeeeee" stroke="#b9b9b9"/>

<text x="110" y="186" font-size="12" fill="#111827" text-anchor="end">KDA 检查点</text>
<circle cx="200" cy="182" r="5" fill="#ffffff" stroke="#9ca3af"/>
<circle cx="280" cy="182" r="5" fill="#ffffff" stroke="#9ca3af"/>
<circle cx="360" cy="182" r="7" fill="#9ca3af" stroke="#6b7280"/>
<circle cx="440" cy="182" r="5" fill="#ffffff" stroke="#9ca3af"/>
<circle cx="520" cy="182" r="8" fill="#d4a24c" stroke="#b07d20"/>
<circle cx="600" cy="182" r="5" fill="#ffffff" stroke="#9ca3af"/>
<circle cx="680" cy="182" r="5" fill="#ffffff" stroke="#9ca3af"/>
<circle cx="760" cy="182" r="5" fill="#ffffff" stroke="#9ca3af"/>
<circle cx="840" cy="182" r="5" fill="#ffffff" stroke="#9ca3af"/>
<circle cx="920" cy="182" r="5" fill="#ffffff" stroke="#9ca3af"/>
<circle cx="1000" cy="182" r="5" fill="#ffffff" stroke="#9ca3af"/>
<circle cx="1080" cy="182" r="5" fill="#ffffff" stroke="#9ca3af"/>
<path d="M520 104 V250" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/>

<text x="110" y="228" font-size="12" fill="#111827" text-anchor="end">新请求</text>
<rect x="120" y="212" width="438" height="24" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="340" y="229" font-size="11" fill="#111827" text-anchor="middle">前 2800 Token 与缓存相同</text>
<text x="528" y="268" font-size="12" fill="#111827" font-weight="700">命中边界 B = 2560 = 5 × 512</text>
<text x="360" y="206" font-size="11" fill="#9ca3af" text-anchor="middle">1536</text>

<rect x="60" y="292" width="490" height="120" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="80" y="318" font-size="14" fill="#111827" font-weight="700">K3 的两级查找</text>
<text x="80" y="342" font-size="11" fill="#6b7280">① MLA：按链式哈希匹配，不足一页时退到页内哈希端点</text>
<text x="80" y="362" font-size="11" fill="#6b7280">② KDA：每个 KDA 缓存组都要在同一边界有检查点</text>
<text x="80" y="382" font-size="11" fill="#6b7280">取两级都满足的最长边界：恢复 B 处 KDA 状态，</text>
<text x="80" y="400" font-size="11" fill="#6b7280">MLA 部分页写时复制，从 B 继续 prefill，[0, B) 不重算</text>

<rect x="580" y="292" width="490" height="120" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="600" y="318" font-size="14" fill="#111827" font-weight="700">若哈希粒度绑死在物理块上</text>
<text x="600" y="342" font-size="11" fill="#6b7280">KDA 状态太大，只能在稀疏边界存，物理块被迫取 1024–6144</text>
<text x="600" y="362" font-size="11" fill="#6b7280">只有整块前缀可复用：这条 2800 Token 的前缀</text>
<text x="600" y="382" font-size="11" fill="#6b7280">不满一个 6144 块，一个 Token 都复用不了；</text>
<text x="600" y="400" font-size="11" fill="#6b7280">分块 prefill 在跨过整块前也导不出可缓存前缀</text>

<text x="30" y="448" font-size="11" fill="#9ca3af">据 PDF p. 23 Figure 12 与 p. 23–24 正文重画。6144 与 512 是原图示例取值，正文写物理块在 1024–6144 Token 之间取。</text>
</svg>
