<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="k3b-ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">给衰减设一个下界，对角小块也能走 Tensor Core</text>
<text x="30" y="54" font-size="13" fill="#6b7280">一个 chunk 切成 4 × 4 个 16 Token 小块。红 = 逐位置对计算的慢路径；紫 = 密集矩阵乘；灰 = 因果掩码外，不用算。</text>

<text x="270" y="96" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">Kimi Linear：log-decay 没有下界</text>
<rect x="170" y="110" width="50" height="50" fill="#fbe9e7" stroke="#d9877a"/>
<rect x="220" y="110" width="50" height="50" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="270" y="110" width="50" height="50" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="320" y="110" width="50" height="50" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="170" y="160" width="50" height="50" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="220" y="160" width="50" height="50" fill="#fbe9e7" stroke="#d9877a"/>
<rect x="270" y="160" width="50" height="50" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="320" y="160" width="50" height="50" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="170" y="210" width="50" height="50" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="220" y="210" width="50" height="50" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="270" y="210" width="50" height="50" fill="#fbe9e7" stroke="#d9877a"/>
<rect x="320" y="210" width="50" height="50" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="170" y="260" width="50" height="50" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="220" y="260" width="50" height="50" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="270" y="260" width="50" height="50" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="320" y="260" width="50" height="50" fill="#fbe9e7" stroke="#d9877a"/>
<text x="270" y="334" font-size="11" fill="#6b7280" text-anchor="middle">对角 4 块只能逐个位置对算，是 chunk 内主要瓶颈</text>

<path d="M430 210 H680" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#k3b-ar)"/>
<text x="555" y="190" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">把 log-decay 限制在 (−5, 0)</text>
<text x="555" y="236" font-size="11" fill="#6b7280" text-anchor="middle">g = −5 · Sigmoid(e^A · z)</text>

<text x="850" y="96" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">Kimi K3：log-decay 有下界</text>
<rect x="750" y="110" width="50" height="50" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="800" y="110" width="50" height="50" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="850" y="110" width="50" height="50" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="900" y="110" width="50" height="50" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="750" y="160" width="50" height="50" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="800" y="160" width="50" height="50" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="850" y="160" width="50" height="50" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="900" y="160" width="50" height="50" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="750" y="210" width="50" height="50" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="800" y="210" width="50" height="50" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="850" y="210" width="50" height="50" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="900" y="210" width="50" height="50" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="750" y="260" width="50" height="50" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="800" y="260" width="50" height="50" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="850" y="260" width="50" height="50" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="900" y="260" width="50" height="50" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="850" y="334" font-size="11" fill="#6b7280" text-anchor="middle">所有因果小块都用同一种密集矩阵乘</text>

<rect x="60" y="360" width="1000" height="62" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="560" y="386" font-size="13" fill="#111827" text-anchor="middle">为什么下界管用：每步保留率 α ＞ e^−5 ≈ 0.0067 → 16 Token 小块累计 log-decay 落在 (−80, 0)</text>
<text x="560" y="408" font-size="13" fill="#111827" text-anchor="middle">→ 重缩放用的倒数 ＜ e^80，仍在 BF16 动态范围内 → 不再需要对角特殊路径</text>

<text x="30" y="450" font-size="11" fill="#9ca3af">据 PDF p. 5 Figure 3(b) 与式 5 重画；4 × 4 只是示意格数。代价：单步保留率不能低于 e^−5，一个通道没法一步清零。</text>
</svg>
