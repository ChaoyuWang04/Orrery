<rect x="360" y="80" width="420" height="400" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="570" y="102" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">一个混合块（重复 23 次）</text>
<rect x="380" y="120" width="170" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="465" y="143" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">KDA</text>
<text x="465" y="163" font-size="11" fill="#6b7280" text-anchor="middle">固定大小的递归状态</text>
<rect x="580" y="120" width="180" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="670" y="143" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">Stable LatentMoE</text>
<text x="670" y="163" font-size="11" fill="#6b7280" text-anchor="middle">896 选 16 + 2 共享</text>
<rect x="380" y="210" width="170" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="465" y="233" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">KDA</text>
<text x="465" y="253" font-size="11" fill="#6b7280" text-anchor="middle">固定大小的递归状态</text>
<rect x="580" y="210" width="180" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="670" y="233" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">Stable LatentMoE</text>
<text x="670" y="253" font-size="11" fill="#6b7280" text-anchor="middle">896 选 16 + 2 共享</text>
<rect x="380" y="300" width="170" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="465" y="323" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">KDA</text>
<text x="465" y="343" font-size="11" fill="#6b7280" text-anchor="middle">固定大小的递归状态</text>
<rect x="580" y="300" width="180" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="670" y="323" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">Stable LatentMoE</text>
<text x="670" y="343" font-size="11" fill="#6b7280" text-anchor="middle">896 选 16 + 2 共享</text>
<rect x="380" y="390" width="170" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="465" y="413" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">Gated MLA</text>
<text x="465" y="433" font-size="11" fill="#6b7280" text-anchor="middle">全局回看，不加位置编码</text>
<rect x="580" y="390" width="180" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="670" y="413" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">Stable LatentMoE</text>
<text x="670" y="433" font-size="11" fill="#6b7280" text-anchor="middle">896 选 16 + 2 共享</text>
