<path d="M670 356 V370 H465 V388" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#k3a-ar)"/>

<rect x="810" y="100" width="290" height="104" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="826" y="126" font-size="14" fill="#111827" font-weight="700">序列：3 层 KDA + 1 层 MLA</text>
<text x="826" y="150" font-size="11" fill="#6b7280">23 个块，主干末尾再加 1 层 MLA</text>
<text x="826" y="170" font-size="11" fill="#6b7280">= 69 层 KDA + 24 层 MLA = 93 层</text>
<text x="826" y="190" font-size="11" fill="#6b7280">KDA 状态不随长度涨，MLA 缓存会涨</text>
<rect x="810" y="226" width="290" height="104" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="826" y="252" font-size="14" fill="#111827" font-weight="700">深度：Block AttnRes</text>
<text x="826" y="276" font-size="11" fill="#6b7280">每层用可学习的伪查询给旧表示打分</text>
<text x="826" y="296" font-size="11" fill="#6b7280">约 8 块 × 12 层，连 embedding 共 9 个来源</text>
<text x="826" y="316" font-size="11" fill="#6b7280">要留的状态从 O(Ld) 降到 O(Nd)</text>
<rect x="810" y="352" width="290" height="104" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="826" y="378" font-size="14" fill="#111827" font-weight="700">宽度：Stable LatentMoE</text>
<text x="826" y="402" font-size="11" fill="#6b7280">路由专家在 3584 维潜空间里干活</text>
<text x="826" y="422" font-size="11" fill="#6b7280">2 个共享专家保留 7168 全宽路径</text>
<text x="826" y="442" font-size="11" fill="#6b7280">RMSNorm + SiTU-GLU + QB 负责稳住</text>

<text x="30" y="516" font-size="11" fill="#9ca3af">据 PDF p. 3 Figure 2、p. 4–7 与 p. 11 Table 1 重画，是结构示意，不是实测耗时；输入端的视觉通路（MoonViT-V2）未画。</text>
<text x="30" y="536" font-size="11" fill="#9ca3af">图中残差相加省略：每个子层前都经 AttnRes 取输入，箭头只表示先后。</text>
</svg>
