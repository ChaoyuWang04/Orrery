<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">K3 的一个混合块：序列、深度、宽度三条信息流各换一种走法</text>
<text x="30" y="54" font-size="13" fill="#6b7280">紫 = 序列方向的 token 混合；绿 = 深度方向的 AttnRes 回读；黄 = 宽度方向的稀疏专家；灰 = 可被回读的旧表示。</text>

<rect x="30" y="80" width="280" height="400" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="170" y="102" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">深度方向：可回读的来源</text>
<rect x="50" y="120" width="240" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="170" y="147" font-size="12" fill="#111827" text-anchor="middle">Token embedding（来源 0）</text>
<rect x="50" y="178" width="240" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="170" y="205" font-size="12" fill="#111827" text-anchor="middle">第 1 块汇总（约 12 层求和）</text>
<rect x="50" y="236" width="240" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="170" y="263" font-size="12" fill="#111827" text-anchor="middle">第 2 块汇总</text>
<text x="170" y="305" font-size="14" fill="#9ca3af" text-anchor="middle">……</text>
<rect x="50" y="320" width="240" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="170" y="347" font-size="12" fill="#111827" text-anchor="middle">前一块汇总</text>
<rect x="50" y="400" width="240" height="44" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="170" y="427" font-size="12" fill="#111827" text-anchor="middle">当前块内已走过层的部分和</text>
<text x="170" y="468" font-size="11" fill="#9ca3af" text-anchor="middle">块间做完整注意力，块内只累加</text>

<path d="M290 142 H336" fill="none" stroke="#5fa886" stroke-width="1.4"/>
