<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="k3c-ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">分位数均衡：不是一步步推偏置，而是直接算出让每个专家恰好接 q 个 Token 的门槛</text>
<text x="30" y="54" font-size="13" fill="#6b7280">8 个 Token、4 个专家、每个 Token 选 1 个，目标 q = mk/n = 2。紫 = 目标以内的 Token；红 = 超出目标的 Token；灰虚框 = 空专家。</text>

<text x="270" y="96" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">按原始分数选 Top-1：负载 (4, 3, 1, 0)</text>
<path d="M70 232 H470" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="474" y="228" font-size="11" fill="#9ca3af">q = 2</text>
<rect x="100" y="276" width="60" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="100" y="232" width="60" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="100" y="188" width="60" height="40" rx="4" fill="#fbe9e7" stroke="#d9877a"/>
<rect x="100" y="144" width="60" height="40" rx="4" fill="#fbe9e7" stroke="#d9877a"/>
<rect x="190" y="276" width="60" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="190" y="232" width="60" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="190" y="188" width="60" height="40" rx="4" fill="#fbe9e7" stroke="#d9877a"/>
<rect x="280" y="276" width="60" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="370" y="276" width="60" height="40" rx="4" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<path d="M80 320 H450" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<text x="130" y="340" font-size="12" fill="#111827" text-anchor="middle">E1 · 4</text>
<text x="220" y="340" font-size="12" fill="#111827" text-anchor="middle">E2 · 3</text>
<text x="310" y="340" font-size="12" fill="#111827" text-anchor="middle">E3 · 1</text>
<text x="400" y="340" font-size="12" fill="#111827" text-anchor="middle">E4 · 0</text>
<text x="270" y="366" font-size="11" fill="#6b7280" text-anchor="middle">E1 过热、E4 接不到 Token，会越训越弱</text>

<path d="M520 230 H640" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#k3c-ar)"/>
<text x="580" y="200" font-size="12" fill="#111827" font-weight="700" text-anchor="middle">每个专家一列</text>
<text x="580" y="218" font-size="11" fill="#6b7280" text-anchor="middle">门槛放在第 q+1 大</text>
<text x="580" y="254" font-size="11" fill="#6b7280" text-anchor="middle">的 margin 上</text>

<text x="850" y="96" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">减去各列门槛后再选：负载 (2, 2, 2, 2)</text>
<path d="M650 232 H1050" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="1054" y="228" font-size="11" fill="#9ca3af">q = 2</text>
<rect x="680" y="276" width="60" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="680" y="232" width="60" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="770" y="276" width="60" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="770" y="232" width="60" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="860" y="276" width="60" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="860" y="232" width="60" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="950" y="276" width="60" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="950" y="232" width="60" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<path d="M660 320 H1030" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
<text x="710" y="340" font-size="12" fill="#111827" text-anchor="middle">E1 · 2</text>
<text x="800" y="340" font-size="12" fill="#111827" text-anchor="middle">E2 · 2</text>
<text x="890" y="340" font-size="12" fill="#111827" text-anchor="middle">E3 · 2</text>
<text x="980" y="340" font-size="12" fill="#111827" text-anchor="middle">E4 · 2</text>
<text x="850" y="366" font-size="11" fill="#6b7280" text-anchor="middle">混合权重仍用原始分数，偏置只决定「选谁」</text>

<rect x="60" y="388" width="1000" height="40" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="560" y="413" font-size="12" fill="#111827" text-anchor="middle">真实规模：896 个专家、全局 batch 数百万个 margin → 每专家 1000 桶直方图，跨卡只 all-reduce 计数；新偏置下一步才生效，推理时冻结</text>

<text x="30" y="456" font-size="11" fill="#9ca3af">据 PDF p. 8 Figure 5、式 13–14 与附录 D（PDF p. 44–45）重画；Token 与专家的具体连线从略，只保留负载。</text>
</svg>
