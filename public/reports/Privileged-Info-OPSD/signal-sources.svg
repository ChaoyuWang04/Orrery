<text x="696.0" y="158.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">无：两边分布一致</text>
<text x="696.0" y="180.0" font-size="11" fill="#6b7280" text-anchor="start">初始损失为 0</text>
<text x="860.0" y="164.0" font-size="11" fill="#9ca3af" text-anchor="start">论文没有训练这一组</text>
<text x="860.0" y="182.0" font-size="11" fill="#9ca3af" text-anchor="start">只在 PDF p. 3 由式 (1) 推出</text>
<rect x="30.0" y="228.0" width="240.0" height="88.0" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.2"/>
<text x="46.0" y="262.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">跨模式、无参考</text>
<text x="46.0" y="284.0" font-size="11" fill="#6b7280" text-anchor="start">论文的无参考对照</text>
<rect x="290.0" y="228.0" width="210.0" height="88.0" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.2"/>
<text x="306.0" y="262.0" font-size="11" fill="#6b7280" text-anchor="start">思考模式</text>
<text x="306.0" y="282.0" font-size="11" fill="#6b7280" text-anchor="start">不看任何参考</text>
<rect x="520.0" y="228.0" width="140.0" height="88.0" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.2"/>
<text x="536.0" y="262.0" font-size="11" fill="#6b7280" text-anchor="start">直答模式</text>
<text x="536.0" y="282.0" font-size="11" fill="#6b7280" text-anchor="start">只看题目</text>
<rect x="680.0" y="228.0" width="160.0" height="88.0" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.2"/>
