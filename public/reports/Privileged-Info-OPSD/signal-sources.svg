<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
<text x="30.0" y="34.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">OPSD 的训练信号有两个来源：去掉参考，模式差还在</text>
<text x="30.0" y="58.0" font-size="13" fill="#6b7280" text-anchor="start">黄 = 思考模式教师与直答模式学生之间的模式差，紫 = 参考带来的信息差。右侧柱长是 Qwen3-1.7B 第 100 步域内相对底座的提升。</text>
<text x="30.0" y="96.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">配置</text>
<text x="290.0" y="96.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">教师（冻结的同一底座）</text>
<text x="520.0" y="96.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">学生（被训练）</text>
<text x="680.0" y="96.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">初始信号从哪来</text>
<text x="860.0" y="96.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">相对底座，Avg@4 百分点</text>
<line x1="30.0" y1="108.0" x2="1090.0" y2="108.0" stroke="#cbd2d9" stroke-width="1"/>
<rect x="30.0" y="124.0" width="240.0" height="88.0" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.2"/>
<text x="46.0" y="158.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">同模式、无参考</text>
<text x="46.0" y="180.0" font-size="11" fill="#6b7280" text-anchor="start">对照的理想形态</text>
<rect x="290.0" y="124.0" width="210.0" height="88.0" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.2"/>
<text x="306.0" y="158.0" font-size="11" fill="#6b7280" text-anchor="start">同一提示、同一思考模式</text>
<text x="306.0" y="178.0" font-size="11" fill="#6b7280" text-anchor="start">同一打分温度，不看参考</text>
<rect x="520.0" y="124.0" width="140.0" height="88.0" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.2"/>
<text x="536.0" y="158.0" font-size="11" fill="#6b7280" text-anchor="start">和教师完全相同</text>
