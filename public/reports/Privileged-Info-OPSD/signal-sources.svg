<text x="985.0" y="274.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">+1.80</text>
<text x="860.0" y="304.0" font-size="11" fill="#9ca3af" text-anchor="start">区间 [0.20, 3.47]</text>
<rect x="30.0" y="332.0" width="240.0" height="88.0" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1.2"/>
<text x="46.0" y="366.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">跨模式 + 参考</text>
<text x="46.0" y="388.0" font-size="11" fill="#6b7280" text-anchor="start">OPSD 常规配置</text>
<rect x="290.0" y="332.0" width="210.0" height="88.0" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.2"/>
<text x="306.0" y="366.0" font-size="11" fill="#6b7280" text-anchor="start">思考模式</text>
