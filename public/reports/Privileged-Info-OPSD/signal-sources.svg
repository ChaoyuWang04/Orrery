<rect x="680.0" y="332.0" width="80.0" height="88.0" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.2"/>
<rect x="760.0" y="332.0" width="80.0" height="88.0" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.2"/>
<text x="696.0" y="366.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">模式差</text>
<text x="776.0" y="366.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">信息差</text>
<text x="696.0" y="388.0" font-size="11" fill="#6b7280" text-anchor="start">同上一行</text>
<text x="776.0" y="388.0" font-size="11" fill="#6b7280" text-anchor="start">来自参考</text>
<rect x="860.0" y="358.0" width="117.0" height="30.0" rx="3" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1.2"/>
<rect x="977.0" y="358.0" width="84.5" height="30.0" rx="3" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1.2"/>
<text x="1069.5" y="378.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">+3.10</text>
<text x="860.0" y="408.0" font-size="11" fill="#9ca3af" text-anchor="start">多出的 +1.30 [0.20, 2.41]，过不了 Holm 校正</text>
<line x1="860.0" y1="118.0" x2="860.0" y2="440.0" stroke="#b9b9b9" stroke-width="1"/>
<text x="30.0" y="466.0" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 2–3 的配置说明与 p. 5 Table 1、正文重画；数字为三种子均值。「多出的 +1.30」是与无参考学生的配对差，未校正区间不含 0。</text>
<text x="30.0" y="490.0" font-size="13" fill="#6b7280" text-anchor="start">只看「相对底座 +3.10」，就会把黄色那一段也记在参考头上。</text>
</svg>
