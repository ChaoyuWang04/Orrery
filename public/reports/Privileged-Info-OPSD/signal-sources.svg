<rect x="520.0" y="332.0" width="140.0" height="88.0" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.2"/>
<text x="536.0" y="366.0" font-size="11" fill="#6b7280" text-anchor="start">直答模式</text>
