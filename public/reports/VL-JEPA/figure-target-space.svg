<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">同一个意思两种说法：token 空间里互不相干，嵌入空间里挨在一起</text>
<text x="30" y="54" font-size="13" fill="#6b7280">绿 = 两个合法答案；紫 = 预测器输出的预测嵌入；灰 = 意思不同的答案。机制示意，依据 PDF p.3 的灯开关例子；右侧点位不是实测。</text>

<rect x="16" y="72" width="1088" height="52" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="560" y="96" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">查询：What will happen here if I flip this light switch down?</text>
<text x="560" y="114" font-size="11" fill="#6b7280" text-anchor="middle">两个都对的回答：the lamp is turned off ／ room will go dark</text>

<rect x="16" y="140" width="530" height="316" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="281" y="166" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">生成式 VLM 的目标：逐个 token</text>
<text x="281" y="186" font-size="11" fill="#6b7280" text-anchor="middle">每个方块是一个 one-hot 目标</text>

<text x="40" y="226" font-size="11" fill="#6b7280">答案 A</text>
<rect x="96" y="206" width="66" height="32" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="129" y="227" font-size="14" fill="#111827" text-anchor="middle">the</text>
<rect x="170" y="206" width="66" height="32" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="203" y="227" font-size="14" fill="#111827" text-anchor="middle">lamp</text>
<rect x="244" y="206" width="66" height="32" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="277" y="227" font-size="14" fill="#111827" text-anchor="middle">is</text>
<rect x="318" y="206" width="76" height="32" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="356" y="227" font-size="14" fill="#111827" text-anchor="middle">turned</text>
<rect x="402" y="206" width="66" height="32" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="435" y="227" font-size="14" fill="#111827" text-anchor="middle">off</text>

<text x="40" y="282" font-size="11" fill="#6b7280">答案 B</text>
<rect x="96" y="262" width="66" height="32" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="129" y="283" font-size="14" fill="#111827" text-anchor="middle">room</text>
<rect x="170" y="262" width="66" height="32" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="203" y="283" font-size="14" fill="#111827" text-anchor="middle">will</text>
<rect x="244" y="262" width="66" height="32" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="277" y="283" font-size="14" fill="#111827" text-anchor="middle">go</text>
<rect x="318" y="262" width="76" height="32" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="356" y="283" font-size="14" fill="#111827" text-anchor="middle">dark</text>

<text x="281" y="332" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">共享 token：0 个</text>
<text x="281" y="354" font-size="11" fill="#6b7280" text-anchor="middle">两条序列在 one-hot 空间里正交，交叉熵把它们当成两个不同目标；</text>
<text x="281" y="372" font-size="11" fill="#6b7280" text-anchor="middle">模型要同时拟合好几块互不相通的高密度区，</text>
<text x="281" y="390" font-size="11" fill="#6b7280" text-anchor="middle">连选词、语序这些与答对无关的东西也得学</text>

<rect x="562" y="140" width="542" height="316" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="833" y="166" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">VL-JEPA 的目标：Y-Encoder 输出的一个向量</text>
<text x="833" y="186" font-size="11" fill="#6b7280" text-anchor="middle">共享 1536 维空间，这里压成二维示意</text>

<circle cx="760" cy="300" r="78" fill="#ffffff" stroke="#5fa886" stroke-dasharray="5 4"/>
<circle cx="735" cy="285" r="9" fill="#e3f4ec" stroke="#5fa886"/>
<text x="722" y="262" font-size="11" fill="#6b7280" text-anchor="middle">A 的嵌入</text>
<circle cx="785" cy="318" r="9" fill="#e3f4ec" stroke="#5fa886"/>
<text x="800" y="348" font-size="11" fill="#6b7280" text-anchor="middle">B 的嵌入</text>
<circle cx="762" cy="300" r="7" fill="#ecebfb" stroke="#8f8bd8"/>

<circle cx="1010" cy="250" r="9" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="1010" y="230" font-size="11" fill="#6b7280" text-anchor="middle">意思不同的答案</text>
<line x1="998" y1="256" x2="846" y2="292" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="930" y="300" font-size="11" fill="#9ca3af" text-anchor="middle">离得远</text>

<text x="833" y="408" font-size="11" fill="#6b7280" text-anchor="middle">两种说法落在同一团里：预测器只需对准一个单峰，</text>
<text x="833" y="426" font-size="11" fill="#6b7280" text-anchor="middle">措辞差异由 Y-Encoder 抹平，不再占预测器的容量</text>
</svg>
