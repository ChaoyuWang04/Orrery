<text x="884" y="340" font-size="11" fill="#6b7280">拼到下一轮用户输入前面</text>
<text x="30" y="436" font-size="11" fill="#9ca3af">块格式（原文）：&lt;|timestamp|&gt;:&lt;|video-tokens|&gt;&lt;|audio-start-token|&gt;&lt;|audio-tokens|&gt;&lt;|timestamp|&gt;:&lt;|video-tokens|&gt;&lt;|audio-tokens|&gt;…</text>
<text x="30" y="454" font-size="11" fill="#9ca3af">…&lt;|audio-end-token|&gt;。时间戳是纯文本，图中写成「0s」「3s」只为简短。</text>
