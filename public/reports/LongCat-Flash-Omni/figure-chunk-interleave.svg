<text x="30" y="32" font-size="19" font-weight="700" fill="#111827">块级交错：用户说话时 1 秒一块看得密，模型说话时 2 秒一块看得疏</text>
<text x="30" y="54" font-size="13" fill="#6b7280">黄 = 视频帧；绿 = 用户音频；灰 = 文本时间戳；紫 = 模型输出。根据 PDF p. 8（2.4.2 节）与 p. 22–23 重画的机制示意，秒数是示例，不是实测。</text>
<text x="30" y="105" font-size="14" font-weight="700" fill="#111827">谁在说话</text>
<text x="30" y="175" font-size="14" font-weight="700" fill="#111827">采样到的输入</text>
<text x="30" y="295" font-size="14" font-weight="700" fill="#111827">送进 LLM 的块</text>
