<text x="30" y="32" font-size="19" font-weight="700" fill="#111827">模态解耦并行：同一组 8 张卡，编码器和 LLM 各按自己的方式切</text>
<text x="30" y="54" font-size="13" fill="#6b7280">同一列 = 同一张物理卡。绿 = 编码器；紫 = LLM；黄 = ModalityBridge；灰 = 物理卡。按原文 Figure 8 的示例配置（DP = 1、PP = 4、CP = 2）重画，PDF p. 18–19。</text>
<text x="30" y="98" font-size="14" font-weight="700" fill="#111827">① 取数</text>
