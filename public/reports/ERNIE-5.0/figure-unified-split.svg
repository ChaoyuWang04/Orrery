<text x="832" y="136" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">RVQ 各层嵌入相加</text>
<text x="832" y="156" font-size="11" fill="#6b7280" text-anchor="middle">12.5 Hz，首层对齐 Whisper</text>
<rect x="932" y="112" width="176" height="58" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="1020" y="136" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">上文 + 说话人嵌入</text>
<text x="1020" y="156" font-size="11" fill="#6b7280" text-anchor="middle">说话人嵌入控制音色</text>

