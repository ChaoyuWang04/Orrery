<text x="644" y="94" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">画图 / 视频</text>
<text x="832" y="94" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">听音频</text>
<text x="1020" y="94" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">说音频</text>

<text x="30" y="146" font-size="14" fill="#111827" font-weight="700">入口</text>
