<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">ERNIE 5.0 统一到哪一层：共用的是中间那条主干，入口和出口仍按任务分开</text>
<text x="30" y="54" font-size="13" fill="#6b7280">绿 = 所有模态共用一份；黄 = 按模态或任务单独一份；灰 = 不另设部件；红 = 与主干分开训练</text>

<text x="268" y="94" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">文本</text>
