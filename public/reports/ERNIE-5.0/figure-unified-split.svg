<rect x="180" y="198" width="928" height="74" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="644" y="228" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">统一 Transformer 主干：同一套注意力、同一个路由器、同一池专家</text>
<text x="644" y="252" font-size="11" fill="#6b7280" text-anchor="middle">Next-Group-of-Tokens 目标；路由只看 Token 表示、不看模态 ID；激活率低于 3%</text>

