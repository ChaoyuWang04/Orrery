<text x="268" y="156" font-size="11" fill="#6b7280" text-anchor="middle">重训的 BPE 词表</text>
<rect x="368" y="112" width="176" height="58" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="456" y="136" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">CNN + ViT 双路</text>
<text x="456" y="156" font-size="11" fill="#6b7280" text-anchor="middle">量化前特征 + Patch Merger</text>
