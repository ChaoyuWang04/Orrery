<text x="30.0" y="486.0" font-size="12" fill="#6b7280" text-anchor="start">据 PDF p. 20 Figure 6 重画。奇异向量基是「最能把能量集中起来」的那组坐标，它给出一个模型输出峰度的上限参照；</text>
<text x="30.0" y="506.0" font-size="12" fill="#6b7280" text-anchor="start">我们的读法：两剂药模型在这组坐标下仍有约 10³ 的峰度，层输出里仍有少数占主导的方向，只是不再对齐某个通道。</text>
