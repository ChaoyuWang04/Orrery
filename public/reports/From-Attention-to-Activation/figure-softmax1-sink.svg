<text x="30.0" y="494.0" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p. 1 Figure 1(a)、p. 4 式 (1)、p. 5 Figure 2 重画的机制示意，格子深浅不是实测注意力值。</text>
