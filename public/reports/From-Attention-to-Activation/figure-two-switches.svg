<text x="941.2" y="442.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">两者都用</text>
<text x="941.2" y="462.0" font-size="12" fill="#6b7280" text-anchor="middle">首 Token 最常被看：1.9%</text>
<rect x="830.0" y="86.0" width="16.0" height="16.0" rx="3" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="852.0" y="99.0" font-size="12" fill="#111827" text-anchor="start">首位置峰度</text>
<rect x="950.0" y="86.0" width="16.0" height="16.0" rx="3" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="972.0" y="99.0" font-size="12" fill="#111827" text-anchor="start">其余位置峰度</text>
<text x="30.0" y="500.0" font-size="12" fill="#6b7280" text-anchor="start">据 PDF p. 8 Table 2 的 GPT2-130M 四行重画。softmax-1 单独就压掉了首位置的大半峰度，却几乎不动其余位置；</text>
<text x="30.0" y="520.0" font-size="12" fill="#6b7280" text-anchor="start">OrthoAdam 单独把其余位置压到 20 左右，首位置仍在 400 以上。首位置那个最极端的离群值，同时挂在两个开关上。</text>
</svg>
