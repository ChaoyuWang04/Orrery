<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">黄 = 首位置隐藏状态的峰度；紫 = 其余位置的峰度（各层平均，纵轴对数）。灰虚线 = 高斯分布的峰度 3。</text>
<text x="30.0" y="72.0" font-size="13" fill="#6b7280" text-anchor="start">柱下第二行是「首 Token 是最常被看的键」的 (查询, 头) 占比。</text>
