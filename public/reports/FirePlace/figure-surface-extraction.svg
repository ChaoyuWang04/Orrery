<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" width="1120" height="590" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="590" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">包围盒看不见搁板：FirePlace 把「书放架子上」落到某一层的平面上</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">书架侧视示意。灰 = 书架网格；黄 = 包围盒及其朝上的面；绿 = 按法向抽出的朝上平面（候选交互表面）；紫 = 要放的书。</text>
<rect x="20" y="72" width="520" height="420" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="280" y="98" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">旧做法：约束写在包围盒上</text>
<text x="280" y="118" font-size="11" fill="#6b7280" text-anchor="middle">LayoutGPT、Holodeck 一类</text>
<rect x="580" y="72" width="520" height="420" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="840" y="98" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">FirePlace：先抽表面，再指一块</text>
<text x="840" y="118" font-size="11" fill="#6b7280" text-anchor="middle">SurfExtr 加分批视觉选择</text>
<rect x="90" y="170" width="12" height="290" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="298" y="170" width="12" height="290" fill="#eeeeee" stroke="#b9b9b9"/>
