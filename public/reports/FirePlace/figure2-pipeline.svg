<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 582" width="1120" height="582" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="582" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 2：一件物体怎样被放进已有场景——五段流水线</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = 调用 MLLM（Gemini-1.5 Pro）做选择或判断；黄 = 几何工具、求解器或渲染器；虚线框 = 原文的窗台例子。</text>
<text x="120.0" y="92" font-size="12" fill="#6b7280" text-anchor="middle">Stage 1</text>
<text x="120.0" y="114" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">约束大纲</text>
<rect x="20" y="132" width="200" height="58" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="120.0" y="157" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">MLLM 写三元组</text>
<text x="120.0" y="177" font-size="11" fill="#6b7280" text-anchor="middle">约束名 + 两块表面的文字</text>
<rect x="20" y="366" width="200" height="92" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="120.0" y="394" font-size="12" fill="#111827" text-anchor="middle">Contact（动物底面，</text>
<text x="120.0" y="416" font-size="12" fill="#111827" text-anchor="middle">窗台顶面）</text>
<text x="120.0" y="438" font-size="12" fill="#111827" text-anchor="middle">NoOverhang（同一对表面）</text>
<line x1="222" y1="161" x2="238" y2="161" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="340.0" y="92" font-size="12" fill="#6b7280" text-anchor="middle">Stage 2</text>
<text x="340.0" y="114" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">锚物体</text>
<rect x="240" y="132" width="200" height="58" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="340.0" y="157" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">USD 渲染实例掩码</text>
<text x="340.0" y="177" font-size="11" fill="#6b7280" text-anchor="middle">不另训分割网络</text>
<line x1="340.0" y1="190" x2="340.0" y2="206" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="240" y="208" width="200" height="58" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="340.0" y="233" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">MLLM 报掩码颜色</text>
<text x="340.0" y="253" font-size="11" fill="#6b7280" text-anchor="middle">分批，每批至多 3 个</text>
<rect x="240" y="366" width="200" height="92" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="340.0" y="394" font-size="12" fill="#111827" text-anchor="middle">从满屏的分割掩码里</text>
<text x="340.0" y="416" font-size="12" fill="#111827" text-anchor="middle">选中窗台这一件</text>
<line x1="442" y1="161" x2="458" y2="161" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="560.0" y="92" font-size="12" fill="#6b7280" text-anchor="middle">Stage 3</text>
<text x="560.0" y="114" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">交互表面</text>
<rect x="460" y="132" width="200" height="58" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="560.0" y="157" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">MLLM 选朝向</text>
<text x="560.0" y="177" font-size="11" fill="#6b7280" text-anchor="middle">上下左右前后六选一</text>
<line x1="560.0" y1="190" x2="560.0" y2="206" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="460" y="208" width="200" height="58" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="560.0" y="233" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">按法向抽平面凸包</text>
<text x="560.0" y="253" font-size="11" fill="#6b7280" text-anchor="middle">DBSCAN 分层后拟合</text>
<line x1="560.0" y1="266" x2="560.0" y2="282" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="460" y="284" width="200" height="58" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="560.0" y="309" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">MLLM 报表面颜色</text>
<text x="560.0" y="329" font-size="11" fill="#6b7280" text-anchor="middle">分批，每批至多 3 块</text>
<rect x="460" y="366" width="200" height="92" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="560.0" y="394" font-size="12" fill="#111827" text-anchor="middle">动物取朝下，窗台取朝上</text>
<text x="560.0" y="416" font-size="12" fill="#111827" text-anchor="middle">垫子、花瓶连在窗台网格上</text>
<text x="560.0" y="438" font-size="12" fill="#111827" text-anchor="middle">仍选中能放东西的那块</text>
<line x1="662" y1="161" x2="678" y2="161" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="780.0" y="92" font-size="12" fill="#6b7280" text-anchor="middle">Stage 4</text>
<text x="780.0" y="114" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">可行摆放</text>
<rect x="680" y="132" width="200" height="58" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="780.0" y="157" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">MLLM 估距离参数</text>
<text x="780.0" y="177" font-size="11" fill="#6b7280" text-anchor="middle">只有 CloseTo 与 FarFrom 有</text>
<line x1="780.0" y1="190" x2="780.0" y2="206" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="680" y="208" width="200" height="58" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="780.0" y="233" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">模拟退火求变换 T</text>
<text x="780.0" y="253" font-size="11" fill="#6b7280" text-anchor="middle">损失和低于阈值的留下</text>
<rect x="680" y="366" width="200" height="92" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="780.0" y="394" font-size="12" fill="#111827" text-anchor="middle">得到一批满足约束的</text>
<text x="780.0" y="416" font-size="12" fill="#111827" text-anchor="middle">位置，有的贴着边缘</text>
<line x1="882" y1="161" x2="898" y2="161" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="1000.0" y="92" font-size="12" fill="#6b7280" text-anchor="middle">Stage 5</text>
<text x="1000.0" y="114" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">合理摆放</text>
<rect x="900" y="132" width="200" height="58" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="1000.0" y="157" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">渲染每个候选</text>
<text x="1000.0" y="177" font-size="11" fill="#6b7280" text-anchor="middle">插入场景后出图</text>
<line x1="1000.0" y1="190" x2="1000.0" y2="206" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="900" y="208" width="200" height="58" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="1000.0" y="233" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">MLLM 先写评判标准</text>
<text x="1000.0" y="253" font-size="11" fill="#6b7280" text-anchor="middle">再两两比较渲染图</text>
<rect x="900" y="366" width="200" height="92" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="1000.0" y="394" font-size="12" fill="#111827" text-anchor="middle">美观、功能、可达性</text>
<text x="1000.0" y="416" font-size="12" fill="#111827" text-anchor="middle">留下更居中的那组</text>
<rect x="20" y="478" width="200" height="34" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="120.0" y="500" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">常识</text>
<rect x="240" y="478" width="640" height="34" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="560.0" y="500" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">3D 几何推理</text>
<rect x="900" y="478" width="200" height="34" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="1000.0" y="500" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">常识</text>
<text x="30" y="542" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 4 Figure 2 与 Algorithm 1、p. 5 §3.3–3.5 重画；底部两种分段照原图的 Common Sense / 3D Geometric Reasoning 色条。</text>
<text x="30" y="564" font-size="13" fill="#6b7280" text-anchor="start">每条三元组都要走一遍 Stage 2–3，全部约束收齐后才进 Stage 4 一起求解。除 Stage 4 的求解外，每一段都在调用 MLLM。</text>
</svg>