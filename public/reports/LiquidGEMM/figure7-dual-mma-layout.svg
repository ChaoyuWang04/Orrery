<text x="484.0" y="404.0" font-size="11" fill="#9ca3af" text-anchor="middle">bank 4–7</text>
<text x="680.0" y="404.0" font-size="11" fill="#9ca3af" text-anchor="middle">bank 28–31</text>
<text x="400.0" y="432.0" font-size="11" fill="#9ca3af" text-anchor="middle">下一行轮到 T8–T15，再往下 T16–T23、T24–T31，4 行排满一个 warp</text>
<text x="790.0" y="334.0" font-size="12" fill="#6b7280" text-anchor="start">8 个线程同时各发一条 LDS.128，</text>
<text x="790.0" y="356.0" font-size="12" fill="#6b7280" text-anchor="start">8 × 16 字节正好铺满 32 个 bank：</text>
<text x="790.0" y="378.0" font-size="12" fill="#6b7280" text-anchor="start">没有 bank 冲突，也不用 swizzle。</text>
<text x="790.0" y="400.0" font-size="12" fill="#6b7280" text-anchor="start">显存里离线排成同样顺序，</text>
<text x="790.0" y="422.0" font-size="12" fill="#6b7280" text-anchor="start">从 HBM 搬进来直接用 LDG.128。</text>
<text x="30.0" y="486.0" font-size="12" fill="#6b7280" text-anchor="start">据 PDF p.7 Figure 7 与 p.7–8 正文重画；格宽只表示数据归属，不按字节比例。</text>
