<text x="576.0" y="132.0" font-size="12" fill="#6b7280" text-anchor="middle">MMA2 要的一半</text>
<text x="404.0" y="250.0" font-size="11" fill="#9ca3af" text-anchor="middle">每行 32 个 UINT4 = 16 字节；往下各行依次轮到 T8–T31</text>
<text x="790.0" y="130.0" font-size="12" fill="#6b7280" text-anchor="start">ldmatrix 每 4 字节交给一个线程，</text>
<text x="790.0" y="152.0" font-size="12" fill="#6b7280" text-anchor="start">而 4 字节此时装着两格、8 个 UINT4：</text>
<text x="790.0" y="174.0" font-size="12" fill="#6b7280" text-anchor="start">本该给相邻线程的数据被送错了人。</text>
<text x="790.0" y="196.0" font-size="12" fill="#6b7280" text-anchor="start">退路 LDS.32：一次拿 8 个只用 4 个，</text>
<text x="790.0" y="218.0" font-size="12" fill="#6b7280" text-anchor="start">带宽浪费一半，指令和地址计算都更多。</text>
<rect x="16" y="286" width="1088" height="170" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36.0" y="310.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">(b) Dual-MMA 打包布局：T0 两次 MMA 的 32 个 UINT4 连成一段 16 字节</text>
