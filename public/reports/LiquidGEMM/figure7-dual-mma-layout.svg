<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 7：把同一线程两次 MMA 要的 32 个 UINT4 排在一起，一条 LDS.128 拿齐</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">紫 = 线程 T0 的数据；灰 = 其他线程的数据；红框 = ldmatrix 按「1 字节 1 个元素」切出的 4 字节。常规布局一格是 4 个 UINT4（2 字节）。</text>
