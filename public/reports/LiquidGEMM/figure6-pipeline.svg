<text x="30.0" y="528.0" font-size="12" fill="#6b7280" text-anchor="start">两种流水共用同一套数据布局和反量化逻辑；它们在消融里多出来的收益还来自 grouped GEMM 之间的流水（PDF p.11）。</text>
