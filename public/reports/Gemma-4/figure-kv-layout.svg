<text x="44.0" y="432.0" font-size="11" fill="#6b7280">5:1（E2B 为 4:1）沿用 Gemma 3。</text>
<rect x="390.0" y="356.0" width="340.0" height="100.0" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="404.0" y="378.0" font-size="14" fill="#111827" font-weight="700">全局层：p-RoPE 与键当值</text>
<text x="404.0" y="398.0" font-size="11" fill="#6b7280">只有 25% 维度做旋转（p = 0.25），</text>
<text x="404.0" y="415.0" font-size="11" fill="#6b7280">RoPE 频率 1M，局部层为 10k。</text>
<text x="404.0" y="432.0" font-size="11" fill="#6b7280">12B、26B-A4B、31B 的全局层令 values = keys；</text>
<text x="404.0" y="449.0" font-size="11" fill="#6b7280">报告称全局 KV 最多省 37.5%。</text>
<rect x="750.0" y="356.0" width="340.0" height="100.0" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="764.0" y="378.0" font-size="14" fill="#111827" font-weight="700">小模型：跨层共享 KV</text>
<text x="764.0" y="398.0" font-size="11" fill="#6b7280">E2B、E4B 不做键当值，</text>
<text x="764.0" y="415.0" font-size="11" fill="#6b7280">改让后面若干层直接复用前面层的 KV。</text>
<text x="764.0" y="432.0" font-size="11" fill="#6b7280">报告只写了比例，没写哪几层、</text>
<text x="764.0" y="449.0" font-size="11" fill="#6b7280">复用谁；图中位置按官方实现画。</text>
</svg>
