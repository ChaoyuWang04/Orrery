<text x="30.0" y="32.0" font-size="19" fill="#111827" font-weight="700">三种尺寸的层排布：只有全局层的缓存随上下文变长</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280">紫 = 滑动窗口局部层（缓存封顶在窗口内）；黄 = 全局层；绿边 = 全局层 values = keys；虚线格 = 不存自己的 KV，复用前面层已算好的。</text>
<text x="30.0" y="72.0" font-size="13" fill="#6b7280">比例来自 PDF p. 1–2；层数、窗口、排布顺序与共享层位置来自官方 config 与 model card（外部补充）。</text>
