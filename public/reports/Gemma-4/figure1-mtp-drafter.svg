<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" width="1120" height="490" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="gmt-ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="490" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" font-weight="700">MTP 草稿头：不自己 prefill，直接读主模型两层的 KV</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280">灰 = 主模型；紫 = 草稿头（4 层 Transformer，自带 embedder）；黄 = 在两步之间传递的激活；红虚线 = 草稿头读主模型 KV。</text>
<text x="30.0" y="72.0" font-size="13" fill="#6b7280">按 PDF p. 3 Figure 1 与 p. 4 正文重画，只画两个草稿步；是机制示意。</text>
<text x="160.0" y="96.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">主模型</text>
<rect x="40.0" y="110.0" width="240.0" height="34.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="160.0" y="132.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">解嵌入 + softmax → t2</text>
<rect x="40.0" y="156.0" width="240.0" height="30.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="160.0" y="176.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">第 N 层</text>
<rect x="40.0" y="198.0" width="240.0" height="40.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="160.0" y="216.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">最后一个已 prefill 的全局层</text>
<text x="160.0" y="232.0" font-size="11" fill="#6b7280" text-anchor="middle">KV 供草稿头读</text>
<rect x="40.0" y="248.0" width="240.0" height="40.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="160.0" y="266.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">最后一个已 prefill 的局部层</text>
<text x="160.0" y="282.0" font-size="11" fill="#6b7280" text-anchor="middle">KV 供草稿头读</text>
<rect x="40.0" y="298.0" width="240.0" height="30.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="160.0" y="318.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">……</text>
<rect x="40.0" y="340.0" width="240.0" height="30.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
