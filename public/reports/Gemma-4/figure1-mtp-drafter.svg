<text x="760.0" y="96.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">草稿第 2 步</text>
<rect x="660.0" y="110.0" width="200.0" height="34.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="760.0" y="132.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">解嵌入 → t4</text>
<rect x="660.0" y="156.0" width="200.0" height="30.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="760.0" y="176.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">MTP 层 4</text>
<rect x="660.0" y="196.0" width="200.0" height="30.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="760.0" y="216.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">MTP 层 3</text>
<rect x="660.0" y="236.0" width="200.0" height="30.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="760.0" y="256.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">MTP 层 2</text>
<rect x="660.0" y="276.0" width="200.0" height="30.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="760.0" y="296.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">MTP 层 1</text>
<rect x="660.0" y="322.0" width="200.0" height="40.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="760.0" y="347.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">拼接 + 降维</text>
<rect x="660.0" y="382.0" width="200.0" height="30.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="760.0" y="402.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">输入嵌入 t3</text>
<path d="M760.0,156.0 L760.0,146.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#gmt-ar)"/>
<path d="M760.0,196.0 L760.0,188.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#gmt-ar)"/>
<path d="M760.0,236.0 L760.0,228.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#gmt-ar)"/>
<path d="M760.0,276.0 L760.0,268.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#gmt-ar)"/>
<path d="M760.0,322.0 L760.0,308.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#gmt-ar)"/>
<path d="M760.0,382.0 L760.0,364.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#gmt-ar)"/>
<text x="760.0" y="432.0" font-size="11" fill="#d9877a" text-anchor="middle">同样读主模型那两层的 KV</text>
<path d="M280.0,171.0 L340.0,171.0 L340.0,342.0 L398.0,342.0" fill="none" stroke="#d4a24c" stroke-width="1.6" marker-end="url(#gmt-ar)"/>
<path d="M600.0,171.0 L630.0,171.0 L630.0,342.0 L658.0,342.0" fill="none" stroke="#d4a24c" stroke-width="1.6" marker-end="url(#gmt-ar)"/>
<rect x="40.0" y="452.0" width="16.0" height="12.0" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="64.0" y="463.0" font-size="11" fill="#6b7280">主模型第 N 层的激活，与 t2 的嵌入拼接后降维，进入草稿第 1 步</text>
<rect x="560.0" y="452.0" width="16.0" height="12.0" rx="2" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="584.0" y="463.0" font-size="11" fill="#6b7280">草稿第 1 步 MTP 层 4 的输出升维后，接替它进入第 2 步</text>
<text x="928.0" y="130.0" font-size="14" fill="#111827" font-weight="700">为什么省</text>
<text x="928.0" y="154.0" font-size="11" fill="#6b7280">草稿头不必把前文再读一遍</text>
<text x="928.0" y="172.0" font-size="11" fill="#6b7280">建自己的缓存；草稿长度</text>
<text x="928.0" y="190.0" font-size="11" fill="#6b7280">也不受限（p. 4）。</text>
<text x="928.0" y="228.0" font-size="14" fill="#111827" font-weight="700">小模型再省一步</text>
<text x="928.0" y="252.0" font-size="11" fill="#6b7280">E2B、E4B 的草稿头把</text>
<text x="928.0" y="270.0" font-size="11" fill="#6b7280">投影到整个词表换成在</text>
<text x="928.0" y="288.0" font-size="11" fill="#6b7280">Token 簇上取 top-k：</text>
<text x="928.0" y="306.0" font-size="11" fill="#6b7280">d × 262,000 → d × 4096。</text>
<text x="928.0" y="344.0" font-size="14" fill="#111827" font-weight="700">规模</text>
<text x="928.0" y="368.0" font-size="11" fill="#6b7280">宽度：E2B / E4B 为 256，</text>
<text x="928.0" y="386.0" font-size="11" fill="#6b7280">26B-A4B / 31B 为 1024；</text>
<text x="928.0" y="404.0" font-size="11" fill="#6b7280">3 层局部 + 1 层全局。</text>
</svg>
