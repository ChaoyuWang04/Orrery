<path d="M160.0,382.0 L160.0,372.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#gmt-ar)"/>
<text x="500.0" y="96.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">草稿第 1 步</text>
<rect x="400.0" y="110.0" width="200.0" height="34.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="500.0" y="132.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">解嵌入 → t3</text>
<rect x="400.0" y="156.0" width="200.0" height="30.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="500.0" y="176.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">MTP 层 4</text>
<rect x="400.0" y="196.0" width="200.0" height="30.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="500.0" y="216.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">MTP 层 3</text>
<rect x="400.0" y="236.0" width="200.0" height="30.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="500.0" y="256.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">MTP 层 2</text>
<rect x="400.0" y="276.0" width="200.0" height="30.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="500.0" y="296.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">MTP 层 1</text>
<rect x="400.0" y="322.0" width="200.0" height="40.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="500.0" y="347.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">拼接 + 降维</text>
<rect x="400.0" y="382.0" width="200.0" height="30.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="500.0" y="402.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">输入嵌入 t2</text>
<path d="M500.0,156.0 L500.0,146.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#gmt-ar)"/>
<path d="M500.0,196.0 L500.0,188.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#gmt-ar)"/>
<path d="M500.0,236.0 L500.0,228.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#gmt-ar)"/>
<path d="M500.0,276.0 L500.0,268.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#gmt-ar)"/>
<path d="M500.0,322.0 L500.0,308.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#gmt-ar)"/>
<path d="M500.0,382.0 L500.0,364.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#gmt-ar)"/>
<path d="M400.0,171.0 L286.0,262.0" fill="none" stroke="#d9877a" stroke-width="1.2" stroke-dasharray="3 3"/>
