<rect x="890" y="318.4" width="24" height="11.6" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="926" y="319.4" width="24" height="10.6" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="962" y="320.3" width="24" height="9.7" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="998" y="321.1" width="24" height="8.9" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="1034" y="321.8" width="24" height="8.2" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="218.0" y="348" font-size="11" fill="#6b7280" text-anchor="middle">1</text>
<text x="506.0" y="348" font-size="11" fill="#6b7280" text-anchor="middle">0.5</text>
<text x="794.0" y="348" font-size="11" fill="#6b7280" text-anchor="middle">0.25</text>
<text x="218.0" y="364" font-size="11" fill="#9ca3af" text-anchor="middle">距离 0</text>
<text x="506.0" y="364" font-size="11" fill="#9ca3af" text-anchor="middle">32 个 token 后</text>
<text x="794.0" y="364" font-size="11" fill="#9ca3af" text-anchor="middle">64 个 token 后</text>
<text x="992" y="364" font-size="11" fill="#9ca3af" text-anchor="middle">不是硬窗口，只是越远越轻</text>
<rect x="200" y="420" width="200" height="96" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="300.0" y="446" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">第三步：逐格相乘再求和</text>
<text x="300.0" y="472" font-size="11" fill="#6b7280" text-anchor="middle">FutureKL_t = Σ M_k·γ^(k−t)·Δlog p_k</text>
<text x="300.0" y="492" font-size="11" fill="#6b7280" text-anchor="middle">掩码格不参与；只看 t 之后</text>
<rect x="430" y="420" width="190" height="96" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="525.0" y="446" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">第四步：取指数</text>
<text x="525.0" y="472" font-size="11" fill="#6b7280" text-anchor="middle">exp(FutureKL_t)</text>
<text x="525.0" y="492" font-size="11" fill="#6b7280" text-anchor="middle">从对数域回到乘法域</text>
<rect x="650" y="420" width="200" height="96" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="750.0" y="446" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">第五步：裁剪成 f_t</text>
<text x="750.0" y="472" font-size="11" fill="#6b7280" text-anchor="middle">32B：裁到 [1, 1.2]，只放大</text>
<text x="750.0" y="492" font-size="11" fill="#6b7280" text-anchor="middle">7B：裁到 [0.8, 1.2]</text>
<rect x="880" y="420" width="210" height="96" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="985.0" y="446" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">第六步：乘回优势</text>
<text x="985.0" y="472" font-size="11" fill="#6b7280" text-anchor="middle">Ã_t = Â · f_t</text>
<text x="985.0" y="492" font-size="11" fill="#6b7280" text-anchor="middle">PPO 裁剪与 token 级平均不变</text>
<line x1="400" y1="468" x2="424" y2="468" stroke="#9ca3af" stroke-width="1.4"/>
<polygon points="424,463 430,468 424,473" fill="#9ca3af"/>
<line x1="620" y1="468" x2="644" y2="468" stroke="#9ca3af" stroke-width="1.4"/>
<polygon points="644,463 650,468 644,473" fill="#9ca3af"/>
<line x1="850" y1="468" x2="874" y2="468" stroke="#9ca3af" stroke-width="1.4"/>
<polygon points="874,463 880,468 874,473" fill="#9ca3af"/>
<text x="30" y="456" font-size="14" fill="#111827" font-weight="700">汇总</text>
<text x="30" y="476" font-size="11" fill="#6b7280">只改优势的大小，</text>
<text x="30" y="492" font-size="11" fill="#6b7280">不改它的正负</text>
<text x="30" y="560" font-size="13" fill="#6b7280">身后被整体抬高（FutureKL_t &gt; 0）时 f_t &gt; 1：答对的轨迹里这一步多拿奖励，答错的轨迹里这一步多挨罚。身后被整体压低时 f_t &lt; 1，但 32B 的下界是 1，这一半被关掉了。</text>
<text x="30" y="584" font-size="13" fill="#6b7280">另有一条保护：优势为负、重要性比又过大的 token，f_t 重置为 1，避免过罚（PDF p. 8）。</text>
<text x="30" y="612" font-size="11" fill="#9ca3af">示意图，不是论文原图。式 5 原文把条件写成 o&lt;t，按上下文应是 o&lt;k，图按后者画。</text>
</svg>
