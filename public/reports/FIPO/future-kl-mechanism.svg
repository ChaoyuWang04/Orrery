<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">Future-KL：一个 token 的权重，由它身后那截轨迹被抬高还是被压低决定</text>
<text x="30" y="58" font-size="13" fill="#6b7280">绿 = 概率被抬高的 token（Δlog p &gt; 0）；红 = 被压低的；灰 = 重要性比超过 10、被掩码剔除；紫 = 距离衰减与计算步骤；黄 = 最终的影响权重 f_t。</text>
<text x="30" y="78" font-size="13" fill="#6b7280">据 PDF p. 5–8 式 3–8 与 p. 20 Table 2 重画的机制示意；柱高是示意，不是实测。每格代表 4 个 token。</text>
<text x="30" y="176" font-size="14" fill="#111827" font-weight="700">第一步</text>
<text x="30" y="196" font-size="11" fill="#6b7280">每个位置的 Δlog p</text>
<text x="30" y="212" font-size="11" fill="#6b7280">= 新策略 − 旧策略</text>
<line x1="194" y1="200" x2="1064" y2="200" stroke="#9ca3af" stroke-width="1.4"/>
<rect x="206" y="146.0" width="24" height="54.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
