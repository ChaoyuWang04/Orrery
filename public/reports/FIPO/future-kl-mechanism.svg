<rect x="422" y="170" width="24" height="30" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="434.0" y="190" font-size="14" fill="#6b7280" text-anchor="middle">×</text>
<rect x="458" y="170.0" width="24" height="30.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
