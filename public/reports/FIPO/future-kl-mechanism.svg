<rect x="530" y="302.5" width="24" height="27.5" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="566" y="304.8" width="24" height="25.2" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
