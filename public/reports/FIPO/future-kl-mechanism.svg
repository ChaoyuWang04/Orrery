<rect x="746" y="182.0" width="24" height="18.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="782" y="188.0" width="24" height="12.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="818" y="200" width="24" height="18.0" rx="3" fill="#fbe9e7" stroke="#d9877a"/>
<rect x="854" y="176.0" width="24" height="24.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="890" y="200" width="24" height="12.0" rx="3" fill="#fbe9e7" stroke="#d9877a"/>
<rect x="926" y="182.0" width="24" height="18.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="962" y="188.0" width="24" height="12.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="998" y="200" width="24" height="18.0" rx="3" fill="#fbe9e7" stroke="#d9877a"/>
<rect x="1034" y="188.0" width="24" height="12.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="201" y="134" width="34" height="104" rx="6" fill="none" stroke="#8f8bd8" stroke-width="2" stroke-dasharray="5 4"/>
<text x="218.0" y="128" font-size="11" fill="#6b7280" text-anchor="middle">当前 token t</text>
<text x="434.0" y="230" font-size="11" fill="#9ca3af" text-anchor="middle">撞上 Dual-Clip</text>
<text x="434.0" y="244" font-size="11" fill="#9ca3af" text-anchor="middle">阈值，M_k = 0</text>
<text x="30" y="296" font-size="14" fill="#111827" font-weight="700">第二步</text>
<text x="30" y="316" font-size="11" fill="#6b7280">按距离衰减</text>
<text x="30" y="332" font-size="11" fill="#6b7280">γ = 2^(−1/τ)，τ = 32</text>
<line x1="194" y1="330" x2="1064" y2="330" stroke="#9ca3af" stroke-width="1.4"/>
<rect x="206" y="270.0" width="24" height="60.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="242" y="275.0" width="24" height="55.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="278" y="279.5" width="24" height="50.5" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="314" y="283.7" width="24" height="46.3" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
