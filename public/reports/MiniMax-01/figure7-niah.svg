<text x="30" y="452" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 10 Figure 7 重画。红柱数字是原图标注；黄、紫两色原图没有标数，是按柱高读出的近似值（误差约 ±2）。</text>
<text x="30" y="476" font-size="13" fill="#6b7280" text-anchor="start">同一张图上的常识推理平均分（CSR-AVG）三种结构相差都在 2 分以内（读图）：lightning 的语言建模能力不差，差的是检索。</text>
<text x="30" y="500" font-size="13" fill="#6b7280" text-anchor="start">实验设置：70M–7B 六个规模、至多 300B Token、上下文 8192、固定学习率（PDF p. 8–9）；图里只画了 410M 到 7B 四档。</text>
