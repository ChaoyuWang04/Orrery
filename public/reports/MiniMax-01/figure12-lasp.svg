<text x="30" y="500" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 18 Figure 12 与 p. 17–19 正文重画。原图每个 rank 内部还分成多个 B 大小的小块，不能整除的部分补零；这里只画 rank 之间的依赖。</text>
<text x="30" y="524" font-size="13" fill="#6b7280" text-anchor="start">代价（报告自述）：总通信量与临时显存都变多；收益：串行依赖消失，报告称 AllGather 的额外开销很小。</text>
<text x="30" y="548" font-size="13" fill="#6b7280" text-anchor="start">在此之上再加 varlen：每条样本先补齐到 256 的倍数再首尾拼接，一个 kernel 处理整批不等长输入（PDF p. 19）。</text>
