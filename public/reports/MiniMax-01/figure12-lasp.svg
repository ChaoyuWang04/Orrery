<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">LASP 到 LASP+：把「一棒传一棒」换成「各算各的，再一次性交换」</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">黄 = 不依赖别人的本地计算；紫 = 块间计算（要用前面所有 rank 的 KV）；绿 = 通信；灰 = 干等。横轴是时间，长度为示意。</text>
<text x="40" y="86" font-size="14" fill="#111827" text-anchor="start" font-weight="700">(a) LASP：第 r 个 rank 要等前面 r 个 rank 依次算完、把 KV 传过来</text>
