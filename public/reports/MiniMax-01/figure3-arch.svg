<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">MiniMax-Text-01：80 层按 7 比 1 交错，每层前馈都是 32 选 2 的 MoE</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = lightning attention 层（线性）；红 = softmax 注意力层；绿 = MoE 前馈；黄 = 输出门控；灰 = 残差与归一化。</text>
