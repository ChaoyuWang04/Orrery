<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 572" width="860" height="572" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="860" height="572" fill="#ffffff"/>
<text x="30" y="34" font-size="19" font-weight="700" fill="#111827">领先最强基线的那一截，多半在「只初始化、不进化」时就有了</text>
<text x="30" y="58" font-size="13" fill="#6b7280">同一 PaLM 2-L、零样本测试准确率，相对该列最强基线（竖线 0）的差，单位是百分点。</text>
<text x="30" y="78" font-size="13" fill="#6b7280">紫条 = 组合初始化（造 2k 条初始提示、不进化）带来的差；绿条 = 在它之上继续进化又多出的部分。</text>
<text x="30" y="98" font-size="11" fill="#9ca3af">数据取自原文 Table 1（PDF p. 8），差值由本文计算；左列括号里是那一列最好的基线。</text>
