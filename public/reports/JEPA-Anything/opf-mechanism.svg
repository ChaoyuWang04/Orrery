<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
<marker id="ard" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9877a"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">OPF：把目标切成 K 块正交坐标，分头预测，再合成回完整状态</text>
<text x="30" y="54" font-size="13" fill="#6b7280">白 = 输入视图；绿 = 接收梯度的可训练部件；灰 = EMA 目标编码器（不接梯度）；紫 = K 块因子坐标；红 = 损失与正则；黄 = 合成出的完整状态。</text>
<text x="30" y="72" font-size="13" fill="#6b7280">以 K = 4 为例，按 PDF p. 5–9 的式 (2)–(10) 与第 2.4 节重画，是机制示意，不是原图。</text>

<!-- context path -->
<rect x="30" y="120" width="140" height="60" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="100" y="146" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">上下文视图</text>
<text x="100" y="166" font-size="11" fill="#6b7280" text-anchor="middle">可见的 token 与描述</text>
<line x1="170" y1="150" x2="208" y2="150" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="210" y="120" width="160" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="290" y="146" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">在线编码器</text>
<text x="290" y="166" font-size="11" fill="#6b7280" text-anchor="middle">输出上下文表示 z_c</text>

<rect x="270" y="200" width="110" height="46" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="325" y="219" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">L_enc</text>
<text x="325" y="236" font-size="11" fill="#6b7280" text-anchor="middle">每维标准差设下限</text>
<line x1="325" y1="200" x2="325" y2="182" stroke="#d9877a" stroke-width="1.4" marker-end="url(#ard)"/>

<line x1="370" y1="150" x2="400" y2="150" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="400" y1="111" x2="400" y2="219" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="400" y1="111" x2="428" y2="111" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="400" y1="147" x2="428" y2="147" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="400" y1="183" x2="428" y2="183" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="400" y1="219" x2="428" y2="219" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="396" y="92" font-size="11" fill="#9ca3af" text-anchor="end">z_c 与目标描述 s_t</text>

<rect x="430" y="96" width="120" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="430" y="132" width="120" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="430" y="168" width="120" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="430" y="204" width="120" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="490" y="116" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">预测头 q1</text>
<text x="490" y="152" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">预测头 q2</text>
<text x="490" y="188" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">预测头 q3</text>
<text x="490" y="224" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">预测头 q4</text>

<line x1="550" y1="111" x2="588" y2="111" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="550" y1="147" x2="588" y2="147" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="550" y1="183" x2="588" y2="183" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="550" y1="219" x2="588" y2="219" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="590" y="96" width="80" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="590" y="132" width="80" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="590" y="168" width="80" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="590" y="204" width="80" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="630" y="115" font-size="11" fill="#111827" text-anchor="middle">预测块 1</text>
<text x="630" y="151" font-size="11" fill="#111827" text-anchor="middle">预测块 2</text>
<text x="630" y="187" font-size="11" fill="#111827" text-anchor="middle">预测块 3</text>
<text x="630" y="223" font-size="11" fill="#111827" text-anchor="middle">预测块 4</text>

<!-- L_pred -->
<rect x="580" y="262" width="150" height="56" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="655" y="284" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">L_pred</text>
<text x="655" y="304" font-size="11" fill="#6b7280" text-anchor="middle">逐块平方误差，式 (6)</text>
<line x1="630" y1="234" x2="630" y2="260" stroke="#d9877a" stroke-width="1.4" marker-end="url(#ard)"/>
<line x1="630" y1="346" x2="630" y2="320" stroke="#d9877a" stroke-width="1.4" marker-end="url(#ard)"/>

<!-- target path -->
<rect x="30" y="380" width="140" height="60" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="100" y="406" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">目标视图</text>
<text x="100" y="426" font-size="11" fill="#6b7280" text-anchor="middle">要预测的那部分状态</text>
<line x1="170" y1="410" x2="208" y2="410" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="210" y="380" width="160" height="60" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="290" y="406" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">EMA 目标编码器</text>
<text x="290" y="426" font-size="11" fill="#6b7280" text-anchor="middle">输出目标表示 z_t</text>

<line x1="240" y1="180" x2="240" y2="378" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="232" y="296" font-size="11" fill="#9ca3af" text-anchor="end">EMA 抄参数</text>
<text x="232" y="312" font-size="11" fill="#9ca3af" text-anchor="end">不传梯度</text>

<line x1="370" y1="410" x2="428" y2="410" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="399" y="400" font-size="11" fill="#9ca3af" text-anchor="middle">停梯度</text>
<rect x="430" y="380" width="120" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="490" y="406" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">投影 P_k 转置</text>
<text x="490" y="426" font-size="11" fill="#6b7280" text-anchor="middle">K 个可学矩阵 d×r</text>

<rect x="430" y="276" width="120" height="60" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="490" y="296" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">L_orth</text>
<text x="490" y="313" font-size="11" fill="#6b7280" text-anchor="middle">块内正交归一</text>
<text x="490" y="328" font-size="11" fill="#6b7280" text-anchor="middle">加块间正交</text>
<line x1="490" y1="336" x2="490" y2="378" stroke="#d9877a" stroke-width="1.4" marker-end="url(#ard)"/>

<line x1="550" y1="410" x2="570" y2="410" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="570" y1="361" x2="570" y2="469" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="570" y1="361" x2="588" y2="361" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="570" y1="397" x2="588" y2="397" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="570" y1="433" x2="588" y2="433" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="570" y1="469" x2="588" y2="469" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="590" y="346" width="80" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="590" y="382" width="80" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="590" y="418" width="80" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="590" y="454" width="80" height="30" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="630" y="365" font-size="11" fill="#111827" text-anchor="middle">目标块 1</text>
<text x="630" y="401" font-size="11" fill="#111827" text-anchor="middle">目标块 2</text>
<text x="630" y="437" font-size="11" fill="#111827" text-anchor="middle">目标块 3</text>
<text x="630" y="473" font-size="11" fill="#111827" text-anchor="middle">目标块 4</text>

<rect x="430" y="470" width="120" height="46" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="490" y="489" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">L_fac</text>
<text x="490" y="506" font-size="11" fill="#6b7280" text-anchor="middle">坐标标准差设下限</text>
<line x1="490" y1="470" x2="490" y2="442" stroke="#d9877a" stroke-width="1.4" marker-end="url(#ard)"/>

<!-- synthesis -->
<line x1="670" y1="111" x2="700" y2="111" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="670" y1="147" x2="700" y2="147" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="670" y1="183" x2="700" y2="183" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="670" y1="219" x2="700" y2="219" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="700" y1="111" x2="700" y2="219" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="700" y1="150" x2="758" y2="150" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="729" y="142" font-size="11" fill="#9ca3af" text-anchor="middle">拼接</text>
<rect x="760" y="116" width="200" height="68" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="860" y="142" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">合成完整预测状态</text>
<text x="860" y="162" font-size="11" fill="#6b7280" text-anchor="middle">用 P 转置的伪逆合成，式 (5)</text>
<text x="860" y="176" font-size="11" fill="#6b7280" text-anchor="middle">严格正交时伪逆就是 P 本身</text>

<line x1="860" y1="184" x2="860" y2="338" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="868" y="262" font-size="11" fill="#9ca3af">喂给解码器、规划器或下一步</text>

<!-- modes -->
<rect x="740" y="340" width="360" height="150" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="758" y="364" font-size="14" fill="#111827" font-weight="700">训练完之后的 3 种用法（PDF p. 9）</text>
<text x="758" y="392" font-size="11" fill="#6b7280">表示模式：只留在线编码器，下游直接读它的特征</text>
<text x="758" y="416" font-size="11" fill="#6b7280">世界模型模式：留投影与预测头，合成下一状态再往前推</text>
<text x="758" y="440" font-size="11" fill="#6b7280">因子分析模式：留投影，把在线状态投到各块当诊断坐标</text>
<text x="758" y="470" font-size="11" fill="#9ca3af">三种用法共用同一个训练循环，区别只在部署时留下哪几件</text>

<!-- footer -->
<text x="30" y="556" font-size="13" fill="#111827">训练总损失 = 该领域原来的损失 + L_pred + λ_orth·L_orth + λ_fac·L_fac + λ_enc·L_enc（式 10）</text>
<text x="30" y="578" font-size="11" fill="#9ca3af">标准 JEPA 对照组在同一个原损失上只加单体预测项，没有这 4 项（PDF p. 10）。</text>
</svg>
