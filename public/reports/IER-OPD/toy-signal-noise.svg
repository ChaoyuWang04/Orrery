<text x="30.0" y="582.0" font-size="13" fill="#6b7280" text-anchor="start">按 PDF p. 3–4 定理 1 的公式手算，是机制示意，不是论文实测。杠杆 L = (1−p)/p：学生越少写的 token，L 越大。</text>
<text x="30.0" y="606.0" font-size="13" fill="#6b7280" text-anchor="start">B 里要修的分歧落在 p = 0.2 与 p = 0.1 两个 token 上，单样本多数时候采不到它们，一采到又是一步很长的更新。</text>
<text x="30.0" y="630.0" font-size="13" fill="#6b7280" text-anchor="start">两边信号差不多（0.166 对 0.139），噪声从 0.150 涨到 0.675，IER 从 1.11 掉到 0.21。</text>
