<rect x="1005" y="373.8" width="16" height="18.2" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="1026" y="372.0" width="16" height="20.0" rx="3" fill="none" stroke="#b9b9b9" stroke-dasharray="3 3"/>
<rect x="1026" y="378.0" width="16" height="14.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="1047" y="378.0" width="16" height="14.0" rx="3" fill="none" stroke="#b9b9b9" stroke-dasharray="3 3"/>
<rect x="1047" y="382.2" width="16" height="9.8" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<text x="846.0" y="410" font-size="11" fill="#6b7280" text-anchor="middle">头部 H（k 个 Token）</text>
<text x="1002.5" y="410" font-size="11" fill="#6b7280" text-anchor="middle">尾部 T，纵向放大 5 倍</text>
<text x="774" y="160" font-size="11" fill="#6b7280">ρ = 0.07 ÷ 0.10 = 0.7；虚线框是缩放前的 p</text>
<line x1="368" y1="268" x2="384" y2="268" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="734" y1="268" x2="750" y2="268" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="20" y="476" width="1080" height="118" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="40" y="504" font-size="14" fill="#111827" font-weight="700">为什么只需对头部求和</text>
<text x="40" y="530" font-size="13" fill="#111827">训练端下 score 的期望恒为 0：整张词表上 Σ p·s = 0，所以尾部那一段 Σ(尾部) p·s 等于 −Σ(头部) p·s。</text>
<text x="40" y="554" font-size="13" fill="#111827">代回 q̂ 下的期望 score，尾部整段消失：E[s] = Σ(头部) (q − ρ·p)·s，只涉及 k 个 Token，词表再大也不用逐个求和。</text>
<text x="40" y="578" font-size="13" fill="#111827">和重要性采样叠加时同样只跑头部，把 ρ 换成标量 α = ρ·f(1/ρ) 即可。</text>
<text x="20" y="620" font-size="11" fill="#9ca3af">机制示意，柱高是虚构的数值；按原文附录 A.1 式 (7)(8) 与 A.2 式 (10) 画（PDF p. 12–13），不是原文图。</text>
</svg>