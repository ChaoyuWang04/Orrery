<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">top-k 尾部模型：头部用采样端记下的概率，尾部借训练端的分布按比例补齐</text>
<text x="30" y="58" font-size="13" fill="#6b7280">紫 = 采样端 q 在头部 k 个 Token 上的概率（每步实测记录）；灰 = 训练端 p；绿 = 训练端尾部乘 ρ 之后，当作采样端的尾部</text>
<rect x="20" y="80" width="348" height="376" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="194" y="106" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">① 采样端 q：只记下头部</text>
<text x="194" y="126" font-size="11" fill="#6b7280" text-anchor="middle">每个位置只存 top-k 个 logprob</text>
<line x1="34" y1="392" x2="354" y2="392" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="200" y1="176" x2="200" y2="392" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="42" y="232.0" width="24" height="160.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="72" y="292.0" width="24" height="100.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="102" y="332.0" width="24" height="60.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="132" y="360.0" width="24" height="32.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="162" y="372.0" width="24" height="20.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="208" y="300" width="126" height="86" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="271" y="338" font-size="11" fill="#9ca3af" text-anchor="middle">尾部</text>
<text x="271" y="356" font-size="11" fill="#9ca3af" text-anchor="middle">没有记录</text>
<text x="114.0" y="410" font-size="11" fill="#6b7280" text-anchor="middle">头部 H（k 个 Token）</text>
<text x="270.5" y="410" font-size="11" fill="#6b7280" text-anchor="middle">尾部 T，纵向放大 5 倍</text>
<text x="42" y="160" font-size="11" fill="#6b7280">头部质量 0.93，所以尾部共 0.07</text>
<rect x="386" y="80" width="348" height="376" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="560" y="106" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">② 训练端 p：整张词表都在手上</text>
<text x="560" y="126" font-size="11" fill="#6b7280" text-anchor="middle">反传时本来就要算完整的 logits</text>
<line x1="400" y1="392" x2="720" y2="392" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="566" y1="176" x2="566" y2="392" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="408" y="212.0" width="24" height="180.0" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="438" y="304.0" width="24" height="88.0" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="468" y="344.0" width="24" height="48.0" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="498" y="364.0" width="24" height="28.0" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="528" y="376.0" width="24" height="16.0" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="576" y="332.0" width="16" height="60.0" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="597" y="348.0" width="16" height="44.0" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="618" y="356.0" width="16" height="36.0" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="639" y="366.0" width="16" height="26.0" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="660" y="372.0" width="16" height="20.0" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="681" y="378.0" width="16" height="14.0" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="480.0" y="410" font-size="11" fill="#6b7280" text-anchor="middle">头部 H（k 个 Token）</text>
<text x="636.5" y="410" font-size="11" fill="#6b7280" text-anchor="middle">尾部 T，纵向放大 5 倍</text>
<text x="408" y="160" font-size="11" fill="#6b7280">头部质量 0.90，尾部 0.10</text>
<rect x="752" y="80" width="348" height="376" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="926" y="106" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">③ 拼出 q̂：头取 q，尾取 ρ·p</text>
<text x="926" y="126" font-size="11" fill="#6b7280" text-anchor="middle">ρ 让拼出来的分布总和恰好为 1</text>
<line x1="766" y1="392" x2="1086" y2="392" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="932" y1="176" x2="932" y2="392" stroke="#cbd2d9" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="774" y="232.0" width="24" height="160.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="804" y="292.0" width="24" height="100.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="834" y="332.0" width="24" height="60.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="864" y="360.0" width="24" height="32.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="894" y="372.0" width="24" height="20.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="942" y="332.0" width="16" height="60.0" rx="3" fill="none" stroke="#b9b9b9" stroke-dasharray="3 3"/>
<rect x="942" y="350.0" width="16" height="42.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="963" y="348.0" width="16" height="44.0" rx="3" fill="none" stroke="#b9b9b9" stroke-dasharray="3 3"/>
