<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">级联蒸馏：剪一刀、蒸馏补回来，再从短上下文版本往下剪</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">灰 = 父模型兼教师；黄 = 剪枝得到的初始权重；绿 = 短上下文蒸馏产物（下一刀从这里剪）；紫 = 长上下文 Base（叶子，不再往下传）。</text>
<rect x="40" y="80" width="240" height="56" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="160" y="104" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Mistral Small 3.1（24B）</text>
<text x="160" y="124" font-size="11" fill="#6b7280" text-anchor="middle">起点，同时是全部蒸馏的教师</text>
<rect x="100" y="170" width="200" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="200" y="194" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">14B Init.</text>
<text x="200" y="214" font-size="11" fill="#6b7280" text-anchor="middle">剪枝得到的初始权重</text>
<rect x="380" y="170" width="220" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="490" y="194" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">14B Short Ctx.</text>
<text x="490" y="214" font-size="11" fill="#6b7280" text-anchor="middle">16K 上下文，教师 logits 蒸馏</text>
<rect x="680" y="170" width="230" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="795" y="194" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Ministral 3 14B Base</text>
<text x="795" y="214" font-size="11" fill="#6b7280" text-anchor="middle">扩到 256K，教师仍是 MS3.1</text>
<line x1="300" y1="198" x2="378" y2="198" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="600" y1="198" x2="678" y2="198" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="925" y="203" font-size="11" fill="#9ca3af" text-anchor="start">后训练出 Instruct / Reasoning</text>
<rect x="100" y="300" width="200" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="200" y="324" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">8B Init.</text>
<text x="200" y="344" font-size="11" fill="#6b7280" text-anchor="middle">剪枝得到的初始权重</text>
<rect x="380" y="300" width="220" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="490" y="324" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">8B Short Ctx.</text>
<text x="490" y="344" font-size="11" fill="#6b7280" text-anchor="middle">16K 上下文，教师 logits 蒸馏</text>
<rect x="680" y="300" width="230" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="795" y="324" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Ministral 3 8B Base</text>
<text x="795" y="344" font-size="11" fill="#6b7280" text-anchor="middle">扩到 256K，教师仍是 MS3.1</text>
<line x1="300" y1="328" x2="378" y2="328" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="600" y1="328" x2="678" y2="328" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="925" y="333" font-size="11" fill="#9ca3af" text-anchor="start">后训练出 Instruct / Reasoning</text>
<rect x="100" y="430" width="200" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="200" y="454" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">3B Init.</text>
<text x="200" y="474" font-size="11" fill="#6b7280" text-anchor="middle">剪枝得到的初始权重</text>
<rect x="380" y="430" width="220" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="490" y="454" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">3B Short Ctx.</text>
<text x="490" y="474" font-size="11" fill="#6b7280" text-anchor="middle">16K 上下文，教师 logits 蒸馏</text>
<rect x="680" y="430" width="230" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="795" y="454" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Ministral 3 3B Base</text>
<text x="795" y="474" font-size="11" fill="#6b7280" text-anchor="middle">扩到 256K，教师仍是 MS3.1</text>
<line x1="300" y1="458" x2="378" y2="458" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="600" y1="458" x2="678" y2="458" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="925" y="463" font-size="11" fill="#9ca3af" text-anchor="start">后训练出 Instruct / Reasoning</text>
<line x1="160" y1="136" x2="160" y2="168" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="300" y="112" font-size="11" fill="#6b7280" text-anchor="start">第一刀：层数 40 与隐藏维 5120 不变，只把 FFN 32768 砍到 16384</text>
<polyline points="490,226 490,256 200,256 200,298" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="510" y="260" font-size="11" fill="#6b7280" text-anchor="start">第二刀：层 40→34，隐藏维 5120→4096，FFN 16384→14336</text>
<polyline points="490,356 490,386 200,386 200,428" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="510" y="390" font-size="11" fill="#6b7280" text-anchor="start">第三刀：层 34→26，隐藏维 4096→3072，FFN 14336→9216</text>
<text x="30" y="508" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 2 Figure 1 与 p. 3 Algorithm 1 重画。每一刀剪掉的维度是外部补充，来自 Hugging Face 官方 config.json，报告只给了子模型的 Table 1。</text>
</svg>
