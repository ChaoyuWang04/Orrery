<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 1 左：门可以插在注意力层的五个位置，只有 G1 和 G2 真正起作用</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">紫 = G1（SDPA 输出后）；绿 = G2（V 投影后）；红 = 几乎无效的位置；灰 = 原有的线性层与注意力。括号里是 15A2B MoE 上的 PPL 变化。</text>
<rect x="16.0" y="72.0" width="560.0" height="510.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="196.0" y="530.0" width="200.0" height="34.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="296.0" y="552.0" font-size="11" fill="#111827" text-anchor="middle">X：pre-norm 之后的隐状态</text>
<rect x="96.0" y="450.0" width="100.0" height="34.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="146.0" y="472.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">W_Q</text>
<line x1="296.0" y1="530.0" x2="146.0" y2="486.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="106.0" y="394.0" width="80.0" height="30.0" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="146.0" y="414.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">G4（−0.045）</text>
<line x1="146.0" y1="450.0" x2="146.0" y2="426.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="146.0" y1="394.0" x2="256.0" y2="342.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="246.0" y="450.0" width="100.0" height="34.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="296.0" y="472.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">W_K</text>
<line x1="296.0" y1="530.0" x2="296.0" y2="486.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="256.0" y="394.0" width="80.0" height="30.0" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="296.0" y="414.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">G3（−0.010）</text>
<line x1="296.0" y1="450.0" x2="296.0" y2="426.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="296.0" y1="394.0" x2="296.0" y2="342.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="396.0" y="450.0" width="100.0" height="34.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="446.0" y="472.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">W_V</text>
<line x1="296.0" y1="530.0" x2="446.0" y2="486.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="406.0" y="394.0" width="80.0" height="30.0" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="446.0" y="414.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">G2（−0.206）</text>
<line x1="446.0" y1="450.0" x2="446.0" y2="426.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="446.0" y1="394.0" x2="336.0" y2="342.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="146.0" y="300.0" width="300.0" height="40.0" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="296.0" y="325.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">SDPA：softmax(QKᵀ/√d_k)·V，每个头一份</text>
<line x1="296.0" y1="300.0" x2="296.0" y2="272.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="216.0" y="238.0" width="160.0" height="32.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="296.0" y="259.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">G1（−0.265）</text>
<text x="392.0" y="259.0" font-size="11" fill="#111827" text-anchor="start">← 最有效</text>
<line x1="296.0" y1="238.0" x2="296.0" y2="214.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="236.0" y="182.0" width="120.0" height="30.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="296.0" y="202.0" font-size="11" fill="#111827" text-anchor="middle">Concat 各头</text>
<line x1="296.0" y1="182.0" x2="296.0" y2="160.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="236.0" y="126.0" width="120.0" height="32.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="296.0" y="147.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">W_O</text>
<line x1="296.0" y1="126.0" x2="296.0" y2="112.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="236.0" y="80.0" width="120.0" height="30.0" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="296.0" y="100.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">G5（−0.009）</text>
<text x="36.0" y="100.0" font-size="11" fill="#9ca3af" text-anchor="start">输出</text>
<text x="36.0" y="552.0" font-size="11" fill="#9ca3af" text-anchor="start">输入</text>
<rect x="592.0" y="72.0" width="512.0" height="510.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="612.0" y="98.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">门的统一写法（式 5，PDF p. 3）</text>
<text x="612.0" y="124.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Y′ = Y ⊙ σ(X·W_θ)</text>
<text x="612.0" y="146.0" font-size="11" fill="#6b7280" text-anchor="start">Y：被调制的那一路；X：pre-norm 后的隐状态；σ：激活函数</text>
<text x="612.0" y="180.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">论文把门拆成五个维度来比（PDF p. 4）</text>
<rect x="612.0" y="200.0" width="90.0" height="30.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="657.0" y="220.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">位置</text>
<text x="716.0" y="220.0" font-size="11" fill="#6b7280" text-anchor="start">G1–G5 五处</text>
<rect x="612.0" y="240.0" width="90.0" height="30.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="657.0" y="260.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">粒度</text>
<text x="716.0" y="260.0" font-size="11" fill="#6b7280" text-anchor="start">逐头一个标量（headwise）／逐元素（elementwise）</text>
<rect x="612.0" y="280.0" width="90.0" height="30.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="657.0" y="300.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">头之间</text>
<text x="716.0" y="300.0" font-size="11" fill="#6b7280" text-anchor="start">每头各自一套（head-specific）／所有头共用</text>
<rect x="612.0" y="320.0" width="90.0" height="30.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="657.0" y="340.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">作用方式</text>
<text x="716.0" y="340.0" font-size="11" fill="#6b7280" text-anchor="start">相乘／相加</text>
<rect x="612.0" y="360.0" width="90.0" height="30.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="657.0" y="380.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">激活</text>
<text x="716.0" y="380.0" font-size="11" fill="#6b7280" text-anchor="start">sigmoid（主推）／SiLU（相加时用）</text>
<text x="612.0" y="428.0" font-size="13" fill="#111827" text-anchor="start">默认配置：逐头各自、相乘、sigmoid。</text>
<text x="612.0" y="456.0" font-size="13" fill="#111827" text-anchor="start">最终推荐：G1 + 逐元素 + sigmoid，学习率适当调大（PDF p. 2）。</text>
<text x="612.0" y="492.0" font-size="11" fill="#9ca3af" text-anchor="start">PPL 变化读自 Table 1 第 5–9 行，均为逐元素 sigmoid 门；</text>
<text x="612.0" y="512.0" font-size="11" fill="#9ca3af" text-anchor="start">基线 PPL 6.026，400B Token（PDF p. 5）。</text>
<text x="612.0" y="548.0" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p. 2 Figure 1 左与 p. 3–4 正文重画。</text>
</svg>
