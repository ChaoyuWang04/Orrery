<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">为什么 G1、G2 有效而 G5 无效：W_V 与 W_O 之间缺一个非线性</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">灰 = 线性映射；黄 = 按注意力分数 S_ij 加权求和（对 X_j 仍是线性的）；紫 = G1；绿 = G2；红 = G5。维度按 15A2B 标注。</text>
<rect x="16.0" y="72.0" width="1088.0" height="138.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36.0" y="96.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">无门：W_V 和 W_O 中间只有线性的加权求和</text>
<text x="36.0" y="116.0" font-size="11" fill="#6b7280" text-anchor="start">可以把 W_V·W_O 合成一个秩 ≤ 128 的 2048 × 2048 矩阵；GQA 下 W_V 还被组内多个头共用，更窄（式 6，PDF p. 6–7）</text>
<rect x="40.0" y="132.0" width="120.0" height="50.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="100.0" y="154.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">X_j</text>
<text x="100.0" y="172.0" font-size="11" fill="#6b7280" text-anchor="middle">2048 维</text>
<line x1="162.0" y1="157.0" x2="260.0" y2="157.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="262.0" y="132.0" width="120.0" height="50.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="322.0" y="154.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">W_V</text>
<text x="322.0" y="172.0" font-size="11" fill="#6b7280" text-anchor="middle">→ 128 维</text>
<line x1="384.0" y1="157.0" x2="482.0" y2="157.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="484.0" y="132.0" width="120.0" height="50.0" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="544.0" y="154.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Σ_j S_ij ·</text>
<text x="544.0" y="172.0" font-size="11" fill="#6b7280" text-anchor="middle">加权求和</text>
<line x1="606.0" y1="157.0" x2="704.0" y2="157.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="706.0" y="132.0" width="120.0" height="50.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="766.0" y="154.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">W_O</text>
<text x="766.0" y="172.0" font-size="11" fill="#6b7280" text-anchor="middle">128 → 2048</text>
<line x1="828.0" y1="157.0" x2="926.0" y2="157.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="928.0" y="132.0" width="120.0" height="50.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="988.0" y="154.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">输出 o_i</text>
<text x="988.0" y="172.0" font-size="11" fill="#6b7280" text-anchor="middle">2048 维</text>
<rect x="16.0" y="222.0" width="1088.0" height="138.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36.0" y="246.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">G2：在求和之前，给每个 X_j 的 value 各自过门</text>
<text x="36.0" y="266.0" font-size="11" fill="#6b7280" text-anchor="start">门由 X_j 算出，属于键值一侧（式 7）；打破了线性链，PPL −0.206</text>
<rect x="40.0" y="282.0" width="120.0" height="50.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="100.0" y="304.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">X_j</text>
<text x="100.0" y="322.0" font-size="11" fill="#6b7280" text-anchor="middle">2048 维</text>
<line x1="162.0" y1="307.0" x2="215.6" y2="307.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="217.6" y="282.0" width="120.0" height="50.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="277.6" y="304.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">W_V</text>
<text x="277.6" y="322.0" font-size="11" fill="#6b7280" text-anchor="middle">→ 128 维</text>
<line x1="339.6" y1="307.0" x2="393.2" y2="307.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="395.2" y="282.0" width="120.0" height="50.0" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="455.2" y="304.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">G2</text>
<text x="455.2" y="322.0" font-size="11" fill="#6b7280" text-anchor="middle">非线性</text>
<line x1="517.2" y1="307.0" x2="570.8" y2="307.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="572.8" y="282.0" width="120.0" height="50.0" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="632.8" y="304.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Σ_j S_ij ·</text>
<text x="632.8" y="322.0" font-size="11" fill="#6b7280" text-anchor="middle">加权求和</text>
<line x1="694.8" y1="307.0" x2="748.4" y2="307.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="750.4" y="282.0" width="120.0" height="50.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="810.4" y="304.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">W_O</text>
<text x="810.4" y="322.0" font-size="11" fill="#6b7280" text-anchor="middle">128 → 2048</text>
<line x1="872.4" y1="307.0" x2="926.0" y2="307.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="928.0" y="282.0" width="120.0" height="50.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="988.0" y="304.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">输出 o_i</text>
<text x="988.0" y="322.0" font-size="11" fill="#6b7280" text-anchor="middle">2048 维</text>
<rect x="16.0" y="372.0" width="1088.0" height="138.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36.0" y="396.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">G1：在求和之后、W_O 之前过门；G5 放在 W_O 之后则无济于事</text>
<text x="36.0" y="416.0" font-size="11" fill="#6b7280" text-anchor="start">门由当前查询 X_i 算出（式 8）；PPL −0.265。G5 在 W_O 之后，W_V·W_O 仍是一个低秩线性映射，PPL 只 −0.009</text>
<rect x="40.0" y="432.0" width="120.0" height="50.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="100.0" y="454.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">X_j</text>
<text x="100.0" y="472.0" font-size="11" fill="#6b7280" text-anchor="middle">2048 维</text>
<line x1="162.0" y1="457.0" x2="215.6" y2="457.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="217.6" y="432.0" width="120.0" height="50.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="277.6" y="454.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">W_V</text>
<text x="277.6" y="472.0" font-size="11" fill="#6b7280" text-anchor="middle">→ 128 维</text>
<line x1="339.6" y1="457.0" x2="393.2" y2="457.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="395.2" y="432.0" width="120.0" height="50.0" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="455.2" y="454.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Σ_j S_ij ·</text>
<text x="455.2" y="472.0" font-size="11" fill="#6b7280" text-anchor="middle">加权求和</text>
<line x1="517.2" y1="457.0" x2="570.8" y2="457.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="572.8" y="432.0" width="120.0" height="50.0" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="632.8" y="454.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">G1</text>
<text x="632.8" y="472.0" font-size="11" fill="#6b7280" text-anchor="middle">非线性</text>
<line x1="694.8" y1="457.0" x2="748.4" y2="457.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="750.4" y="432.0" width="120.0" height="50.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="810.4" y="454.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">W_O</text>
<text x="810.4" y="472.0" font-size="11" fill="#6b7280" text-anchor="middle">128 → 2048</text>
<line x1="872.4" y1="457.0" x2="926.0" y2="457.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="928.0" y="432.0" width="120.0" height="50.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="988.0" y="454.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">输出 o_i</text>
<text x="988.0" y="472.0" font-size="11" fill="#6b7280" text-anchor="middle">2048 维</text>
<text x="30.0" y="540.0" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p. 6–7 的式 (6)–(8) 与 Table 1、Table 3 重画，是机制示意。「秩 ≤ 128」是按头维 128 推出的，不是论文原句。</text>
</svg>
