<text x="260" y="151" font-size="11" fill="#6b7280" text-anchor="middle">cᵛ₀ = 0</text>
<rect x="315" y="110" width="365" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="497.5" y="132" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">第 1 个视频潜变量（压 4 帧）</text>
<text x="497.5" y="151" font-size="11" fill="#6b7280" text-anchor="middle">条件 cᵛ₁ = φᵥ(a₁, …, a₄)，4 帧动作合成一个</text>
<rect x="695" y="110" width="365" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
