<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="500" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">双速率动作条件：同一串动作，按两种时间分辨率切给两个流</text>
<text x="30" y="58" font-size="13" fill="#6b7280">灰 = 每帧的位姿动作；紫 = 视频潜变量及其条件；黄 = 触觉潜变量及其条件；绿 = 第 0 步的干净上下文（不加噪，条件为 0）。</text>
<text x="30" y="78" font-size="13" fill="#6b7280">机制示意，依据 PDF p. 3 式 (2)–(3)；只画前 8 帧，实际预测窗口长度报告没给。</text>
<text x="30" y="132" font-size="14" fill="#111827" font-weight="700">视频流</text>
<text x="30" y="152" font-size="11" fill="#6b7280">VAE 时间压缩 4 倍</text>
<text x="30" y="252" font-size="14" fill="#111827" font-weight="700">动作 aₜ</text>
<text x="30" y="272" font-size="11" fill="#6b7280">67 维，逐帧给出</text>
<text x="30" y="372" font-size="14" fill="#111827" font-weight="700">触觉流</text>
<text x="30" y="392" font-size="11" fill="#6b7280">逐帧，预测残差</text>
<rect x="220" y="110" width="80" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
