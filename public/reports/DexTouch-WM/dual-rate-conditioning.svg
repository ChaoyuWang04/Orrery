<text x="30" y="440" font-size="11" fill="#9ca3af">触觉流预测的是相对初始潜变量的残差 rₜ = zₜ − z₀，解码时把 z₀ 加回去（式 2）；z₀ 始终作为上下文可见。</text>
<text x="30" y="462" font-size="11" fill="#9ca3af">两路条件都经 AdaLN 注入各自专家的时间步调制；动作里手腕与相机是相对第一帧的运动，手指关节是绝对角度（PDF p. 3）。</text>
