<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8f8bd8"/></marker>
<marker id="ay" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d4a24c"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">MMTP：MTP 头在图像位置该吃什么</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = 视觉 Token；绿 = 文本 Token；灰 = 被掩掉的位置；黄 = 共享的可学习占位符 &lt;|image|&gt;。上半是 MTP 头看到的输入，下半是流水线里的数据依赖。</text>
<text x="30" y="92" font-size="14" fill="#111827" text-anchor="start" font-weight="700">选项 1：直接送视觉 embedding</text>
<rect x="30" y="102" width="52" height="30" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="56" y="122" font-size="12" fill="#111827" text-anchor="middle">v11</text>
<rect x="88" y="102" width="52" height="30" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="114" y="122" font-size="12" fill="#111827" text-anchor="middle">v12</text>
<rect x="146" y="102" width="52" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="172" y="122" font-size="12" fill="#111827" text-anchor="middle">t1</text>
<rect x="204" y="102" width="52" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="230" y="122" font-size="12" fill="#111827" text-anchor="middle">t2</text>
<rect x="262" y="102" width="52" height="30" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="288" y="122" font-size="12" fill="#111827" text-anchor="middle">v21</text>
<rect x="320" y="102" width="52" height="30" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="346" y="122" font-size="12" fill="#111827" text-anchor="middle">v22</text>
<rect x="378" y="102" width="52" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="404" y="122" font-size="12" fill="#111827" text-anchor="middle">t3</text>
<rect x="436" y="102" width="52" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="462" y="122" font-size="12" fill="#111827" text-anchor="middle">t4</text>
<rect x="494" y="102" width="52" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="520" y="122" font-size="12" fill="#111827" text-anchor="middle">t5</text>
<text x="600" y="114" font-size="13" fill="#111827" text-anchor="start">视觉 embedding 要从第一段一路送到 MTP 头所在的最后一段</text>
<text x="600" y="132" font-size="11" fill="#6b7280" text-anchor="start">0.5B 消融里训练 loss 更高（见下方原图）</text>
<text x="30" y="172" font-size="14" fill="#111827" text-anchor="start" font-weight="700">选项 2：把视觉 Token 全掩掉</text>
<rect x="30" y="182" width="52" height="30" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="88" y="182" width="52" height="30" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="146" y="182" width="52" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="172" y="202" font-size="12" fill="#111827" text-anchor="middle">t1</text>
<rect x="204" y="182" width="52" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="230" y="202" font-size="12" fill="#111827" text-anchor="middle">t2</text>
<rect x="262" y="182" width="52" height="30" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="320" y="182" width="52" height="30" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="378" y="182" width="52" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="404" y="202" font-size="12" fill="#111827" text-anchor="middle">t3</text>
<rect x="436" y="182" width="52" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="462" y="202" font-size="12" fill="#111827" text-anchor="middle">t4</text>
<rect x="494" y="182" width="52" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="520" y="202" font-size="12" fill="#111827" text-anchor="middle">t5</text>
<text x="600" y="194" font-size="13" fill="#111827" text-anchor="start">退化成纯文本 MTP</text>
<text x="600" y="212" font-size="11" fill="#6b7280" text-anchor="start">报告说它不如选项 3 那样与序列并行、上下文并行的现有切分天然兼容</text>
<text x="30" y="252" font-size="14" fill="#111827" text-anchor="start" font-weight="700">选项 3（采用）：每段视觉 Token 换成一个共享占位符</text>
<rect x="30" y="262" width="110" height="30" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="85" y="282" font-size="12" fill="#111827" text-anchor="middle">&lt;|image|&gt;</text>
<rect x="146" y="262" width="52" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="172" y="282" font-size="12" fill="#111827" text-anchor="middle">t1</text>
<rect x="204" y="262" width="52" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="230" y="282" font-size="12" fill="#111827" text-anchor="middle">t2</text>
<rect x="262" y="262" width="110" height="30" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="317" y="282" font-size="12" fill="#111827" text-anchor="middle">&lt;|image|&gt;</text>
<rect x="378" y="262" width="52" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="404" y="282" font-size="12" fill="#111827" text-anchor="middle">t3</text>
<rect x="436" y="262" width="52" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="462" y="282" font-size="12" fill="#111827" text-anchor="middle">t4</text>
<rect x="494" y="262" width="52" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="520" y="282" font-size="12" fill="#111827" text-anchor="middle">t5</text>
<text x="600" y="274" font-size="13" fill="#111827" text-anchor="start">图像在哪里保留了，图像是什么丢掉了</text>
<text x="600" y="292" font-size="11" fill="#6b7280" text-anchor="start">占位符是词表里的一项，最后一段自己查表就有</text>
<rect x="20" y="322" width="1080" height="220" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="40" y="348" font-size="14" fill="#111827" text-anchor="start" font-weight="700">流水线并行下：MTP 头挂在最后一段</text>
<rect x="50" y="372" width="230" height="120" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="165" y="394" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Stage-0</text>
<rect x="70" y="408" width="190" height="30" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="165" y="428" font-size="12" fill="#111827" text-anchor="middle">CogViT + MLP Adapter</text>
<rect x="70" y="446" width="190" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="165" y="466" font-size="12" fill="#111827" text-anchor="middle">Embedding Layer</text>
<rect x="320" y="372" width="140" height="120" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="390" y="436" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Stage-1</text>
<text x="515" y="436" font-size="14" fill="#6b7280" text-anchor="middle">…</text>
<rect x="570" y="372" width="140" height="120" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="640" y="436" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Stage-(k-1)</text>
<rect x="750" y="372" width="330" height="120" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="800" y="394" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Stage-k</text>
<rect x="770" y="408" width="130" height="30" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
<text x="835" y="428" font-size="12" fill="#111827" text-anchor="middle">最后几层 Transformer</text>
<rect x="930" y="408" width="130" height="68" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
<text x="995" y="446" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">MTP 头</text>
<rect x="770" y="446" width="130" height="30" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="835" y="466" font-size="12" fill="#111827" text-anchor="middle">词表查 &lt;|image|&gt;</text>
<line x1="900" y1="461" x2="928" y2="461" stroke="#d4a24c" stroke-width="1.4" marker-end="url(#ay)"/>
<polyline points="165,492 165,516 995,516 995,478" fill="none" stroke="#8f8bd8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ap)"/>
<text x="560" y="532" font-size="11" fill="#6b7280" text-anchor="middle">选项 1：视觉 embedding 跨过中间每一段送到最后</text>
<text x="30" y="572" font-size="12" fill="#9ca3af" text-anchor="start">据 PDF p. 3 的文字与 Figure 2 上半部分重画；下半的流水线切法是机制示意，报告没有给出实际的段数与层分配。</text>
</svg>
