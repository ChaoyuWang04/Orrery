<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="480" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">多模态装箱有两本账：只看序列长度，ViT 那本就会失衡</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">绿 = 序列长度（语言主干的算力与显存跟它走）；紫 = ViT Token 数（视觉编码器的算力与显存跟它走）。每组两条是同一个 micro-batch 的两本账。</text>
<rect x="20" y="72" width="530" height="340" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="40" y="98" font-size="14" fill="#111827" text-anchor="start" font-weight="700">只按序列长度装箱</text>
<text x="40" y="146" font-size="11" fill="#6b7280" text-anchor="start">micro-batch A</text>
<rect x="140" y="126" width="360" height="18" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="140" y="148" width="330" height="18" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="40" y="216" font-size="11" fill="#6b7280" text-anchor="start">micro-batch B</text>
<rect x="140" y="196" width="355" height="18" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="140" y="218" width="40" height="18" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="40" y="286" font-size="11" fill="#6b7280" text-anchor="start">micro-batch C</text>
<rect x="140" y="266" width="362" height="18" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="140" y="288" width="150" height="18" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<line x1="500" y1="116" x2="500" y2="316" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="40" y="350" font-size="13" fill="#111827" text-anchor="start">绿条都顶到同一条线，看上去很均衡</text>
<text x="40" y="372" font-size="11" fill="#6b7280" text-anchor="start">但 A 塞了几张大图、B 几乎全是文本：视觉编码器在 A 上</text>
<text x="40" y="390" font-size="11" fill="#6b7280" text-anchor="start">的算力与激活显存是 B 的好几倍，这一步要等最慢的 A</text>
<rect x="570" y="72" width="530" height="340" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="590" y="98" font-size="14" fill="#111827" text-anchor="start" font-weight="700">按序列长度与 ViT Token 数联合装箱</text>
<text x="590" y="146" font-size="11" fill="#6b7280" text-anchor="start">micro-batch A'</text>
<rect x="690" y="126" width="350" height="18" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="690" y="148" width="175" height="18" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="590" y="216" font-size="11" fill="#6b7280" text-anchor="start">micro-batch B'</text>
<rect x="690" y="196" width="358" height="18" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="690" y="218" width="170" height="18" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="590" y="286" font-size="11" fill="#6b7280" text-anchor="start">micro-batch C'</text>
<rect x="690" y="266" width="345" height="18" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="690" y="288" width="178" height="18" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="590" y="350" font-size="13" fill="#111827" text-anchor="start">两本账各自拉平，谁也不拖后腿</text>
<text x="590" y="372" font-size="11" fill="#6b7280" text-anchor="start">代价是装箱变成二维问题，组合更难凑；报告没有给</text>
<text x="590" y="390" font-size="11" fill="#6b7280" text-anchor="start">具体算法，也没有给装箱前后的吞吐对比</text>
<text x="30" y="446" font-size="12" fill="#9ca3af" text-anchor="start">据 PDF p. 5「按序列长度与 ViT Token 数联合装箱」一句画出的机制示意；条长为示意，不是报告数据。</text>
</svg>
