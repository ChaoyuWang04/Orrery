<text x="720" y="440" font-size="11" fill="#111827" text-anchor="start">约 18k 步降到 10 以下，终点约 7.76</text>
<text x="560" y="620" font-size="12" fill="#6b7280" text-anchor="middle">训练步数（iterations）</text>
<text x="30" y="652" font-size="11" fill="#9ca3af">据 PDF p. 3 图 1、图 2 读图重画。计划是线性衰减到峰值的 10%（0.12e-4），跨 300B Token（PDF p. 2）；175B 的 batch 为 2M Token（PDF p. 2，表 1）。</text>
