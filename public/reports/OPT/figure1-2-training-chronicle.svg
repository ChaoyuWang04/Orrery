<text x="500" y="238" font-size="11" fill="#111827" text-anchor="start">③ 约 61k 反而调高到约 0.37e-4</text>
<text x="690" y="262" font-size="11" fill="#111827" text-anchor="start">④ 约 73k、91k 各再降一次，终点约 0.06e-4</text>
