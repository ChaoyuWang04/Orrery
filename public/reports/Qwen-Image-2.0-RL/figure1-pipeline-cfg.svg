<text x="30.0" y="530.0" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 2 Figure 1 与 p. 6–8 正文重画。奖励模型是远程 API 服务，只在 RL 阶段被调用；T2I 三路奖励按「对齐 → 美学 → 人像」逐层叠加。</text>
