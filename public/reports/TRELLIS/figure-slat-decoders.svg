<text x="650" y="228" font-size="11" fill="#9ca3af" text-anchor="middle">中心只能落在本格 ±1 格内</text>
<text x="750" y="116" font-size="14" fill="#111827" text-anchor="start" font-weight="700">每格解出 K = 32 个高斯</text>
<text x="750" y="140" font-size="11" fill="#6b7280" text-anchor="start">每个高斯：偏移 o、颜色、尺度、不透明度、旋转</text>
<text x="750" y="162" font-size="11" fill="#6b7280" text-anchor="start">位置 = pᵢ + tanh(o)，tanh 把偏移压进 (−1, 1)</text>
<text x="750" y="184" font-size="11" fill="#6b7280" text-anchor="start">尺度下限 9×10⁻⁴，屏幕空间滤波方差 0.1</text>
<text x="750" y="206" font-size="11" fill="#6b7280" text-anchor="start">网络直接预测高斯，原版的分裂与剪枝用不上，</text>
<text x="750" y="224" font-size="11" fill="#6b7280" text-anchor="start">改用体积正则与不透明度正则防退化</text>
<text x="396" y="284" font-size="14" fill="#111827" text-anchor="start" font-weight="700">辐射场解码器</text>
<text x="396" y="306" font-size="11" fill="#6b7280" text-anchor="start">输出：辐射场</text>
<text x="396" y="328" font-size="11" fill="#9ca3af" text-anchor="start">冻住编码器后单独训</text>
