<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">SLAT：一个活跃格上的一条向量，三种解码器各自展开成不同的 3D 格式</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = 活跃体素与它的潜向量；白 = 空格，不进网络；绿 / 黄 / 红 = 高斯、辐射场、网格三种输出。左栏是二维切片示意，尺寸取自附录 A.2（PDF p. 15）。</text>
