<text x="36" y="104" font-size="14" fill="#111827" text-anchor="start" font-weight="700">SLAT：只在表面穿过的格子上放向量</text>
<text x="36" y="124" font-size="11" fill="#9ca3af" text-anchor="start">虚线圈 = 物体表面；它穿过的格子才是活跃体素</text>
<text x="36" y="440" font-size="14" fill="#111827" text-anchor="start" font-weight="700">64³ = 262,144 个格子</text>
<text x="36" y="464" font-size="11" fill="#6b7280" text-anchor="start">平均只有 L ≈ 20K 个活跃，约占 7.6%</text>
<text x="36" y="488" font-size="11" fill="#6b7280" text-anchor="start">每个活跃格存两样东西：</text>
<text x="36" y="510" font-size="11" fill="#6b7280" text-anchor="start">坐标 pᵢ：哪些格子非空，管粗几何</text>
<text x="36" y="532" font-size="11" fill="#6b7280" text-anchor="start">向量 zᵢ（8 维）：细形状与外观</text>
<text x="36" y="560" font-size="11" fill="#9ca3af" text-anchor="start">7.6% 由 20K / 262,144 算得，原文只写 L ≪ N³</text>
