<polyline points="594,540 620,524 648,510 674,484 694,470 707,446" fill="none" stroke="#111827" stroke-width="1.6"/>
<rect x="590" y="440" width="120" height="120" rx="0" fill="none" stroke="#8f8bd8" stroke-width="2"/>
<text x="650" y="576" font-size="11" fill="#9ca3af" text-anchor="middle">本格细分成 4³，黑线为抽出的面</text>
<text x="750" y="464" font-size="14" fill="#111827" text-anchor="start" font-weight="700">两次稀疏卷积上采样：64³ → 256³</text>
<text x="750" y="488" font-size="11" fill="#6b7280" text-anchor="start">每个细格：45 个 FlexiCubes 参数 + 8 个顶点有向距离</text>
<text x="750" y="510" font-size="11" fill="#6b7280" text-anchor="start">另预测顶点颜色与法线，共享顶点取各格平均</text>
<text x="750" y="532" font-size="11" fill="#6b7280" text-anchor="start">空格的有向距离置 1.0，在 256³ 上抽 0 等值面</text>
<text x="750" y="554" font-size="11" fill="#6b7280" text-anchor="start">损失 = 几何 + 0.1 × 颜色 + 正则，</text>
<text x="750" y="572" font-size="11" fill="#6b7280" text-anchor="start">渲染掩膜、深度、法线与颜色图来算</text>
<text x="30" y="624" font-size="11" fill="#9ca3af" text-anchor="start">三个解码器共用同一种 Transformer 骨架，只换输出层（PDF p. 4）。高斯分支撑开潜空间，另两支在冻住的编码器上从头训（PDF p. 5）。</text>
</svg>
