<line x1="590" y1="356.0" x2="710" y2="356.0" stroke="#d4a24c" stroke-width="0.6"/>
<line x1="695.0" y1="266" x2="695.0" y2="386" stroke="#d4a24c" stroke-width="0.6"/>
<line x1="590" y1="371.0" x2="710" y2="371.0" stroke="#d4a24c" stroke-width="0.6"/>
<rect x="590" y="266" width="120" height="120" rx="0" fill="none" stroke="#8f8bd8" stroke-width="2"/>
<text x="650" y="402" font-size="11" fill="#9ca3af" text-anchor="middle">本格内一块 8³ 小体积</text>
<text x="750" y="290" font-size="14" fill="#111827" text-anchor="start" font-weight="700">每格 4 组向量，拼成一块 8³ 小体积</text>
<text x="750" y="314" font-size="11" fill="#6b7280" text-anchor="start">x、y、z 三个方向各 16×8，颜色与密度 16×4</text>
<text x="750" y="336" font-size="11" fill="#6b7280" text-anchor="start">秩 16 的 CP 分解，还原成 8×8×8×4</text>
<text x="750" y="358" font-size="11" fill="#6b7280" text-anchor="start">按 pᵢ 拼回去：64 × 8 = 512，得到 512³ 辐射场</text>
<text x="750" y="380" font-size="11" fill="#6b7280" text-anchor="start">自写 CUDA 渲染器：排序、光线行进、积分</text>
<text x="750" y="398" font-size="11" fill="#6b7280" text-anchor="start">与 CP 重建融进同一个 kernel</text>
<text x="396" y="458" font-size="14" fill="#111827" text-anchor="start" font-weight="700">网格解码器</text>
<text x="396" y="480" font-size="11" fill="#6b7280" text-anchor="start">输出：三角网格</text>
<text x="396" y="502" font-size="11" fill="#9ca3af" text-anchor="start">冻住编码器后单独训</text>
<rect x="590" y="440" width="120" height="120" rx="0" fill="#fbe9e7" stroke="#d9877a" stroke-width="1"/>
