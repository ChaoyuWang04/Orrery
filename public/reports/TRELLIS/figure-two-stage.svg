<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 576" width="1120" height="576" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="576" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">两段生成：先定哪些格子非空，再只在非空格上填向量</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = 第一段结构生成器；黄 = 第二段潜向量生成器；灰 = 固定的编解码器。两段都是整流流 Transformer，各自单独训练。</text>
<rect x="16" y="72" width="1088" height="186" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="16" y="276" width="1088" height="214" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="32" y="96" font-size="14" fill="#111827" text-anchor="start" font-weight="700">第一段：稀疏结构（哪些格子非空）</text>
<text x="1088" y="300" font-size="14" fill="#111827" text-anchor="end" font-weight="700">第二段：潜向量（非空格上长什么样）</text>
<rect x="32" y="112" width="236" height="128" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<rect x="310" y="112" width="236" height="128" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<rect x="588" y="112" width="236" height="128" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<rect x="866" y="112" width="236" height="128" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<rect x="32" y="316" width="196" height="128" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="248" y="316" width="196" height="128" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="464" y="316" width="196" height="128" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="680" y="316" width="196" height="128" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<rect x="896" y="316" width="196" height="128" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<line x1="270" y1="176.0" x2="306" y2="176.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="548" y1="176.0" x2="584" y2="176.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="826" y1="176.0" x2="862" y2="176.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="230" y1="380.0" x2="244" y2="380.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="446" y1="380.0" x2="460" y2="380.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="662" y1="380.0" x2="676" y2="380.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="878" y1="380.0" x2="892" y2="380.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M984.0,242 C984.0,280 130.0,256 130.0,312" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M346.0,446 L346.0,462 L778.0,462 L778.0,450" fill="none" stroke="#d4a24c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="150.0" y="138" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">64³ 二值占用</text>
<text x="150.0" y="160" font-size="11" fill="#6b7280" text-anchor="middle">活跃格记 1，其余记 0</text>
<text x="150.0" y="178" font-size="11" fill="#6b7280" text-anchor="middle">只表示粗几何</text>
<text x="150.0" y="196" font-size="11" fill="#6b7280" text-anchor="middle">直接生成要吃 262,144 个位置</text>
<text x="428.0" y="138" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">结构 VAE（3D 卷积）</text>
<text x="428.0" y="160" font-size="11" fill="#6b7280" text-anchor="middle">64³ 压到 16³，每格 8 通道</text>
<text x="428.0" y="178" font-size="11" fill="#6b7280" text-anchor="middle">按二分类训练，用 Dice 损失</text>
<text x="428.0" y="196" font-size="11" fill="#6b7280" text-anchor="middle">论文称几乎无损</text>
<text x="706.0" y="138" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">结构生成器</text>
<text x="706.0" y="160" font-size="11" fill="#6b7280" text-anchor="middle">普通 Transformer</text>
<text x="706.0" y="178" font-size="11" fill="#6b7280" text-anchor="middle">16³ = 4,096 个位置摊平成序列</text>
<text x="706.0" y="196" font-size="11" fill="#6b7280" text-anchor="middle">adaLN 注时间步，交叉注意力注条件</text>
<text x="984.0" y="138" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">结构解码器</text>
<text x="984.0" y="160" font-size="11" fill="#6b7280" text-anchor="middle">还原成 64³ 占用</text>
<text x="984.0" y="178" font-size="11" fill="#6b7280" text-anchor="middle">再转成活跃坐标 {pᵢ}</text>
<text x="984.0" y="196" font-size="11" fill="#6b7280" text-anchor="middle">交给第二段当骨架</text>
<text x="130.0" y="342" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">{pᵢ} 上的噪声</text>
<text x="130.0" y="364" font-size="11" fill="#6b7280" text-anchor="middle">平均约 20K 个活跃格</text>
<text x="130.0" y="382" font-size="11" fill="#6b7280" text-anchor="middle">每格一条 8 维向量</text>
<text x="130.0" y="400" font-size="11" fill="#6b7280" text-anchor="middle">坐标已知，不再改动</text>
<text x="346.0" y="342" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">稀疏卷积下采样</text>
<text x="346.0" y="364" font-size="11" fill="#6b7280" text-anchor="middle">2³ 邻域里的活跃格取平均</text>
<text x="346.0" y="382" font-size="11" fill="#6b7280" text-anchor="middle">落到 32³ 的格子上</text>
<text x="346.0" y="400" font-size="11" fill="#6b7280" text-anchor="middle">序列因此变短</text>
<text x="562.0" y="342" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">潜向量生成器</text>
<text x="562.0" y="364" font-size="11" fill="#6b7280" text-anchor="middle">时间调制 Transformer</text>
<text x="562.0" y="382" font-size="11" fill="#6b7280" text-anchor="middle">长度 = 32³ 中非空格数</text>
<text x="562.0" y="400" font-size="11" fill="#6b7280" text-anchor="middle">≤ L，论文没给平均值</text>
<text x="778.0" y="342" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">稀疏卷积上采样</text>
<text x="778.0" y="364" font-size="11" fill="#6b7280" text-anchor="middle">按已知的 64³ 结构还原</text>
<text x="778.0" y="382" font-size="11" fill="#6b7280" text-anchor="middle">与下采样块 skip 相连</text>
<text x="778.0" y="400" font-size="11" fill="#6b7280" text-anchor="middle">输出每格的 zᵢ</text>
<text x="994.0" y="342" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">任选一个解码器</text>
<text x="994.0" y="364" font-size="11" fill="#6b7280" text-anchor="middle">高斯 / 辐射场 / 网格</text>
<text x="994.0" y="382" font-size="11" fill="#6b7280" text-anchor="middle">同一份 SLAT</text>
<text x="994.0" y="400" font-size="11" fill="#6b7280" text-anchor="middle">按下游格式挑</text>
<text x="562.0" y="478" font-size="11" fill="#9ca3af" text-anchor="middle">skip 连接</text>
<text x="32" y="516" font-size="11" fill="#9ca3af" text-anchor="start">条件：文本走预训练 CLIP 特征，图像走 DINOv2 特征，两段都经交叉注意力进入（PDF p. 5）。</text>
<text x="32" y="536" font-size="11" fill="#9ca3af" text-anchor="start">编辑借这条切分：细节变体保留 {pᵢ}、只换文本重跑第二段；区域编辑在两段都用 Repaint 式采样，只重生成包围盒内的格子（PDF p. 5）。</text>
<text x="32" y="556" font-size="11" fill="#9ca3af" text-anchor="start">4,096 与 262,144 按附录尺寸算得（PDF p. 14）；第二段打包后的实际序列长度原文没有给出。</text>
</svg>
