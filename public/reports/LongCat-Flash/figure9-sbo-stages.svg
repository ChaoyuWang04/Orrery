<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="l9-ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" font-weight="700">SBO：一个 batch 内部的四阶段流水，阶段宽度按 Table 7 的理论耗时画</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280">上道 = 主干（稠密，张量并行走节点内 NVLink）；下道 = MoE 分支（all-to-all 走节点间 RDMA）。绿 = 注意力、稠密 FFN 与 LN；红 = 节点内 all-gather / reduce-scatter；</text>
<text x="30.0" y="72.0" font-size="13" fill="#6b7280">灰 = 路由器；黄 = all-to-all；紫 = MoE GEMM。阶段宽度正比于 PDF p. 27 Table 7 的 264 / 236 / 60 / 472 us；阶段内各块的宽度只是示意。</text>
<text x="30.0" y="175.0" font-size="12" fill="#111827" font-weight="700">主干</text>
<text x="30.0" y="247.0" font-size="12" fill="#111827" font-weight="700">MoE 分支</text>
<rect x="150.0" y="150.0" width="98.0" height="40.0" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="199.0" y="175.0" font-size="11" fill="#111827" text-anchor="middle">Attn 0</text>
<rect x="250.0" y="150.0" width="98.0" height="40.0" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="299.0" y="175.0" font-size="11" fill="#111827" text-anchor="middle">Attn 1</text>
<rect x="350.0" y="150.0" width="34.0" height="40.0" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="367.0" y="175.0" font-size="11" fill="#111827" text-anchor="middle">LN</text>
<rect x="150.0" y="222" width="235.6" height="40" rx="4" fill="none" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="268.8" y="247.0" font-size="11" fill="#9ca3af" text-anchor="middle">还没有输入，闲着</text>
<rect x="387.6" y="150.0" width="26.0" height="40.0" rx="4" fill="#fbe9e7" stroke="#d9877a"/>
<text x="400.6" y="175.0" font-size="11" fill="#111827" text-anchor="middle">AG</text>
<rect x="415.6" y="150.0" width="76.0" height="40.0" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="453.6" y="175.0" font-size="11" fill="#111827" text-anchor="middle">Dense FFN</text>
<rect x="493.6" y="150.0" width="26.0" height="40.0" rx="4" fill="#fbe9e7" stroke="#d9877a"/>
<text x="506.6" y="175.0" font-size="11" fill="#111827" text-anchor="middle">RS</text>
<rect x="521.6" y="150.0" width="26.0" height="40.0" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="534.6" y="175.0" font-size="11" fill="#111827" text-anchor="middle">LN</text>
<rect x="549.6" y="150.0" width="46.0" height="40.0" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="572.6" y="175.0" font-size="11" fill="#111827" text-anchor="middle">Attn 0</text>
<rect x="387.6" y="222.0" width="50.0" height="40.0" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="412.6" y="247.0" font-size="11" fill="#111827" text-anchor="middle">Router</text>
<rect x="439.6" y="222.0" width="158.4" height="40.0" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="518.8" y="247.0" font-size="11" fill="#111827" text-anchor="middle">A2A Dispatch</text>
<rect x="600.0" y="150" width="52.0" height="40" rx="4" fill="none" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="600.0" y="222.0" width="52.0" height="40.0" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="626.0" y="247.0" font-size="11" fill="#111827" text-anchor="middle">MoE</text>
<rect x="654.0" y="150.0" width="88.0" height="40.0" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="698.0" y="175.0" font-size="11" fill="#111827" text-anchor="middle">Attn 1</text>
<rect x="744.0" y="150.0" width="32.0" height="40.0" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="760.0" y="175.0" font-size="11" fill="#111827" text-anchor="middle">LN</text>
<rect x="778.0" y="150.0" width="28.0" height="40.0" rx="4" fill="#fbe9e7" stroke="#d9877a"/>
<text x="792.0" y="175.0" font-size="11" fill="#111827" text-anchor="middle">AG</text>
<rect x="808.0" y="150.0" width="88.0" height="40.0" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="852.0" y="175.0" font-size="11" fill="#111827" text-anchor="middle">Dense FFN</text>
<rect x="898.0" y="150.0" width="28.0" height="40.0" rx="4" fill="#fbe9e7" stroke="#d9877a"/>
<text x="912.0" y="175.0" font-size="11" fill="#111827" text-anchor="middle">RS</text>
<rect x="928.0" y="150" width="148.8" height="40" rx="4" fill="none" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="1003.4" y="175.0" font-size="11" fill="#9ca3af" text-anchor="middle">余量</text>
<rect x="654.0" y="222.0" width="422.8" height="40.0" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="865.4" y="247.0" font-size="11" fill="#111827" text-anchor="middle">A2A Combine</text>
<path d="M149.0,130.0 L149.0,290.0" fill="none" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M386.6,130.0 L386.6,290.0" fill="none" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M599.0,130.0 L599.0,290.0" fill="none" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M653.0,130.0 L653.0,290.0" fill="none" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M1077.8,130.0 L1077.8,290.0" fill="none" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="268.8" y="312.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">阶段 1</text>
<text x="268.8" y="330.0" font-size="11" fill="#6b7280" text-anchor="middle">264 us</text>
<text x="493.8" y="312.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">阶段 2</text>
<text x="493.8" y="330.0" font-size="11" fill="#6b7280" text-anchor="middle">236 us</text>
<text x="627.0" y="312.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">3</text>
<text x="627.0" y="330.0" font-size="11" fill="#6b7280" text-anchor="middle">60</text>
<text x="866.4" y="312.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">阶段 4</text>
<text x="866.4" y="330.0" font-size="11" fill="#6b7280" text-anchor="middle">472 us</text>
<text x="30.0" y="372.0" font-size="12" fill="#6b7280">阶段 1：第一个 MLA 独占，因为后面的一切都要它的输出。阶段 2：dispatch 在路上时，主干算第一个稠密 FFN 和第二个 MLA 的 QKV 投影。</text>
<text x="30.0" y="394.0" font-size="12" fill="#6b7280">阶段 3：专家计算独占。阶段 4：combine 在路上时，主干算第二个 MLA 的核心注意力与输出投影、第二个稠密 FFN。</text>
<text x="30.0" y="422.0" font-size="12" fill="#6b7280">本文解读：四段宽度相加正是报告的 TPL = 264 + 236 + 60 + 472 = 1032 us；阶段 2、4 由通信定长，主干藏在下面。</text>
<text x="30.0" y="444.0" font-size="12" fill="#6b7280">阶段 4 主干的余量，对应报告说的「序列变长一些也不怎么涨延迟」（PDF p. 28）。</text>
</svg>
