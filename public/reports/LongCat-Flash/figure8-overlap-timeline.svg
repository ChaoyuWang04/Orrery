<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" font-weight="700">专家并行里计算在等什么：普通 MoE、ScMoE、ScMoE 加两个 chunk</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280">每组上一道是计算流、下一道是专家并行通信流。灰 = 不依赖通信的计算；紫 = 专家计算；黄 = dispatch / combine 通信；红虚框 = 计算流空等。</text>
<text x="30.0" y="72.0" font-size="13" fill="#6b7280">块的位置与长度按 PDF p. 22 Figure 8 估读，是机制示意，不是实测时长。</text>
