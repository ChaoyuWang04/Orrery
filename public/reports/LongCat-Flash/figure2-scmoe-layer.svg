<text x="30.0" y="32.0" font-size="19" fill="#111827" font-weight="700">LongCat-Flash 的一层：MoE 从第一个 MLA 抄近路，12 个名额里可以有「不干活」的专家</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280">绿 = 每个 Token 都走的稠密主干；灰 = 路由器；紫 = FFN 专家（每层 512 个）；黄 = 零计算专家（每层 256 个，原样返回输入）。根据 PDF p. 5 Figure 2 与 p. 10 重画。</text>
<rect x="30.0" y="84.0" width="560.0" height="490.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
