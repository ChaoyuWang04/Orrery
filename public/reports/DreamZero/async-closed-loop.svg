<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 525" width="1120" height="525" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="525" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">DreamZero 的闭环节拍：约束从「算完才能动」变成「当前块用完前算完」</text>
<text x="30" y="58" font-size="13" fill="#6b7280">紫 = 模型在推理；灰 = 机器人在执行动作块；红 = 机器人停着等动作。横轴按比例画，1 格 = 1 秒。</text>
<text x="30" y="96" font-size="14" fill="#111827" font-weight="700">① 朴素串行：单卡一块约 5.7 秒，推理期间机器人不动</text>
<text x="178" y="125" font-size="11" fill="#6b7280" text-anchor="end">推理</text>
<text x="178" y="159" font-size="11" fill="#6b7280" text-anchor="end">机器人</text>
<rect x="350.0" y="108" width="570.0" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="635.0" y="125" font-size="11" fill="#6b7280" text-anchor="middle">推理下一块，约 5.7 秒</text>
<rect x="190.0" y="142" width="160.0" height="26" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="270.0" y="159" font-size="11" fill="#6b7280" text-anchor="middle">执行块 1</text>
<rect x="350.0" y="142" width="570.0" height="26" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="635.0" y="159" font-size="11" fill="#6b7280" text-anchor="middle">块 1 用完，停住等待</text>
<rect x="920.0" y="142" width="160.0" height="26" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="1000.0" y="159" font-size="11" fill="#6b7280" text-anchor="middle">执行块 2</text>
<text x="30" y="206" font-size="14" fill="#111827" font-weight="700">② 只改成异步：推理和执行并行，但 5.7 秒远长于 1.6 秒的块</text>
<text x="178" y="235" font-size="11" fill="#6b7280" text-anchor="end">推理</text>
<text x="178" y="269" font-size="11" fill="#6b7280" text-anchor="end">机器人</text>
<rect x="190.0" y="218" width="570.0" height="26" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
