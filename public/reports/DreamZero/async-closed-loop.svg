<text x="925.0" y="235" font-size="11" fill="#6b7280" text-anchor="middle">推理块 3……</text>
<rect x="190.0" y="252" width="160.0" height="26" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="270.0" y="269" font-size="11" fill="#6b7280" text-anchor="middle">执行块 1</text>
<rect x="350.0" y="252" width="410.0" height="26" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="555.0" y="269" font-size="11" fill="#6b7280" text-anchor="middle">块 1 用完，停住</text>
<rect x="760.0" y="252" width="160.0" height="26" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="840.0" y="269" font-size="11" fill="#6b7280" text-anchor="middle">执行块 2</text>
<rect x="920.0" y="252" width="170.0" height="26" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="1005.0" y="269" font-size="11" fill="#6b7280" text-anchor="middle">停住</text>
<text x="30" y="316" font-size="14" fill="#111827" font-weight="700">③ 异步 + 38 倍提速：约 150ms 出一块，机器人一直有动作可执行</text>
