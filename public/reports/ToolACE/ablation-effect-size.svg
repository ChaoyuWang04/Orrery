<text x="308" y="445" font-size="12" fill="#111827" text-anchor="end">补回并行调用样本</text>
<rect x="320" y="432" width="71.3" height="18" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<text x="399.3" y="445" font-size="11" fill="#6b7280">+7.59（50.60 → 58.19）</text>
<text x="308" y="477" font-size="12" fill="#111827" text-anchor="end">补回多类型样本（拒绝、追问）</text>
<rect x="320" y="464" width="145.5" height="18" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<text x="473.5" y="477" font-size="11" fill="#6b7280">+15.48（42.71 → 58.19）</text>
<text x="308" y="509" font-size="12" fill="#111827" text-anchor="end">xLAM 数据换成 ToolACE 数据</text>
<rect x="320" y="496" width="166.2" height="18" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<text x="494.2" y="509" font-size="11" fill="#6b7280">+17.68（40.51 → 58.19）</text>
<text x="308" y="541" font-size="12" fill="#111827" text-anchor="end">ToolLLM 数据换成 ToolACE 数据</text>
<rect x="320" y="528" width="312.9" height="18" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<text x="640.9" y="541" font-size="11" fill="#6b7280">+33.29（24.90 → 58.19）</text>
