<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">同样约 99.99% 的教师质量，入口坐标在一条路由上缺席，在另一条上被削弱</text>
<text x="30" y="58" font-size="13" fill="#6b7280">横轴是教师词表里的排名（对数刻度），只画第一个受监督位置。绿 = 教师 top-32 支撑；黄 = 入口词 &lt;tool_call&gt; 所在的排名；</text>
<text x="30" y="78" font-size="13" fill="#6b7280">紫 = 并上学生 top-32 之后的结果。数字来自 Table 1 与附录 B.5（PDF p. 5、p. 25–26），每条路由 500 条 prompt。</text>
<rect x="30" y="96" width="1060" height="215" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="50" y="124" font-size="14" fill="#111827" font-weight="700">直答路：该直接回答的样本交给直答教师</text>
<text x="50" y="142" font-size="11" fill="#6b7280">学生若高估 &lt;tool_call&gt;，全词表目标本该把它压下去</text>
<rect x="150" y="170" width="392.1" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<line x1="150" y1="214" x2="1010" y2="214" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="150.0" y1="214" x2="150.0" y2="219" stroke="#9ca3af" stroke-width="1.4"/>
<text x="150.0" y="232" font-size="11" fill="#9ca3af" text-anchor="middle">1</text>
<line x1="410.5" y1="214" x2="410.5" y2="219" stroke="#9ca3af" stroke-width="1.4"/>
<text x="410.5" y="232" font-size="11" fill="#9ca3af" text-anchor="middle">10</text>
<line x1="542.1" y1="214" x2="542.1" y2="219" stroke="#9ca3af" stroke-width="1.4"/>
<text x="542.1" y="232" font-size="11" fill="#9ca3af" text-anchor="middle">32</text>
<line x1="671.0" y1="214" x2="671.0" y2="219" stroke="#9ca3af" stroke-width="1.4"/>
<text x="671.0" y="232" font-size="11" fill="#9ca3af" text-anchor="middle">100</text>
<line x1="777.4" y1="214" x2="777.4" y2="219" stroke="#9ca3af" stroke-width="1.4"/>
<text x="777.4" y="232" font-size="11" fill="#9ca3af" text-anchor="middle">256</text>
<line x1="931.6" y1="214" x2="931.6" y2="219" stroke="#9ca3af" stroke-width="1.4"/>
<text x="931.6" y="232" font-size="11" fill="#9ca3af" text-anchor="middle">1000</text>
<text x="1020" y="218" font-size="11" fill="#9ca3af">教师排名</text>
<text x="160" y="196" font-size="11" fill="#111827">top-32，质量 0.999900</text>
<rect x="514.2" y="180" width="442.0" height="14" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<line x1="768.4" y1="174" x2="768.4" y2="200" stroke="#d4a24c" stroke-width="3"/>
<text x="768.4" y="166" font-size="11" fill="#6b7280" text-anchor="middle">&lt;tool_call&gt; 排名 25–1243，中位数 236.5</text>
<text x="50" y="258" font-size="12" fill="#111827">教师给它的平均概率只有 6.14×10⁻⁸，只在 0.4% 的 prompt 里进得了 top-32；其余 prompt 上它不在支撑里，梯度恒为 0。</text>
<text x="50" y="278" font-size="12" fill="#6b7280">压低入口的力：top-32 下 −0.000002，全词表下 −0.040708；把 K 加到 256 也只覆盖 52.2%。</text>
<rect x="760" y="246" width="310" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="772" y="264" font-size="11" fill="#111827">并上学生 top-32：平均 38.46 个坐标</text>
<text x="772" y="281" font-size="11" fill="#6b7280">下降 −0.040748，几乎等于全词表</text>
<rect x="30" y="326" width="1060" height="215" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="50" y="354" font-size="14" fill="#111827" font-weight="700">工具路：该调工具的样本交给工具教师</text>
<text x="50" y="372" font-size="11" fill="#6b7280">入口词在支撑里，方向是对的</text>
<rect x="150" y="400" width="392.1" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<line x1="150" y1="444" x2="1010" y2="444" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="150.0" y1="444" x2="150.0" y2="449" stroke="#9ca3af" stroke-width="1.4"/>
<text x="150.0" y="462" font-size="11" fill="#9ca3af" text-anchor="middle">1</text>
<line x1="410.5" y1="444" x2="410.5" y2="449" stroke="#9ca3af" stroke-width="1.4"/>
<text x="410.5" y="462" font-size="11" fill="#9ca3af" text-anchor="middle">10</text>
<line x1="542.1" y1="444" x2="542.1" y2="449" stroke="#9ca3af" stroke-width="1.4"/>
<text x="542.1" y="462" font-size="11" fill="#9ca3af" text-anchor="middle">32</text>
<line x1="671.0" y1="444" x2="671.0" y2="449" stroke="#9ca3af" stroke-width="1.4"/>
<text x="671.0" y="462" font-size="11" fill="#9ca3af" text-anchor="middle">100</text>
<line x1="777.4" y1="444" x2="777.4" y2="449" stroke="#9ca3af" stroke-width="1.4"/>
<text x="777.4" y="462" font-size="11" fill="#9ca3af" text-anchor="middle">256</text>
<line x1="931.6" y1="444" x2="931.6" y2="449" stroke="#9ca3af" stroke-width="1.4"/>
<text x="931.6" y="462" font-size="11" fill="#9ca3af" text-anchor="middle">1000</text>
<text x="1020" y="448" font-size="11" fill="#9ca3af">教师排名</text>
<text x="281.6" y="426" font-size="11" fill="#111827">top-32，质量 1.000000</text>
<rect x="150.0" y="410" width="14" height="14" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="150" y="396" font-size="11" fill="#6b7280">&lt;tool_call&gt; 在全部 500 条 prompt 上都排第 1</text>
<text x="50" y="488" font-size="12" fill="#111827">抬高入口的力方向保住了：1,500 对师生样本全部为正。</text>
<text x="50" y="508" font-size="12" fill="#6b7280">但幅度只剩约 6%：top-32 下 +0.001167，全词表下 +0.020174；K = 256 时 +0.008982。</text>
<rect x="760" y="476" width="310" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="772" y="494" font-size="11" fill="#111827">并上学生 top-32：平均 58.16 个坐标</text>
<text x="772" y="511" font-size="11" fill="#6b7280">下降 +0.020065，几乎等于全词表</text>
</svg>