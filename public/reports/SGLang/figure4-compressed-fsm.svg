<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 4：约束把路走死之后，普通 FSM 仍一次一问，压缩 FSM 一步跳过</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">紫 = 有限状态机的状态；黄 = 追加进序列的 Token；绿 = 一次模型前向（LLM decode）。例子是正则里的常量 {&quot;summary&quot;: &quot;，␣ 表示空格。</text>
<text x="30.0" y="96.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">(a) 普通 FSM：按字符建，14 个状态、13 条边，每条边只接受一个字符</text>
<text x="60.0" y="131.0" font-size="12" fill="#111827" text-anchor="middle">0</text>
<text x="98.0" y="120.0" font-size="13" fill="#6b7280" text-anchor="middle" font-family="Menlo, Consolas, monospace">{</text>
<text x="136.0" y="131.0" font-size="12" fill="#111827" text-anchor="middle">1</text>
<text x="174.0" y="120.0" font-size="13" fill="#6b7280" text-anchor="middle" font-family="Menlo, Consolas, monospace">&quot;</text>
<text x="212.0" y="131.0" font-size="12" fill="#111827" text-anchor="middle">2</text>
<text x="250.0" y="120.0" font-size="13" fill="#6b7280" text-anchor="middle" font-family="Menlo, Consolas, monospace">s</text>
<text x="288.0" y="131.0" font-size="12" fill="#111827" text-anchor="middle">3</text>
<text x="326.0" y="120.0" font-size="13" fill="#6b7280" text-anchor="middle" font-family="Menlo, Consolas, monospace">u</text>
<text x="364.0" y="131.0" font-size="12" fill="#111827" text-anchor="middle">4</text>
<text x="402.0" y="120.0" font-size="13" fill="#6b7280" text-anchor="middle" font-family="Menlo, Consolas, monospace">m</text>
<text x="440.0" y="131.0" font-size="12" fill="#111827" text-anchor="middle">5</text>
<text x="478.0" y="120.0" font-size="13" fill="#6b7280" text-anchor="middle" font-family="Menlo, Consolas, monospace">m</text>
<text x="516.0" y="131.0" font-size="12" fill="#111827" text-anchor="middle">6</text>
<text x="554.0" y="120.0" font-size="13" fill="#6b7280" text-anchor="middle" font-family="Menlo, Consolas, monospace">a</text>
<text x="592.0" y="131.0" font-size="12" fill="#111827" text-anchor="middle">7</text>
<text x="630.0" y="120.0" font-size="13" fill="#6b7280" text-anchor="middle" font-family="Menlo, Consolas, monospace">r</text>
