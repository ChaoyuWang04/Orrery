<text x="706.0" y="120.0" font-size="13" fill="#6b7280" text-anchor="middle" font-family="Menlo, Consolas, monospace">y</text>
<text x="744.0" y="131.0" font-size="12" fill="#111827" text-anchor="middle">9</text>
<text x="782.0" y="120.0" font-size="13" fill="#6b7280" text-anchor="middle" font-family="Menlo, Consolas, monospace">&quot;</text>
<text x="820.0" y="131.0" font-size="12" fill="#111827" text-anchor="middle">10</text>
<text x="858.0" y="120.0" font-size="13" fill="#6b7280" text-anchor="middle" font-family="Menlo, Consolas, monospace">:</text>
<text x="896.0" y="131.0" font-size="12" fill="#111827" text-anchor="middle">11</text>
<text x="934.0" y="120.0" font-size="13" fill="#6b7280" text-anchor="middle" font-family="Menlo, Consolas, monospace">␣</text>
<text x="972.0" y="131.0" font-size="12" fill="#111827" text-anchor="middle">12</text>
<text x="1010.0" y="120.0" font-size="13" fill="#6b7280" text-anchor="middle" font-family="Menlo, Consolas, monospace">&quot;</text>
<text x="1048.0" y="131.0" font-size="12" fill="#111827" text-anchor="middle">13</text>
<text x="30.0" y="190.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">(b) 压缩 FSM：单后继、单字符的边首尾相接，并成一条边</text>
<text x="60.0" y="225.0" font-size="12" fill="#111827" text-anchor="middle">0</text>
<text x="440.0" y="225.0" font-size="12" fill="#111827" text-anchor="middle">1</text>
<text x="250.0" y="214.0" font-size="13" fill="#6b7280" text-anchor="middle" font-family="Menlo, Consolas, monospace">{&quot;summary&quot;:␣&quot;</text>
<text x="490.0" y="225.0" font-size="11" fill="#9ca3af" text-anchor="start">这一段在约束下只有一种写法，状态机里却占了 13 步</text>
<text x="30.0" y="290.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">(c) 普通 FSM 解码：每追加一个 Token 就要一次前向</text>
<text x="62.0" y="326.0" font-size="13" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, monospace">{&quot;</text>
<text x="149.0" y="326.0" font-size="13" fill="#111827" text-anchor="middle">LLM 前向</text>
<text x="255.5" y="326.0" font-size="13" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, monospace">summary</text>
<text x="362.0" y="326.0" font-size="13" fill="#111827" text-anchor="middle">LLM 前向</text>
<text x="449.0" y="326.0" font-size="13" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, monospace">&quot;:</text>
<text x="536.0" y="326.0" font-size="13" fill="#111827" text-anchor="middle">LLM 前向</text>
<text x="623.0" y="326.0" font-size="13" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, monospace">␣&quot;</text>
<text x="710.0" y="326.0" font-size="13" fill="#111827" text-anchor="middle">LLM 前向</text>
<text x="761.0" y="326.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">4 次前向</text>
<text x="30.0" y="390.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">(d) 压缩 FSM 解码：整段常量直接追加，只剩一次前向</text>
<text x="62.0" y="426.0" font-size="13" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, monospace">{&quot;</text>
<text x="155.5" y="426.0" font-size="13" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, monospace">summary</text>
<text x="249.0" y="426.0" font-size="13" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, monospace">&quot;:</text>
<text x="323.0" y="426.0" font-size="13" fill="#111827" text-anchor="middle" font-family="Menlo, Consolas, monospace">␣&quot;</text>
<text x="410.0" y="426.0" font-size="13" fill="#111827" text-anchor="middle">LLM 前向</text>
<text x="461.0" y="426.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">1 次前向</text>
<text x="30.0" y="490.0" font-size="12" fill="#6b7280" text-anchor="start">据 PDF p. 6 Figure 4 重画，是机制示意，不是实测时间。Token 的切法取自附录 B.2（PDF p. 18）：这段常量按该分词器只能切成 {&quot; · summary · &quot;: · ␣&quot;，</text>
<text x="30.0" y="512.0" font-size="12" fill="#6b7280" text-anchor="start">不能随手切成 summa + ry。跳过之后要用原分词器把「已有文本 + 压缩边文本」重新分词，才能和下一次前向的输入对齐。</text>
</svg>
