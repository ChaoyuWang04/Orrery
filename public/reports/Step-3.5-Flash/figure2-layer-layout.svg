<text x="20" y="32" font-size="19" fill="#111827" font-weight="700">Step 3.5 Flash 的 45 层骨干，加三个挂在最后的 MTP 草稿模块</text>
<text x="20" y="54" font-size="13" fill="#6b7280">紫 = 全注意力（看整段历史）；绿 = 滑动窗口注意力（只看最近 512 个 Token）；灰 = 稠密 FFN；黄 = MoE FFN；红 = MTP 模块</text>
<text x="20" y="96" font-size="14" fill="#111827" font-weight="700">注意力：12 层全注意力 + 33 层 SWA，按 1 + 11 × (3 SWA + 1 全注意力) 排</text>
<text x="20" y="166" font-size="14" fill="#111827" font-weight="700">前馈：前 3 层稠密 FFN，其余 42 层 MoE（288 路由专家 + 1 共享专家，每 Token 选 8 个）</text>
