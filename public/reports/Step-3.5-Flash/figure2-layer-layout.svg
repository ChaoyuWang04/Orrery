<text x="44" y="262" font-size="11" fill="#6b7280">每一列是一层，数字标出全注意力所在层号。第 1 层单独一层全注意力（原图省略了它）；第 2–5 层是第一个混合块，共 11 块</text>
<rect x="20" y="286" width="1080" height="170" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36" y="310" font-size="14" fill="#111827" font-weight="700">MTP-3：一次前向覆盖接下来 4 个位置，供投机解码打草稿</text>
<rect x="40" y="326" width="230" height="64" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="155" y="352" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">骨干第 45 层输出</text>
<text x="155" y="374" font-size="11" fill="#6b7280" text-anchor="middle">主 LM 头预测第 t+1 个 Token</text>
<rect x="310" y="326" width="230" height="64" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="425" y="352" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">MTP-1</text>
<text x="425" y="374" font-size="11" fill="#6b7280" text-anchor="middle">门控 SWA + 稠密 FFN，预测第 t+2 个</text>
<rect x="580" y="326" width="230" height="64" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="695" y="352" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">MTP-2</text>
<text x="695" y="374" font-size="11" fill="#6b7280" text-anchor="middle">从 MTP-1 克隆，预测第 t+3 个</text>
<rect x="850" y="326" width="230" height="64" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="965" y="352" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">MTP-3</text>
<text x="965" y="374" font-size="11" fill="#6b7280" text-anchor="middle">从 MTP-1 克隆，预测第 t+4 个</text>
<line x1="270" y1="358" x2="308" y2="358" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="540" y1="358" x2="578" y2="358" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="810" y1="358" x2="848" y2="358" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="36" y="416" font-size="11" fill="#6b7280">每个模块把上一级的隐状态与下一个位置的共享 Embedding 拼接后再过一层（原图的 H-Norm / E-Norm）。三个模块合计约 0.81B 参数。</text>
<text x="36" y="436" font-size="11" fill="#6b7280">主训练阶段只训 MTP-1；骨干训好后，MTP-2、MTP-3 从它初始化，在最后一段轻量后训练里三个一起训。</text>
<text x="20" y="484" font-size="11" fill="#9ca3af">据 PDF p. 6 Figure 2、p. 7 正文与 p. 27 Table 6 重画的结构示意；层号与层数按正文「先导 1 层全注意力 + 11 个混合块」「3 层稠密 + 42 层 MoE」排出。</text>
