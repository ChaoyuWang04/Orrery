<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">受控扩张：只加依赖已满足的工具，环境变大，奖励仍然验得准</text>
<text x="30" y="54" font-size="13" fill="#6b7280">绿 = 数据库状态已构造的工具；黄 = 本轮 BFS 新加入（依赖已满足）；红 = 依赖未满足、拒绝加入；灰 = 图里其余工具；紫 = 决策。</text>

<rect x="30" y="76" width="340" height="300" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="46" y="100" font-size="14" fill="#111827" font-weight="700">① 采一条种子链 s₁，按链实例化数据库</text>
<line x1="110" y1="162" x2="182" y2="196" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="110" y1="258" x2="182" y2="224" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="222" y1="200" x2="288" y2="166" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<circle cx="92" cy="152" r="20" fill="#e3f4ec" stroke="#5fa886"/>
<text x="92" y="157" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">A</text>
<circle cx="92" cy="266" r="20" fill="#e3f4ec" stroke="#5fa886"/>
<text x="92" y="271" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">B</text>
<circle cx="202" cy="210" r="20" fill="#e3f4ec" stroke="#5fa886"/>
<text x="202" y="215" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">C</text>
<circle cx="308" cy="156" r="20" fill="#e3f4ec" stroke="#5fa886"/>
<text x="308" y="161" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">D</text>
<text x="46" y="322" font-size="11" fill="#6b7280">已选过的工具再被采到的概率逐步降低，保多样性。</text>
<text x="46" y="342" font-size="11" fill="#6b7280">任务 = 描述 + 用户画像 + 评分细则，必须用满整条链；</text>
<text x="46" y="362" font-size="11" fill="#6b7280">细则经多轮一致性检查：可执行的链判对，残缺的判错。</text>

<line x1="374" y1="226" x2="392" y2="226" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="396" y="76" width="360" height="300" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="412" y="100" font-size="14" fill="#111827" font-weight="700">② 从 s₁ 做 BFS 扩张，得到子图 R(s₁)</text>
<line x1="476" y1="148" x2="546" y2="176" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="476" y1="230" x2="546" y2="202" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="586" y1="180" x2="650" y2="150" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="586" y1="198" x2="650" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="576" y1="208" x2="620" y2="296" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="494" y1="314" x2="604" y2="314" stroke="#b9b9b9" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<circle cx="456" cy="140" r="20" fill="#e3f4ec" stroke="#5fa886"/>
<text x="456" y="145" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">A</text>
<circle cx="456" cy="238" r="20" fill="#e3f4ec" stroke="#5fa886"/>
<text x="456" y="243" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">B</text>
<circle cx="566" cy="190" r="20" fill="#e3f4ec" stroke="#5fa886"/>
<text x="566" y="195" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">C</text>
<circle cx="670" cy="142" r="20" fill="#e3f4ec" stroke="#5fa886"/>
<text x="670" y="147" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">D</text>
<circle cx="670" cy="240" r="20" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="670" y="245" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">L</text>
<circle cx="474" cy="314" r="20" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="474" y="319" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">G</text>
<circle cx="626" cy="314" r="20" fill="#fbe9e7" stroke="#d9877a"/>
<text x="626" y="319" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">E</text>
<text x="700" y="245" font-size="11" fill="#6b7280">只依赖 C</text>
<text x="652" y="319" font-size="11" fill="#6b7280">还依赖 G</text>
<text x="412" y="362" font-size="11" fill="#6b7280">G 的数据库没构造，E 不加；L 的依赖已满足，加入。</text>

<line x1="760" y1="226" x2="778" y2="226" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="782" y="76" width="308" height="300" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="798" y="100" font-size="14" fill="#111827" font-weight="700">③ 要不要再起一条链</text>
<rect x="798" y="114" width="276" height="74" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="936" y="138" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">p = f(c(Eₙ), g(Dₙ), |Dₙ|) &gt; τ ？</text>
<text x="936" y="158" font-size="11" fill="#6b7280" text-anchor="middle">是：从剩余工具 Dₙ 再采一条链，回到 ②</text>
<text x="936" y="176" font-size="11" fill="#6b7280" text-anchor="middle">g = 强求解器找到另一条合法链要试几次</text>
<line x1="936" y1="190" x2="936" y2="204" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="798" y="208" width="276" height="62" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="936" y="232" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">否：工具数 |Eₙ| &lt; 20 ？</text>
<text x="936" y="254" font-size="11" fill="#6b7280" text-anchor="middle">是：随机并入一条中等规模链，保持数据库一致</text>
<line x1="936" y1="272" x2="936" y2="286" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="798" y="290" width="276" height="62" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="936" y="314" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">可执行、可验证的环境</text>
<text x="936" y="336" font-size="11" fill="#6b7280" text-anchor="middle">每个至少 20 个工具，可能含多条合法链</text>

<text x="30" y="408" font-size="13" fill="#6b7280">为什么不随手加节点：新工具会连锁牵出一串没满足的依赖，数据库一旦不一致，正确的轨迹也会执行失败，</text>
<text x="30" y="428" font-size="13" fill="#6b7280">被判成错误，RL 收到有偏的负奖励（PDF p. 6）。f 的形式与阈值 τ 报告没有给出。</text>
<text x="30" y="456" font-size="11" fill="#9ca3af">据 PDF p. 6 Figure 4 与 p. 6–7 正文重画的机制示意，节点字母沿用原图，只画一条链的一轮扩张。</text>
</svg>
