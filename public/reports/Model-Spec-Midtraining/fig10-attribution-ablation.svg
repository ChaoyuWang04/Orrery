<text x="30" y="522" font-size="11" fill="#9ca3af">读法：绿点离零线越远，说明 AFT 在 MSM 之上还有增益；灰点大多贴近零线，说明只做到「同现」时 AFT 几乎不再抬高价值。只做 MSM 的水平两版 spec 相当（PDF p. 33）。</text>
