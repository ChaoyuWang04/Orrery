<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">Figure 10：只保留「同时出现」、拿掉「因为」，AFT 的叠加就几乎消失</text>
<text x="30" y="56" font-size="13" fill="#6b7280">横轴 = MSM + AFT 比只做 MSM 多出的分布外偏好率（叠加增量）。绿 = 原始 spec，每条偏好都被解释成价值的结果；</text>
<text x="30" y="76" font-size="13" fill="#6b7280">灰 = 消融 spec，价值只泛泛陈述、偏好被打乱，两者同现但互不解释。数值读自原文 Figure 10（PDF p. 32），4 个种子。</text>
