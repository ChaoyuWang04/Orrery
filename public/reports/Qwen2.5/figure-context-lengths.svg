<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fa886"/></marker><marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8f8bd8"/></marker></defs>
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30" y="34" font-size="19" font-weight="700" fill="#111827">长上下文分两笔账：训练见过多长，推理时再外推多长</text>
<text x="30" y="58" font-size="13" fill="#6b7280">横轴按 2 的倍数等距排列。绿 = 预训练见过的长度；黄 = 推理期用 YARN + DCA 外推出来的长度；虚线 = 32,768。</text>
<text x="30" y="144" font-size="14" font-weight="700" fill="#111827">0.5B / 1.5B / 3B</text>
<text x="30" y="162" font-size="11" fill="#6b7280">开放权重，Table 1 标 32K</text>
<text x="30" y="244" font-size="14" font-weight="700" fill="#111827">7B / 14B / 32B / 72B</text>
<text x="30" y="262" font-size="11" fill="#6b7280">开放权重，Table 1 标 128K</text>
<text x="30" y="344" font-size="14" font-weight="700" fill="#111827">Qwen2.5-Turbo</text>
<text x="30" y="362" font-size="11" fill="#6b7280">API 上的 MoE，标称 1M</text>
<rect x="250" y="130" width="300" height="34" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="260" y="152" font-size="11" fill="#111827">4,096 → 32,768；RoPE base 10,000 → 1,000,000</text>
<text x="562" y="144" font-size="11" fill="#6b7280">正文说「其余模型」可外推到 131,072（p. 4），</text>
<text x="562" y="160" font-size="11" fill="#6b7280">与 Table 1 的 32K 对不上（p. 3）</text>
<rect x="250" y="230" width="300" height="34" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="260" y="252" font-size="11" fill="#111827">同上一行（用 ABF 调大 RoPE base）</text>
<rect x="550" y="230" width="200" height="34" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="560" y="252" font-size="11" fill="#111827">YARN + DCA 外推到 131,072</text>
<rect x="250" y="330" width="600" height="34" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="260" y="352" font-size="11" fill="#111827">4,096 起步；RoPE base 10,000,000</text>
<text x="562" y="352" font-size="11" fill="#111827">四级递进：32K → 64K → 128K → 256K</text>
<rect x="850" y="330" width="200" height="34" rx="4" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="860" y="352" font-size="11" fill="#111827">外推到 1M</text>
<text x="260" y="384" font-size="11" fill="#6b7280">每一级的数据：40% 是当前最长长度，60% 更短</text>
<path d="M550,110 L550,405" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/>
<path d="M250,410 L1050,410" stroke="#9ca3af" stroke-width="1.4"/>
<path d="M250,406 L250,414" stroke="#9ca3af" stroke-width="1.4"/>
<text x="250" y="430" font-size="11" fill="#6b7280" text-anchor="middle">4K</text>
<path d="M550,406 L550,414" stroke="#9ca3af" stroke-width="1.4"/>
<text x="550" y="430" font-size="11" fill="#6b7280" text-anchor="middle">32K</text>
<path d="M650,406 L650,414" stroke="#9ca3af" stroke-width="1.4"/>
<text x="650" y="430" font-size="11" fill="#6b7280" text-anchor="middle">64K</text>
<path d="M750,406 L750,414" stroke="#9ca3af" stroke-width="1.4"/>
<text x="750" y="430" font-size="11" fill="#6b7280" text-anchor="middle">128K</text>
<path d="M850,406 L850,414" stroke="#9ca3af" stroke-width="1.4"/>
<text x="850" y="430" font-size="11" fill="#6b7280" text-anchor="middle">256K</text>
<path d="M1050,406 L1050,414" stroke="#9ca3af" stroke-width="1.4"/>
<text x="1050" y="430" font-size="11" fill="#6b7280" text-anchor="middle">1M</text>
<text x="30" y="458" font-size="11" fill="#9ca3af">据 PDF p. 3–4（Table 1 与 3.3 节）重画。32K 以内 YARN + DCA 不改变模型行为（Table 16–17 表题，p. 17）；外推段的效果见正文的对照表。</text>
