<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9877a"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5fa886"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>

  <text x="24" y="38" font-size="19" font-weight="700" fill="#111827">式 (2) 里评委能做的事：把程序化奖励左右挪至多 0.2</text>
  <text x="24" y="62" font-size="13" fill="#6b7280">灰：程序化奖励 r_V 及其取值区间；红箭头：评委扣分；绿箭头：评委加分；实心点是最终训练奖励 r = r_V + 0.2 · s/5</text>

  <!-- 区间底色 -->
  <rect x="336" y="96" width="104" height="340" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <rect x="960" y="96" width="104" height="340" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
  <rect x="440" y="96" width="520" height="340" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
  <text x="700" y="120" font-size="11" fill="#6b7280" text-anchor="middle">程序化奖励 r_V 只能落在 [0, 1]</text>
  <text x="388" y="120" font-size="11" fill="#9ca3af" text-anchor="middle">评委下推区</text>
  <text x="1012" y="120" font-size="11" fill="#9ca3af" text-anchor="middle">评委上推区</text>

  <!-- 行 1：附录 B 的 −5 例 -->
  <text x="24" y="170" font-size="14" font-weight="700" fill="#111827">原文例：评委打 −5</text>
  <text x="24" y="188" font-size="11" fill="#6b7280">交付物基本对了，但删掉失败日志再报告</text>
  <line x1="824" y1="176" x2="734" y2="176" stroke="#d9877a" stroke-width="2" marker-end="url(#arrRed)"/>
  <circle cx="830" cy="176" r="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="2"/>
  <circle cx="726" cy="176" r="6" fill="#d9877a"/>
  <text x="830" y="160" font-size="11" fill="#6b7280" text-anchor="middle">r_V = 0.75</text>
  <text x="726" y="200" font-size="11" fill="#111827" text-anchor="middle">r = 0.55</text>

  <!-- 行 2：附录 B 的 −2 例 -->
  <text x="24" y="250" font-size="14" font-weight="700" fill="#111827">原文例：评委打 −2</text>
  <text x="24" y="268" font-size="11" fill="#6b7280">测试全过，但没执行说明要求的辅助脚本</text>
  <line x1="954" y1="256" x2="926" y2="256" stroke="#d9877a" stroke-width="2" marker-end="url(#arrRed)"/>
  <circle cx="960" cy="256" r="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="2"/>
  <circle cx="918" cy="256" r="6" fill="#d9877a"/>
  <text x="960" y="240" font-size="11" fill="#6b7280" text-anchor="middle">r_V = 1.0</text>
  <text x="918" y="280" font-size="11" fill="#111827" text-anchor="middle">r = 0.92（按式推算）</text>

  <!-- 行 3：假设例，失败但过程漂亮 -->
  <text x="24" y="330" font-size="14" font-weight="700" fill="#111827">假设：任务没做成，过程写得漂亮</text>
  <text x="24" y="348" font-size="11" fill="#6b7280">r_V = 0，评委打 +5</text>
  <line x1="446" y1="336" x2="536" y2="336" stroke="#5fa886" stroke-width="2" marker-end="url(#arrGreen)"/>
  <circle cx="440" cy="336" r="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="2"/>
  <circle cx="544" cy="336" r="6" fill="#5fa886"/>
  <text x="440" y="320" font-size="11" fill="#6b7280" text-anchor="middle">r_V = 0</text>
  <text x="544" y="360" font-size="11" fill="#111827" text-anchor="middle">r = 0.2</text>

  <!-- 行 4：假设例，做对一部分但过程差 -->
  <text x="24" y="410" font-size="14" font-weight="700" fill="#111827">假设：做对一部分，过程很差</text>
  <text x="24" y="428" font-size="11" fill="#6b7280">r_V = 0.2，评委打 −5</text>
  <line x1="538" y1="416" x2="448" y2="416" stroke="#d9877a" stroke-width="2" marker-end="url(#arrRed)"/>
  <circle cx="544" cy="416" r="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="2"/>
  <circle cx="440" cy="416" r="6" fill="#d9877a"/>
  <text x="544" y="400" font-size="11" fill="#6b7280" text-anchor="middle">r_V = 0.2</text>
  <text x="600" y="420" font-size="11" fill="#111827" text-anchor="start">r = 0，反而低于上一行的失败任务</text>

  <!-- 坐标轴 -->
  <line x1="336" y1="462" x2="1064" y2="462" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="336" y1="456" x2="336" y2="468" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="440" y1="456" x2="440" y2="468" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="544" y1="456" x2="544" y2="468" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="648" y1="456" x2="648" y2="468" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="752" y1="456" x2="752" y2="468" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="856" y1="456" x2="856" y2="468" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="960" y1="456" x2="960" y2="468" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="1064" y1="456" x2="1064" y2="468" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="336" y="484" font-size="11" fill="#6b7280" text-anchor="middle">−0.2</text>
  <text x="440" y="484" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
  <text x="544" y="484" font-size="11" fill="#6b7280" text-anchor="middle">0.2</text>
  <text x="648" y="484" font-size="11" fill="#6b7280" text-anchor="middle">0.4</text>
  <text x="752" y="484" font-size="11" fill="#6b7280" text-anchor="middle">0.6</text>
  <text x="856" y="484" font-size="11" fill="#6b7280" text-anchor="middle">0.8</text>
  <text x="960" y="484" font-size="11" fill="#6b7280" text-anchor="middle">1.0</text>
  <text x="1064" y="484" font-size="11" fill="#6b7280" text-anchor="middle">1.2</text>
  <text x="700" y="504" font-size="11" fill="#6b7280" text-anchor="middle">训练奖励</text>

  <text x="24" y="534" font-size="11" fill="#9ca3af">前两行取自原文附录 B（PDF p. 18），−2 例的最终奖励是按式 (2) 推算，原文只给了 r_V；后两行是机制示意，不是实测轨迹。</text>
</svg>
