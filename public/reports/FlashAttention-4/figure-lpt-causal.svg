<text x="36.0" y="318.0" font-size="11" fill="#6b7280" text-anchor="start">行 = 第 m 个 Q 块；列 = KV 块。</text>
<text x="36.0" y="338.0" font-size="11" fill="#6b7280" text-anchor="start">对角线以上被掩掉，不用算；</text>
<text x="36.0" y="358.0" font-size="11" fill="#6b7280" text-anchor="start">第 m 块只扫 m + 1 个 KV 块，</text>
<text x="36.0" y="378.0" font-size="11" fill="#6b7280" text-anchor="start">所以 8 个块的长度是 1 到 8。</text>
<text x="36.0" y="410.0" font-size="11" fill="#6b7280" text-anchor="start">默认网格按 m 升序发，</text>
<text x="36.0" y="430.0" font-size="11" fill="#6b7280" text-anchor="start">等于先发最短的。</text>
