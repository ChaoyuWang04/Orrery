<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">矩阵乘单元翻倍，指数单元和共享内存没动，最长的那根杆换了人</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">紫 = Tensor Core 矩阵乘；黄 = MUFU 指数单元；绿 = 共享内存；灰 = 上一代 H100 的同一部件。</text>
<rect x="16.0" y="72.0" width="1088.0" height="196.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36.0" y="98.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">① 每个 SM 每个时钟能做多少（PDF p. 4）</text>
<text x="40.0" y="144.0" font-size="13" fill="#111827" text-anchor="start">Tensor Core（BF16 矩阵乘）</text>
<rect x="330.0" y="128.0" width="200.0" height="13.0" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="540.0" y="139.0" font-size="11" fill="#6b7280" text-anchor="start">H100 4096 ops</text>
<rect x="330.0" y="145.0" width="400.0" height="13.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="740.0" y="156.0" font-size="11" fill="#111827" text-anchor="start" font-weight="700">B200 8192 ops，×2</text>
<text x="40.0" y="190.0" font-size="13" fill="#111827" text-anchor="start">MUFU 指数单元</text>
<rect x="330.0" y="174.0" width="200.0" height="13.0" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="540.0" y="185.0" font-size="11" fill="#6b7280" text-anchor="start">H100 16 ops</text>
<rect x="330.0" y="191.0" width="200.0" height="13.0" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="540.0" y="202.0" font-size="11" fill="#111827" text-anchor="start" font-weight="700">B200 16 ops，不变</text>
<text x="40.0" y="236.0" font-size="13" fill="#111827" text-anchor="start">共享内存读带宽</text>
<rect x="330.0" y="220.0" width="200.0" height="13.0" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="540.0" y="231.0" font-size="11" fill="#6b7280" text-anchor="start">H100 128 字节</text>
<rect x="330.0" y="237.0" width="200.0" height="13.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<text x="540.0" y="248.0" font-size="11" fill="#111827" text-anchor="start" font-weight="700">B200 128 字节，不变</text>
<rect x="16.0" y="284.0" width="1088.0" height="316.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36.0" y="310.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">② 一轮内循环里三种部件各要转多少圈（Table 1、Table 3，单位：时钟周期）</text>
<text x="40.0" y="358.0" font-size="13" fill="#111827" text-anchor="start">前向，M = N = d = 128</text>
<text x="40.0" y="378.0" font-size="11" fill="#6b7280" text-anchor="start">指数与矩阵乘并列最长</text>
<rect x="330.0" y="336.0" width="172.3" height="15.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="512.3" y="348.0" font-size="11" fill="#111827" text-anchor="start" font-weight="700">矩阵乘 1024</text>
<rect x="330.0" y="356.0" width="172.3" height="15.0" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="512.3" y="368.0" font-size="11" fill="#111827" text-anchor="start" font-weight="700">指数 1024</text>
<rect x="330.0" y="376.0" width="129.2" height="15.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<text x="469.2" y="388.0" font-size="11" fill="#6b7280" text-anchor="start">共享内存 768</text>
<text x="40.0" y="444.0" font-size="13" fill="#111827" text-anchor="start">反向，1-CTA，M = N = d = 128</text>
<text x="40.0" y="464.0" font-size="11" fill="#6b7280" text-anchor="start">共享内存比矩阵乘长约 30%</text>
<rect x="330.0" y="422.0" width="430.8" height="15.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="770.8" y="434.0" font-size="11" fill="#6b7280" text-anchor="start">矩阵乘 2560</text>
<rect x="330.0" y="442.0" width="172.3" height="15.0" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="512.3" y="454.0" font-size="11" fill="#6b7280" text-anchor="start">指数 1024</text>
<rect x="330.0" y="462.0" width="560.0" height="15.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<text x="900.0" y="474.0" font-size="11" fill="#111827" text-anchor="start" font-weight="700">共享内存 3328</text>
<text x="40.0" y="530.0" font-size="13" fill="#111827" text-anchor="start">反向，2-CTA，M = 256</text>
<text x="40.0" y="550.0" font-size="11" fill="#6b7280" text-anchor="start">共享内存仍长约 5%</text>
<rect x="330.0" y="508.0" width="430.8" height="15.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="770.8" y="520.0" font-size="11" fill="#6b7280" text-anchor="start">矩阵乘 2560</text>
<rect x="330.0" y="528.0" width="172.3" height="15.0" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="512.3" y="540.0" font-size="11" fill="#6b7280" text-anchor="start">指数 1024</text>
<rect x="330.0" y="548.0" width="452.3" height="15.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<text x="792.3" y="560.0" font-size="11" fill="#111827" text-anchor="start" font-weight="700">共享内存 2688</text>
<text x="30.0" y="624.0" font-size="12" fill="#6b7280" text-anchor="start">按 PDF p. 4–6、p. 10–11 的数字重画。论文只算这三种部件，寄存器、L2 等不在账里；前向 256 × 128² 的大 tile 各项正好翻倍，结论不变。</text>
</svg>
