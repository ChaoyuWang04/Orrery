<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 3：2-CTA 反向算 dQ，先用 DSMEM 把 dS 换一个切法</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">绿 = 来自 KV 块 0 的 dS；紫 = 来自 KV 块 1 的 dS；黄 = K；灰 = dQ 输出。虚线框 = 要搬到对面 CTA 的那半块。</text>
<rect x="16.0" y="72.0" width="390.0" height="400.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36.0" y="98.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">交换前：每个 CTA 只有自己那块 KV 的 dS</text>
<text x="36.0" y="118.0" font-size="11" fill="#6b7280" text-anchor="start">一对 CTA 在同一个 cluster；dQ 要对两块 KV 求和</text>
<text x="125.0" y="150.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">CTA 0 · KV 块 0</text>
<rect x="60.0" y="164.0" width="130.0" height="110.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="60.0" y="278.0" width="130.0" height="110.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<text x="125.0" y="224.0" font-size="11" fill="#111827" text-anchor="middle">上半 M/2 行</text>
<text x="125.0" y="338.0" font-size="11" fill="#111827" text-anchor="middle">下半 M/2 行</text>
<rect x="56" y="274" width="138" height="118" rx="4" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="125.0" y="406.0" font-size="11" fill="#9ca3af" text-anchor="middle">dS：M × N</text>
<text x="305.0" y="150.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">CTA 1 · KV 块 1</text>
<rect x="240.0" y="164.0" width="130.0" height="110.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="240.0" y="278.0" width="130.0" height="110.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="305.0" y="224.0" font-size="11" fill="#111827" text-anchor="middle">上半 M/2 行</text>
<text x="305.0" y="338.0" font-size="11" fill="#111827" text-anchor="middle">下半 M/2 行</text>
<rect x="236" y="160" width="138" height="118" rx="4" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="305.0" y="406.0" font-size="11" fill="#9ca3af" text-anchor="middle">dS：M × N</text>
<text x="36.0" y="440.0" font-size="11" fill="#6b7280" text-anchor="start">dQ = dS · K 的归约轴是 N，恰好被这对 CTA 劈成两半；</text>
<text x="36.0" y="458.0" font-size="11" fill="#6b7280" text-anchor="start">2-CTA MMA 只会切输出，不会替你把归约合起来（PDF p. 12）。</text>
<rect x="420.0" y="230.0" width="100.0" height="60.0" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="470.0" y="256.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">DSMEM</text>
<text x="470.0" y="276.0" font-size="11" fill="#6b7280" text-anchor="middle">换走半块 dS</text>
<line x1="406.0" y1="260.0" x2="418.0" y2="260.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="522.0" y1="260.0" x2="540.0" y2="260.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="546.0" y="72.0" width="558.0" height="400.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="566.0" y="98.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">交换后：按 Q 行切，每个 CTA 拿满 2N 的归约</text>
<text x="566.0" y="118.0" font-size="11" fill="#6b7280" text-anchor="start">每个 CTA 的 dQ 矩阵乘：(M/2 × 2N) · (2N × d) → (M/2 × d)</text>
<text x="566.0" y="208.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">CTA 0</text>
<rect x="620.0" y="170.0" width="110.0" height="70.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<text x="675.0" y="209.0" font-size="11" fill="#111827" text-anchor="middle">KV0 · 上</text>
<rect x="732.0" y="170.0" width="110.0" height="70.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="787.0" y="209.0" font-size="11" fill="#111827" text-anchor="middle">KV1 · 上</text>
<text x="731.0" y="162.0" font-size="11" fill="#9ca3af" text-anchor="middle">M/2 × 2N</text>
<text x="858.0" y="210.0" font-size="14" fill="#111827" text-anchor="middle">·</text>
<rect x="872.0" y="150.0" width="70.0" height="110.0" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="907.0" y="202.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">K</text>
<text x="907.0" y="220.0" font-size="11" fill="#6b7280" text-anchor="middle">2N × d</text>
<text x="958.0" y="210.0" font-size="14" fill="#111827" text-anchor="middle">=</text>
<rect x="974.0" y="180.0" width="110.0" height="50.0" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="1029.0" y="202.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">dQ 上半</text>
<text x="1029.0" y="218.0" font-size="11" fill="#6b7280" text-anchor="middle">M/2 × d，放 TMEM</text>
<text x="566.0" y="358.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">CTA 1</text>
<rect x="620.0" y="320.0" width="110.0" height="70.0" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<text x="675.0" y="359.0" font-size="11" fill="#111827" text-anchor="middle">KV0 · 下</text>
<rect x="732.0" y="320.0" width="110.0" height="70.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="787.0" y="359.0" font-size="11" fill="#111827" text-anchor="middle">KV1 · 下</text>
<text x="731.0" y="312.0" font-size="11" fill="#9ca3af" text-anchor="middle">M/2 × 2N</text>
<text x="858.0" y="360.0" font-size="14" fill="#111827" text-anchor="middle">·</text>
<rect x="872.0" y="300.0" width="70.0" height="110.0" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="907.0" y="352.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">K</text>
<text x="907.0" y="370.0" font-size="11" fill="#6b7280" text-anchor="middle">2N × d</text>
<text x="958.0" y="360.0" font-size="14" fill="#111827" text-anchor="middle">=</text>
<rect x="974.0" y="330.0" width="110.0" height="50.0" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="1029.0" y="352.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">dQ 下半</text>
<text x="1029.0" y="368.0" font-size="11" fill="#6b7280" text-anchor="middle">M/2 × d，放 TMEM</text>
<text x="566.0" y="440.0" font-size="11" fill="#6b7280" text-anchor="start">K 这一侧由两个 CTA 各存一半（按 d 切成 d/2），硬件拼起来用。</text>
<text x="566.0" y="458.0" font-size="11" fill="#6b7280" text-anchor="start">其余四个矩阵乘仍用 M = 256；只有 dQ 用 M = 128、归约 2N = 256。</text>
<rect x="16.0" y="486.0" width="1088.0" height="58.0" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36.0" y="510.0" font-size="12" fill="#111827" text-anchor="start">顺带的收益：每个 CTA 只往全局 dQ 原子加 M/2 × d，次数是 1-CTA 的一半；原子加越少，非确定性和开销都越少（PDF p. 12）。</text>
<text x="36.0" y="530.0" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p. 11 Figure 3 与 p. 12 正文重画，是机制示意。</text>
</svg>
