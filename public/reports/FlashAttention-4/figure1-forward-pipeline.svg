<text x="427.0" y="418.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">softmax warpgroup × 2</text>
<text x="427.0" y="438.0" font-size="11" fill="#6b7280" text-anchor="middle">一个线程管一整行 128 个分数</text>
<rect x="568.0" y="394.0" width="250.0" height="58.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="693.0" y="418.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">correction warpgroup</text>
<text x="693.0" y="438.0" font-size="11" fill="#6b7280" text-anchor="middle">按需重缩放 O，最后归一化</text>
<rect x="834.0" y="394.0" width="250.0" height="58.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
