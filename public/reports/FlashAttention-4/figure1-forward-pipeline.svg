<text x="959.0" y="438.0" font-size="11" fill="#6b7280" text-anchor="middle">两片 O 累加器 + 两片 S，P 写回 S</text>
<text x="36.0" y="480.0" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p. 6 Figure 1 与 p. 6–7 正文重画。四个 SM 的时间线在原图里完全相同，这里只画一个；周期数是理想化的机制示意，不是实测。</text>
