<text x="434" y="153" font-size="11" fill="#6b7280" text-anchor="end">x(l+1)</text>
<text x="434" y="487" font-size="11" fill="#6b7280" text-anchor="end">x(l)</text>
<circle cx="484" cy="200" r="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
