<rect x="873" y="470" width="18" height="24" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="802" y="153" font-size="11" fill="#6b7280" text-anchor="end">x(l+1)</text>
<text x="802" y="487" font-size="11" fill="#6b7280" text-anchor="end">x(l)</text>
<circle cx="852" cy="200" r="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
<text x="852" y="205" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<polyline points="852,188 852,164" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="944" y="316" width="140" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="1014" y="336" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">层 F</text>
<text x="1014" y="352" font-size="11" fill="#6b7280" text-anchor="middle">注意力或 FFN，C 维</text>
