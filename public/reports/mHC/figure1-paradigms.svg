<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">残差连接、超连接与 mHC：同一层的三种接线</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">灰 = 残差流里存放的状态；紫 = 真正做计算的层 F；黄 = 自由学习的映射；绿 = 被约束住的映射。一格灰块代表一条 C 维的流。</text>
<rect x="16" y="70" width="352" height="470" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="192" y="94" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(a) 普通残差连接</text>
<text x="192" y="114" font-size="11" fill="#6b7280" text-anchor="middle">1 条流，旧状态原样相加</text>
<rect x="94" y="136" width="44" height="24" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="94" y="470" width="44" height="24" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="86" y="153" font-size="11" fill="#6b7280" text-anchor="end">x(l+1)</text>
<text x="86" y="487" font-size="11" fill="#6b7280" text-anchor="end">x(l)</text>
<circle cx="116" cy="200" r="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
<text x="116" y="205" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">+</text>
<polyline points="116,188 116,164" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="208" y="316" width="140" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="278" y="336" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">层 F</text>
<text x="278" y="352" font-size="11" fill="#6b7280" text-anchor="middle">注意力或 FFN，C 维</text>
<polyline points="116,470 116,214" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="138,482 278,482 278,362" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="278,316 278,200 130,200" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="108" y="330" font-size="11" fill="#9ca3af" text-anchor="end">恒等</text>
<text x="108" y="346" font-size="11" fill="#9ca3af" text-anchor="end">旁路</text>
<text x="192" y="526" font-size="11" fill="#9ca3af" text-anchor="middle">浅层信号原样直达深层，增益恒为 1</text>
<rect x="384" y="70" width="352" height="470" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="560" y="94" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(b) 超连接 HC</text>
<text x="560" y="114" font-size="11" fill="#6b7280" text-anchor="middle">n 条流，三个映射自由学习</text>
