<polyline points="1014,316 1014,278" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="1014,232 1014,200 866,200" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="928" y="526" font-size="11" fill="#9ca3af" text-anchor="middle">Res 映射行和列和为 1，连乘后仍守恒</text>
<text x="30" y="576" font-size="11" fill="#9ca3af" text-anchor="start">按 PDF p. 1 Figure 1 与 p. 3、p. 9 的式 (3)、(8) 重画的结构示意；层 F 内部照常只处理 C 维，拓宽的只是层与层之间存放状态的容器。</text>
