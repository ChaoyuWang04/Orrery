<polyline points="646,316 646,278" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="646,232 646,200 498,200" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="560" y="526" font-size="11" fill="#9ca3af" text-anchor="middle">三个映射都是任意实数，几十层连乘后失控</text>
<rect x="752" y="70" width="352" height="470" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="928" y="94" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(c) mHC</text>
<text x="928" y="114" font-size="11" fill="#6b7280" text-anchor="middle">n 条流，映射投影到约束集合</text>
