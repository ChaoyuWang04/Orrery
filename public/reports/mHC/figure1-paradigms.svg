<polyline points="484,470 484,376" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="484,330 484,214" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="576" y="400" width="140" height="44" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="646" y="420" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Pre 映射</text>
<text x="646" y="436" font-size="11" fill="#6b7280" text-anchor="middle">1×n，n 流读成 1 份</text>
<polyline points="526,482 646,482 646,446" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
