<text x="927.8" y="312" font-size="11" fill="#6b7280" text-anchor="middle">MLP 的 Post·Res（反向）</text>
<text x="30" y="350" font-size="11" fill="#9ca3af" text-anchor="start">三条改动（PDF p. 11）：MLP 层的 Post·Res 算子走专用高优先级计算流，不堵通信；注意力层的长算子不用 persistent kernel，可被抢占；</text>
<text x="30" y="368" font-size="11" fill="#9ca3af" text-anchor="start">每个 stage 的块首输入本来就缓存在本地，所以整段重算不依赖流水通信，可以和 PP 收发并行。</text>
<text x="30" y="396" font-size="11" fill="#9ca3af" text-anchor="start">按 PDF p. 12 Figure 4 的块序重画，保留原图的相对位置。</text>
