<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 502" width="860" height="502" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="860" height="502" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">过滤器在比什么：同一段后文，换三种前缀，看谁让后文最好猜</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">按原文 Figure 2 的 Pittsburgh 例子示意，不是实测数值。灰 = 不给调用；黄 = 只给调用、不给结果；</text>
<text x="30" y="72" font-size="13" fill="#6b7280" text-anchor="start">绿 = 调用加结果；紫 = 被打分的后文 token。白框是已经读过、不打分的原文。</text>
<text x="30" y="110" font-size="11" fill="#9ca3af" text-anchor="start">前缀 z（过滤时放在整段最前面）</text>
<text x="335" y="110" font-size="11" fill="#9ca3af" text-anchor="start">已读原文 x₁ … xᵢ₋₁</text>
<text x="540" y="110" font-size="11" fill="#9ca3af" text-anchor="start">位置 i 起的后文</text>
<text x="730" y="110" font-size="11" fill="#9ca3af" text-anchor="start">加权损失</text>
<rect x="30" y="124" width="290" height="52" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="42" y="146" font-size="12" fill="#111827" text-anchor="start">不给任何调用</text>
<text x="42" y="164" font-size="12" fill="#111827" text-anchor="start">（空前缀 ε）</text>
<rect x="335" y="134" width="190" height="32" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="345" y="155" font-size="12" fill="#6b7280" text-anchor="start">Pittsburgh is also known as</text>
<rect x="540" y="134" width="44" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="562.0" y="155" font-size="12" fill="#111827" text-anchor="middle">the</text>
<rect x="590" y="134" width="56" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="618.0" y="155" font-size="12" fill="#111827" text-anchor="middle">Steel</text>
<rect x="652" y="134" width="50" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="677.0" y="155" font-size="12" fill="#111827" text-anchor="middle">City</text>
<text x="730" y="155" font-size="12" fill="#111827" text-anchor="start" font-weight="700">Lᵢ(ε)</text>
<rect x="30" y="190" width="290" height="52" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="42" y="212" font-size="12" fill="#111827" text-anchor="start">[QA(What other name is</text>
<text x="42" y="230" font-size="12" fill="#111827" text-anchor="start">Pittsburgh known by?)]</text>
<rect x="335" y="200" width="190" height="32" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="345" y="221" font-size="12" fill="#6b7280" text-anchor="start">Pittsburgh is also known as</text>
<rect x="540" y="200" width="44" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="562.0" y="221" font-size="12" fill="#111827" text-anchor="middle">the</text>
<rect x="590" y="200" width="56" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="618.0" y="221" font-size="12" fill="#111827" text-anchor="middle">Steel</text>
<rect x="652" y="200" width="50" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="677.0" y="221" font-size="12" fill="#111827" text-anchor="middle">City</text>
<text x="730" y="221" font-size="12" fill="#111827" text-anchor="start" font-weight="700">Lᵢ(e(c, ε))</text>
<rect x="30" y="256" width="290" height="52" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="42" y="278" font-size="12" fill="#111827" text-anchor="start">[QA(What other name is Pittsburgh</text>
<text x="42" y="296" font-size="12" fill="#111827" text-anchor="start">known by?) → Steel City]</text>
<rect x="335" y="266" width="190" height="32" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="345" y="287" font-size="12" fill="#6b7280" text-anchor="start">Pittsburgh is also known as</text>
<rect x="540" y="266" width="44" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="562.0" y="287" font-size="12" fill="#111827" text-anchor="middle">the</text>
<rect x="590" y="266" width="56" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="618.0" y="287" font-size="12" fill="#111827" text-anchor="middle">Steel</text>
<rect x="652" y="266" width="50" height="32" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="677.0" y="287" font-size="12" fill="#111827" text-anchor="middle">City</text>
<text x="730" y="287" font-size="12" fill="#111827" text-anchor="start" font-weight="700">Lᵢ(e(c, r)) = L⁺</text>
<text x="562.0" y="326" font-size="11" fill="#6b7280" text-anchor="middle">1.0</text>
<text x="618.0" y="326" font-size="11" fill="#6b7280" text-anchor="middle">0.8</text>
<text x="677.0" y="326" font-size="11" fill="#6b7280" text-anchor="middle">0.6</text>
<text x="540" y="344" font-size="11" fill="#9ca3af" text-anchor="start">权重 w̃ 按距离每步减 0.2，第 5 个 token 起为 0</text>
<text x="30" y="326" font-size="11" fill="#9ca3af" text-anchor="start">三行的后文完全相同，只有前缀不同</text>
<rect x="30" y="362" width="800" height="118" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="48" y="388" font-size="13" fill="#111827" text-anchor="start">L⁻ = min( Lᵢ(ε), Lᵢ(e(c, ε)) )：灰、黄两行里更好的那个，即「不调用」或「调了但没结果」</text>
<text x="48" y="412" font-size="13" fill="#111827" text-anchor="start">保留条件：L⁻ − L⁺ ≥ τf（默认 1.0；计算器与翻译放宽到 0.5）。结果本身必须让后文更好猜。</text>
<text x="48" y="436" font-size="13" fill="#111827" text-anchor="start">同图第二个候选「Which country is Pittsburgh in? → United States」让后文更难猜，被滤掉。</text>
<text x="48" y="460" font-size="13" fill="#111827" text-anchor="start">通过的调用插回位置 i，得到训练文本 x*；过滤时放在最前面，是因为 M 还没见过句中出现调用。</text>
</svg>
