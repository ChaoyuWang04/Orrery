<text x="30.0" y="32.0" font-size="19" fill="#111827" font-weight="700">slime 的两种调度：rollout 长度整齐就共置同步，长短悬殊就拆开异步</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280">绿 = 生成 rollout；紫 = 训练更新；黄 = 权重同步（BF16 权重在线做块级 FP8 量化后下发）；红虚框 = GPU 空等；灰 = 数据池。</text>
<text x="30.0" y="72.0" font-size="13" fill="#6b7280">根据 PDF p. 12–14 的文字与 p. 13 Figure 10 重画，是机制示意，块长不是实测时长。</text>
