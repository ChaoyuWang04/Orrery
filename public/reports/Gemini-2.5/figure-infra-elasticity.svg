<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="gi-ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
<rect x="150" y="124" width="210" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="362" y="124" width="420" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="784" y="124" width="286" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="150" y="174" width="210" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="362" y="174" width="60" height="30" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="424" y="174" width="420" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="846" y="174" width="224" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="30" y="284" width="250" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="300" y="284" width="250" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="570" y="284" width="250" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="840" y="284" width="250" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<line x1="280" y1="312" x2="298" y2="312" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#gi-ar)"/>
<line x1="550" y1="312" x2="568" y2="312" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#gi-ar)"/>
<line x1="820" y1="312" x2="838" y2="312" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#gi-ar)"/>
<rect x="30" y="470" width="990.0400000000001" height="40" rx="3" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="1020.0400000000001" y="470" width="34.980000000000004" height="40" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="1055.02" y="470" width="34.97999999999992" height="40" rx="3" fill="#fbe9e7" stroke="#d9877a"/>
<line x1="1037.53" y1="468" x2="1037.53" y2="446" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="1072.51" y1="512" x2="1072.51" y2="534" stroke="#9ca3af" stroke-width="1.4"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">每小时多次硬件故障，训练怎样不停下来</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">绿 = 满速计算；黄 = 少一个切片降级运行；灰 = 重配置或等待，训练停着；红 = 弹性也救不回来的长尾；紫 = SDC 排查步骤。</text>
<text x="30" y="72" font-size="13" fill="#6b7280" text-anchor="start">上两块是机制示意，横轴不按比例；只有最下面的时间账按报告的百分比画。据 PDF p. 4–5 重画。</text>
<text x="30" y="108" font-size="14" fill="#111827" text-anchor="start" font-weight="700">一 · 局部故障之后</text>
<text x="30" y="142" font-size="12" fill="#111827" text-anchor="start" font-weight="700">没有弹性</text>
<text x="160" y="144" font-size="11" fill="#111827" text-anchor="start">满速训练</text>
<text x="372" y="144" font-size="11" fill="#111827" text-anchor="start">一个切片坏了：整个作业停下，等调度找到健康机器，10 分钟以上</text>
<text x="794" y="144" font-size="11" fill="#111827" text-anchor="start">换上新机器，恢复满速</text>
<text x="30" y="192" font-size="12" fill="#111827" text-anchor="start" font-weight="700">切片粒度弹性</text>
<text x="160" y="194" font-size="11" fill="#111827" text-anchor="start">满速训练</text>
<text x="368" y="194" font-size="11" fill="#111827" text-anchor="start">几十秒</text>
<text x="434" y="194" font-size="11" fill="#111827" text-anchor="start">摘掉坏切片，用剩下的切片继续，约 97% 吞吐</text>
<text x="856" y="194" font-size="11" fill="#111827" text-anchor="start">坏切片修好后并回，满速</text>
<text x="150" y="224" font-size="11" fill="#6b7280" text-anchor="start">报告说这套容错按「更大规模下更高的故障率」设计，本次训练中硬件故障导致的中断每小时发生多次。</text>
<text x="30" y="268" font-size="14" fill="#111827" text-anchor="start" font-weight="700">二 · 分阶段 SDC 检测：先重放，再定位</text>
<text x="42" y="306" font-size="13" fill="#111827" text-anchor="start" font-weight="700">某一步的训练指标可疑</text>
<text x="42" y="326" font-size="11" fill="#6b7280" text-anchor="start">单控制器看得到全局指标</text>
<text x="312" y="306" font-size="13" fill="#111827" text-anchor="start" font-weight="700">立即用确定性重放重跑这一步</text>
<text x="312" y="326" font-size="11" fill="#6b7280" text-anchor="start">轻量，不回滚一大段</text>
<text x="582" y="306" font-size="13" fill="#111827" text-anchor="start" font-weight="700">比对每台设备的中间校验和</text>
<text x="582" y="326" font-size="11" fill="#6b7280" text-anchor="start">据此定位出错的设备</text>
<text x="852" y="306" font-size="13" fill="#111827" text-anchor="start" font-weight="700">几分钟内定位并剔除该芯片</text>
<text x="852" y="326" font-size="11" fill="#6b7280" text-anchor="start">以前可能要好几个小时</text>
<text x="30" y="366" font-size="11" fill="#6b7280" text-anchor="start">本次训练约 0.25% 的步因怀疑 SDC 被重放，其中 6% 确认是真实的硬件损坏。能这么轻地做，是因为 Pathways 由一个 Python 程序协调全部加速器、掌握全局状态。</text>
<text x="30" y="414" font-size="14" fill="#111827" text-anchor="start" font-weight="700">三 · 整次训练的时间账（按比例）</text>
<text x="44" y="495" font-size="13" fill="#111827" text-anchor="start" font-weight="700">93.4% 的时间在做 TPU 计算</text>
<text x="1031.53" y="442" font-size="11" fill="#6b7280" text-anchor="end">约一半：弹性重配置</text>
<text x="1066.51" y="548" font-size="11" fill="#6b7280" text-anchor="end">约一半：弹性失效的罕见长尾</text>
<text x="30" y="588" font-size="13" fill="#6b7280" text-anchor="start">另有约 4.5% 的已计算步是为调试干预做的重放或回滚。它按步数计，与上面的时间占比口径不同，不能相加。</text>
<text x="30" y="610" font-size="13" fill="#6b7280" text-anchor="start">报告没有给出芯片总数、训练天数与总算力，这张账只能看比例。</text>
</svg>
