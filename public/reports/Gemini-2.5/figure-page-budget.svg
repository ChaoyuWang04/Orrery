<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">73 页花在哪：架构一段话，安全二十页</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">每格一页。紫 = 第 2 章 模型、数据与训练；绿 = 第 3–4 章 评测与用例；红 = 第 5 章 安全；黄 = 引言与讨论；灰 = 参考文献、贡献者名单与附录。</text>
<text x="125.5" y="82" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">第 2 章</text>
<text x="125.5" y="99" font-size="11" fill="#6b7280" text-anchor="middle">p.2–10 · 9 页</text>
