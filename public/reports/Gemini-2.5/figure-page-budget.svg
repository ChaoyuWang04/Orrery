<text x="244.5" y="99" font-size="11" fill="#6b7280" text-anchor="middle">p.11–18 · 8 页</text>
<text x="440.5" y="82" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">第 5 章 安全</text>
<text x="440.5" y="99" font-size="11" fill="#6b7280" text-anchor="middle">p.19–38 · 20 页</text>
<text x="643.5" y="82" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">参考文献</text>
<text x="643.5" y="99" font-size="11" fill="#6b7280" text-anchor="middle">p.40–46 · 7 页</text>
<text x="804.5" y="82" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">贡献者名单</text>
<text x="804.5" y="99" font-size="11" fill="#6b7280" text-anchor="middle">p.47–62 · 16 页</text>
<text x="993.5" y="82" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">附录</text>
<text x="993.5" y="99" font-size="11" fill="#6b7280" text-anchor="middle">p.63–73 · 11 页</text>
<text x="49" y="168" font-size="11" fill="#6b7280" text-anchor="start">p.1 引言</text>
<text x="587" y="168" font-size="11" fill="#6b7280" text-anchor="middle">p.39 讨论</text>
<text x="30" y="212" font-size="14" fill="#111827" text-anchor="start" font-weight="700">放大第 2 章：各小节正文篇幅（按正文行数的粗略比例）</text>
<text x="55" y="247" font-size="11" fill="#111827" text-anchor="start">2.1 架构与蒸馏</text>
<text x="174" y="247" font-size="11" fill="#111827" text-anchor="start">2.2</text>
<text x="206" y="247" font-size="11" fill="#111827" text-anchor="start">2.3 训练基础设施</text>
<text x="317" y="247" font-size="11" fill="#111827" text-anchor="start">2.4 后训练</text>
<text x="381" y="247" font-size="11" fill="#111827" text-anchor="start">2.5 思考</text>
<text x="461" y="247" font-size="11" fill="#111827" text-anchor="start">2.6 分能力改进：代码、事实性、长上下文、音视频、Deep Research</text>
<text x="859" y="247" font-size="11" fill="#111827" text-anchor="start">2.7 通往 2.5 的实验型号</text>
<text x="75" y="322" font-size="11" fill="#6b7280" text-anchor="start">没有参数量、层数、专家数、注意力与词表，只有「稀疏 MoE Transformer」一句</text>
<text x="188" y="304" font-size="11" fill="#6b7280" text-anchor="start">2.2 数据：来源类别与知识截止日，没有 Token 总量与配比</text>
<text x="246" y="286" font-size="11" fill="#6b7280" text-anchor="start">给了可核对的数字：8960 芯片 Pod、每小时多次故障、93.4% 计算时间</text>
<text x="30" y="370" font-size="14" fill="#111827" text-anchor="start" font-weight="700">放大第 5 章：安全各小节的页数（约）</text>
<text x="55" y="405" font-size="11" fill="#111827" text-anchor="start">5.1–5.4 流程与训练</text>
<text x="183" y="405" font-size="11" fill="#111827" text-anchor="start">5.5 自动红队与提示注入</text>
<text x="347" y="405" font-size="11" fill="#111827" text-anchor="start">5.6 记忆化</text>
<text x="434" y="405" font-size="11" fill="#111827" text-anchor="start">5.7 保证性评测与前沿安全框架</text>
<text x="935" y="405" font-size="11" fill="#111827" text-anchor="start">5.8 外部测试</text>
<text x="30" y="456" font-size="13" fill="#6b7280" text-anchor="start">页码按 PDF 页序，据全文目录与各节起止页整理。两条放大条只表达量级：第 2 章按正文行数，第 5 章按起止页估算，图表所占篇幅未单独扣除。</text>
<text x="30" y="478" font-size="13" fill="#6b7280" text-anchor="start">第 5 章之外，附录 p.63–71 还有评测细则（Table 11）、宝可梦案例与前沿安全评测的正确性检查。</text>
