<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">DAC 的残差量化：九层按残差接力，每层先降到 8 维查表、再升回高维写回</text>
<text x="30" y="56" font-size="13" fill="#6b7280">绿 = 编码器 / 解码器所在的高维空间；紫 = 查表发生的低维空间；黄 = 写进 token 的整数编号。</text>
<rect x="16" y="76" width="1088" height="250" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36" y="102" font-size="14" fill="#111827" font-weight="700">一帧音频怎么变成 9 个编号</text>
<text x="36" y="120" font-size="11" fill="#6b7280">44.1 kHz 波形经编码器压 512 倍，每秒约 86 帧；每帧一个向量，逐层量化</text>
<rect x="36" y="146" width="140" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="106.0" y="173.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">编码器输出 z</text>
<text x="106.0" y="190.0" font-size="11" fill="#6b7280" text-anchor="middle">一帧一个向量</text>
<rect x="226" y="146" width="110" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="281.0" y="173.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">第 1 层</text>
<text x="281.0" y="190.0" font-size="11" fill="#6b7280" text-anchor="middle">10 bit 码本</text>
<rect x="366" y="146" width="110" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="421.0" y="173.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">第 2 层</text>
<text x="421.0" y="190.0" font-size="11" fill="#6b7280" text-anchor="middle">10 bit 码本</text>
<rect x="506" y="146" width="110" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="561.0" y="173.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">第 3 层</text>
<text x="561.0" y="190.0" font-size="11" fill="#6b7280" text-anchor="middle">10 bit 码本</text>
<text x="668" y="182" font-size="19" fill="#9ca3af" text-anchor="middle">…</text>
<rect x="716" y="146" width="110" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="771.0" y="173.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">第 9 层</text>
<text x="771.0" y="190.0" font-size="11" fill="#6b7280" text-anchor="middle">10 bit 码本</text>
<rect x="886" y="146" width="200" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="986.0" y="173.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">各层码字相加</text>
<text x="986.0" y="190.0" font-size="11" fill="#6b7280" text-anchor="middle">送进解码器还原波形</text>
<line x1="176" y1="176" x2="224" y2="176" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="336" y1="176" x2="364" y2="176" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="476" y1="176" x2="504" y2="176" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="616" y1="176" x2="644" y2="176" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="692" y1="176" x2="714" y2="176" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="826" y1="176" x2="884" y2="176" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="350" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">残差</text>
<text x="490" y="166" font-size="11" fill="#9ca3af" text-anchor="middle">残差</text>
<line x1="281" y1="206" x2="281" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="241" y="234" width="80" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="281.0" y="254.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">k1</text>
<line x1="421" y1="206" x2="421" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="381" y="234" width="80" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="421.0" y="254.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">k2</text>
<line x1="561" y1="206" x2="561" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="521" y="234" width="80" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="561.0" y="254.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">k3</text>
<line x1="771" y1="206" x2="771" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="731" y="234" width="80" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="771.0" y="254.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">k9</text>
<text x="560" y="284" font-size="11" fill="#6b7280" text-anchor="middle">每个编号取 0–1023，一帧 9 × 10 = 90 bit；前几层管粗结构，后几层补细节</text>
<path d="M226,296 L226,304 L616,304 L616,296" fill="none" stroke="#8f8bd8" stroke-width="1.4"/>
<text x="421" y="320" font-size="11" fill="#6b7280" text-anchor="middle">量化器 dropout：每个样本以 p = 0.5 的概率只用前 n 层（n 随机取 1–9）</text>
<rect x="16" y="342" width="1088" height="236" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36" y="368" font-size="14" fill="#111827" font-weight="700">放大其中一层：低维查表，高维写回（附录 A）</text>
<text x="36" y="386" font-size="11" fill="#6b7280">EnCodec 式 EMA 码本直接在高维里找最近邻，要靠 k-means 初始化和随机重启撑住利用率；这里两者都不用</text>
<rect x="36" y="410" width="132" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="102.0" y="437.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">输入残差 r</text>
<text x="102.0" y="454.0" font-size="11" fill="#6b7280" text-anchor="middle">高维</text>
<rect x="188" y="410" width="132" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="254.0" y="437.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">W_in 投影</text>
<text x="254.0" y="454.0" font-size="11" fill="#6b7280" text-anchor="middle">降到 8 维</text>
<line x1="168" y1="440" x2="186" y2="440" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="340" y="410" width="132" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="406.0" y="437.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">L2 归一化</text>
<text x="406.0" y="454.0" font-size="11" fill="#6b7280" text-anchor="middle">距离变余弦</text>
<line x1="320" y1="440" x2="338" y2="440" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="492" y="410" width="132" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="558.0" y="437.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">找最近码字</text>
<text x="558.0" y="454.0" font-size="11" fill="#6b7280" text-anchor="middle">1024 条里取 k</text>
<line x1="472" y1="440" x2="490" y2="440" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="644" y="410" width="132" height="60" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="710.0" y="437.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">取出码字</text>
<text x="710.0" y="454.0" font-size="11" fill="#6b7280" text-anchor="middle">8 维</text>
<line x1="624" y1="440" x2="642" y2="440" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="796" y="410" width="132" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="862.0" y="437.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">W_out 投影</text>
<text x="862.0" y="454.0" font-size="11" fill="#6b7280" text-anchor="middle">升回高维</text>
<line x1="776" y1="440" x2="794" y2="440" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="948" y="410" width="132" height="60" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="1014.0" y="437.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">本层重建</text>
<text x="1014.0" y="454.0" font-size="11" fill="#6b7280" text-anchor="middle">交给下一层</text>
<line x1="928" y1="440" x2="946" y2="440" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="558.0" y1="470" x2="558.0" y2="500" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="508" y="502" width="100" height="30" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="558.0" y="522.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">编号 k</text>
<text x="636" y="522" font-size="11" fill="#6b7280">这个整数就是写进 token 的那一格</text>
<text x="36" y="562" font-size="11" fill="#9ca3af">按 DAC 论文 §3、§3.2–3.3、§4.3 与附录 A（PDF p. 3–6、p. 14）重画的机制示意；8 维是 Table 2 里最好的查表维度，层数与码本大小取自 Table 1。</text>
</svg>