<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="470" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">119B 都要放在显存里，每个 token 只碰其中约 6B</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = 128 个路由专家；黄 = 1 个共享专家；绿 = 注意力（MLA）；灰 = 词嵌入与输出层；红 = 视觉编码器。按 params.json 的维度逐项相乘，本文算术。</text>
<rect x="16" y="72" width="1088" height="130" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36" y="96" font-size="14" fill="#111827" text-anchor="start" font-weight="700">全部参数：约 119.4B（每个 token 都不会全用，但权重都得常驻）</text>
<rect x="40.0" y="112" width="971.5" height="40" rx="0" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="1011.5" y="112" width="7.6" height="40" rx="0" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="1019.1" y="112" width="8.5" height="40" rx="0" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="1027.6" y="112" width="9.0" height="40" rx="0" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="1036.6" y="112" width="3.4" height="40" rx="0" fill="#fbe9e7" stroke="#d9877a"/>
<text x="525.7621440536013" y="137" font-size="11" fill="#111827" text-anchor="middle">路由专家 128 × 36 层 ≈ 116.0B（97%）</text>
<text x="1040" y="172" font-size="11" fill="#6b7280" text-anchor="end">右端细条：共享专家 0.9B、注意力 1.0B、词嵌入与输出层 1.1B、视觉编码器 0.4B</text>
<rect x="16" y="218" width="1088" height="210" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36" y="242" font-size="14" fill="#111827" text-anchor="start" font-weight="700">一个 token 实际经过的参数（横轴放大 12 倍）</text>
<rect x="40.0" y="262" width="363.8" height="40" rx="0" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="221.90954773869345" y="287" font-size="11" fill="#111827" text-anchor="middle">4 个路由专家 3.6B</text>
<rect x="403.8" y="262" width="91.5" height="40" rx="0" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="449.5477386934673" y="287" font-size="11" fill="#111827" text-anchor="middle">共享 0.9B</text>
<rect x="495.3" y="262" width="103.5" height="40" rx="0" fill="#e3f4ec" stroke="#5fa886"/>
<text x="547.0351758793969" y="287" font-size="11" fill="#111827" text-anchor="middle">注意力 1.0B</text>
<rect x="598.8" y="262" width="107.5" height="40" rx="0" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="652.5628140703517" y="287" font-size="11" fill="#111827" text-anchor="middle">嵌入与输出 1.1B</text>
<rect x="706.3" y="262" width="40.2" height="40" rx="0" fill="#fbe9e7" stroke="#d9877a"/>
<text x="726.43216080402" y="287" font-size="11" fill="#111827" text-anchor="middle"></text>
<line x1="598.8" y1="256" x2="598.8" y2="324" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="598.7939698492462" y="340" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">约 5.6B</text>
<text x="598.7939698492462" y="356" font-size="11" fill="#6b7280" text-anchor="middle">博客的「6B 激活」</text>
<line x1="706.3" y1="256" x2="706.3" y2="324" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="706.3316582914572" y="340" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">约 6.6B</text>
<text x="706.3316582914572" y="356" font-size="11" fill="#6b7280" text-anchor="middle">模型卡的「6.5B」</text>
<line x1="844.0" y1="256" x2="844.0" y2="324" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="844.0201005025125" y="340" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">8B</text>
<text x="844.0201005025125" y="356" font-size="11" fill="#6b7280" text-anchor="middle">博客「含词嵌入与输出层」</text>
<text x="726.3316582914572" y="252" font-size="11" fill="#6b7280" text-anchor="start">视觉 0.4B（仅图像输入时）</text>
<text x="36" y="414" font-size="11" fill="#6b7280" text-anchor="start">纯文本请求不经过视觉编码器；按配置算到 7.0B 为止，够不到博客写的 8B。</text>
<text x="30" y="454" font-size="11" fill="#9ca3af" text-anchor="start">维度取自官方权重仓 params.json（外部补充，不是博客原文）；专家为 SwiGLU 三个矩阵，视觉编码器按 24 层估算，路由器与归一化忽略不计。</text>
</svg>