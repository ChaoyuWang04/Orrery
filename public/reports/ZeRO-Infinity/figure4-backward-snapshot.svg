<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">ZeRO-Infinity 的一次反向：参数分片上来、拼齐、算完，梯度再分片卸回</text>
<text x="30" y="54" font-size="13" fill="#6b7280">按 PDF p. 6 图 4 重画：两层模型、4 个数据并行 rank，正在做第 0 层的反向。紫 = 参数 P；黄 = 梯度 G；绿 = 优化器状态 A；灰 = 慢存储。</text>
<rect x="250" y="74" width="840" height="96" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="270" y="94" font-size="11" fill="#9ca3af">GPU 之间的集合通信</text>
<rect x="290" y="104" width="360" height="52" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="690" y="104" width="380" height="52" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="470" y="126" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">② All-Gather：四块 P0 分片拼成完整 P0</text>
<text x="470" y="146" font-size="11" fill="#6b7280" text-anchor="middle">每张卡都拿到一整份第 0 层参数</text>
<text x="880" y="126" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">③ Reduce-Scatter：G0 求和后按块分回</text>
<text x="880" y="146" font-size="11" fill="#6b7280" text-anchor="middle">每张卡只留自己负责的那 1/4</text>
<text x="30" y="200" font-size="13" fill="#111827" font-weight="700">1× 数据移动</text>
<text x="30" y="216" font-size="11" fill="#6b7280">GPU ↔ GPU</text>
<text x="30" y="296" font-size="13" fill="#111827" font-weight="700">1/DP 数据移动</text>
<text x="30" y="312" font-size="11" fill="#6b7280">每卡只走自己的 PCIe</text>
<text x="30" y="350" font-size="11" fill="#6b7280">每层的 P、G、A</text>
<text x="30" y="366" font-size="11" fill="#6b7280">都切成 4 份，</text>
<text x="30" y="382" font-size="11" fill="#6b7280">第 r 份只归 rank r</text>
<rect x="250" y="222" width="180" height="46" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
