<text x="36" y="482" font-size="13" fill="#6b7280">① 每个 rank 只把自己那 1/4 的 P0 从慢存储经自己的 PCIe 搬上 GPU；四条链路同时在搬（PDF p. 8 带宽中心分区）。</text>
<text x="36" y="504" font-size="13" fill="#6b7280">④ 反向后，每张卡把自己那 1/4 的梯度 G0 卸回慢存储。第 1 层此时还躺在慢存储里，等预取器按顺序把它请上来。</text>
<text x="36" y="526" font-size="13" fill="#6b7280">A（优化器状态）这一步不动：全部梯度到齐后，才按 CPU 放得下的块从 NVMe 搬上来更新（PDF p. 7）。</text>
