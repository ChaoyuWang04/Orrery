<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="860" height="500" fill="#ffffff"/>
<text x="20" y="32" font-size="19" font-weight="700" fill="#111827">IGPO 的回合奖励怎样落到每一回合</text>
<text x="20" y="54" font-size="13" fill="#6b7280">一条虚构的 7 回合轨迹。黄 = 搜索回合；绿 = 浏览回合及其信息增益；红 = 格式错的回合与它挨的惩罚；紫 = 交卷与结果奖励。</text>
<text x="20" y="95" font-size="14" font-weight="700" fill="#111827">① 回合动作</text>
<rect x="140" y="80" width="90" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="185.0" y="102.0" font-size="11" text-anchor="middle" fill="#111827">1 搜索</text>
<rect x="240" y="80" width="90" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="285.0" y="102.0" font-size="11" text-anchor="middle" fill="#111827">2 搜索</text>
<rect x="340" y="80" width="90" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="385.0" y="102.0" font-size="11" text-anchor="middle" fill="#111827">3 浏览</text>
<rect x="440" y="80" width="90" height="36" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="485.0" y="95" font-size="11" text-anchor="middle" fill="#111827">4 搜索</text>
<text x="485.0" y="109" font-size="11" text-anchor="middle" fill="#6b7280">格式错</text>
<rect x="540" y="80" width="90" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="585.0" y="102.0" font-size="11" text-anchor="middle" fill="#111827">5 搜索</text>
<rect x="640" y="80" width="90" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="685.0" y="102.0" font-size="11" text-anchor="middle" fill="#111827">6 浏览</text>
<rect x="740" y="80" width="90" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="785.0" y="102.0" font-size="11" text-anchor="middle" fill="#111827">7 交卷</text>
<text x="20" y="185" font-size="14" font-weight="700" fill="#111827">② 原始奖励</text>
<text x="20" y="201" font-size="11" fill="#6b7280">式 (3)(4)</text>
<rect x="140" y="170" width="90" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="185.0" y="185" font-size="11" text-anchor="middle" fill="#111827">IG₃</text>
<text x="185.0" y="199" font-size="11" text-anchor="middle" fill="#6b7280">回填</text>
<rect x="240" y="170" width="90" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="285.0" y="185" font-size="11" text-anchor="middle" fill="#111827">IG₃</text>
<text x="285.0" y="199" font-size="11" text-anchor="middle" fill="#6b7280">回填</text>
<rect x="340" y="170" width="90" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="385.0" y="185" font-size="11" text-anchor="middle" fill="#111827">IG₃</text>
<text x="385.0" y="199" font-size="11" text-anchor="middle" fill="#6b7280">在此计算</text>
<rect x="440" y="170" width="90" height="36" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="485.0" y="185" font-size="11" text-anchor="middle" fill="#111827">−λ_fmt</text>
<text x="485.0" y="199" font-size="11" text-anchor="middle" fill="#6b7280">覆盖 IG₆</text>
<rect x="540" y="170" width="90" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="585.0" y="185" font-size="11" text-anchor="middle" fill="#111827">IG₆</text>
<text x="585.0" y="199" font-size="11" text-anchor="middle" fill="#6b7280">回填</text>
<rect x="640" y="170" width="90" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="685.0" y="185" font-size="11" text-anchor="middle" fill="#111827">IG₆</text>
<text x="685.0" y="199" font-size="11" text-anchor="middle" fill="#6b7280">在此计算</text>
<rect x="740" y="170" width="90" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="785.0" y="192.0" font-size="11" text-anchor="middle" fill="#111827">结果奖励 rᴼ</text>
<path d="M385.0,168 Q335.0,136 291.0,166" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M385.0,168 Q285.0,136 191.0,166" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M685.0,168 Q635.0,136 591.0,166" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M685.0,168 Q585.0,136 491.0,166" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="140" y="224" font-size="11" fill="#6b7280">IG = 看完这回合后，模型给标准答案 g 的平均对数概率升了多少；只在浏览回合算，再分给上次浏览以来的搜索回合。</text>
<text x="20" y="275" font-size="14" font-weight="700" fill="#111827">③ 组内标准化</text>
<text x="20" y="291" font-size="11" fill="#6b7280">式 (5)–(8)</text>
<rect x="140" y="260" width="90" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="185.0" y="282.0" font-size="11" text-anchor="middle" fill="#111827">s × z(·)</text>
<rect x="240" y="260" width="90" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="285.0" y="282.0" font-size="11" text-anchor="middle" fill="#111827">s × z(·)</text>
<rect x="340" y="260" width="90" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="385.0" y="282.0" font-size="11" text-anchor="middle" fill="#111827">s × z(·)</text>
<rect x="440" y="260" width="90" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="485.0" y="282.0" font-size="11" text-anchor="middle" fill="#111827">s × z(·)</text>
<rect x="540" y="260" width="90" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="585.0" y="282.0" font-size="11" text-anchor="middle" fill="#111827">s × z(·)</text>
<rect x="640" y="260" width="90" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="685.0" y="282.0" font-size="11" text-anchor="middle" fill="#111827">s × z(·)</text>
<rect x="740" y="260" width="90" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="785.0" y="282.0" font-size="11" text-anchor="middle" fill="#111827">z(rᴼ)</text>
<text x="140" y="314" font-size="11" fill="#6b7280">非终点与终点各用一套组内均值方差；IG-Scale 的 s 只乘非终点，s = min(max(Mᴼ, 0.3) / Mᴵᴳ, 10)。</text>
<text x="20" y="365" font-size="14" font-weight="700" fill="#111827">④ 折扣回传</text>
<text x="20" y="381" font-size="11" fill="#6b7280">式 (9)</text>
<rect x="140" y="350" width="90" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="185.0" y="372.0" font-size="11" text-anchor="middle" fill="#111827">R̃₁</text>
<rect x="240" y="350" width="90" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="285.0" y="372.0" font-size="11" text-anchor="middle" fill="#111827">R̃₂</text>
<rect x="340" y="350" width="90" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="385.0" y="372.0" font-size="11" text-anchor="middle" fill="#111827">R̃₃</text>
<rect x="440" y="350" width="90" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="485.0" y="372.0" font-size="11" text-anchor="middle" fill="#111827">R̃₄</text>
<rect x="540" y="350" width="90" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="585.0" y="372.0" font-size="11" text-anchor="middle" fill="#111827">R̃₅</text>
<rect x="640" y="350" width="90" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="685.0" y="372.0" font-size="11" text-anchor="middle" fill="#111827">R̃₆</text>
<rect x="740" y="350" width="90" height="36" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="785.0" y="372.0" font-size="11" text-anchor="middle" fill="#111827">R̃₇</text>
<line x1="830" y1="402" x2="144" y2="402" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="140" y="422" font-size="11" fill="#6b7280">R̃ₜ 从后往前累加 γ 折扣后的奖励（γ = 0.95），赋给第 t 回合的全部助手 token；观察只留在前缀里，不进目标。</text>
<text x="20" y="446" font-size="11" fill="#9ca3af">据 PDF p. 5–8 式 (2)–(10) 重画的机制示意；轨迹是示例，不是论文里的真实 rollout。</text>
</svg>