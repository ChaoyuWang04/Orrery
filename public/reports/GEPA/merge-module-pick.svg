<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">Merge 按模块挑版本：哪一边离开了祖先，就用哪一边</text>
<text x="30" y="58" font-size="13" fill="#6b7280">三行是同一棵家族树上的共同祖先 a 与两个后代 i、j，四列是系统里的四个模块（个数为示意）。灰 = 与祖先相同；紫 = i 改过；黄 = j 改过；绿 = 合并结果。</text>
<text x="30" y="78" font-size="13" fill="#6b7280">据附录 D.1 的 Algorithm 3–4（PDF p. 23–24）重画，是机制示意，不含实测数据。</text>
<text x="360.0" y="116" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">模块 1</text>
<text x="560.0" y="116" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">模块 2</text>
<text x="760.0" y="116" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">模块 3</text>
<text x="960.0" y="116" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">模块 4</text>
<text x="40" y="164" font-size="14" fill="#111827" font-weight="700">祖先 a</text>
<text x="40" y="182" font-size="11" fill="#6b7280">各模块的原版本</text>
<rect x="270" y="140" width="180" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="360.0" y="172" font-size="14" fill="#111827" text-anchor="middle">祖先版</text>
<rect x="470" y="140" width="180" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="560.0" y="172" font-size="14" fill="#111827" text-anchor="middle">祖先版</text>
<rect x="670" y="140" width="180" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="760.0" y="172" font-size="14" fill="#111827" text-anchor="middle">祖先版</text>
<rect x="870" y="140" width="180" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="960.0" y="172" font-size="14" fill="#111827" text-anchor="middle">祖先版</text>
<text x="40" y="234" font-size="14" fill="#111827" font-weight="700">后代 i</text>
<text x="40" y="252" font-size="11" fill="#6b7280">均分 S[i]</text>
<rect x="270" y="210" width="180" height="54" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="360.0" y="242" font-size="14" fill="#111827" text-anchor="middle">改过</text>
<rect x="470" y="210" width="180" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="560.0" y="242" font-size="14" fill="#111827" text-anchor="middle">同祖先</text>
<rect x="670" y="210" width="180" height="54" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="760.0" y="242" font-size="14" fill="#111827" text-anchor="middle">改过（i 版）</text>
<rect x="870" y="210" width="180" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="960.0" y="242" font-size="14" fill="#111827" text-anchor="middle">同祖先</text>
<text x="40" y="304" font-size="14" fill="#111827" font-weight="700">后代 j</text>
<text x="40" y="322" font-size="11" fill="#6b7280">均分 S[j]，比 S[i] 高</text>
<rect x="270" y="280" width="180" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="360.0" y="312" font-size="14" fill="#111827" text-anchor="middle">同祖先</text>
<rect x="470" y="280" width="180" height="54" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="560.0" y="312" font-size="14" fill="#111827" text-anchor="middle">改过</text>
<rect x="670" y="280" width="180" height="54" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="760.0" y="312" font-size="14" fill="#111827" text-anchor="middle">改过（j 版）</text>
<rect x="870" y="280" width="180" height="54" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="960.0" y="312" font-size="14" fill="#111827" text-anchor="middle">同祖先</text>
<text x="40" y="414" font-size="14" fill="#111827" font-weight="700">合并结果 Φ′</text>
<text x="40" y="432" font-size="11" fill="#6b7280">从 a 的副本出发逐模块替换</text>
<rect x="270" y="390" width="180" height="54" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="360.0" y="422" font-size="14" fill="#111827" text-anchor="middle">用 i 的版本</text>
<rect x="470" y="390" width="180" height="54" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="560.0" y="422" font-size="14" fill="#111827" text-anchor="middle">用 j 的版本</text>
<rect x="670" y="390" width="180" height="54" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="760.0" y="422" font-size="14" fill="#111827" text-anchor="middle">用均分高者：j</text>
<rect x="870" y="390" width="180" height="54" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="960.0" y="422" font-size="14" fill="#111827" text-anchor="middle">默认 i（= 祖先版）</text>
<line x1="360.0" y1="338" x2="360.0" y2="384" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="560.0" y1="338" x2="560.0" y2="384" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="760.0" y1="338" x2="760.0" y2="384" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="960.0" y1="338" x2="960.0" y2="384" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="368.0" y="365" font-size="11" fill="#9ca3af">一边改、一边没改</text>
<text x="568.0" y="365" font-size="11" fill="#9ca3af">一边改、一边没改</text>
<text x="768.0" y="365" font-size="11" fill="#9ca3af">两边都改且互不相同</text>
<text x="968.0" y="365" font-size="11" fill="#9ca3af">两边都没改</text>
<rect x="40" y="470" width="1040" height="104" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="60" y="496" font-size="14" fill="#111827" font-weight="700">合并之前先过的门槛（Algorithm 4 第 4–16 行与 Algorithm 3）</text>
<text x="60" y="518" font-size="11" fill="#6b7280">1. i 与 j 互不为祖先；从两者的共同祖先里逐个试 a，同一组 (i, j, a) 只试一次。</text>
<text x="60" y="538" font-size="11" fill="#6b7280">2. 祖先的均分不能高于 i、j 中较低的那个：两个后代都得相对祖先有进步。</text>
<text x="60" y="558" font-size="11" fill="#6b7280">3. 至少有一个模块是「一边改、一边没改」（DESIRABLE），否则两条血缘学的不是互补的东西。实验里 Merge 最多触发 5 次（PDF p. 27）。</text>
</svg>