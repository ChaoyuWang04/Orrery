<text x="30" y="428" font-size="13" fill="#6b7280">据 PDF p. 5 Figure 3 与 p. 5–6、p. 15–17 正文重画。专家名单按正文（p. 6）；原图画了 7 个专家框，多一个 Instruction-Following，</text>
<text x="30" y="452" font-size="13" fill="#6b7280">并把 Math 写作 Math &amp; Reasoning、RAG 写作 RAG, Tool Use &amp; Agents。所有专家都从同一个 Instruct 模型初始化（p. 16）。</text>
<text x="30" y="476" font-size="13" fill="#6b7280">RL 阶段按领域选算法：数学与代码用可验证奖励，安全与多语言用偏好对（p. 6）。合并只花很少算力，每次合并后的评测才是瓶颈（p. 17）。</text>
