<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">RoC：每题先采 32 条，答对的挑干净的一半，答错的原样抽一半</text>
<text x="30" y="54" font-size="13" fill="#6b7280">每个方块是一条多轮轨迹。绿 = 答对且没有工具错误；黄 = 答对但含工具错误或多余的 answer 标签；红 = 答错。虚线空心 = 被下采样丢掉。</text>
<text x="36" y="96" font-size="14" fill="#111827" font-weight="700">① 旧策略对同一道题过采样 2G = 32 条（生成顺序）</text>
<text x="1084" y="96" font-size="11" fill="#6b7280" text-anchor="end">示例：20 条答对（12 绿、8 黄），12 条答错</text>
<text x="36" y="224" font-size="14" fill="#111827" font-weight="700">② 正例 20 条：按 p_total 反比的概率抽 10 条</text>
<text x="36" y="242" font-size="11" fill="#6b7280">p_total = 工具错误率 p_err + 格式罚分 p_format；不调工具的轨迹 p_err 记 0.5</text>
<text x="36" y="320" font-size="11" fill="#6b7280">左边罚分低、右边罚分高（按罚分排好只为看得清）</text>
<text x="36" y="338" font-size="11" fill="#6b7280">是概率偏好不是硬截断：脏的仍可能被抽中</text>
<text x="716" y="224" font-size="14" fill="#111827" font-weight="700">② 负例 12 条：不打分，均匀抽 6 条</text>
<text x="716" y="242" font-size="11" fill="#6b7280">保住失败模式的多样性</text>
<text x="716" y="320" font-size="11" fill="#6b7280">被截断的超长轨迹按答错处理，也在这一侧</text>
<text x="36" y="410" font-size="14" fill="#111827" font-weight="700">③ 进入这次更新的 G = 16 条：10 条答对 + 6 条答错</text>
<text x="36" y="428" font-size="11" fill="#6b7280">在这 16 条上做组内标准化算优势，再按 Clip-Higher（0.2 / 0.28）更新</text>
<text x="552" y="458" font-size="14" fill="#111827" font-weight="700">答对占比 20/32 = 10/16</text>
<text x="552" y="476" font-size="11" fill="#6b7280">正负比例不变，全对或全错的题仍然全对或全错；变的只是「哪几条答对的」</text>
<text x="30" y="526" font-size="11" fill="#9ca3af">机制示意，依据 rStar2-Agent 第 2.2.3 节与式 4–7（PDF p. 7–8）与第 4.3 节 2G = 32、G = 16（PDF p. 12）；答对答错的条数与被抽中的位置是虚构的。</text>
<text x="30" y="544" font-size="11" fill="#9ca3af">答错一侧论文写的是取 ⌊|O_neg|/2⌋ 条；奇数时余数落在哪一侧，论文没写。</text>
</svg>