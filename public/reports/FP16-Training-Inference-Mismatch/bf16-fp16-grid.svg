<text x="30" y="428" font-size="13" fill="#6b7280">论文的说法：尾数多 3 位，精度高 8 倍（2^10 对 2^7）；多出的精度像一块缓冲，吸收两台引擎的实现差异，</text>
<text x="30" y="450" font-size="13" fill="#6b7280">不让舍入沿自回归序列累积成策略分叉（PDF p. 6）。示意里的「圆整」只演示格距的作用，不代表具体算子。</text>
