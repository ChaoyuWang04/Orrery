<text x="56.0" y="388.0" font-size="12" fill="#111827" text-anchor="start">现有系统 · 请求 B：整段预留 512 槽，已写入 4 槽</text>
<text x="56.0" y="454.0" font-size="12" fill="#111827" text-anchor="start">vLLM · 请求 A：按需拿 3 个 4 槽的块（Figure 6 的块大小），空位只在最后一块里</text>
<text x="56.0" y="520.0" font-size="12" fill="#6b7280" text-anchor="start">左端那一丝绿色就是真正存了东西的部分。Orca 类系统里只有 20.4%–38.2% 的 KV 显存装着真实 Token，vLLM 是 96.3%（PDF p.2 Figure 2）。</text>
