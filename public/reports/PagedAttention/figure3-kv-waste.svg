<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">黄 = 提示词的 KV，绿 = 已生成 / 本步生成的 KV，紫 = 预留（以后会用），红 = 内部碎片（永远不用），灰 = 外部碎片。</text>
