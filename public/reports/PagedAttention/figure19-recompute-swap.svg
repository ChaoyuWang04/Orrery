<text x="640.0" y="120.0" font-size="11" fill="#6b7280" text-anchor="start">纵轴：归一化延迟（s/token）；红 = 换出</text>
<text x="904.8" y="144.0" font-size="11" fill="#9ca3af" text-anchor="middle">16–64</text>
<text x="30.0" y="440.0" font-size="12" fill="#6b7280" text-anchor="start">读自 PDF p.13 Figure 19，线为读图近似。(a) 块小时换出变成大量小块 CPU↔GPU 传输，吃不满 PCIe 带宽；重算不碰 KV 块，开销与块大小无关。</text>
<text x="30.0" y="462.0" font-size="12" fill="#6b7280" text-anchor="start">块到 256 时重算约 39 ms、换出约 33 ms，重算约慢两成：原文「重算开销从不超过换出延迟的 20%」只能读成「最多比换出慢 20%」。</text>
<text x="30.0" y="484.0" font-size="12" fill="#6b7280" text-anchor="start">(b) 原文结论：块大小 16–64 时两者端到端相当。两端抬头与 Figure 18b 的块大小曲线同形，原文没有单独解释这张子图的两端。</text>
