<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 19：块小时换出很贵，块大时重算反而略慢</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">绿 = 重算，红 = 换出再换回（swap in + out），黄虚线 = 只换入，紫虚线 = 只换出。横轴是块大小（对数刻度）。</text>
