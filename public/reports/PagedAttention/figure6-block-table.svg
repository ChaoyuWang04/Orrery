<text x="56.0" y="420.0" font-size="12" fill="#6b7280" text-anchor="start">① 提示词阶段：7 个 Token 只需要 2 个逻辑块，映射到物理块 7 和 1；前 4 个进块 0，后 3 个进块 1，留 1 个空位。这一步用常规注意力算子算。</text>
<text x="56.0" y="444.0" font-size="12" fill="#6b7280" text-anchor="start">② 第一次解码：新 Token「fathers」正好落进块 1 的空位，块表只把已填数从 3 改成 4，不分配新块。</text>
<text x="56.0" y="468.0" font-size="12" fill="#6b7280" text-anchor="start">③ 第二次解码：块 1 已满，开逻辑块 2，从空闲池拿物理块 3，把映射写进块表。</text>
<text x="56.0" y="500.0" font-size="12" fill="#6b7280" text-anchor="start">块总是从左往右填满才开新块，所以一个请求的浪费封顶在最后一块之内。按 PDF p.6 Figure 6 与 §4.3 重画，块号和已填数取自原图，是机制示意。</text>
