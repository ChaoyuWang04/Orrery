<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 6：逻辑块连续，物理块散放，中间只隔一张块表</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">黄 = 提示词 Token 的 KV，绿 = 生成 Token 的 KV，白 = 空槽。块大小取原图的 4；①②③ 是下方三步各自改动的位置。</text>
