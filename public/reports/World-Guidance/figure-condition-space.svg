<rect x="650" y="126" width="194" height="30" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="702.0" y="130" width="90" height="22" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
