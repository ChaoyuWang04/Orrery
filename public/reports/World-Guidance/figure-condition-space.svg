<rect x="1000" y="86" width="44" height="26" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="1022.0" y="103" font-size="11" fill="#111827" text-anchor="middle">16</text>
<text x="30" y="146" font-size="13" fill="#6b7280">均匀采 4 帧未来观测</text>
<rect x="250" y="126" width="194" height="30" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="302.0" y="130" width="90" height="22" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="347.0" y="145" font-size="11" fill="#111827" text-anchor="middle">未来帧 1</text>
<rect x="450" y="126" width="194" height="30" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="502.0" y="130" width="90" height="22" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
