<text x="772.0" y="103" font-size="11" fill="#111827" text-anchor="middle">11</text>
<rect x="800" y="86" width="44" height="26" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="822.0" y="103" font-size="11" fill="#111827" text-anchor="middle">12</text>
<rect x="850" y="86" width="44" height="26" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="872.0" y="103" font-size="11" fill="#111827" text-anchor="middle">13</text>
