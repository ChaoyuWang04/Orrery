<rect x="550" y="86" width="44" height="26" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="572.0" y="103" font-size="11" fill="#111827" text-anchor="middle">7</text>
<rect x="600" y="86" width="44" height="26" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="622.0" y="103" font-size="11" fill="#111827" text-anchor="middle">8</text>
