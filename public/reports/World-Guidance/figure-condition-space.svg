<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" width="1120" height="610" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="1120" height="610" fill="#ffffff"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">条件空间的形状：16 步动作、4 帧未来、16 × 32 的条件</text>
<text x="30" y="58" font-size="13" fill="#6b7280">黄 = 未来观测与冻结的视觉模型；紫 = 可学习的查询；绿 = 条件 Oᶜ；灰 = VLM 与动作头。箭头是数据流向。</text>
<text x="30" y="104" font-size="13" fill="#6b7280">预测地平线：16 步动作</text>
<rect x="250" y="86" width="44" height="26" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
