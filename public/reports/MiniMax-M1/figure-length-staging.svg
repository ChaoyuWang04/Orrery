<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">从 40K 到 80K：每一档窗口都要等两个信号，再防一次后段崩坏</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = 生成长度窗口；绿 = 升档判据；红 = 每档后期出现的崩坏链；黄 = 对应的三项修复。</text>
<rect x="20" y="72" width="1080" height="210" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="40" y="98" font-size="14" fill="#111827" text-anchor="start" font-weight="700">(a) 窗口分六档逐步放大，不是一步拉到 80K</text>
<rect x="50" y="210.0" width="105" height="40.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="102" y="202.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">40K</text>
<line x1="157" y1="230.0" x2="173" y2="230.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="175" y="189.2" width="105" height="60.8" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="227" y="181.2" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">48K</text>
<line x1="282" y1="219.6" x2="298" y2="219.6" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="300" y="168.4" width="105" height="81.6" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="352" y="160.4" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">56K</text>
<line x1="407" y1="209.2" x2="423" y2="209.2" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="425" y="147.6" width="105" height="102.4" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="477" y="139.6" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">64K</text>
<line x1="532" y1="198.8" x2="548" y2="198.8" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="550" y="126.8" width="105" height="123.2" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="602" y="118.8" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">72K</text>
<line x1="657" y1="188.4" x2="673" y2="188.4" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="675" y="106.0" width="105" height="144.0" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="727" y="98.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">80K</text>
<rect x="820" y="116" width="260" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="950.0" y="141.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">升档判据一</text>
<text x="950.0" y="159.0" font-size="11" fill="#6b7280" text-anchor="middle">生成序列的困惑度已收敛</text>
<rect x="820" y="184" width="260" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="950.0" y="209.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">升档判据二</text>
<text x="950.0" y="227.0" font-size="11" fill="#6b7280" text-anchor="middle">输出长度的 P99 逼近当前窗口</text>
<rect x="20" y="300" width="1080" height="250" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="40" y="326" font-size="14" fill="#111827" text-anchor="start" font-weight="700">(b) 每一档训练后期：负样本先撞墙，序列后段被负梯度淹没</text>
<rect x="40" y="344" width="320" height="60" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="200.0" y="371.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">负样本变长更快</text>
<text x="200.0" y="389.0" font-size="11" fill="#6b7280" text-anchor="middle">比正样本更早撞到窗口上限</text>
<line x1="362" y1="374" x2="396" y2="374" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="400" y="344" width="320" height="60" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="560.0" y="371.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">负梯度堆在序列后段</text>
<text x="560.0" y="389.0" font-size="11" fill="#6b7280" text-anchor="middle">token 级损失 + GRPO 式优势归一化放大不对称</text>
<line x1="722" y1="374" x2="756" y2="374" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="760" y="344" width="320" height="60" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="920.0" y="371.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">模式崩坏</text>
<text x="920.0" y="389.0" font-size="11" fill="#6b7280" text-anchor="middle">后段变成乱码，困惑度同时上升</text>
<rect x="40" y="444" width="320" height="60" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="200.0" y="471.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">修复一：重复检测提前截断</text>
<text x="200.0" y="489.0" font-size="11" fill="#6b7280" text-anchor="middle">连续高概率 Token 即停，别让重复占满窗口</text>
<rect x="400" y="444" width="320" height="60" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="560.0" y="471.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">修复二：样本级损失 + token 级归一化</text>
<text x="560.0" y="489.0" font-size="11" fill="#6b7280" text-anchor="middle">缓和正负样本的不平衡</text>
<rect x="760" y="444" width="320" height="60" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="920.0" y="471.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">修复三：调小梯度裁剪阈值与 ε_high</text>
<text x="920.0" y="489.0" font-size="11" fill="#6b7280" text-anchor="middle">进一步稳住生成</text>
<line x1="560" y1="406" x2="560" y2="440" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="30" y="580" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 11–12 第 5 节重画，是流程示意，横向间距不代表训练步数。报告没给每一档训练了多少步，也没给 ε_high 与梯度裁剪的具体值。</text>
<text x="30" y="604" font-size="13" fill="#6b7280" text-anchor="start">数据也换过：用 40K 模型筛掉容易的题，偏向难的数学和代码，合成推理数据下采样，因为它让长输出重复、同质（PDF p. 12）。</text>
</svg>
