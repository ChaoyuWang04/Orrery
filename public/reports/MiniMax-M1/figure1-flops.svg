<text x="30" y="504" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 1 Figure 1（右）读数重画：原图每 8K 一个点，这里用读数拟合的平滑曲线，数值误差约 ±0.1。报告正文的口径是 64K 时不到 R1 的 50%、100K 时约 25%（PDF p. 2）。</text>
<text x="30" y="528" font-size="13" fill="#6b7280" text-anchor="start">这是按模型结构算出来的理论 FLOPs，不是实测延迟。生成很短时三条线几乎重合，拉开差距的是注意力里随长度平方增长的那一项。</text>
