<rect x="320" y="340" width="200" height="144" rx="2" fill="none" stroke="#b9b9b9"/>
<text x="320" y="502" font-size="11" fill="#9ca3af" text-anchor="start">低质量</text>
<text x="520" y="502" font-size="11" fill="#9ca3af" text-anchor="end">高质量</text>
<text x="312" y="352" font-size="11" fill="#9ca3af" text-anchor="end">主题 1</text>
<text x="312" y="482" font-size="11" fill="#9ca3af" text-anchor="end">主题 24</text>
<text x="560" y="350" font-size="14" fill="#111827" text-anchor="start" font-weight="700">每一行是一个主题：Olmix 定这一行一共取多少 token（行约束）</text>
<text x="560" y="372" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">小模型蜂群 + 逐任务回归，求平均 BPB 最低的配比；任何域重复不超过约 4–7 次</text>
<text x="560" y="402" font-size="14" fill="#111827" text-anchor="start" font-weight="700">每一列是一个 5% 质量档：行内按质量上采样（列约束）</text>
<text x="560" y="424" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">最低 40% 丢弃，越高质量的档重复越多，单档平均不超过 7 次</text>
<text x="560" y="454" font-size="14" fill="#111827" text-anchor="start" font-weight="700">两种约束用截断幂指数函数族合在一起</text>
<text x="560" y="476" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">网页最终进入训练混合 4.51T token，占 5.93T 的 76.1%</text>
<text x="30" y="548" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 14 Table 4、p. 15–20、p. 87–90 重画。正文与附录的中间数略有出入（38.8B 与 38.7B、12.8B 与 12.7B、23% 与 24%），这里取正文去重一节的口径。</text>
<text x="30" y="568" font-size="13" fill="#6b7280" text-anchor="start">格子只示意行列结构与上采样的方向，颜色深浅不是实测倍数。</text>
</svg>
