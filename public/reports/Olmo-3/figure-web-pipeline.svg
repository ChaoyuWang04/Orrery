<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="580" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">网页数据先洗到几乎不重复，再按主题与质量把重复有选择地加回来</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">灰条 = 剩余文档数（按长度线性缩放）；下方格子：灰 = 丢弃的低质量档，绿 = 保留，绿越深重复次数越多。</text>
<text x="40" y="105" font-size="14" fill="#111827" text-anchor="start" font-weight="700">CommonCrawl 104 个 dump</text>
<rect x="320" y="86" width="500.0" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="832.0" y="105" font-size="13" fill="#6b7280" text-anchor="start">252.6B 文档</text>
<text x="40" y="151" font-size="14" fill="#111827" text-anchor="start" font-weight="700">启发式过滤</text>
<rect x="320" y="132" width="76.6" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="408.6" y="151" font-size="13" fill="#6b7280" text-anchor="start">38.7B，去掉约 85%</text>
<text x="40" y="197" font-size="14" fill="#111827" text-anchor="start" font-weight="700">精确去重（文本哈希）</text>
<rect x="320" y="178" width="25.3" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="357.3" y="197" font-size="13" fill="#6b7280" text-anchor="start">12.8B，再去 67%</text>
<text x="40" y="243" font-size="14" fill="#111827" text-anchor="start" font-weight="700">MinHash 模糊去重</text>
<rect x="320" y="224" width="19.4" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="351.4" y="243" font-size="13" fill="#6b7280" text-anchor="start">9.8B，再去 23%</text>
<text x="40" y="289" font-size="14" fill="#111827" text-anchor="start" font-weight="700">后缀数组子串去重</text>
<rect x="320" y="270" width="19.2" height="28" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="351.2" y="289" font-size="13" fill="#6b7280" text-anchor="start">9.7B 文档、36.5T 字节，删 14% 字节</text>
<text x="40" y="358" font-size="14" fill="#111827" text-anchor="start" font-weight="700">24 个主题 × 20 个质量档</text>
<text x="40" y="378" font-size="11" fill="#6b7280" text-anchor="start">= 480 个互不相交的桶，约 8T token</text>
