<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="540" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Olmo 3 的模型流：基座三段，后训练分出三个变体</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">黄 = 基座训练阶段；灰 = 基座产物；紫 = Think 线；绿 = Instruct 线；红 = RL-Zero 线。每一格的中间 checkpoint 与数据都公开。</text>
<rect x="40" y="80" width="250" height="84" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="165" y="108" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">阶段一 预训练</text>
<text x="165" y="130" font-size="11" fill="#6b7280" text-anchor="middle">Dolma 3 Mix，5.93T token</text>
<text x="165" y="148" font-size="11" fill="#6b7280" text-anchor="middle">上下文 8K；32B 截在 5.5T</text>
<rect x="320" y="80" width="250" height="84" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="445" y="108" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">阶段二 中训练</text>
<text x="445" y="130" font-size="11" fill="#6b7280" text-anchor="middle">Dolma 3 Dolmino Mix，100B token</text>
<text x="445" y="148" font-size="11" fill="#6b7280" text-anchor="middle">32B 换种子跑两次，再权重平均</text>
<rect x="600" y="80" width="250" height="84" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="725" y="108" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">阶段三 长上下文扩展</text>
<text x="725" y="130" font-size="11" fill="#6b7280" text-anchor="middle">Dolma 3 Longmino Mix</text>
<text x="725" y="148" font-size="11" fill="#6b7280" text-anchor="middle">7B 用 50B、32B 用 100B；8K 到 65K</text>
<rect x="880" y="80" width="200" height="84" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="980" y="112" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Olmo 3 Base</text>
<text x="980" y="136" font-size="11" fill="#6b7280" text-anchor="middle">7B / 32B，稠密 Transformer</text>
<line x1="290" y1="122" x2="318" y2="122" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="570" y1="122" x2="598" y2="122" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="850" y1="122" x2="878" y2="122" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="980,164 980,200 60,200 60,262 98,262" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="60,262 60,452 578,452" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="100" y="234" width="200" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="200" y="258" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Think SFT</text>
<text x="200" y="278" font-size="11" fill="#6b7280" text-anchor="middle">约 227 万条提示，带思考链</text>
<rect x="340" y="234" width="200" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="440" y="258" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Think DPO</text>
<text x="440" y="278" font-size="11" fill="#6b7280" text-anchor="middle">Delta Learning，15 万–20 万对</text>
<rect x="580" y="234" width="200" height="56" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="680" y="258" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Think RLVR</text>
<text x="680" y="278" font-size="11" fill="#6b7280" text-anchor="middle">OlmoRL，约 10.5 万条提示</text>
<line x1="300" y1="262" x2="338" y2="262" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="540" y1="262" x2="578" y2="262" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="780" y1="262" x2="818" y2="262" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="826" y="258" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Olmo 3 Think 7B / 32B</text>
<text x="826" y="278" font-size="11" fill="#6b7280" text-anchor="start">3.1 Think 32B：同一次 RL 续跑到 2300 步</text>
<line x1="200" y1="290" x2="200" y2="330" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="210" y="316" font-size="11" fill="#9ca3af" text-anchor="start">热启动</text>
<rect x="100" y="332" width="200" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="200" y="356" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Instruct SFT</text>
<text x="200" y="376" font-size="11" fill="#6b7280" text-anchor="middle">约 215 万条，含函数调用</text>
<rect x="340" y="332" width="200" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="440" y="356" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Instruct DPO</text>
<text x="440" y="376" font-size="11" fill="#6b7280" text-anchor="middle">两路偏好信号 + 长度控制</text>
<rect x="580" y="332" width="200" height="56" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="680" y="356" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Instruct RLVR</text>
<text x="680" y="376" font-size="11" fill="#6b7280" text-anchor="middle">回复上限 7B 8K、32B 16K</text>
<line x1="300" y1="360" x2="338" y2="360" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="540" y1="360" x2="578" y2="360" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="780" y1="360" x2="818" y2="360" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="826" y="356" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Olmo 3 Instruct 7B</text>
<text x="826" y="376" font-size="11" fill="#6b7280" text-anchor="start">32B 只以 3.1 Instruct 32B 发布</text>
<rect x="580" y="424" width="200" height="56" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="680" y="448" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">RL-Zero RLVR</text>
<text x="680" y="468" font-size="11" fill="#6b7280" text-anchor="middle">跳过 SFT 与 DPO，直接从 Base</text>
<line x1="780" y1="452" x2="818" y2="452" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="826" y="448" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Olmo 3 RL-Zero 7B</text>
<text x="826" y="468" font-size="11" fill="#6b7280" text-anchor="start">数学、代码、IF、通用对话、混合</text>
<text x="30" y="516" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 1 封面清单与 p. 4 Figure 2 重画；token 与条数见 p. 4–5、p. 40、p. 46、p. 58、p. 86。流程示意，不含时间比例。</text>
</svg>
