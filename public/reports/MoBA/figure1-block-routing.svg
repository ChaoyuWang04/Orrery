<text x="980.0" y="310.0" font-size="16" fill="#d9877a" text-anchor="middle" font-weight="700">−∞</text>
<text x="30.0" y="382.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">③ top-k，k = 3：当前块占 1 个名额，剩下 2 个名额给分数最高的历史块</text>
<rect x="72.0" y="396.0" width="108.0" height="40.0" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="126.0" y="421.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">块 1</text>
<rect x="194.0" y="396.0" width="108.0" height="40.0" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="248.0" y="421.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">块 2</text>
<rect x="316.0" y="396.0" width="108.0" height="40.0" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="370.0" y="421.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">块 3</text>
<rect x="438.0" y="396.0" width="108.0" height="40.0" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="492.0" y="421.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">块 4</text>
<rect x="560.0" y="396.0" width="108.0" height="40.0" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="614.0" y="421.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">块 5</text>
<rect x="682.0" y="396.0" width="108.0" height="40.0" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="736.0" y="421.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">块 6</text>
<rect x="804.0" y="396.0" width="108.0" height="40.0" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="858.0" y="421.0" font-size="12" fill="#9ca3af" text-anchor="middle">不可见</text>
<rect x="926.0" y="396.0" width="108.0" height="40.0" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="980.0" y="421.0" font-size="12" fill="#9ca3af" text-anchor="middle">不可见</text>
<rect x="30" y="462" width="1060" height="118" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="50.0" y="490.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">④ 两路分开算，再合并</text>
<rect x="50.0" y="504.0" width="480.0" height="60.0" rx="6" fill="#ecebfb" stroke="#8f8bd8" stroke-width="1"/>
<text x="64.0" y="528.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">历史块：整块可见（causal = False）</text>
<text x="64.0" y="550.0" font-size="11" fill="#6b7280" text-anchor="start">把选中同一块的 Query 聚到一起，交给变长 FlashAttention</text>
<rect x="560.0" y="504.0" width="300.0" height="60.0" rx="6" fill="#e3f4ec" stroke="#5fa886" stroke-width="1"/>
<text x="574.0" y="528.0" font-size="13" fill="#111827" text-anchor="start" font-weight="700">当前块：块内因果掩码（causal = True）</text>
<text x="574.0" y="550.0" font-size="11" fill="#6b7280" text-anchor="start">只看块内排在 q 前面的 Token</text>
<line x1="530.0" y1="534.0" x2="558.0" y2="534.0" stroke="#9ca3af" stroke-width="1.4"/>
<rect x="890.0" y="504.0" width="180.0" height="60.0" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
<text x="980.0" y="528.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">online softmax</text>
<text x="980.0" y="550.0" font-size="11" fill="#6b7280" text-anchor="middle">合并成一次完整归一化</text>
<line x1="860.0" y1="534.0" x2="886.0" y2="534.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
</svg>
