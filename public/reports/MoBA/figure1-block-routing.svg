<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="19" fill="#111827" text-anchor="start" font-weight="700">MoBA：一个 Query 怎样挑块</text>
<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">绿 = 当前块（强制选中，块内因果掩码）；紫 = top-k 选中的历史块；灰 = 没选中；红 = 未来块（分数置 −∞）。分数为示意。</text>
<text x="30.0" y="92.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">① 把上下文按位置切成等长的块，每块把 Key 沿序列求平均，得到一个代表向量</text>
