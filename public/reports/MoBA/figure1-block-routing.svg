<text x="248.0" y="185.0" font-size="11" fill="#6b7280" text-anchor="middle">均值 2</text>
<rect x="316.0" y="106.0" width="108.0" height="40.0" rx="6" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
<text x="370.0" y="131.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">块 3</text>
