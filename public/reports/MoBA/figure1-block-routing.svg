<text x="126.0" y="131.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">块 1</text>
<line x1="126.0" y1="147.0" x2="126.0" y2="164.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
