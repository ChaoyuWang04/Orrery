<text x="736.0" y="185.0" font-size="11" fill="#9ca3af" text-anchor="middle">含 q 之后的 Token</text>
<text x="919.0" y="185.0" font-size="11" fill="#9ca3af" text-anchor="middle">整块都在 q 之后</text>
<text x="30.0" y="232.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">② 打分：q 与每个代表向量做内积；未来块的分数直接置为 −∞，当前块不参与比较</text>
<rect x="102.0" y="316.0" width="48.0" height="24.0" rx="3" fill="#eeeeee" stroke="#b9b9b9" stroke-width="1"/>
