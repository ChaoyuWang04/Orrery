<text x="492.0" y="131.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">块 4</text>
<line x1="492.0" y1="147.0" x2="492.0" y2="164.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="462.0" y="168.0" width="60.0" height="24.0" rx="12" fill="#fdf1dc" stroke="#d4a24c" stroke-width="1"/>
