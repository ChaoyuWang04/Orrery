<line x1="72.0" y1="340.0" x2="668.0" y2="340.0" stroke="#9ca3af" stroke-width="1"/>
<text x="736.0" y="300.0" font-size="12" fill="#5fa886" text-anchor="middle" font-weight="700">不比分</text>
