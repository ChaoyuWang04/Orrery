<text x="560" y="336" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">6 + 100 + 2 = 108 层，与表 1 的 Total Layers 一致</text>
<text x="560" y="358" font-size="11" fill="#6b7280" text-anchor="middle">按类型：Mamba-2 48 层，LatentMoE 48 层，注意力 12 层（64 个查询头共用 2 个 KV 头）</text>
<text x="30" y="408" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p. 3 图 2 与 p. 4 表 1 重画；层数加总与分类计数是本文所做，报告只给了图与总层数。</text>
