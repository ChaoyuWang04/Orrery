<text x="30.0" y="54.0" font-size="13" fill="#6b7280" text-anchor="start">紫 = 视频潜帧；黄 = 音频潜帧；灰线 = 朴素索引下被当成同一位置的一对；绿线 = 对齐后真正同一时刻的一对。只画前 1 秒。</text>
