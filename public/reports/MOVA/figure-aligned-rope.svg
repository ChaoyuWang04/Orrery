<text x="30.0" y="506.0" font-size="13" fill="#6b7280" text-anchor="start">报告正文没有给 f_v、f_a、s 的数值。8.05 秒片段里视频有 49 个潜帧、音频约 403 个（本文按配置推算）。</text>
<text x="30.0" y="536.0" font-size="11" fill="#9ca3af" text-anchor="start">视频第一帧在 VAE 里单独成帧，官方配置没有为它做偏移（apply_first_frame_bias_in_rope = false），图中按均匀刻度画。</text>
