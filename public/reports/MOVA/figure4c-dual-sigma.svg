<text x="30.0" y="562.0" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 10 公式 (4) 与 p. 8 Figure 4(c) 重画。右图各点按 t_k = 1 − k/19（k = 0–19）代入公式重算，与原图点位吻合。</text>
<text x="30.0" y="586.0" font-size="13" fill="#6b7280" text-anchor="start">报告 p. 10 印出的分母是 shift + t(1 − shift)，照它算 shift = 5 时 t > 5/9 就有 σ > 1；本图按官方代码的标准形式画，右图点位也只与标准形式吻合。</text>
<text x="30.0" y="612.0" font-size="13" fill="#6b7280" text-anchor="start">原图把对角线（v = a = 5）标成 Unbalance，而 Phase 2–3 实际采用的正是它，正文对此没有交代。</text>
