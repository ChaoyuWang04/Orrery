<rect x="640.0" y="526.0" width="210.0" height="34.0" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="745.0" y="548.0" font-size="13" fill="#111827" text-anchor="middle">音频 VAE（DAC 风格，冻结）</text>
<text x="30.0" y="604.0" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 3 Figure 2 重画。层数、宽度与「第 i 层对第 i 层」的配对取自官方权重配置与代码（外部补充，报告正文没写）。</text>
<text x="30.0" y="628.0" font-size="13" fill="#6b7280" text-anchor="start">参数按官方权重文件大小以 bf16 折算：14.29 + 14.29 + 2.66 + 1.42 ≈ 32.7B；单步激活一套视频专家，≈ 18.4B。</text>
<text x="30.0" y="652.0" font-size="13" fill="#6b7280" text-anchor="start">UMT5（折合 ≈5.7B）与两个 VAE 不在 32B 之内。</text>
<text x="30.0" y="682.0" font-size="11" fill="#9ca3af" text-anchor="start">Text CrossAttn、Self-Attention、FFN 等块内结构两塔相同，图上不画。</text>
