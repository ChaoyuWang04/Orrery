<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="540" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Markovian RSA：每条候选想 β，进下一轮只带 τ</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">黄 = 一条候选的推理（最长 β）；紫 = 带进下一轮的尾巴（最后 τ）；灰 = 原题。横向长度按 Token 数等比，1K = 5 px。</text>

<rect x="16" y="72" width="1088" height="220" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="130" y="96" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">第 t 轮：N = 16 条并行</text>
<rect x="30" y="112" width="180" height="20" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="210" y="112" width="20" height="20" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="30" y="140" width="180" height="20" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="210" y="140" width="20" height="20" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="30" y="168" width="180" height="20" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="210" y="168" width="20" height="20" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="30" y="196" width="180" height="20" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="210" y="196" width="20" height="20" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="130" y="238" font-size="11" fill="#6b7280" text-anchor="middle">每条最长 β = 40K（画出 4 条）</text>
<text x="130" y="256" font-size="11" fill="#6b7280" text-anchor="middle">最后 τ = 4K 就是尾巴</text>

<line x1="232" y1="122" x2="416" y2="140" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="232" y1="150" x2="416" y2="200" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="232" y1="178" x2="416" y2="140" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="232" y1="206" x2="416" y2="200" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>

<text x="490" y="96" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">抽 C = 4 条尾巴，拼 N 条聚合 prompt</text>
<rect x="420" y="130" width="40" height="20" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="440" y="144" font-size="11" fill="#111827" text-anchor="middle">题</text>
<rect x="460" y="130" width="20" height="20" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="480" y="130" width="20" height="20" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="500" y="130" width="20" height="20" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="520" y="130" width="20" height="20" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="420" y="190" width="40" height="20" rx="3" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="440" y="204" font-size="11" fill="#111827" text-anchor="middle">题</text>
<rect x="460" y="190" width="20" height="20" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="480" y="190" width="20" height="20" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="500" y="190" width="20" height="20" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="520" y="190" width="20" height="20" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="480" y="176" font-size="11" fill="#6b7280" text-anchor="middle">⋮</text>
<text x="490" y="238" font-size="11" fill="#6b7280" text-anchor="middle">prefill ≤ |q| + C·τ，与已经想过多少无关</text>
<text x="490" y="256" font-size="11" fill="#6b7280" text-anchor="middle">prompt 只请模型综合出更好的一条，不需验证器</text>
<text x="490" y="274" font-size="11" fill="#9ca3af" text-anchor="middle">每条从 16 条尾巴里均匀随机抽 4 条，虚线只示意几条</text>

<line x1="548" y1="140" x2="636" y2="140" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="548" y1="200" x2="636" y2="200" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>

<text x="750" y="96" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">第 t+1 轮：再生成 N 条</text>
<rect x="640" y="130" width="180" height="20" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="820" y="130" width="20" height="20" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="640" y="190" width="180" height="20" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="820" y="190" width="20" height="20" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="740" y="176" font-size="11" fill="#6b7280" text-anchor="middle">⋮</text>
<text x="740" y="238" font-size="11" fill="#6b7280" text-anchor="middle">每条仍以 β 为上限</text>
<text x="740" y="256" font-size="11" fill="#6b7280" text-anchor="middle">解码是 batch = N 的批生成</text>

<line x1="850" y1="170" x2="890" y2="170" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="996" y="160" font-size="12" fill="#111827" text-anchor="middle">重复到 T = 2 轮</text>
<text x="996" y="180" font-size="11" fill="#6b7280" text-anchor="middle">最后一轮照常抽答案</text>

<rect x="16" y="306" width="1088" height="176" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="30" y="330" font-size="14" fill="#111827" text-anchor="start" font-weight="700">一条聚合 prompt 要带的候选状态（β = 40K，C = 4，τ = 4K）</text>
<text x="30" y="368" font-size="12" fill="#111827" text-anchor="start">全链 RSA：C·β</text>
<rect x="240" y="352" width="200" height="24" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="440" y="352" width="200" height="24" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="640" y="352" width="200" height="24" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="840" y="352" width="200" height="24" rx="3" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="1050" y="368" font-size="12" fill="#111827" text-anchor="start">160K</text>
<text x="30" y="416" font-size="12" fill="#111827" text-anchor="start">Markovian RSA：C·τ</text>
<rect x="240" y="400" width="20" height="24" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="260" y="400" width="20" height="24" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="280" y="400" width="20" height="24" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="300" y="400" width="20" height="24" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="332" y="416" font-size="12" fill="#111827" text-anchor="start">16K，候选状态少 90%（不含原题）</text>
<text x="30" y="458" font-size="11" fill="#6b7280" text-anchor="start">上下文封顶不等于总花销小：40K/4K 配置每题实际新生成约 740K Token，16K/4K 约 440K（都不含 prefill 与拷贝的尾巴）。</text>

<text x="30" y="514" font-size="12" fill="#9ca3af" text-anchor="start">机制示意，依据 PDF p. 19 Fig. 8、p. 17–18 算法描述与 p. 20、22 的 Token 账。长度按 Token 数等比，不是实测时间。</text>
</svg>
