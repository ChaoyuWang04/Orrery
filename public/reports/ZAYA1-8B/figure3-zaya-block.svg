<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" width="1120" height="610" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="610" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">ZAYA1-8B 的一个 Block：三处改动分别落在哪里</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">绿 = 残差缩放；紫 = 投到压缩空间；黄 = CCA 的预处理（卷积、均值跳连、时延）；红 = 路由器的新部件；灰 = 沿用的标准部件。</text>

<rect x="16" y="74" width="280" height="486" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="312" y="74" width="460" height="486" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="788" y="74" width="316" height="486" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>

<text x="156" y="98" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(a) 残差缩放</text>
<text x="156" y="116" font-size="11" fill="#6b7280" text-anchor="middle">每个子层的残差与输出各一组 α、β</text>
<rect x="96" y="136" width="120" height="28" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="156" y="154" font-size="11" fill="#111827" text-anchor="middle">输入 x_l</text>
<polyline points="156,164 156,176 76,176 76,296" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="156,176 226,176 226,192" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="176" y="196" width="100" height="26" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="226" y="213" font-size="11" fill="#111827" text-anchor="middle">RMSNorm</text>
<line x1="226" y1="222" x2="226" y2="236" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="176" y="240" width="100" height="40" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="226" y="257" font-size="11" fill="#111827" text-anchor="middle">子层</text>
<text x="226" y="272" font-size="11" fill="#6b7280" text-anchor="middle">CCA 或 MoE</text>
<line x1="226" y1="280" x2="226" y2="296" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="176" y="300" width="100" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="226" y="319" font-size="11" fill="#111827" text-anchor="middle">输出侧缩放</text>
<rect x="30" y="300" width="92" height="30" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<text x="76" y="319" font-size="11" fill="#111827" text-anchor="middle">残差侧缩放</text>
<polyline points="76,330 76,370 146,370" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="226,330 226,370 166,370" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<circle cx="156" cy="370" r="9" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
<text x="156" y="374" font-size="12" fill="#111827" text-anchor="middle">+</text>
<line x1="156" y1="379" x2="156" y2="392" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="96" y="396" width="120" height="28" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="156" y="414" font-size="11" fill="#111827" text-anchor="middle">输出 x_(l+1)</text>
<text x="156" y="454" font-size="12" fill="#111827" text-anchor="middle">Res-scale(x) = αx + β</text>
<text x="156" y="474" font-size="11" fill="#6b7280" text-anchor="middle">α、β 都是 D 维向量，逐维缩放</text>
<text x="156" y="492" font-size="11" fill="#6b7280" text-anchor="middle">初始化 α = 1、β = 0，即普通残差</text>
<text x="156" y="510" font-size="11" fill="#6b7280" text-anchor="middle">新增参数 4 × L × D</text>
<text x="156" y="528" font-size="11" fill="#6b7280" text-anchor="middle">与 LayerNorm 同一量级</text>

<text x="542" y="98" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(b) CCA：注意力在压缩空间里做</text>
<text x="542" y="116" font-size="11" fill="#6b7280" text-anchor="middle">正式配置叫 CCGQA：带 CCA 预处理，再叠分组查询</text>
