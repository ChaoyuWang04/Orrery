<text x="730" y="422" font-size="11" fill="#6b7280" text-anchor="start">ṽ</text>
<rect x="350" y="440" width="410" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="555" y="463" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">在压缩空间里做注意力：8 个 Q 头共享 2 个 KV 头</text>
<text x="542" y="500" font-size="11" fill="#6b7280" text-anchor="middle">Query 压 2×；KV Cache 相对完整多头注意力压 8×</text>
<text x="542" y="518" font-size="11" fill="#6b7280" text-anchor="middle">K 乘学到的温度 T（标准 CCA 用 exp(T)），QK 内积上界 T·√d_h</text>
<text x="542" y="536" font-size="11" fill="#6b7280" text-anchor="middle">每个头一半通道加 RoPE，另一半不加位置编码</text>

<text x="946" y="98" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(c) ZAYA1 路由器 + Top-1</text>
<text x="946" y="116" font-size="11" fill="#6b7280" text-anchor="middle">线性打分换成一个小网络</text>
