<text x="402" y="500" font-size="11" fill="#6b7280" text-anchor="start">攒够预设数量的轨迹就训一步；每 K 次更新把新权重推回推理引擎，并重置优化器（PDF p. 15–16）</text>
<text x="402" y="520" font-size="11" fill="#6b7280" text-anchor="start">黄：最早一段在 w0 生成，w′ − w0 > τ 时整条丢弃；红：环境崩溃的样本记下原因后剔除（PDF p. 17）</text>
<text x="36" y="562" font-size="11" fill="#9ca3af" text-anchor="start">机制示意，依据报告 §4.1.1–4.1.2 的文字（PDF p. 15–17）重画；K、τ 与轨迹阈值报告均未给出具体取值。</text>
