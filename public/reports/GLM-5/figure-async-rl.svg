<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8f8bd8"/></marker></defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">同步 RL 等最慢的那条；全异步让生成与训练各跑各的，代价是轨迹跨了权重版本</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">绿 = 正在生成的轨迹；紫 = 训练更新；灰 = GPU 空等；黄 = 跨版本太多、整条丢弃的轨迹；红 = 沙箱崩溃、被剔除的样本。横轴是时间，长度只示意。</text>
<rect x="16" y="72" width="1088" height="196" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36" y="96" font-size="14" fill="#111827" text-anchor="start" font-weight="700">同步：一批轨迹全部生成完才训练一步</text>
<text x="40" y="146" font-size="11" fill="#6b7280" text-anchor="start">生成</text>
<text x="40" y="214" font-size="11" fill="#6b7280" text-anchor="start">训练</text>
