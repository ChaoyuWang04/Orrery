<rect x="770" y="204" width="110" height="16" rx="3" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="825" y="216" font-size="11" fill="#111827" text-anchor="middle">更新一步</text>
<text x="790" y="160" font-size="11" fill="#6b7280" text-anchor="start">短轨迹早早结束，</text>
<text x="790" y="176" font-size="11" fill="#6b7280" text-anchor="start">GPU 空等到最长那条跑完</text>
<text x="36" y="252" font-size="11" fill="#9ca3af" text-anchor="start">agent 轨迹长度极不均衡，大部分 GPU 时间耗在等待上（§4.1.1，PDF p. 15）</text>
<rect x="16" y="284" width="1088" height="296" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="36" y="308" font-size="14" fill="#111827" text-anchor="start" font-weight="700">全异步：推理引擎与训练引擎放在不同 GPU 上</text>
<text x="40" y="338" font-size="11" fill="#6b7280" text-anchor="start">权重版本</text>
<text x="40" y="392" font-size="11" fill="#6b7280" text-anchor="start">推理 GPU</text>
<text x="40" y="470" font-size="11" fill="#6b7280" text-anchor="start">训练 GPU</text>
<rect x="170" y="324" width="216" height="20" rx="3" fill="#ffffff" stroke="#cbd2d9"/>
<text x="278.0" y="338" font-size="11" fill="#111827" text-anchor="middle">w0</text>
<rect x="390" y="324" width="216" height="20" rx="3" fill="#ffffff" stroke="#cbd2d9"/>
