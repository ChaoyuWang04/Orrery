<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">省注意力算力的三种办法，丢掉的东西不一样</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">绿 = 这一步真正参与注意力的历史位置；灰 = 这一层已经看不到的位置；黄 = 压缩后的固定大小状态；紫 = 仍完整存在缓存里、这一步没读的位置。</text>
