<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fa886"/></marker></defs>
<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">Figure 5：同一副 LLaVA 骨架，3D 数据从哪一段进</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">灰 = 只用标准 LLaVA 数据训练的一段；黄 = 这一段用上了 3D 数据；白框 = 冻结不训；虚线框 = 搜过、最终不用。</text>
<text x="386.0" y="94" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">LLaVA-v1.5</text>
<text x="386.0" y="112" font-size="11" fill="#6b7280" text-anchor="middle">基线</text>
<text x="674.0" y="94" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">SpatialVLM</text>
<text x="674.0" y="112" font-size="11" fill="#6b7280" text-anchor="middle">只在最后一段加 3D</text>
<text x="962.0" y="94" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">SpatialLLM（最终）</text>
<text x="962.0" y="112" font-size="11" fill="#6b7280" text-anchor="middle">对齐与微调都加 3D</text>
