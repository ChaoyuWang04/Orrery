<text x="386.0" y="500" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Vicuna-7B</text>
<rect x="538" y="460" width="272" height="70" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="674.0" y="490" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">图上未标</text>
<text x="674.0" y="510" font-size="11" fill="#6b7280" text-anchor="middle">Table 1 里是 13B 的复现</text>
<rect x="826" y="460" width="272" height="70" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="962.0" y="500" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Llama3-8B</text>
<text x="30" y="560" font-size="13" fill="#6b7280" text-anchor="start">据 PDF p. 5 Figure 3、p. 6 Figure 5 与 p. 8 Table 2 重画。三列的差别只在黄格：SpatialVLM 只把 3D 放进 Stage 2，且数据里没有朝向；</text>
<text x="30" y="582" font-size="13" fill="#6b7280" text-anchor="start">SpatialLLM 在 Stage 1 加人工标注的朝向探针、在 Stage 2 加含朝向的问答。连接器始终是 MLP，推理时只输入原始图像。</text>
