<text x="674.0" y="238" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">—</text>
<text x="674.0" y="258" font-size="11" fill="#6b7280" text-anchor="middle">没有这一段</text>
<rect x="826" y="208" width="272" height="70" rx="6" fill="#fdf1dc" stroke="#d4a24c" stroke-dasharray="5 4"/>
<text x="962.0" y="238" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">3DI-Pb-OI1M 探针</text>
