<text x="30" y="56" font-size="13" fill="#6b7280" text-anchor="start">绿＝共享底座里该分支实际用到的模块，灰虚线＝该分支去掉的模块，紫＝分支新增的结构，黄＝分支专属的后训练。</text>
<text x="30" y="74" font-size="13" fill="#6b7280" text-anchor="start">按 PDF p.3–4 §2 与 Figure 1、p.5–6 §4、p.9–10 §5、p.12–14 §6 正文整理；Figure 1 把三个分支都画在完整栈下，TTS 实际不经过编码器与适配器。</text>
