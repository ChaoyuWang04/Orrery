<text x="955.0" y="482.0" font-size="11" fill="#6b7280" text-anchor="middle">生成式奖励 + 评分细则，动态排练防遗忘</text>
<text x="315.0" y="535.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">转写文本</text>
<text x="315.0" y="551.0" font-size="11" fill="#6b7280" text-anchor="middle">RTF 0.0053</text>
<text x="635.0" y="535.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">音频 Token</text>
