<text x="30" y="522" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p.6 Figure 3 的派发重画：每个专家槽数 =（本批 Token 数 ÷ 专家数）× 容量因子，式 (3) 在 p.7。</text>
<text x="30" y="540" font-size="11" fill="#9ca3af" text-anchor="start">同一专家满员时谁被挤掉，按附录 F 伪代码（p.34）的先到先得；原图只画出溢出，没有指定是哪一个。</text>
