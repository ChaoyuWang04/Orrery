<rect x="76" y="310" width="180" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="166.0" y="334.55" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Switch FFN 层</text>
<line x1="166" y1="310" x2="166" y2="282" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="76" y="240" width="180" height="40" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
