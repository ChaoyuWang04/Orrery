<text x="166" y="534" font-size="11" fill="#9ca3af" text-anchor="middle">据 PDF p.5 Figure 2 左半重画</text>
<rect x="332" y="72" width="772" height="470" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="718" y="98" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">(b) Switch FFN 层内部：两个 Token 各自独立路由</text>
