<rect x="934" y="270" width="72" height="40" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="970.0" y="294.55" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">FFN 3</text>
<rect x="1014" y="270" width="72" height="40" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="1050.0" y="294.55" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">FFN 4</text>
<line x1="930" y1="390" x2="810" y2="312" stroke="#8f8bd8" stroke-width="1.4" marker-end="url(#ap)"/>
<text x="886.0" y="352" font-size="12" fill="#5fa886" text-anchor="start" font-weight="700">p = 0.8</text>
<circle cx="810" cy="190" r="16" fill="#ffffff" stroke="#8f8bd8" stroke-width="1.4"/>
<text x="810" y="195" font-size="16" fill="#111827" text-anchor="middle" font-weight="700">×</text>
<line x1="810" y1="270" x2="810" y2="208" stroke="#8f8bd8" stroke-width="1.4" marker-end="url(#ap)"/>
<path d="M 990 410 L 1096 410 L 1096 190 L 828 190" fill="none" stroke="#5fa886" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ag)"/>
<rect x="770" y="112" width="80" height="32" rx="6" fill="#ffffff" stroke="#b9b9b9"/>
<text x="810.0" y="132.55" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">y₂</text>
<line x1="810" y1="174" x2="810" y2="146" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="718" y="528" font-size="11" fill="#9ca3af" text-anchor="middle">实线：派发到得分最高的那一个专家；绿虚线：门控值 p 乘到输出上，梯度沿它回到路由器。其余 3 个专家这一步不计算。</text>
<text x="30" y="580" font-size="11" fill="#9ca3af" text-anchor="start">据 PDF p.5 Figure 2 重画，机制示意，不是实测。</text>
</svg>