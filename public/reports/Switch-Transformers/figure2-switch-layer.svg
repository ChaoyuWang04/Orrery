<rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" font-weight="700">Figure 2：每个 Token 只进一个专家，输出再乘上门控值</text>
<text x="30" y="54" font-size="13" fill="#6b7280">黄 = 每个 Token 都要算的稠密部分；绿 = 路由器；紫 = 被选中的专家；灰 = 这一步不算的专家。</text>
<rect x="16" y="72" width="300" height="470" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
