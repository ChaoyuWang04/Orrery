<text x="940" y="510" font-size="11" fill="#111827" text-anchor="middle">g3：按门控权重合并</text>
<text x="30" y="116" font-size="14" fill="#111827" text-anchor="start" font-weight="700">① 按组切开输入</text>
<text x="30" y="133" font-size="11" fill="#6b7280" text-anchor="start">split(inputs, 0, D)</text>
<text x="30" y="176" font-size="14" fill="#111827" text-anchor="start" font-weight="700">② 门控权重复制</text>
<text x="30" y="193" font-size="11" fill="#6b7280" text-anchor="start">replicate(wg)；softmax 与 top-2 都在本卡</text>
<text x="30" y="240" font-size="14" fill="#111827" text-anchor="start" font-weight="700">③ 派发 einsum 本地算</text>
<text x="30" y="257" font-size="11" fill="#6b7280" text-anchor="start">GSEC,GSM→EGCM，结果仍按 G 切</text>
<text x="30" y="300" font-size="14" fill="#111827" text-anchor="start" font-weight="700">④ AllToAll 改切分维</text>
<text x="30" y="317" font-size="11" fill="#6b7280" text-anchor="start">split(…, 0, D)：按 G 切 → 按 E 切</text>
<text x="30" y="376" font-size="14" fill="#111827" text-anchor="start" font-weight="700">⑤ 本地专家前馈</text>
<text x="30" y="393" font-size="11" fill="#6b7280" text-anchor="start">每卡只算落到自己专家的 4 个桶</text>
<text x="30" y="428" font-size="14" fill="#111827" text-anchor="start" font-weight="700">⑥ AllToAll 送回</text>
<text x="30" y="445" font-size="11" fill="#6b7280" text-anchor="start">按 E 切 → 按 G 切，由编译器插入</text>
<text x="30" y="490" font-size="14" fill="#111827" text-anchor="start" font-weight="700">⑦ combine einsum</text>
<text x="30" y="507" font-size="11" fill="#6b7280" text-anchor="start">溢出的 Token 这里是零，只走残差</text>
