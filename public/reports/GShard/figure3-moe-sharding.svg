<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = 按组 G 切开的 Token 数据（每张卡拿不同的组）；黄 = 按专家 E 切开的专家权重（每张卡只存自己的专家）；灰 = 整份复制的门控权重。</text>
