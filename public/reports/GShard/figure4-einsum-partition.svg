<text x="30" y="446" font-size="14" fill="#111827" text-anchor="start" font-weight="700">(c) 循环里切片：两边沿各自的非收缩维切</text>
<text x="30" y="466" font-size="11" fill="#6b7280" text-anchor="start">AB,BC→AC。A 按行切、B 按列切，本卡</text>
<text x="30" y="482" font-size="11" fill="#6b7280" text-anchor="start">凑不出任何一块输出。复制一边要装得下；</text>
<text x="30" y="498" font-size="11" fill="#6b7280" text-anchor="start">装不下就让 A 的行片沿环转 4 圈，每圈</text>
<text x="30" y="514" font-size="11" fill="#6b7280" text-anchor="start">算出输出里的一块，全程没有完整大小的张量。</text>
<text x="30" y="538" font-size="11" fill="#111827" text-anchor="start">通信：CollectivePermute，每卡 O(D)</text>
