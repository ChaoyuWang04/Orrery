<text x="30" y="278" font-size="14" fill="#111827" text-anchor="start" font-weight="700">(b) 累加部分和：沿收缩维切</text>
<text x="30" y="298" font-size="11" fill="#6b7280" text-anchor="start">AB,BC→AC。两边都沿被求和掉的 B 切，</text>
<text x="30" y="314" font-size="11" fill="#6b7280" text-anchor="start">每张卡只能算出一份完整形状的部分和，</text>
<text x="30" y="330" font-size="11" fill="#6b7280" text-anchor="start">四份相加才是结果。</text>
<text x="30" y="370" font-size="11" fill="#111827" text-anchor="start">通信：AllReduce，在 TPU 上随卡数约为常数</text>
