<text x="30" y="110" font-size="14" fill="#111827" text-anchor="start" font-weight="700">(a) 重新分片：MoE 的派发 einsum</text>
<text x="30" y="130" font-size="11" fill="#6b7280" text-anchor="start">GSEC,GSM→EGCM。两个输入都按组 G 切，</text>
<text x="30" y="146" font-size="11" fill="#6b7280" text-anchor="start">先在本卡做 batch 并行 einsum，</text>
<text x="30" y="162" font-size="11" fill="#6b7280" text-anchor="start">结果仍按 G 切；再用一次 AllToAll</text>
<text x="30" y="178" font-size="11" fill="#6b7280" text-anchor="start">把切分维从 G 换成 E。</text>
<text x="30" y="202" font-size="11" fill="#111827" text-anchor="start">通信：AllToAll，随卡数约按 √D 涨</text>
