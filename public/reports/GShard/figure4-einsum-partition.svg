<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">GShard 图 4 重画：einsum 两边的切分维对不上时，编译器插哪一种通信</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">绿 / 紫 / 黄 / 红 = 这一片放在卡 0 / 1 / 2 / 3 上；灰 = 没有切开的完整形状。D = 4，只画每个张量的两个维，机制示意。</text>
<rect x="16" y="86" width="1088" height="156" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="16" y="254" width="1088" height="156" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
