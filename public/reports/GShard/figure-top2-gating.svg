<text x="134" y="362" font-size="11" fill="#111827" text-anchor="middle">E1 · 0.60</text>
<rect x="180" y="342" width="84" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="222" y="362" font-size="11" fill="#111827" text-anchor="middle">E3 · 0.40</text>
<text x="280" y="362" font-size="11" fill="#111827" text-anchor="start">0.80 > 0.10</text>
<text x="380" y="362" font-size="11" fill="#111827" text-anchor="start">只走第二专家</text>
<rect x="36" y="386" width="50" height="30" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
<text x="61" y="406" font-size="11" fill="#111827" text-anchor="middle">t6</text>
<rect x="96" y="386" width="76" height="30" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="134" y="406" font-size="11" fill="#111827" text-anchor="middle">E2 · 0.90</text>
<rect x="180" y="386" width="84" height="30" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="222" y="406" font-size="11" fill="#111827" text-anchor="middle">E4 · 0.10</text>
<text x="280" y="406" font-size="11" fill="#111827" text-anchor="start">0.20 ≤ 0.60</text>
<text x="380" y="406" font-size="11" fill="#111827" text-anchor="start">只走第一专家</text>
<rect x="36" y="430" width="50" height="30" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
<text x="61" y="450" font-size="11" fill="#111827" text-anchor="middle">t7</text>
<rect x="96" y="430" width="76" height="30" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="134" y="450" font-size="11" fill="#111827" text-anchor="middle">E3 · 0.50</text>
<rect x="180" y="430" width="84" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="222" y="450" font-size="11" fill="#111827" text-anchor="middle">E2 · 0.50</text>
<text x="280" y="450" font-size="11" fill="#111827" text-anchor="start">1.00 > 0.47</text>
<text x="380" y="450" font-size="11" fill="#111827" text-anchor="start">两位专家</text>
<rect x="36" y="474" width="50" height="30" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
<text x="61" y="494" font-size="11" fill="#111827" text-anchor="middle">t8</text>
<rect x="96" y="474" width="76" height="30" rx="4" fill="#fbe9e7" stroke="#d9877a"/>
<text x="134" y="494" font-size="11" fill="#111827" text-anchor="middle">E1 · 0.70</text>
<rect x="180" y="474" width="84" height="30" rx="4" fill="#fbe9e7" stroke="#d9877a"/>
<text x="222" y="494" font-size="11" fill="#111827" text-anchor="middle">E2 · 0.30</text>
<text x="280" y="494" font-size="11" fill="#111827" text-anchor="start">0.60 > 0.20</text>
<text x="380" y="494" font-size="11" fill="#111827" text-anchor="start">全溢出，走残差</text>
<rect x="484" y="88" width="620" height="318" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="498" y="110" font-size="14" fill="#111827" text-anchor="start" font-weight="700">专家缓冲区：先按 Token 顺序写满第一专家，再写第二专家</text>
<text x="498" y="127" font-size="11" fill="#6b7280" text-anchor="start">第二轮从第一轮用剩的位置开始排，所以第一选择永远优先</text>
<text x="510" y="172" font-size="14" fill="#111827" text-anchor="start" font-weight="700">E1</text>
<rect x="548" y="146" width="70" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="583" y="171" font-size="11" fill="#111827" text-anchor="middle">t1</text>
<rect x="626" y="146" width="70" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="661" y="171" font-size="11" fill="#111827" text-anchor="middle">t2</text>
<rect x="704" y="146" width="70" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="739" y="171" font-size="11" fill="#111827" text-anchor="middle">t3</text>
<rect x="782" y="146" width="70" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="817" y="171" font-size="11" fill="#111827" text-anchor="middle">t4</text>
<text x="870" y="164" font-size="11" fill="#111827" text-anchor="start">第一轮计数 c = 6</text>
<text x="870" y="180" font-size="11" fill="#6b7280" text-anchor="start">第一轮就满：t5、t8 的第一选择溢出</text>
<text x="510" y="234" font-size="14" fill="#111827" text-anchor="start" font-weight="700">E2</text>
<rect x="548" y="208" width="70" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="583" y="233" font-size="11" fill="#111827" text-anchor="middle">t6</text>
<rect x="626" y="208" width="70" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="661" y="233" font-size="11" fill="#111827" text-anchor="middle">t1</text>
<rect x="704" y="208" width="70" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="739" y="233" font-size="11" fill="#111827" text-anchor="middle">t4</text>
<rect x="782" y="208" width="70" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="817" y="233" font-size="11" fill="#111827" text-anchor="middle">t7</text>
<text x="870" y="226" font-size="11" fill="#111827" text-anchor="start">第一轮计数 c = 1</text>
<text x="870" y="242" font-size="11" fill="#6b7280" text-anchor="start">t8 的第二选择来时已满</text>
<text x="510" y="296" font-size="14" fill="#111827" text-anchor="start" font-weight="700">E3</text>
<rect x="548" y="270" width="70" height="40" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="583" y="295" font-size="11" fill="#111827" text-anchor="middle">t7</text>
<rect x="626" y="270" width="70" height="40" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="661" y="295" font-size="11" fill="#111827" text-anchor="middle">t5</text>
<rect x="704" y="270" width="70" height="40" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
<text x="739" y="295" font-size="11" fill="#9ca3af" text-anchor="middle">空</text>
<rect x="782" y="270" width="70" height="40" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
<text x="817" y="295" font-size="11" fill="#9ca3af" text-anchor="middle">空</text>
<text x="870" y="288" font-size="11" fill="#111827" text-anchor="start">第一轮计数 c = 1</text>
<text x="870" y="304" font-size="11" fill="#6b7280" text-anchor="start">t5 靠第二专家接住</text>
<text x="510" y="358" font-size="14" fill="#111827" text-anchor="start" font-weight="700">E4</text>
<rect x="548" y="332" width="70" height="40" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
<text x="583" y="357" font-size="11" fill="#9ca3af" text-anchor="middle">空</text>
<rect x="626" y="332" width="70" height="40" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
<text x="661" y="357" font-size="11" fill="#9ca3af" text-anchor="middle">空</text>
<rect x="704" y="332" width="70" height="40" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
<text x="739" y="357" font-size="11" fill="#9ca3af" text-anchor="middle">空</text>
<rect x="782" y="332" width="70" height="40" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
<text x="817" y="357" font-size="11" fill="#9ca3af" text-anchor="middle">空</text>
<text x="870" y="350" font-size="11" fill="#111827" text-anchor="start">第一轮计数 c = 0</text>
<text x="870" y="366" font-size="11" fill="#6b7280" text-anchor="start">一个 Token 都没收到</text>
<rect x="484" y="422" width="620" height="120" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="498" y="444" font-size="14" fill="#111827" text-anchor="start" font-weight="700">辅助损失看的是第一轮计数</text>
<text x="498" y="466" font-size="11" fill="#6b7280" text-anchor="start">算法 1 第 13 行：aux = (1/E) · Σ (c_e / S) · m_e，c_e 在第一轮不论写没写进都加一。</text>
<text x="498" y="484" font-size="11" fill="#6b7280" text-anchor="start">这里 c = (6, 1, 1, 0)：E1 被 6 个 Token 当成第一选择，它的平均门控 m_E1 会被压下去。</text>
<text x="498" y="502" font-size="11" fill="#6b7280" text-anchor="start">c_e 来自 top-2，不可导；梯度只经可导的 m_e 走，c_e 充当「这个专家现在多挤」的权重。</text>
<text x="498" y="520" font-size="11" fill="#6b7280" text-anchor="start">损失系数 k 的数值论文没有给出。</text>
</svg>