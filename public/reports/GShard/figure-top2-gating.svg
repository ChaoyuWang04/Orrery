<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
<text x="30" y="32" font-size="19" fill="#111827" text-anchor="start" font-weight="700">GShard 算法 1 走一遍：一组 8 个 Token、4 个专家、每个专家容量 C = 4</text>
<text x="30" y="54" font-size="13" fill="#6b7280" text-anchor="start">紫 = 第一轮写入的第一专家；绿 = 第二轮写入的第二专家；灰 = 第二专家被随机门放弃；红 = 专家已满、没写进去。</text>
<text x="30" y="72" font-size="13" fill="#6b7280" text-anchor="start">数字是为演示编的，不是论文数据；C = 2S/E = 2 × 8 / 4 = 4 按论文的分组容量公式取。g1、g2 已按 g1 + g2 = 1 归一化。</text>
<rect x="16" y="88" width="452" height="454" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="30" y="110" font-size="14" fill="#111827" text-anchor="start" font-weight="700">每个 Token 的 top-2 与随机门</text>
<text x="30" y="127" font-size="11" fill="#6b7280" text-anchor="start">第二专家只在 2·g2 大于均匀随机数时才派发</text>
<text x="44" y="152" font-size="11" fill="#111827" text-anchor="start" font-weight="700">Token</text>
<text x="104" y="152" font-size="11" fill="#111827" text-anchor="start" font-weight="700">第一专家</text>
<text x="188" y="152" font-size="11" fill="#111827" text-anchor="start" font-weight="700">第二专家</text>
<text x="280" y="152" font-size="11" fill="#111827" text-anchor="start" font-weight="700">2·g2 对 随机数</text>
<text x="380" y="152" font-size="11" fill="#111827" text-anchor="start" font-weight="700">结果</text>
<rect x="36" y="166" width="50" height="30" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
<text x="61" y="186" font-size="11" fill="#111827" text-anchor="middle">t1</text>
<rect x="96" y="166" width="76" height="30" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="134" y="186" font-size="11" fill="#111827" text-anchor="middle">E1 · 0.60</text>
<rect x="180" y="166" width="84" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="222" y="186" font-size="11" fill="#111827" text-anchor="middle">E2 · 0.40</text>
<text x="280" y="186" font-size="11" fill="#111827" text-anchor="start">0.80 > 0.35</text>
<text x="380" y="186" font-size="11" fill="#111827" text-anchor="start">两位专家</text>
<rect x="36" y="210" width="50" height="30" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
<text x="61" y="230" font-size="11" fill="#111827" text-anchor="middle">t2</text>
<rect x="96" y="210" width="76" height="30" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="134" y="230" font-size="11" fill="#111827" text-anchor="middle">E1 · 0.70</text>
<rect x="180" y="210" width="84" height="30" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="222" y="230" font-size="11" fill="#111827" text-anchor="middle">E3 · 0.30</text>
<text x="280" y="230" font-size="11" fill="#111827" text-anchor="start">0.60 ≤ 0.72</text>
<text x="380" y="230" font-size="11" fill="#111827" text-anchor="start">只走第一专家</text>
<rect x="36" y="254" width="50" height="30" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
<text x="61" y="274" font-size="11" fill="#111827" text-anchor="middle">t3</text>
<rect x="96" y="254" width="76" height="30" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="134" y="274" font-size="11" fill="#111827" text-anchor="middle">E1 · 0.80</text>
<rect x="180" y="254" width="84" height="30" rx="4" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="222" y="274" font-size="11" fill="#111827" text-anchor="middle">E4 · 0.20</text>
<text x="280" y="274" font-size="11" fill="#111827" text-anchor="start">0.40 ≤ 0.90</text>
<text x="380" y="274" font-size="11" fill="#111827" text-anchor="start">只走第一专家</text>
<rect x="36" y="298" width="50" height="30" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
<text x="61" y="318" font-size="11" fill="#111827" text-anchor="middle">t4</text>
<rect x="96" y="298" width="76" height="30" rx="4" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="134" y="318" font-size="11" fill="#111827" text-anchor="middle">E1 · 0.55</text>
<rect x="180" y="298" width="84" height="30" rx="4" fill="#e3f4ec" stroke="#5fa886"/>
<text x="222" y="318" font-size="11" fill="#111827" text-anchor="middle">E2 · 0.45</text>
<text x="280" y="318" font-size="11" fill="#111827" text-anchor="start">0.90 > 0.50</text>
<text x="380" y="318" font-size="11" fill="#111827" text-anchor="start">两位专家</text>
<rect x="36" y="342" width="50" height="30" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
<text x="61" y="362" font-size="11" fill="#111827" text-anchor="middle">t5</text>
