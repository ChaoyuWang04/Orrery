<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="adamFlowGray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
<marker id="adamFlowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fa886"/></marker>
<marker id="adamFlowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9877a"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
<text x="28" y="34" font-size="19" fill="#111827" font-weight="700">Adam 一步：两条矩从零起步，校正之后才写回参数</text>
<text x="28" y="58" font-size="13" fill="#6b7280">紫 = 一阶矩；黄 = 二阶原矩；绿 = 除过 (1−β 的 t 次方) 才进入更新。红 = 跳过这次除法。</text>
<text x="28" y="78" font-size="13" fill="#6b7280">按 PDF p.2 算法 1 重画，是机制示意，不是训练曲线。</text>

<rect x="28" y="168" width="168" height="108" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="248" y="108" width="250" height="292" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="264" y="128" width="218" height="108" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="264" y="260" width="218" height="108" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="568" y="156" width="236" height="148" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="868" y="156" width="224" height="148" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="248" y="448" width="556" height="128" rx="8" fill="#ffffff" stroke="#d9877a" stroke-dasharray="5 4"/>
<rect x="264" y="492" width="524" height="68" rx="6" fill="#fbe9e7" stroke="#d9877a"/>

<line x1="196" y1="206" x2="256" y2="168" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#adamFlowGray)"/>
<line x1="196" y1="238" x2="256" y2="300" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#adamFlowGray)"/>
<line x1="498" y1="182" x2="560" y2="200" stroke="#5fa886" stroke-width="1.4" marker-end="url(#adamFlowGreen)"/>
<line x1="498" y1="314" x2="560" y2="270" stroke="#5fa886" stroke-width="1.4" marker-end="url(#adamFlowGreen)"/>
<line x1="804" y1="230" x2="860" y2="230" stroke="#5fa886" stroke-width="1.4" marker-end="url(#adamFlowGreen)"/>
<line x1="373" y1="400" x2="373" y2="448" stroke="#d9877a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#adamFlowRed)"/>

<text x="112" y="202" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">随机梯度 g</text>
<text x="112" y="226" font-size="11" fill="#6b7280" text-anchor="middle">当前步的一阶偏导</text>
<text x="112" y="246" font-size="11" fill="#6b7280" text-anchor="middle">可能很稀疏、很吵</text>

<text x="373" y="156" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">一阶矩 m</text>
<text x="373" y="180" font-size="11" fill="#6b7280" text-anchor="middle">从零向量起步</text>
<text x="373" y="198" font-size="11" fill="#6b7280" text-anchor="middle">留 β1，加 (1−β1) g</text>
<text x="373" y="216" font-size="11" fill="#6b7280" text-anchor="middle">估的是梯度均值</text>

<text x="373" y="288" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">二阶原矩 v</text>
<text x="373" y="312" font-size="11" fill="#6b7280" text-anchor="middle">也从零向量起步</text>
<text x="373" y="330" font-size="11" fill="#6b7280" text-anchor="middle">留 β2，加 (1−β2) g²</text>
<text x="373" y="348" font-size="11" fill="#6b7280" text-anchor="middle">未减均值的二阶矩</text>

<text x="686" y="188" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">偏差校正</text>
<text x="686" y="212" font-size="11" fill="#6b7280" text-anchor="middle">除以 (1 − β 的 t 次方)</text>
<text x="686" y="230" font-size="11" fill="#6b7280" text-anchor="middle">一阶、二阶各除一次</text>
<text x="686" y="252" font-size="11" fill="#6b7280" text-anchor="middle">零起步把估计压小</text>
<text x="686" y="270" font-size="11" fill="#6b7280" text-anchor="middle">除这一项才拉回来</text>

<text x="980" y="188" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">写回参数</text>
<text x="980" y="212" font-size="11" fill="#6b7280" text-anchor="middle">减去 α · 校正后的 m</text>
<text x="980" y="230" font-size="11" fill="#6b7280" text-anchor="middle">除以 √校正后的 v + ε</text>
<text x="980" y="252" font-size="11" fill="#6b7280" text-anchor="middle">每个坐标自己的步长</text>
<text x="980" y="270" font-size="11" fill="#6b7280" text-anchor="middle">默认 α = 0.001</text>

<text x="526" y="476" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">不校正：两条矩都不除，直接拿去当步长</text>
<text x="526" y="504" font-size="11" fill="#6b7280" text-anchor="middle">分母在开头更小，步子被放大。β2 越接近 1，这口放大越久。</text>
<text x="526" y="524" font-size="11" fill="#6b7280" text-anchor="middle">这是第 5 节和图 4 的论点。红箭头从两条矩的外框底下离开，不进绿框。</text>

<text x="388" y="432" font-size="11" fill="#9ca3af">跳过除法</text>
<text x="28" y="616" font-size="11" fill="#9ca3af">默认 β1 = 0.9，β2 = 0.999，ε = 10⁻⁸。向量运算按元素。</text>
</svg>
