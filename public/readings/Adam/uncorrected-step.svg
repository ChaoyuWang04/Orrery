<text x="700" y="132" font-size="11" fill="#9ca3af">倍数 = (1−β1 的 t 次方) / √(1−β2 的 t 次方)</text>
<text x="700" y="152" font-size="11" fill="#9ca3af">t = 10 往往比 t = 1 更大：β1 先回到 1，β2 还没</text>
<text x="700" y="172" font-size="11" fill="#9ca3af">图 4 只说明不校正会不稳，损失刻度读不出</text>
</svg>
