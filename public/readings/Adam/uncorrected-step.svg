<rect x="188" y="348" width="115" height="16" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="311" y="360" font-size="11" fill="#6b7280">3.2</text>
<text x="168" y="388" font-size="11" fill="#6b7280" text-anchor="end">t = 1000</text>
<rect x="188" y="376" width="47" height="16" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="243" y="388" font-size="11" fill="#6b7280">1.3</text>

<text x="28" y="424" font-size="14" fill="#111827" font-weight="700">β2 = 0.9999</text>
<text x="168" y="450" font-size="11" fill="#6b7280" text-anchor="end">t = 1</text>
<rect x="188" y="438" width="360" height="16" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<text x="556" y="450" font-size="11" fill="#6b7280">10.0</text>
