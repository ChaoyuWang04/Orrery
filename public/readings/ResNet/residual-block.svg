<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="mk-blk" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
<marker id="mk-blk-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fa886"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="680" fill="#ffffff"/>
<text x="28" y="34" font-size="19" fill="#111827" font-weight="700">恒等捷径不加参数，堆叠层只学残差</text>
<text x="28" y="58" font-size="13" fill="#6b7280">灰 = 输入或非线性；紫 = 要学的权重层；绿 = 恒等捷径，不加参数、不加计算。块宽表示通道维。</text>
<text x="28" y="78" font-size="13" fill="#6b7280">据 PDF p.2 Figure 2、p.3 式 (1)、p.6 Figure 5 重画。加法之后才做第二次 ReLU。</text>

<rect x="20" y="96" width="520" height="360" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="556" y="96" width="544" height="360" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>

<text x="44" y="122" font-size="14" fill="#111827" font-weight="700">plain：直接拟合 H(x)</text>
<text x="580" y="122" font-size="14" fill="#111827" font-weight="700">残差块：拟合 F(x)，再加回 x</text>

<rect x="160" y="140" width="200" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="260" y="164" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">输入 x</text>
<line x1="260" y1="176" x2="260" y2="196" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#mk-blk)"/>

<rect x="160" y="200" width="200" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="260" y="226" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">权重层</text>
<line x1="260" y1="240" x2="260" y2="258" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#mk-blk)"/>

<rect x="210" y="262" width="100" height="28" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="260" y="281" font-size="11" fill="#6b7280" text-anchor="middle">ReLU</text>
<line x1="260" y1="290" x2="260" y2="308" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#mk-blk)"/>

<rect x="160" y="312" width="200" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="260" y="338" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">权重层</text>
<line x1="260" y1="352" x2="260" y2="370" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#mk-blk)"/>

<rect x="120" y="374" width="280" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="260" y="398" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">输出，指望等于 H(x)</text>
<text x="44" y="436" font-size="11" fill="#9ca3af">没有捷径。每一层都要学完整映射</text>

<rect x="700" y="140" width="200" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="800" y="164" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">输入 x</text>
<line x1="800" y1="176" x2="800" y2="196" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#mk-blk)"/>

<rect x="700" y="200" width="200" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="800" y="226" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">权重层</text>
<line x1="800" y1="240" x2="800" y2="258" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#mk-blk)"/>

<rect x="750" y="262" width="100" height="28" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="800" y="281" font-size="11" fill="#6b7280" text-anchor="middle">ReLU</text>
<line x1="800" y1="290" x2="800" y2="308" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#mk-blk)"/>

<rect x="700" y="312" width="200" height="40" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="800" y="338" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">权重层  F(x)</text>
<line x1="800" y1="352" x2="800" y2="368" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#mk-blk)"/>

<circle cx="800" cy="386" r="16" fill="#ffffff" stroke="#5fa886" stroke-width="1.4"/>
<text x="800" y="391" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">+</text>

<path d="M900,158 L980,158 L980,386 L816,386" fill="none" stroke="#5fa886" stroke-width="1.4" marker-end="url(#mk-blk-g)"/>
<text x="990" y="250" font-size="11" fill="#5fa886">恒等 x</text>
<text x="990" y="268" font-size="11" fill="#5fa886">不加参数</text>

<line x1="800" y1="402" x2="800" y2="416" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#mk-blk)"/>
<rect x="750" y="418" width="100" height="24" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<text x="800" y="435" font-size="11" fill="#6b7280" text-anchor="middle">ReLU</text>

<text x="580" y="452" font-size="11" fill="#9ca3af">y = F(x)+x。捷径从输入框右侧接到加号</text>

<rect x="20" y="472" width="1080" height="188" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<text x="44" y="498" font-size="14" fill="#111827" font-weight="700">瓶颈块：3×3 走窄通道，捷径仍连在两个宽端</text>
<text x="44" y="518" font-size="11" fill="#6b7280">块越宽，通道越多。绿线仍是恒等。PDF p.6 Figure 5 右，ResNet-50/101/152</text>

<rect x="44" y="540" width="150" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="119" y="567" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">256-d</text>

<rect x="230" y="548" width="56" height="28" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="258" y="567" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">64</text>

<rect x="322" y="548" width="56" height="28" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="350" y="567" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">64</text>

<rect x="414" y="540" width="150" height="44" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<text x="489" y="567" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">256-d</text>

<line x1="194" y1="562" x2="226" y2="562" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#mk-blk)"/>
<line x1="286" y1="562" x2="318" y2="562" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#mk-blk)"/>
<line x1="378" y1="562" x2="410" y2="562" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#mk-blk)"/>
<line x1="564" y1="562" x2="588" y2="562" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#mk-blk)"/>

<circle cx="610" cy="562" r="14" fill="#ffffff" stroke="#5fa886" stroke-width="1.4"/>
<text x="610" y="567" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">+</text>

<path d="M119,584 L119,620 L610,620 L610,576" fill="none" stroke="#5fa886" stroke-width="1.4" marker-end="url(#mk-blk-g)"/>
<text x="300" y="638" font-size="11" fill="#5fa886">恒等捷径，连在两个 256 维端。换成投影，时间和模型体积大约翻倍</text>

<text x="640" y="548" font-size="11" fill="#6b7280">1×1 降维</text>
<text x="640" y="568" font-size="11" fill="#6b7280">3×3 在 64 维</text>
<text x="640" y="588" font-size="11" fill="#6b7280">1×1 升回 256</text>
</svg>
