<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<defs>
<marker id="nsGray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
<marker id="nsGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5fa886"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
<text x="28" y="32" font-size="19" fill="#111827" font-weight="700">两种近似都在替全词表 softmax：走一条树路径，或抽 k 个噪声词</text>
<text x="28" y="54" font-size="13" fill="#6b7280">紫 = 要计算的内部节点；绿 = 正例；红 = 噪声词；灰 = 这条路径上不计算的兄弟。</text>

<rect x="20" y="72" width="530" height="424" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="570" y="72" width="530" height="424" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>

<text x="285" y="100" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">层次 softmax</text>
<text x="285" y="120" font-size="11" fill="#6b7280" text-anchor="middle">只评估根到叶的那条路径</text>

<rect x="168" y="140" width="120" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="300" y="140" width="88" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="168" y="214" width="120" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="300" y="214" width="88" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="168" y="288" width="120" height="36" rx="6" fill="#ecebfb" stroke="#8f8bd8"/>
<rect x="300" y="288" width="88" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="148" y="362" width="160" height="36" rx="6" fill="#e3f4ec" stroke="#5fa886"/>

<line x1="228" y1="176" x2="228" y2="214" stroke="#5fa886" stroke-width="1.4" marker-end="url(#nsGreen)"/>
<line x1="228" y1="250" x2="228" y2="288" stroke="#5fa886" stroke-width="1.4" marker-end="url(#nsGreen)"/>
<line x1="228" y1="324" x2="228" y2="362" stroke="#5fa886" stroke-width="1.4" marker-end="url(#nsGreen)"/>
<line x1="288" y1="158" x2="300" y2="158" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#nsGray)"/>
<line x1="288" y1="232" x2="300" y2="232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#nsGray)"/>
<line x1="288" y1="306" x2="300" y2="306" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#nsGray)"/>

<text x="228" y="163" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">根</text>
<text x="344" y="163" font-size="11" fill="#6b7280" text-anchor="middle">未走</text>
<text x="228" y="237" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">内节点</text>
<text x="344" y="237" font-size="11" fill="#6b7280" text-anchor="middle">未走</text>
<text x="228" y="311" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">内节点</text>
<text x="344" y="311" font-size="11" fill="#6b7280" text-anchor="middle">未走</text>
<text x="228" y="385" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">目标词</text>

<text x="285" y="428" font-size="11" fill="#6b7280" text-anchor="middle">代价约 log2(W) 次 logistic，与整表无关</text>
<text x="285" y="448" font-size="11" fill="#6b7280" text-anchor="middle">Huffman 把高频词放到更短的路径上</text>
<text x="285" y="468" font-size="11" fill="#9ca3af" text-anchor="middle">词只有输入向量；内部节点另有输出向量</text>

<text x="835" y="100" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">负采样</text>
<text x="835" y="120" font-size="11" fill="#6b7280" text-anchor="middle">不建树，每个正例配 k 个噪声词</text>

<rect x="730" y="148" width="210" height="36" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="835" y="171" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">中心词向量</text>

<rect x="610" y="250" width="120" height="44" rx="6" fill="#e3f4ec" stroke="#5fa886"/>
<rect x="750" y="250" width="100" height="44" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<rect x="866" y="250" width="100" height="44" rx="6" fill="#fbe9e7" stroke="#d9877a"/>
<rect x="982" y="250" width="88" height="44" rx="6" fill="#fbe9e7" stroke="#d9877a"/>

<line x1="800" y1="184" x2="670" y2="250" stroke="#5fa886" stroke-width="1.4" marker-end="url(#nsGreen)"/>
<line x1="835" y1="184" x2="800" y2="250" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#nsGray)"/>
<line x1="870" y1="184" x2="916" y2="250" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#nsGray)"/>
<line x1="900" y1="184" x2="1026" y2="250" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#nsGray)"/>

<text x="670" y="277" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">正例</text>
<text x="800" y="277" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">噪声</text>
<text x="916" y="277" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">噪声</text>
<text x="1026" y="277" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">噪声</text>

<text x="835" y="340" font-size="11" fill="#6b7280" text-anchor="middle">代价是 k+1 次 logistic，不随词表涨</text>
<text x="835" y="360" font-size="11" fill="#6b7280" text-anchor="middle">小数据 k 取 5–20，大数据 k 取 2–5</text>
<text x="835" y="380" font-size="11" fill="#6b7280" text-anchor="middle">噪声按 unigram 的 3/4 次方抽</text>
<text x="835" y="400" font-size="11" fill="#6b7280" text-anchor="middle">只要样本，不要噪声分布的数值概率</text>
<text x="835" y="448" font-size="11" fill="#9ca3af" text-anchor="middle">这是相对 NCE 省掉的那一步</text>
<text x="835" y="468" font-size="11" fill="#9ca3af" text-anchor="middle">词仍有输入向量和输出向量各一份</text>
</svg>
