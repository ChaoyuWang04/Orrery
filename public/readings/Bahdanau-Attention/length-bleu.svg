<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">句一长，固定向量先掉，软搜索的 50 词模型还在</text>
<text x="30" y="58" font-size="13" fill="#6b7280">紫 = RNNsearch-50；黄 = RNNsearch-30；红 = RNNenc-50；灰 = RNNenc-30。纵轴是 BLEU，刻度 0 到 30 来自原图。</text>
<text x="30" y="78" font-size="13" fill="#6b7280">曲线按 PDF p.5 Figure 2 的走势重画。点上不标原文没有列出的小数。图例里的 RNNenc 是原图缩写。</text>
<text x="80" y="124" font-size="11" fill="#9ca3af" text-anchor="end">30</text>
<text x="80" y="191" font-size="11" fill="#9ca3af" text-anchor="end">20</text>
<text x="80" y="257" font-size="11" fill="#9ca3af" text-anchor="end">10</text>
<text x="80" y="324" font-size="11" fill="#9ca3af" text-anchor="end">0</text>
<text x="120" y="342" font-size="11" fill="#9ca3af" text-anchor="middle">0</text>
<text x="273" y="342" font-size="11" fill="#9ca3af" text-anchor="middle">10</text>
<text x="427" y="342" font-size="11" fill="#9ca3af" text-anchor="middle">20</text>
<text x="580" y="342" font-size="11" fill="#9ca3af" text-anchor="middle">30</text>
<text x="733" y="342" font-size="11" fill="#9ca3af" text-anchor="middle">40</text>
<text x="887" y="342" font-size="11" fill="#9ca3af" text-anchor="middle">50</text>
<text x="1040" y="342" font-size="11" fill="#9ca3af" text-anchor="middle">60</text>
<text x="580" y="368" font-size="11" fill="#6b7280" text-anchor="middle">句长。含未登录词的完整测试集</text>
<text x="30" y="408" font-size="13" fill="#6b7280">紫线升上去之后保持平，一直到 50 词以外。黄线和两条编码器–解码器曲线在中段之后掉下去，灰线掉得最狠。</text>
<text x="30" y="432" font-size="13" fill="#6b7280">图注写 RNNsearch-50 在 50 词及以上几乎不掉，RNNencdec 随长度急剧下跌。逐点 BLEU 原文没有列表。</text>
<text x="30" y="456" font-size="13" fill="#6b7280">据 PDF p.5 Figure 2 重画。横轴原图标到 60。</text>
