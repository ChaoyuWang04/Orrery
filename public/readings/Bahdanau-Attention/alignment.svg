<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', Arial, sans-serif">
<rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>
<rect x="24" y="96" width="520" height="300" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="576" y="96" width="520" height="300" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-dasharray="5 4"/>
<rect x="250" y="168" width="72" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="334" y="168" width="72" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="418" y="168" width="72" height="48" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="250" y="228" width="72" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="334" y="228" width="72" height="48" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="418" y="228" width="72" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="250" y="288" width="72" height="48" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="334" y="288" width="72" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="418" y="288" width="72" height="48" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="760" y="188" width="88" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="860" y="188" width="88" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<rect x="760" y="260" width="88" height="56" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="860" y="260" width="88" height="56" rx="6" fill="#fdf1dc" stroke="#d4a24c"/>
<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">软对齐大体沿对角线，形容词可以回跳</text>
<text x="30" y="58" font-size="13" fill="#6b7280">黄 = 这一格被看过；灰 = 这一格几乎不看。同色不表示权重相等，原文没有给出权重数字。</text>
<text x="30" y="78" font-size="13" fill="#6b7280">横轴是英语源词，纵轴是法文译文，从上到下是生成顺序。据 PDF p.6 Figure 3(a)(d) 重画。</text>
<text x="284" y="122" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">(a) 先对上 Area，再逐词回看</text>
<text x="286" y="156" font-size="11" fill="#6b7280" text-anchor="middle">European</text>
<text x="370" y="156" font-size="11" fill="#6b7280" text-anchor="middle">Economic</text>
<text x="454" y="156" font-size="11" fill="#6b7280" text-anchor="middle">Area</text>
<text x="238" y="196" font-size="11" fill="#6b7280" text-anchor="end">zone</text>
<text x="238" y="256" font-size="11" fill="#6b7280" text-anchor="end">économique</text>
<text x="238" y="316" font-size="11" fill="#6b7280" text-anchor="end">européenne</text>
<text x="284" y="372" font-size="11" fill="#9ca3af" text-anchor="middle">亮格从右上走到左下，不是对角</text>
<text x="836" y="122" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">(d) the 同时看后面的名词</text>
<text x="804" y="172" font-size="11" fill="#6b7280" text-anchor="middle">the</text>
<text x="904" y="172" font-size="11" fill="#6b7280" text-anchor="middle">man</text>
<text x="744" y="220" font-size="11" fill="#6b7280" text-anchor="end">l'</text>
<text x="744" y="292" font-size="11" fill="#6b7280" text-anchor="end">homme</text>
<text x="836" y="348" font-size="11" fill="#9ca3af" text-anchor="middle">l' 两格都黄，只表示同时看过</text>
<text x="836" y="368" font-size="11" fill="#9ca3af" text-anchor="middle">不是 0.5 对 0.5</text>
<text x="30" y="432" font-size="13" fill="#6b7280">全句其余部分大体沿对角线，图上是灰度。这两张只留下论文点名、并且能从原图读出的那一块。</text>
<text x="30" y="456" font-size="13" fill="#6b7280">(a) 的回跳对应 zone économique européen 对 European Economic Area。(d) 里硬对齐会把 the 钉死在 l' 上。</text>
<text x="30" y="488" font-size="13" fill="#6b7280">这是作者读图，不是对齐错误率。论文没有给对齐分数。</text>
</svg>
