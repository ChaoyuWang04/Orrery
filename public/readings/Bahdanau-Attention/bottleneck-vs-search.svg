<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">固定向量每步都用，软搜索每步自己加权</text>
<text x="30" y="58" font-size="13" fill="#6b7280">红 = 整句共用的固定向量 c；黄 = 这一解码步自己的上下文；绿 = 编码器注释；紫 = 解码状态。</text>
<text x="30" y="78" font-size="13" fill="#6b7280">右图黄条的高矮是示意，不是某一句的对齐权重。灰块是词。</text>
<text x="284" y="126" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">基本编码器–解码器</text>
<text x="284" y="148" font-size="11" fill="#6b7280" text-anchor="middle">每一步读的是同一个 c</text>
<text x="92" y="199" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">y1</text>
<text x="240" y="199" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">y2</text>
<text x="388" y="199" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">y3</text>
<text x="264" y="310" font-size="19" fill="#111827" font-weight="700" text-anchor="middle">c</text>
<text x="88" y="401" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">h1</text>
<text x="172" y="401" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">h2</text>
<text x="256" y="401" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">h3</text>
<text x="392" y="401" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">hT</text>
<text x="88" y="475" font-size="11" fill="#6b7280" text-anchor="middle">x1</text>
<text x="172" y="475" font-size="11" fill="#6b7280" text-anchor="middle">x2</text>
<text x="256" y="475" font-size="11" fill="#6b7280" text-anchor="middle">x3</text>
<text x="392" y="475" font-size="11" fill="#6b7280" text-anchor="middle">xT</text>
<text x="284" y="510" font-size="11" fill="#6b7280" text-anchor="middle">长度变了，还是这一个向量</text>
<text x="836" y="126" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">软搜索，每步一个上下文</text>
<text x="836" y="146" font-size="11" fill="#6b7280" text-anchor="middle">只服务正在写的这一个词</text>
<text x="836" y="179" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">yi</text>
<text x="836" y="256" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">ci</text>
<text x="656" y="323" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">s 上一步</text>
<text x="662" y="433" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">h1</text>
<text x="762" y="433" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">h2</text>
<text x="862" y="433" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">h3</text>
<text x="982" y="433" font-size="11" fill="#111827" font-weight="700" text-anchor="middle">hT</text>
<text x="662" y="487" font-size="11" fill="#6b7280" text-anchor="middle">x1</text>
<text x="762" y="487" font-size="11" fill="#6b7280" text-anchor="middle">x2</text>
<text x="862" y="487" font-size="11" fill="#6b7280" text-anchor="middle">x3</text>
<text x="982" y="487" font-size="11" fill="#6b7280" text-anchor="middle">xT</text>
<text x="836" y="510" font-size="11" fill="#6b7280" text-anchor="middle">黄条高的位置，这一步看得多</text>
<text x="30" y="560" font-size="13" fill="#6b7280">据 PDF p.2–3 的编码器–解码器与 Figure 1 重画。左图是式（2）里每步共用的 c；右图是式（5）的加权和。</text>
<text x="30" y="584" font-size="13" fill="#6b7280">原图 Figure 1 只画了右图这一步，双向状态画成上下两排。这里把固定向量对照摆在左边。机制示意，不是时间轴。</text>
<text x="30" y="612" font-size="13" fill="#6b7280">打分用的是发出这个词之前的解码状态。论文把这叫注意力。没有从解码步指回源词的硬对齐。</text>
