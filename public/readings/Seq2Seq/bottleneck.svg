<rect x="72" y="356" width="64" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="152" y="356" width="64" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="232" y="356" width="64" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
<rect x="312" y="356" width="64" height="36" rx="6" fill="#eeeeee" stroke="#b9b9b9"/>
