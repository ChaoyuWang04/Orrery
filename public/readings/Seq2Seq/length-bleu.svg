<text x="30" y="34" font-size="19" fill="#111827" font-weight="700">长句没有先崩，稀有词变多之后两条线交叉</text>
<text x="30" y="58" font-size="13" fill="#6b7280">紫 = LSTM（图例 34.8）；红 = 基线（图例 33.3）。纵轴是 BLEU，刻度 20 到 40 来自原图。</text>
<text x="30" y="78" font-size="13" fill="#6b7280">曲线按 PDF p.7 Figure 3 的走势重画。点上不标原文没有列出的小数。</text>
