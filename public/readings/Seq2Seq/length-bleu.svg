<text x="948" y="342" font-size="11" fill="#9ca3af" text-anchor="middle">2500</text>
<text x="1008" y="342" font-size="11" fill="#9ca3af" text-anchor="middle">3000</text>
<text x="850" y="368" font-size="11" fill="#6b7280" text-anchor="middle">测试句按平均词频排名排序</text>
<text x="30" y="412" font-size="13" fill="#6b7280">左图：句长 7 和 8 两档两条线都掉到 25 以下，12 以后拉回；12 到 35，LSTM 在基线上面；79 处碰到一起。</text>
<text x="30" y="436" font-size="13" fill="#6b7280">右图：稀有词变多时两条线都下降，在排名 2000 与 2500 之间交叉，之后 LSTM 低于基线。左端竖直段图注没有解释。</text>
<text x="30" y="468" font-size="13" fill="#6b7280">图注只写了少于 35 词没有退化、最长句轻微退化。交叉和最短档下探是图上能看见的，原文没有逐点 BLEU。</text>
<text x="30" y="500" font-size="13" fill="#6b7280">横轴 4、7、8 挤在左端，因为轴是排过序的测试句，不是均匀的长度尺。据 PDF p.7 Figure 3 重画。</text>
<text x="30" y="532" font-size="13" fill="#6b7280">原图还标了 17、28，以及右图 3500。右图曲线在 3000 附近结束，没有画到 3500。</text>
